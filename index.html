                              <span className="text-[10px] px-2.5 py-0.5 rounded-full bg-amber-950/80 text-pch-goldLight border border-pch-gold/40 font-mono font-bold">
                                Semua Bank & E-Wallet
                              </span>
                            </div>

                            <div className="flex flex-col items-center justify-center p-4 rounded-xl bg-pch-secondary border border-pch-border text-center space-y-3">
                              {appBranding.qrisImageUrl ? (
                                <div className="space-y-2">
                                  <div className="w-64 max-w-full aspect-square mx-auto rounded-xl overflow-hidden border-2 border-pch-gold p-2 bg-white shadow-gold-glow">
                                    <img 
                                      src={appBranding.qrisImageUrl} 
                                      alt="QRIS Panua Community" 
                                      className="w-full h-full object-contain"
                                    />
                                  </div>
                                  <p className="text-[11px] text-pch-goldLight font-bold">
                                    Scan via BCA, Mandiri, BRI, BNI, DANA, OVO, GoPay, ShopeePay
                                  </p>
                                </div>
                              ) : (
                                <div className="py-8 px-4 space-y-3 text-center">
                                  <div className="w-20 h-20 rounded-2xl bg-pch-surface border border-pch-gold/30 flex items-center justify-center mx-auto text-pch-gold/60">
                                    <Icons.QrCode className="w-10 h-10" />
                                  </div>
                                  <div>
                                    <h4 className="font-bold text-sm text-pch-text">Barcode QRIS Siap Dipindai</h4>
                                    <p className="text-xs text-pch-muted max-w-xs mx-auto mt-1">
                                      Admin belum mengunggah gambar barcode QRIS khusus. Anda dapat langsung menggunakan <strong>Nomor DANA Resmi</strong> di samping.
                                    </p>
                                  </div>
                                </div>
                              )}
                            </div>

                            <p className="text-xs text-pch-muted text-center">
                              Pindai langsung menggunakan kamera e-wallet atau aplikasi mobile banking kesayangan Anda.
                            </p>
                          </div>

                          {appBranding.qrisImageUrl && (
                            <div className="pt-2">
                              <a
                                href={appBranding.qrisImageUrl}
                                target="_blank"
                                rel="noreferrer"
                                className="w-full py-2.5 rounded-xl bg-pch-secondary border border-pch-gold/40 text-pch-goldLight font-bold text-xs hover:bg-pch-surface flex items-center justify-center gap-2"
                              >
                                <Icons.ExternalLink className="w-4 h-4" />
                                <span>Buka / Unduh Barcode QRIS Layar Penuh</span>
                              </a>
                            </div>
                          )}
                        </div>
                      </div>

                      {/* FORM KONFIRMASI TRANSFER KE ADMIN VIA WHATSAPP */}
                      <div className="p-6 rounded-2xl bg-pch-surface border border-pch-gold/50 shadow-card-elevated space-y-5">
                        <div className="border-b border-pch-border pb-3">
                          <h3 className="font-bold text-base text-pch-text flex items-center gap-2">
                            <Icons.Check className="w-5 h-5 text-pch-success" />
                            <span>Konfirmasi Bukti Transfer Dana Talangan</span>
                          </h3>
                          <p className="text-xs text-pch-muted mt-0.5">
                            Kirimkan rincian transfer Anda agar Administrator dapat melakukan pencatatan buku kas komunitas secara transparan.
                          </p>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                          <div>
                            <label className="text-xs font-semibold text-pch-muted block mb-1">Nama Donatur / Pengirim</label>
                            <input 
                              type="text" 
                              placeholder={user?.name || "Nama Lengkap Anda"}
                              value={danaConfirmSender}
                              onChange={(e) => setDanaConfirmSender(e.target.value)}
                              className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2.5 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                            />
                          </div>

                          <div>
                            <label className="text-xs font-semibold text-pch-muted block mb-1">Nominal Donasi (Rp)</label>
                            <input 
                              type="number" 
                              placeholder="Contoh: 50000"
                              value={danaConfirmNominal}
                              onChange={(e) => setDanaConfirmNominal(e.target.value)}
                              className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2.5 text-xs text-pch-text font-mono focus:outline-none focus:border-pch-purple"
                            />
                          </div>

                          <div>
                            <label className="text-xs font-semibold text-pch-muted block mb-1">Metode Transfer</label>
                            <select 
                              value={danaConfirmMethod}
                              onChange={(e) => setDanaConfirmMethod(e.target.value)}
                              className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2.5 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                            >
                              <option value="QRIS Barcode">Barcode QRIS (Semua Bank/E-Wallet)</option>
                              <option value="Dompet DANA">Dompet Digital DANA</option>
                              <option value="Transfer Bank Lain">Transfer Bank / Lainnya</option>
                            </select>
                          </div>

                          <div>
                            <label className="text-xs font-semibold text-pch-muted block mb-1">Catatan / Doa Singkat</label>
                            <input 
                              type="text" 
                              placeholder="Untuk kelancaran komunitas Panua"
                              value={danaConfirmNote}
                              onChange={(e) => setDanaConfirmNote(e.target.value)}
                              className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2.5 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                            />
                          </div>
                        </div>

                        <div className="pt-2 flex flex-col sm:flex-row items-center justify-between gap-4">
                          <span className="text-[11px] text-pch-muted leading-relaxed">
                            Akan otomatis membuka WhatsApp resmi Admin dengan pesan konfirmasi yang telah terformat rapi.
                          </span>

                          <button
                            type="button"
                            onClick={handleSendDanaConfirmationWA}
                            className="w-full sm:w-auto px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs flex items-center justify-center gap-2 shadow-sm transition-all"
                          >
                            <Icons.Phone className="w-4 h-4" />
                            <span>Kirim Konfirmasi Bukti Transfer via WhatsApp</span>
                          </button>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* TAB 2: COMMUNITY GROUPS */}
                  {activeTab === "community" && (
                    <div className="space-y-6">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                          <h2 className="text-xl font-bold text-pch-text">Direktori Grup Panua Community</h2>
                          <p className="text-xs text-pch-muted">Wadah interaksi dan kolaborasi pionir Pi Network se-Gorontalo (Sinkron Cloud Realtime).</p>
                        </div>
                        <div className="flex items-center gap-2">
                          <button
                            onClick={() => setShowCreateGroupModal(true)}
                            className="px-3.5 py-2 rounded-xl bg-pch-purple text-white text-xs font-semibold hover:bg-pch-purpleLight flex items-center gap-1.5 shadow-purple-glow shrink-0"
                          >
                            <Icons.Plus className="w-3.5 h-3.5" />
                            <span>Buat Grup</span>
                          </button>
                          <div className="relative w-full sm:w-64">
                            <Icons.Search className="w-4 h-4 text-pch-muted absolute left-3 top-3" />
                            <input 
                              type="text" 
                              placeholder="Cari grup..."
                              value={searchQuery}
                              onChange={(e) => setSearchQuery(e.target.value)}
                              className="w-full bg-pch-secondary border border-pch-border rounded-xl pl-9 pr-4 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                            />
                          </div>
                        </div>
                      </div>

                      {/* Category Filter Pills */}
                      <div className="flex items-center gap-2 overflow-x-auto pb-1 text-xs">
                        {["Semua", "Wilayah", "Edukasi", "Bisnis", "Umum"].map(cat => (
                          <button
                            key={cat}
                            onClick={() => setSelectedCategory(cat)}
                            className={`px-3 py-1.5 rounded-xl font-semibold shrink-0 transition-all ${
                              selectedCategory === cat 
                                ? "bg-pch-gold text-black shadow-gold-glow" 
                                : "bg-pch-surface border border-pch-border text-pch-muted hover:text-pch-text"
                            }`}
                          >
                            {cat}
                          </button>
                        ))}
                      </div>

                      {filteredGroups.length === 0 ? (
                        <div className="p-8 rounded-2xl bg-pch-surface border border-pch-border text-center space-y-3">
                          <Icons.Users className="w-10 h-10 text-pch-muted mx-auto opacity-50" />
                          <p className="text-sm text-pch-muted">Tidak ada grup pada kategori ini. Jadilah yang pertama membuat grup baru!</p>
                        </div>
                      ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                          {filteredGroups.map(grp => (
                            <div key={grp.id} className="p-5 rounded-2xl bg-pch-surface border border-pch-border space-y-3 flex flex-col justify-between">
                              <div className="space-y-2">
                                <div className="flex items-start justify-between gap-2">
                                  <span className="text-[10px] px-2 py-0.5 rounded bg-pch-secondary border border-pch-border text-pch-goldLight font-mono">
                                    {grp.category}
                                  </span>
                                  {grp.isOfficial && (
                                    <span className="text-[10px] px-2 py-0.5 rounded bg-amber-950/80 text-pch-gold border border-pch-gold/40">
                                      Resmi Panua
                                    </span>
                                  )}
                                </div>
                                <h3 className="font-bold text-sm text-pch-text">{grp.name}</h3>
                                <p className="text-xs text-pch-muted leading-relaxed line-clamp-3">{grp.description}</p>
                              </div>
                              <div className="pt-3 border-t border-pch-border flex items-center justify-between gap-2">
                                <span className="text-xs text-pch-muted font-mono">{grp.memberCount} Anggota</span>
                                <div className="flex items-center gap-2">
                                  {(user?.role === "admin" || (grp.createdBy && grp.createdBy === user?.username)) && (
                                    <button
                                      type="button"
                                      onClick={() => handleDeleteGroup(grp.id, grp.name)}
                                      className="p-1.5 rounded-lg bg-pch-secondary border border-pch-border text-pch-muted hover:text-pch-danger hover:border-pch-danger/60 transition-colors"
                                      title="Hapus Grup Ini"
                                    >
                                      <Icons.Trash className="w-3.5 h-3.5" />
                                    </button>
                                  )}
                                  <button
                                    onClick={() => handleToggleJoinGroup(grp)}
                                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                                      grp.joined 
                                        ? "bg-pch-secondary border border-pch-border text-pch-muted hover:text-pch-danger"
                                        : "bg-pch-gold text-black hover:bg-pch-goldLight shadow-gold-glow"
                                    }`}
                                  >
                                    {grp.joined ? "Sudah Bergabung" : "Gabung Grup"}
                                  </button>
                                </div>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}

                  {/* TAB 3: CHAT FORUM */}
                  {activeTab === "chat" && (
                    <div className="p-4 sm:p-6 rounded-2xl bg-pch-surface border border-pch-border h-[650px] flex flex-col justify-between">
                      <div className="pb-3 border-b border-pch-border flex items-center justify-between flex-wrap gap-2">
                        <div className="flex items-center gap-3">
                          <BrandLogo config={appBranding} size="sm" />
                          <div>
                            <h3 className="font-bold text-sm text-pch-text">Forum Resmi Panua Community Gorontalo</h3>
                            <p className="text-[10px] text-pch-muted">Komunikasi publik perintis & anggota secara realtime di Supabase ({chatMessages.length} Pesan)</p>
                          </div>
                        </div>
                        <div className="flex items-center gap-2">
                          {/* Toggle Suara Notifikasi */}
                          <button
                            type="button"
                            onClick={() => {
                              const next = !isSoundNotificationEnabled;
                              setIsSoundNotificationEnabled(next);
                              if (next) playNotificationSound('message');
                              triggerToast(next ? "Suara notifikasi obrolan diaktifkan!" : "Suara notifikasi dibisukan.", "normal");
                            }}
                            className={`p-2 rounded-xl border text-xs font-semibold flex items-center gap-1 transition-all ${
                              isSoundNotificationEnabled 
                                ? "bg-pch-secondary border-pch-gold/50 text-pch-goldLight" 
                                : "bg-pch-secondary border-pch-border text-pch-muted hover:text-pch-text"
                            }`}
                            title={isSoundNotificationEnabled ? "Matikan Nada Notifikasi" : "Aktifkan Nada Notifikasi"}
                          >
                            {isSoundNotificationEnabled ? <Icons.Volume2 className="w-4 h-4" /> : <Icons.VolumeX className="w-4 h-4" />}
                          </button>

                          {/* Tombol Hapus Masal Chat (Admin atau jika ada pesan) */}
                          {(user?.role === "admin" || chatMessages.length > 0) && (
                            <button
                              type="button"
                              onClick={handleClearAllChatMessages}
                              className="px-2.5 py-1.5 rounded-xl bg-red-950/60 border border-pch-danger/60 text-pch-danger hover:bg-red-900/60 text-xs font-semibold flex items-center gap-1.5 transition-all"
                              title="Bersihkan Semua Pesan Obrolan"
                            >
                              <Icons.Trash className="w-3.5 h-3.5" />
                              <span className="hidden sm:inline">Bersihkan Forum</span>
                            </button>
                          )}

                          <span className="text-[10px] px-2.5 py-1 rounded-full bg-emerald-950/80 border border-pch-success text-pch-success font-semibold flex items-center gap-1.5 shrink-0">
                            <span className="w-1.5 h-1.5 rounded-full bg-current animate-ping"></span>
                            <span>Streaming Aktif</span>
                          </span>
                        </div>
                      </div>

                      <div ref={chatScrollRef} className="flex-1 overflow-y-auto py-4 space-y-3.5 pr-2">
                        {chatMessages.length === 0 ? (
                          <div className="h-full flex flex-col items-center justify-center text-pch-muted space-y-2">
                            <Icons.MessageSquare className="w-8 h-8 opacity-40" />
                            <p className="text-xs">Belum ada percakapan. Mulai obrolan pertama!</p>
                          </div>
                        ) : (
                          chatMessages.map(msg => (
                            <div key={msg.id} className={`flex flex-col group ${msg.isMe ? "items-end" : "items-start"}`}>
                              {msg.replyTo && (
                                <span className="text-[10px] text-pch-muted italic mb-1 bg-pch-secondary/80 px-2 py-0.5 rounded border border-pch-border/60">
                                  Membalas: "{msg.replyTo}"
                                </span>
                              )}
                              <div className={`max-w-[85%] sm:max-w-md p-3 rounded-2xl text-xs space-y-1 relative shadow-sm ${
                                msg.isMe 
                                ? "bg-pch-purple text-white rounded-br-sm" 
                                : "bg-pch-secondary border border-pch-border text-pch-text rounded-bl-sm"
                              }`}>
                                {!msg.isMe && <span className="font-bold text-pch-goldLight block text-[11px]">{msg.sender}</span>}
                                <p className="leading-relaxed whitespace-pre-wrap">{msg.text}</p>
                                
                                <div className="flex items-center justify-end gap-2 text-[10px] opacity-75 pt-1 border-t border-white/10 mt-1">
                                  <span>{msg.time}</span>
                                  {!msg.isMe && (
                                    <button onClick={() => setReplyingTo(msg)} className="hover:underline font-semibold text-pch-goldLight">
                                      Balas
                                    </button>
                                  )}
                                  {(msg.isMe || user?.role === "admin") && (
                                    <button 
                                      type="button"
                                      onClick={() => handleDeleteSingleChatMessage(msg.id, msg.sender)}
                                      className="text-red-400 hover:text-red-200 transition-colors p-0.5 ml-1"
                                      title="Hapus Pesan Ini"
                                    >
                                      <Icons.Trash className="w-3 h-3" />
                                    </button>
                                  )}
                                </div>
                              </div>
                            </div>
                          ))
                        )}
                      </div>

                      <form onSubmit={handleSendMessage} className="pt-3 border-t border-pch-border space-y-2">
                        {replyingTo && (
                          <div className="flex items-center justify-between bg-pch-secondary px-3 py-1 rounded-lg text-[11px] text-pch-goldLight">
                            <span>Membalas @{replyingTo.sender}: "{replyingTo.text.slice(0, 30)}..."</span>
                            <button type="button" onClick={() => setReplyingTo(null)} className="text-pch-muted hover:text-pch-text">
                              <Icons.X className="w-3.5 h-3.5" />
                            </button>
                          </div>
                        )}
                        <div className="flex items-center gap-2">
                          <input 
                            type="text" 
                            placeholder="Ketik pesan untuk forum Panua Community..."
                            value={chatInput}
                            onChange={(e) => setChatInput(e.target.value)}
                            className="flex-1 bg-pch-secondary border border-pch-border rounded-xl px-4 py-2.5 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                          />
                          <button 
                            type="submit"
                            className="p-2.5 rounded-xl bg-pch-gold text-black hover:bg-pch-goldLight transition-all shadow-gold-glow shrink-0"
                          >
                            <Icons.Send className="w-4 h-4" />
                          </button>
                        </div>
                      </form>
                    </div>
                  )}

                  {/* TAB 4: MEETINGS */}
                  {activeTab === "meetings" && (
                    <div className="space-y-6">
                      {/* HEADER RAPAT ONLINE DEDICATED */}
                      <div className="p-5 rounded-2xl bg-gradient-to-r from-pch-surface via-pch-secondary to-pch-surface border border-pch-border flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                          <div className="flex items-center gap-2">
                            <span className="w-2.5 h-2.5 rounded-full bg-pch-success animate-ping"></span>
                            <h2 className="text-lg font-bold text-pch-text">Rapat Online Komunitas (WebRTC Ringan & Bebas Hambatan)</h2>
                          </div>
                          <p className="text-xs text-pch-muted mt-1">
                            Konferensi video cepat tanpa perlu login moderator. Audio, mikrofon, kamera, dan screen share langsung terhubung.
                          </p>
                        </div>
                        <div className="flex items-center gap-2">
                          <button
                            type="button"
                            onClick={() => setShowCreateMeetingModal(true)}
                            className="px-4 py-2.5 rounded-xl bg-pch-gold text-black text-xs font-bold hover:bg-pch-goldLight flex items-center gap-1.5 shadow-gold-glow shrink-0 transition-all cursor-pointer"
                          >
                            <Icons.Plus className="w-4 h-4" />
                            <span>Jadwalkan Rapat Baru</span>
                          </button>
                        </div>
                      </div>

                      {/* ACTIVE EMBEDDED MEETING ROOM */}
                      {activeJitsiRoom ? (
                        <div className="space-y-3">
                          <div className="flex items-center justify-between p-3.5 rounded-xl bg-pch-surface border border-pch-gold/40 flex-wrap gap-2">
                            <div className="flex items-center gap-2">
                              <span className="w-2.5 h-2.5 rounded-full bg-pch-success animate-ping"></span>
                              <span className="text-xs font-bold text-pch-goldLight">Sedang Berlangsung: {activeJitsiRoom.title}</span>
                            </div>
                            <div className="flex items-center gap-2 flex-wrap">
                              <a 
                                href={activeJitsiRoom.url}
                                target="_blank"
                                rel="noreferrer"
                                className="px-3 py-1.5 rounded-lg bg-pch-gold text-black text-xs font-bold hover:bg-pch-goldLight shadow-gold-glow flex items-center gap-1"
                              >
                                <Icons.ExternalLink className="w-3.5 h-3.5" />
                                <span>Buka Layar Penuh (Mikrofon & Kamera Optimal)</span>
                              </a>
                              <button
                                onClick={() => handleShareMeetingToWA({
                                  title: activeJitsiRoom.title,
                                  host: user?.name || "Host",
                                  date: "Sedang Berlangsung",
                                  duration: "Live",
                                  room: activeJitsiRoom.room,
                                  directUrl: activeJitsiRoom.url,
                                  provider: activeJitsiRoom.provider
                                })}
                                className="px-3 py-1.5 rounded-lg bg-emerald-950/80 border border-pch-success text-pch-success text-xs font-semibold flex items-center gap-1"
                              >
                                <Icons.Phone className="w-3.5 h-3.5" />
                                <span>Undang via WA</span>
                              </button>
                              <button 
                                onClick={() => setActiveJitsiRoom(null)}
                                className="px-3 py-1.5 rounded-lg bg-red-950/80 border border-pch-danger text-red-200 text-xs font-semibold hover:bg-red-900/80"
                              >
                                Tutup Rapat
                              </button>
                            </div>
                          </div>

                          <div className="w-full h-[560px] rounded-2xl overflow-hidden border border-pch-border bg-black shadow-card-elevated">
                            <iframe 
                              src={activeJitsiRoom.url}
                              title="WebRTC Video Conference"
                              allow="camera *; microphone *; fullscreen *; display-capture *; autoplay *"
                              className="w-full h-full border-0"
                            ></iframe>
                          </div>
                        </div>
                      ) : (
                        /* KONDISI RAPAT: KOSONG SECARA DEFAULT ATAU MENAMPILKAN JADWAL YANG TELAH DIBUAT */
                        meetings.length === 0 ? (
                          /* EMPTY STATE RESMI (HALAMAN KOSONG SAAT BELUM ADA RAPAT) */
                          <div className="p-8 sm:p-12 rounded-2xl bg-pch-surface border border-pch-border text-center space-y-4 max-w-lg mx-auto shadow-card-elevated my-6">
                            <div className="w-16 h-16 rounded-2xl bg-pch-secondary border border-pch-gold/40 text-pch-gold mx-auto flex items-center justify-center shadow-gold-glow">
                              <Icons.Video className="w-8 h-8" />
                            </div>
                            <div className="space-y-1.5">
                              <h3 className="text-base sm:text-lg font-bold text-pch-text">Belum Ada Jadwal Rapat Online</h3>
                              <p className="text-xs text-pch-muted leading-relaxed">
                                Halaman rapat masih kosong. Ketika Anda atau pengurus menjadwalkan rapat baru, daftar ruangan rapat beserta fitur kamera, mikrofon, dan tautan bergabung akan muncul di sini.
                              </p>
                            </div>
                            <button
                              type="button"
                              onClick={() => setShowCreateMeetingModal(true)}
                              className="px-5 py-2.5 rounded-xl bg-pch-gold text-black font-bold text-xs hover:bg-pch-goldLight transition-all shadow-gold-glow inline-flex items-center gap-2"
                            >
                              <Icons.Plus className="w-4 h-4" />
                              <span>Jadwalkan Rapat Sekarang</span>
                            </button>
                          </div>
                        ) : (
                          /* DAFTAR RUANG RAPAT YANG DIBUAT */
                          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {meetings.map(meet => {
                              const providerName = meet.provider === "google-meet" 
                                ? "Google Meet" 
                                : meet.provider === "custom" 
                                ? "Tautan Kustom" 
                                : "MiroTalk WebRTC (Ringan)";
                              return (
                                <div key={meet.id} className="p-5 rounded-2xl bg-pch-surface border border-pch-border space-y-4 flex flex-col justify-between hover:border-pch-gold/50 transition-all shadow-card-elevated">
                                  <div className="space-y-3">
                                    <div className="flex items-start justify-between gap-2">
                                      <span className="text-[10px] px-2 py-0.5 rounded font-bold uppercase bg-emerald-950 text-pch-success border border-pch-success/40 flex items-center gap-1">
                                        <span className="w-1.5 h-1.5 rounded-full bg-current"></span>
                                        <span>{meet.status || "Aktif"}</span>
                                      </span>

                                      <Icons.Video className="w-4 h-4" />
                                      <span>Masuk Rapat Langsung</span>
                                    </button>

                                    <div className="grid grid-cols-2 gap-2">
                                      <button
                                        onClick={() => handleDirectJoinRoom(meet, false)}

                                        <Icons.Eye className="w-3.5 h-3.5 text-pch-purpleLight" />

                                      </button>

                                        onClick={() => handleShareMeetingToWA(meet)}
                                        className="py-1.5 rounded-lg bg-emerald-950/70 border border-pch-success/60 text-pch-success text-xs font-semibold hover:bg-emerald-900/60 flex items-center justify-center gap-1"

                                      >
                                        <Icons.Phone className="w-3.5 h-3.5" />
                                        <span>Kirim ke WA</span>
                                      </button>
                                    </div>

                                    {(user?.role === "admin" || user?.username === meet.createdBy) && (
                                      <button
                                        onClick={() => handleDeleteMeeting(meet.id, meet.title)}
                                        className="w-full py-1 text-[11px] text-pch-muted hover:text-pch-danger text-center"
                                      >
                                        Hapus Ruang Rapat
                                      </button>
                                    )}
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        )
                      )}
                    </div>
                  )}

                  {/* TAB 5: MY SECURE VAULT */}
                  {activeTab === "vault" && (
                    <div className="space-y-6">
                      {!vaultUnlocked ? (
                        <div className="max-w-xl mx-auto p-6 sm:p-8 rounded-2xl bg-pch-surface border border-pch-gold/40 shadow-card-elevated space-y-6 text-center">
                          <div className="w-16 h-16 rounded-2xl bg-pch-gold/15 border border-pch-gold/40 text-pch-gold mx-auto flex items-center justify-center shadow-gold-glow">
                            <Icons.Key className="w-8 h-8" />
                          </div>

                          <div className="space-y-2">
                            <span className="text-[11px] font-bold px-3 py-1 rounded-full bg-amber-950/80 text-pch-goldLight border border-pch-gold/40 uppercase tracking-wider">
                              Akses Privat Terproteksi (Sesi Aktif 1 Jam)
                            </span>
                            <h2 className="text-xl sm:text-2xl font-bold text-pch-text">
                              Buka Akses My Secure Vault
                            </h2>
                            <p className="text-xs sm:text-sm text-pch-muted max-w-md mx-auto leading-relaxed">
                              Masukkan <strong>Redeem Code</strong> yang diterbitkan Admin (berlaku 90 detik). Setelah diverifikasi via Cloud, brankas Anda terbuka selama <strong>1 Jam</strong> sebelum terkunci otomatis.
                            </p>
                          </div>

                          <form onSubmit={handleUnlockVault} className="space-y-4 max-w-md mx-auto">
                            <div className="relative">
                              <Icons.Key className="w-4 h-4 text-pch-gold absolute left-3.5 top-3" />
                              <input 
                                type="text" 
                                required
                                placeholder="Contoh: PANUA-849201"
                                value={vaultRedeemInput}
                                onChange={(e) => setVaultRedeemInput(e.target.value)}
                                className="w-full bg-pch-secondary border border-pch-border rounded-xl pl-10 pr-4 py-2.5 text-sm text-pch-text font-mono uppercase focus:outline-none focus:border-pch-gold"
                              />
                            </div>

                            <button 
                              type="submit"
                              disabled={isVerifyingCode}
                              className="w-full py-2.5 rounded-xl bg-pch-gold text-black font-bold text-sm hover:bg-pch-goldLight transition-all shadow-gold-glow flex items-center justify-center gap-2 disabled:opacity-50"
                            >
                              <Icons.Lock className="w-4 h-4" />
                              <span>{isVerifyingCode ? "Memverifikasi Kode Cloud..." : "Buka Akses Brankas (1 Jam)"}</span>
                            </button>
                          </form>

                          <div className="pt-4 border-t border-pch-border/70 space-y-3">
                            <p className="text-xs text-pch-muted">
                              Belum memiliki Redeem Code atau sesi sebelumnya telah berakhir?
                            </p>
                            <button 
                              type="button"
                              onClick={handleRequestCodeViaWhatsapp}
                              className="px-4 py-2 rounded-xl bg-emerald-950/70 border border-pch-success text-pch-success text-xs font-semibold hover:bg-emerald-900/50 flex items-center justify-center gap-2 mx-auto"
                            >
                              <Icons.Phone className="w-3.5 h-3.5" />
                              <span>Minta Kode Akses 90 Detik ke Admin via WA</span>
                            </button>
                          </div>
                        </div>
                      ) : (
                        <div className="space-y-6">
                          <div className="p-4 rounded-2xl bg-gradient-to-r from-emerald-950/40 via-pch-surface to-pch-surface border border-pch-success/40 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                              <div className="w-10 h-10 rounded-xl bg-emerald-950 border border-pch-success text-pch-success flex items-center justify-center shrink-0">
                                <Icons.Check className="w-5 h-5" />
                              </div>
                              <div>
                                <div className="flex items-center gap-2 flex-wrap">
                                  <h3 className="font-bold text-sm sm:text-base text-pch-text">My Secure Vault — Sesi Akses Terbuka</h3>
                                  <span className="text-[10px] px-2 py-0.5 rounded bg-emerald-950 text-pch-success border border-pch-success/30 font-mono font-bold">15 Berkas Lengkap</span>
                                  {vaultUnlockedUntil > 0 && (
                                    <span className="text-[10px] px-2.5 py-0.5 rounded-full bg-amber-950/80 text-pch-warning border border-pch-warning/40 font-mono font-bold flex items-center gap-1">
                                      <span className="w-1.5 h-1.5 rounded-full bg-current animate-ping"></span>
                                      <span>Sisa Sesi: {Math.max(0, Math.floor((vaultUnlockedUntil - currentTime) / 60000))}m {Math.max(0, Math.floor(((vaultUnlockedUntil - currentTime) % 60000) / 1000))}s (Maks 1 Jam)</span>
                                    </span>
                                  )}
                                </div>
                                <p className="text-xs text-pch-muted">
                                  Status Cloud: <strong>{memberDossier.lastSynced}</strong>
                                </p>
                              </div>
                            </div>

                            <div className="flex items-center gap-2">
                              <button 
                                onClick={handleSaveAndSendDossierToAdmin}
                                disabled={isSavingDossier}

                              >
                                <Icons.Upload className="w-3.5 h-3.5" />
                                <span>{isSavingDossier ? "Menyimpan ke Cloud..." : "Simpan & Kirim ke Admin"}</span>
                              </button>

                              {user?.role !== "admin" && (
                                <button 
                                  onClick={() => {
                                    setVaultUnlockedUntil(0);
                                    localStorage.removeItem('panua_vault_unlock_until');

                                  }}
                                  className="px-3 py-2 rounded-xl bg-pch-secondary border border-pch-border text-pch-muted hover:text-pch-danger text-xs font-semibold"
                                >
                                  Kunci Sesi
                                </button>
                              )}
                            </div>
                          </div>

                          {/* 1. Identitas & Kontak */}

                                />
                              </div>

                              <div>
                                <label className="text-xs font-semibold text-pch-muted block mb-1">Email</label>
                                <input 
                                  type="email" 
                                  value={memberDossier.email || ""}
                                  onChange={(e) => updateDossierField("email", e.target.value)}
                                  className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                                />
                              </div>

                              <div>
                                <label className="text-xs font-semibold text-pch-muted block mb-1">No HP / WhatsApp</label>
                                <input 
                                  type="tel" 
                                  value={memberDossier.noHp || ""}
                                  onChange={(e) => updateDossierField("noHp", e.target.value)}
                                  className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                                />
                              </div>

                              <div>
                                <label className="text-xs font-semibold text-pch-muted block mb-1">Username Pi Network</label>
                                <input 
                                  type="text" 
                                  value={memberDossier.usernamePi || ""}
                                  onChange={(e) => updateDossierField("usernamePi", e.target.value)}
                                  placeholder="@username_pi"
                                  className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text font-mono focus:outline-none focus:border-pch-purple"
                                />
                              </div>

                              <div>
                                <label className="text-xs font-semibold text-pch-muted block mb-1">Tempat & Tanggal Lahir (TTL)</label>
                                <input 
                                  type="text" 
                                  value={memberDossier.ttl || ""}
                                  onChange={(e) => updateDossierField("ttl", e.target.value)}
                                  placeholder="Gorontalo, 17 Agustus 1990"
                                  className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                                />
                              </div>

                              <div>
                                <label className="text-xs font-semibold text-pch-muted block mb-1">NIK (16 Digit)</label>
                                <input 
                                  type="text" 
                                  value={memberDossier.nik || ""}
                                  onChange={(e) => updateDossierField("nik", e.target.value)}
                                  placeholder="7501..."
                                  className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text font-mono focus:outline-none focus:border-pch-purple"
                                />
                              </div>

                              <div className="sm:col-span-2 lg:col-span-3">
                                <label className="text-xs font-semibold text-pch-muted block mb-1">Alamat Lengkap Domisili</label>
                                <textarea 
                                  rows="2"
                                  value={memberDossier.alamatLengkap || ""}
                                  onChange={(e) => updateDossierField("alamatLengkap", e.target.value)}
                                  className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                                ></textarea>
                              </div>
                            </div>
                          </div>

                          {/* 2. Rekening & Wallet */}
                          <div className="p-5 sm:p-6 rounded-2xl bg-pch-surface border border-pch-border space-y-4">
                            <h4 className="font-bold text-sm text-pch-goldLight flex items-center gap-2 border-b border-pch-border pb-3">
                              <Icons.Database className="w-4 h-4 text-pch-gold" />
                              <span>2. Rekening Bank & Alamat Wallet Publik</span>
                            </h4>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                              <div>
                                <label className="text-xs font-semibold text-pch-muted block mb-1">Nama Pemilik Rekening</label>
                                <input 
                                  type="text" 
                                  value={memberDossier.namaRekening || ""}
                                  onChange={(e) => updateDossierField("namaRekening", e.target.value)}
                                  className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                                />
                              </div>

                              <div>
                                <label className="text-xs font-semibold text-pch-muted block mb-1">Bank & Nomor Rekening</label>
                                <input 
                                  type="text" 
                                  value={memberDossier.noRekening || ""}
                                  onChange={(e) => updateDossierField("noRekening", e.target.value)}
                                  placeholder="Contoh: Bank SulutGo / BCA - 1234567890"
                                  className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text font-mono focus:outline-none focus:border-pch-purple"
                                />
                              </div>

                              <div>
                                <label className="text-xs font-semibold text-pch-muted block mb-1">Alamat Wallet Publik Pi Network</label>
                                <input 
                                  type="text" 
                                  value={memberDossier.walletPi || ""}
                                  onChange={(e) => updateDossierField("walletPi", e.target.value)}
                                  placeholder="Public Address (G...)"
                                  className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text font-mono focus:outline-none focus:border-pch-purple"
                                />
                              </div>

                              <div>
                                <label className="text-xs font-semibold text-pch-muted block mb-1">Alamat Wallet Publik OKX</label>
                                <input 
                                  type="text" 
                                  value={memberDossier.walletOkx || ""}
                                  onChange={(e) => updateDossierField("walletOkx", e.target.value)}
                                  placeholder="Public Address OKX (0x...)"
                                  className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text font-mono focus:outline-none focus:border-pch-purple"
                                />
                              </div>
                            </div>
                          </div>

                          {/* 3. Berkas Dokumen Wajib */}
                          <div className="p-5 sm:p-6 rounded-2xl bg-pch-surface border border-pch-border space-y-4">
                            <h4 className="font-bold text-sm text-pch-goldLight flex items-center gap-2 border-b border-pch-border pb-3">
                              <Icons.FileText className="w-4 h-4 text-pch-gold" />
                              <span>3. Berkas Dokumen Wajib Terunggah</span>
                            </h4>

                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                              {[
                                { key: 'fotoKtp', label: 'Foto KTP Elektronik', data: memberDossier.fotoKtp },
                                { key: 'fotoKk', label: 'Foto Kartu Keluarga (KK)', data: memberDossier.fotoKk },
                                { key: 'fotoNpwp', label: 'Foto NPWP', data: memberDossier.fotoNpwp },
                                { key: 'pasfoto', label: 'Pasfoto Formal (4x6)', data: memberDossier.pasfoto },
                                { key: 'kartuKeanggotaan', label: 'Kartu Anggota Panua Community', data: memberDossier.kartuKeanggotaan }
                              ].map(item => (
                                <div key={item.key} className="p-3.5 rounded-xl bg-pch-secondary border border-pch-border flex flex-col justify-between space-y-3">
                                  <div>
                                    <span className="text-[11px] font-bold text-pch-text block">{item.label}</span>
                                    <div className="mt-2 flex items-center gap-2">
                                      <Icons.FileText className="w-4 h-4 text-pch-gold shrink-0" />
                                      <span className="text-xs font-mono text-pch-goldLight truncate">{item.data?.name || "Belum ada berkas"}</span>
                                    </div>
                                    <span className="text-[10px] text-pch-muted mt-1 block">
                                      {item.data?.driveUrl ? (
                                        <a href={item.data.driveUrl} target="_blank" rel="noreferrer" className="text-pch-success underline font-semibold flex items-center gap-1">
                                          <Icons.Check className="w-3 h-3" /> Ada di Cloud (Klik Lihat)
                                        </a>
                                      ) : item.data?.base64 ? (
                                        <span className="text-pch-goldLight">Siap upload ({item.data.size})</span>
                                      ) : (
                                        `Ukuran: ${item.data?.size || "-"}`
                                      )}
                                    </span>
                                  </div>

                                  <label className="text-[11px] px-2.5 py-1 rounded-lg bg-pch-purple/20 border border-pch-purple text-pch-purpleLight hover:bg-pch-purple/30 cursor-pointer text-center font-medium block">
                                    <span>Pilih / Ganti File</span>
                                    <input 
                                      type="file" 
                                      accept=".pdf,image/*" 
                                      className="hidden"
                                      onChange={async (e) => {
                                        const file = e.target.files[0];
                                        if (file) {
                                          if (file.size > 15 * 1024 * 1024) {
                                            triggerToast("Ukuran file maksimal 15MB!", "danger");
                                            return;
                                          }
                                          const compressed = await compressImageFile(file);
                                          setMemberDossier(prev => ({
                                            ...prev,
                                            [item.key]: compressed
                                          }));
                                          triggerToast(`File ${item.label} siap disimpan!`);
                                        }
                                      }}
                                    />
                                  </label>
                                </div>
                              ))}
                            </div>
                          </div>

                          {/* 4. Dokumen Tambahan Lainnya */}
                          <div className="p-5 sm:p-6 rounded-2xl bg-pch-surface border border-pch-border space-y-4">
                            <h4 className="font-bold text-sm text-pch-goldLight flex items-center gap-2 border-b border-pch-border pb-3">
                              <Icons.Plus className="w-4 h-4 text-pch-gold" />
                              <span>4. Dokumen Tambahan Lainnya</span>
                            </h4>

                            {memberDossier.extraDocs && memberDossier.extraDocs.length > 0 ? (
                              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                {memberDossier.extraDocs.map(doc => (
                                  <div key={doc.id} className="p-3 rounded-xl bg-pch-secondary border border-pch-border flex items-center justify-between">
                                    <div className="space-y-0.5 truncate pr-2">
                                      <h5 className="text-xs font-bold text-pch-text truncate">{doc.title}</h5>
                                      <p className="text-[10px] text-pch-muted font-mono">{doc.fileName} • {doc.size}</p>
                                    </div>
                                    <button 
                                      onClick={() => {
                                        setMemberDossier(prev => ({
                                          ...prev,
                                          extraDocs: prev.extraDocs.filter(d => d.id !== doc.id)
                                        }));
                                        triggerToast(`Dokumen "${doc.title}" dihapus.`);
                                      }}
                                      className="p-1.5 rounded-lg bg-pch-surface border border-pch-border text-pch-danger hover:bg-red-950/40"
                                      title="Hapus"
                                    >
                                      <Icons.Trash className="w-3.5 h-3.5" />
                                    </button>
                                  </div>
                                ))}
                              </div>
                            ) : (
                              <p className="text-xs text-pch-muted italic">Belum ada dokumen tambahan.</p>
                            )}

                            <form onSubmit={handleAddExtraDocument} className="pt-2 flex flex-col sm:flex-row items-center gap-2.5">
                              <input 
                                type="text" 
                                placeholder="Judul Dokumen Tambahan"
                                value={newExtraDocTitle}
                                onChange={(e) => setNewExtraDocTitle(e.target.value)}
                                className="flex-1 bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                              />
                              <input 
                                type="file" 
                                accept=".pdf,image/*" 
                                onChange={(e) => setNewExtraDocFile(e.target.files[0])}
                                className="w-full sm:w-auto text-xs text-pch-muted file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:bg-pch-secondary file:text-pch-text file:border file:border-pch-border"
                              />
                              <button 
                                type="submit"
                                className="w-full sm:w-auto px-4 py-2 rounded-xl bg-pch-purple text-white text-xs font-semibold hover:bg-pch-purpleLight shrink-0 shadow-purple-glow"
                              >
                                Tambah Dokumen
                              </button>
                            </form>
                          </div>

                          {/* Save & Sync Button */}
                          <div className="p-5 rounded-2xl bg-pch-secondary border border-pch-gold/40 flex flex-col sm:flex-row items-center justify-between gap-4">
                            <div className="space-y-1 text-center sm:text-left">
                              <h4 className="text-sm font-bold text-pch-text">Simpan & Kirim Semua Dokumen ke Admin</h4>
                              <p className="text-xs text-pch-muted">
                                Dokumen Anda tersimpan di Cloud Database Panua Community Gorontalo.
                              </p>
                            </div>
                            <button 
                              onClick={handleSaveAndSendDossierToAdmin}
                              disabled={isSavingDossier}
                              className="w-full sm:w-auto px-6 py-2.5 rounded-xl bg-pch-gold text-black font-bold text-sm hover:bg-pch-goldLight transition-all shadow-gold-glow flex items-center justify-center gap-2 shrink-0 disabled:opacity-50"
                            >
                              <Icons.Upload className="w-4 h-4" />
                              <span>{isSavingDossier ? "Menyimpan Realtime..." : "Simpan & Kirim Dokumen"}</span>
                            </button>
                          </div>
                        </div>
                      )}
                    </div>
                  )}

                  {/* TAB 6: PROFILE */}
                  {activeTab === "profile" && (
                    <div className="max-w-2xl mx-auto space-y-6">
                      <div className="p-6 rounded-2xl bg-pch-surface border border-pch-border space-y-6">
                        <div className="flex flex-col sm:flex-row items-center gap-5">
                          <div className="relative group">
                            <UserAvatar user={user} branding={appBranding} size="lg" />
                            <label className="absolute inset-0 bg-black/60 rounded-full flex flex-col items-center justify-center text-white opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer">
                              <Icons.Upload className="w-5 h-5 mb-1 text-pch-gold" />
                              <span className="text-[10px] font-semibold">Ganti Foto</span>
                              <input 
                                type="file" 
                                accept="image/*"
                                onChange={handleProfilePhotoUpload}
                                className="hidden"
                              />
                            </label>
                          </div>

                          <div className="space-y-1 text-center sm:text-left">
                            <h2 className="text-xl font-bold text-pch-text">{user.name}</h2>
                            <p className="text-xs text-pch-gold font-mono">@{user.username} • {user.role.toUpperCase()}</p>
                            <p className="text-xs text-pch-muted">{user.email}</p>
                            <p className="text-xs text-pch-purpleLight font-mono">{user.phone || "No HP belum diatur"}</p>
                          </div>
                        </div>

                        <div className="space-y-4 pt-4 border-t border-pch-border">
                          <div>
                            <label className="text-xs font-semibold text-pch-muted">Nama Lengkap</label>
                            <input 
                              type="text" 
                              value={user.name} 
                              onChange={(e) => setUser({ ...user, name: e.target.value })}
                              className="w-full mt-1 bg-pch-secondary border border-pch-border rounded-xl px-4 py-2 text-sm text-pch-text focus:outline-none focus:border-pch-purple"
                            />
                          </div>

                          <div>
                            <label className="text-xs font-semibold text-pch-muted">No HP / WhatsApp</label>
                            <input 
                              type="tel" 
                              value={user.phone || ""} 
                              onChange={(e) => setUser({ ...user, phone: e.target.value })}
                              className="w-full mt-1 bg-pch-secondary border border-pch-border rounded-xl px-4 py-2 text-sm text-pch-text focus:outline-none focus:border-pch-purple"
                            />
                          </div>

                          <div>
                            <label className="text-xs font-semibold text-pch-muted">Bio Anggota Panua</label>
                            <textarea 
                              rows="2"
                              value={user.bio} 
                              onChange={(e) => setUser({ ...user, bio: e.target.value })}
                              className="w-full mt-1 bg-pch-secondary border border-pch-border rounded-xl px-4 py-2 text-sm text-pch-text focus:outline-none focus:border-pch-purple"
                            ></textarea>
                          </div>

                          <div className="pt-2 flex gap-3">
                            <button 
                              onClick={async () => {
                                if (supabase) {
                                  await supabase.from('users_registry').update({
                                    name: user.name,
                                    phone: user.phone,
                                    bio: user.bio
                                  }).eq('id', user.id);
                                }
                                triggerToast("Pengaturan profil berhasil disimpan.", "success");
                              }}
                              className="flex-1 py-2.5 rounded-xl bg-pch-gold text-black font-semibold text-sm hover:bg-pch-goldLight shadow-gold-glow"
                            >
                              Simpan Profil
                            </button>
                            <button 
                              onClick={handleLogoutSession}
                              className="px-4 py-2.5 rounded-xl bg-pch-secondary border border-pch-border text-pch-muted hover:text-pch-danger text-sm font-semibold flex items-center gap-1.5"
                            >
                              <Icons.LogOut className="w-4 h-4" />
                              <span>Keluar</span>
                            </button>
                          </div>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* TAB 7: ADMIN CONSOLE (KHUSUS ROLE ADMIN) */}
                  {activeTab === "admin" && user?.role === "admin" && (
                    <div className="space-y-6">
                      <div className="p-5 rounded-2xl bg-pch-surface border border-pch-purple/50 flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                          <div className="flex items-center gap-2">
                            <Icons.Shield className="w-5 h-5 text-pch-purpleLight" />
                            <h2 className="text-lg font-bold text-pch-text">Panel Administrasi Panua Community</h2>
                          </div>
                          <p className="text-xs text-pch-muted mt-1">
                            Kelola identitas komunitas, terbitkan kode akses 90 detik, dan pantau arsip berkas anggota Gorontalo di Supabase Realtime.
                          </p>
                        </div>
                        <div className="flex items-center gap-2 self-start">
                          <button
                            onClick={() => setShowSupabaseSettingsModal(true)}
                            className="px-3 py-1.5 rounded-lg bg-pch-secondary border border-pch-gold/40 text-xs text-pch-goldLight hover:bg-pch-surface flex items-center gap-1.5"
                          >
                            <Icons.Database className="w-3.5 h-3.5" />
                            <span>Koneksi Supabase</span>
                          </button>
                          <span className="text-xs font-mono bg-pch-purple/20 text-pch-purpleLight border border-pch-purple px-3 py-1 rounded-lg">
                            SUPER_ADMIN
                          </span>
                        </div>
                      </div>

                      {/* 1. Pengaturan Nama & Logo Aplikasi */}
                      <div className="p-6 rounded-2xl bg-pch-surface border border-pch-gold/50 shadow-card-elevated space-y-6">
                        <h3 className="font-bold text-base text-pch-text border-b border-pch-border pb-3 flex items-center gap-2">
                          <Icons.Edit className="w-4 h-4 text-pch-gold" />
                          <span>1. Pengaturan Identitas, Judul & Logo Panua Community</span>
                        </h3>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                          <div className="space-y-4">
                            <div>
                              <label className="text-xs font-semibold text-pch-muted block mb-1">Nama Judul Aplikasi</label>
                              <input 
                                type="text" 
                                value={brandingDraft.title}
                                onChange={(e) => setBrandingDraft({ ...brandingDraft, title: e.target.value })}
                                className="w-full bg-pch-secondary border border-pch-border rounded-xl px-4 py-2 text-sm text-pch-text font-bold focus:outline-none focus:border-pch-purple"
                              />
                            </div>

                            <div>
                              <label className="text-xs font-semibold text-pch-muted block mb-1">Tagline Komunitas</label>
                              <input 
                                type="text" 
                                value={brandingDraft.tagline}
                                onChange={(e) => setBrandingDraft({ ...brandingDraft, tagline: e.target.value })}
                                className="w-full bg-pch-secondary border border-pch-border rounded-xl px-4 py-2 text-sm text-pch-text focus:outline-none focus:border-pch-purple"
                              />
                            </div>

                            <div>
                              <label className="text-xs font-semibold text-pch-muted block mb-1">Nomor WhatsApp Resmi Admin</label>
                              <input 
                                type="tel" 
                                value={brandingDraft.adminWhatsapp}
                                onChange={(e) => setBrandingDraft({ ...brandingDraft, adminWhatsapp: e.target.value })}
                                className="w-full bg-pch-secondary border border-pch-border rounded-xl px-4 py-2 text-xs font-mono text-pch-text focus:outline-none focus:border-pch-purple"
                              />
                            </div>

                            <div>
                              <label className="text-xs font-semibold text-pch-muted block mb-1.5">Format Tampilan Logo</label>
                              <div className="grid grid-cols-2 gap-2">
                                <button
                                  type="button"
                                  onClick={() => setBrandingDraft({ ...brandingDraft, logoType: "panua", customLogoUrl: "" })}
                                  className={`py-2 px-3 rounded-xl text-xs font-semibold border transition-all ${
                                    brandingDraft.logoType === "panua"
                                      ? "bg-pch-gold text-black border-pch-gold shadow-gold-glow"
                                      : "bg-pch-secondary border-pch-border text-pch-muted"
                                  }`}
                                >
                                  Logo Segel Panua Resmi
                                </button>
                                <button
                                  type="button"
                                  onClick={() => setBrandingDraft({ ...brandingDraft, logoType: "custom" })}
                                  className={`py-2 px-3 rounded-xl text-xs font-semibold border transition-all ${
                                    brandingDraft.logoType === "custom"
                                      ? "bg-pch-purple text-white border-pch-purple shadow-purple-glow"
                                      : "bg-pch-secondary border-pch-border text-pch-muted"
                                  }`}
                                >
                                  Logo Kustom Bulat
                                </button>
                              </div>

                              {brandingDraft.logoType === "custom" && (
                                <div className="p-3.5 rounded-xl bg-pch-secondary border border-pch-purple/50 space-y-3 mt-3">
                                  <div className="flex items-center justify-between">
                                    <label className="text-xs font-bold text-pch-purpleLight">
                                      Unggah Gambar Logo Bulat Kustom
                                    </label>
                                    {brandingDraft.customLogoUrl && (
                                      <button
                                        type="button"
                                        onClick={() => setBrandingDraft({ ...brandingDraft, customLogoUrl: "" })}
                                        className="text-[10px] text-pch-danger hover:underline"
                                      >
                                        Hapus Logo
                                      </button>
                                    )}
                                  </div>

                                  <label className="w-full sm:w-auto px-4 py-2 rounded-xl bg-pch-purple text-white text-xs font-bold hover:bg-pch-purpleLight transition-all shadow-purple-glow cursor-pointer text-center flex items-center justify-center gap-2">
                                    <Icons.Upload className="w-4 h-4" />
                                    <span>Pilih File Logo (JPG/PNG/SVG)</span>
                                    <input
                                      type="file"
                                      accept="image/*"
                                      className="hidden"
                                      onChange={async (e) => {
                                        const file = e.target.files[0];
                                        if (file) {
                                          if (file.size > 3 * 1024 * 1024) {
                                            triggerToast("Ukuran logo maksimal 3MB!", "danger");
                                            return;
                                          }
                                          const compressed = await compressImageFile(file, 400, 0.85);
                                          let logoUrl = compressed.base64;
                                          if (supabase) {
                                            const uploaded = await uploadFileToSupabaseStorage(compressed, 'branding');
                                            if (uploaded) logoUrl = uploaded;
                                          }
                                          setBrandingDraft(prev => ({ ...prev, customLogoUrl: logoUrl }));
                                          triggerToast("Logo kustom berhasil dimuat! Pratinjau diperbarui.");
                                        }
                                      }}
                                    />
                                  </label>
                                </div>
                              )}
                            </div>
                          </div>

                          <div className="flex flex-col justify-between p-5 rounded-2xl bg-pch-secondary/50 border border-pch-border space-y-4">
                            <div>
                              <span className="text-xs font-semibold text-pch-muted uppercase tracking-wider block mb-3">
                                Pratinjau Tampilan Header & Avatar
                              </span>
                              <div className="p-4 rounded-xl bg-pch-bg border border-pch-gold/40 flex items-center gap-3">
                                <BrandLogo config={brandingDraft} size="lg" />
                                <div>
                                  <h4 className="font-bold text-base gold-gradient-text uppercase">
                                    {brandingDraft.title}
                                  </h4>
                                  <p className="text-xs text-pch-muted">
                                    {brandingDraft.tagline}
                                  </p>
                                </div>
                              </div>
                            </div>

                            <button 
                              onClick={handleSaveBranding}
                              className="w-full py-3 rounded-xl bg-pch-gold text-black font-bold text-sm hover:bg-pch-goldLight transition-all flex items-center justify-center gap-2 shadow-gold-glow"
                            >
                              <Icons.Check className="w-4 h-4" />
                              <span>Simpan Perubahan Identitas</span>
                            </button>
                          </div>
                        </div>
                      </div>

                      {/* 1B. PENGATURAN DANA TALANGAN & BARCODE QRIS OLEH ADMIN */}
                      <div className="p-6 rounded-2xl bg-pch-surface border border-pch-gold/50 shadow-card-elevated space-y-6">
                        <div className="border-b border-pch-border pb-3 flex items-center justify-between">
                          <h3 className="font-bold text-base text-pch-text flex items-center gap-2">
                            <Icons.Wallet className="w-4 h-4 text-pch-gold" />
                            <span>1B. Pengaturan Dana Talangan & Barcode QRIS Komunitas</span>
                          </h3>
                          <span className="text-[10px] px-2.5 py-0.5 rounded-full bg-amber-950/80 text-pch-goldLight border border-pch-gold/40 font-mono">
                            Sinkron Realtime
                          </span>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                          <div className="space-y-4">
                            <div>
                              <label className="text-xs font-semibold text-pch-muted block mb-1">Nomor Akun DANA Resmi</label>
                              <input 
                                type="tel" 
                                value={brandingDraft.danaNumber || ""}
                                onChange={(e) => setBrandingDraft({ ...brandingDraft, danaNumber: e.target.value })}
                                placeholder="081299887766"
                                className="w-full bg-pch-secondary border border-pch-border rounded-xl px-4 py-2 text-sm font-mono text-pch-text font-bold focus:outline-none focus:border-pch-purple"
                              />
                            </div>

                            <div>
                              <label className="text-xs font-semibold text-pch-muted block mb-1">Atas Nama Rekening DANA</label>
                              <input 
                                type="text" 
                                value={brandingDraft.danaName || ""}
                                onChange={(e) => setBrandingDraft({ ...brandingDraft, danaName: e.target.value })}
                                placeholder="PANUA COMMUNITY GORONTALO"
                                className="w-full bg-pch-secondary border border-pch-border rounded-xl px-4 py-2 text-sm text-pch-text font-bold focus:outline-none focus:border-pch-purple"
                              />
                            </div>

                            <div>
                              <label className="text-xs font-semibold text-pch-muted block mb-1">Deskripsi / Tujuan Dana Talangan</label>
                              <textarea 
                                rows="3"
                                value={brandingDraft.danaDescription || ""}
                                onChange={(e) => setBrandingDraft({ ...brandingDraft, danaDescription: e.target.value })}
                                placeholder="Jelaskan tujuan pengumpulan dana gotong royong bagi anggota..."
