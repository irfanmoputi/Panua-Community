    function safeCopyToClipboard(text) {
      try {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.left = "-999999px";
        textArea.style.top = "-999999px";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        document.execCommand('copy');
        textArea.remove();
        return true;
      } catch (err) {
        return false;
      }
    }

    // Audio Notification Synthesizer (Zero-dependency Web Audio API)
    const playNotificationSound = (type = 'message') => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (ctx.state === 'suspended') ctx.resume();

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;
        if (type === 'message' || type === 'chat') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, now); // D5
          osc.frequency.setValueAtTime(880, now + 0.08); // A5
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
          osc.start(now);
          osc.stop(now + 0.33);
        } else if (type === 'alert' || type === 'meeting' || type === 'user') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(659.25, now + 0.1);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
          osc.start(now);
          osc.stop(now + 0.37);
        } else if (type === 'delete') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.setValueAtTime(160, now + 0.08);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.23);
        }
      } catch (e) {
        // Safe fail jika kebijakan autoplay browser memerlukan interaksi pertama
      }
    };

    function dataURLtoBlob(dataurl) {
      const arr = dataurl.split(',');
      const mime = arr[0].match(/:(.*?);/)[1];
      const bstr = atob(arr[1]);
      let n = bstr.length;
      const u8arr = new Uint8Array(n);
      while(n--){
        u8arr[n] = bstr.charCodeAt(n);
      }
      return new Blob([u8arr], {type:mime});
    }

            reader.onload = (e) => resolve({
              name: file ? file.name : "berkas.dat",

                }
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');

                const compressedBase64 = canvas.toDataURL('image/jpeg', quality);
                const approxKB = Math.round((compressedBase64.length * 3 / 4) / 1024);
                resolve({

              .on('postgres_changes', { event: '*', schema: 'public', table: 'users_registry' }, (payload) => {
                fetchLatestFromSupabase(true);
                if (payload.eventType === 'INSERT' && user?.role === 'admin') {

                }

              .on('postgres_changes', { event: '*', schema: 'public', table: 'redeem_codes' }, () => {
                fetchLatestFromSupabase(true);
              })
              .on('postgres_changes', { event: '*', schema: 'public', table: 'chat_messages' }, (payload) => {
                fetchLatestFromSupabase(true);
                if (payload.eventType === 'INSERT') {
                  const newSender = payload.new?.sender;

                    if (activeTabRef.current !== 'chat') {
                      setUnreadChatCount(prev => prev + 1);

              .on('postgres_changes', { event: '*', schema: 'public', table: 'community_groups' }, () => {
                fetchLatestFromSupabase(true);
              })
              .on('postgres_changes', { event: '*', schema: 'public', table: 'group_memberships' }, () => {
                fetchLatestFromSupabase(true);
              })
              .subscribe((status, err) => {
                if (status === 'SUBSCRIBED') {
                  setIsRealtimeActive(true);

                }

          if (fileObj.base64 && typeof fileObj.base64 === 'string') {

          const { error } = await supabase.storage
            .from('pch_secure_vault')

              cacheControl: '3600',
              upsert: true
            });

          if (error) {
            console.error("Storage upload error:", error);
            return fileObj.base64 || "";
          }

          const { data: urlData } = supabase.storage
            .from('pch_secure_vault')

          setVaultRedeemInput("");
          triggerToast("Akses Brankas Diterima! Sesi aktif selama 1 Jam.", "success");

          grantVaultAccessOneHour();

        const now = Date.now();
        const matchedLocal = activeRedeemCodes.find(c => 
          c.code === codeTrim && 
          (c.userTarget === "all" || c.userTarget?.toLowerCase() === user?.username?.toLowerCase()) &&
          now < c.expiresAt
        );

        if (matchedLocal) {
          grantVaultAccessOneHour();

                grantVaultAccessOneHour();

                triggerToast("Redeem Code telah kedaluwarsa (> 90 detik). Minta kode baru ke Admin.", "danger");

            id: 'slide-1',
            imageUrl: '',
            title: brandingDraft.title || 'PANUA COMMUNITY GORONTALO',
            subtitle: brandingDraft.tagline || 'Wadah Gotong Royong & Edukasi Terpadu Pionir Pi Network Gorontalo'
          }
        ];

        const updatedDraft = { ...brandingDraft, bannerSlides: finalRemaining };
        setBrandingDraft(updatedDraft);
        setAppBranding(updatedDraft);
        setCurrentSlideIndex(0);

        try {
          localStorage.setItem('panua_banner_slides_cache', JSON.stringify(finalRemaining));
        } catch(e) {}

        if (supabase) {
          try {
            await supabase.from('app_branding').upsert([{
              id: 'primary',
              banner_slides: JSON.stringify(finalRemaining),
              updated_at: new Date().toISOString()
            }], { onConflict: 'id' });
            triggerToast("Slide banner berhasil dihapus.", "warning");
          } catch(e) {
            triggerToast("Slide dihapus dari dashboard lokal.", "normal");
          }
        }
      };

      // Helper Konfirmasi Dana Talangan ke WhatsApp Admin
      const handleSendDanaConfirmationWA = () => {
        const adminNumber = (appBranding.adminWhatsapp || "6281299887766").replace(/\D/g, '');
        const sender = danaConfirmSender.trim() || user?.name || "Pionir Panua";
        const nominal = danaConfirmNominal.trim() || "Sukarela";
        const note = danaConfirmNote.trim() || "Dukungan & Solidaritas Panua Gorontalo";
        const text = `📢 *KONFIRMASI DANA TALANGAN & SOLIDARITAS — ${appBranding.title}*\n\nHalo Admin,\nSaya telah melakukan transfer dukungan dana talangan komunitas:\n\n👤 *Nama Pengirim:* ${sender} (@${user?.username || 'user'})\n💰 *Nominal:* Rp ${nominal}\n💳 *Metode:* ${danaConfirmMethod}\n📝 *Catatan / Doa:* ${note}\n\n(Bukti tangkapan layar transfer saya lampirkan di chat ini). Terima kasih atas amanahnya, salam sukses Pionir Panua!`;
        window.open(`https://wa.me/${adminNumber}?text=${encodeURIComponent(text)}`, '_blank');
        triggerToast("Membuka WhatsApp untuk mengirim bukti transfer ke Admin...");
      };

      const handleAddExtraDocument = async (e) => {
        e.preventDefault();
        if (!newExtraDocTitle.trim()) {
          triggerToast("Masukkan judul dokumen tambahan!", "warning");
          return;
        }
        let docObj = null;
        if (newExtraDocFile) {
          docObj = await compressImageFile(newExtraDocFile);
        }
        const newDoc = {
          id: "extra-" + Date.now(),
          title: newExtraDocTitle.trim(),
          fileName: newExtraDocFile ? newExtraDocFile.name : "dokumen_tambahan.dat",
          size: docObj ? docObj.size : "0 KB",
          base64: docObj ? docObj.base64 : ""
        };
        isDossierDirtyRef.current = true;
        setMemberDossier(prev => ({
          ...prev,
          extraDocs: [...(prev.extraDocs || []), newDoc]
        }));
        setNewExtraDocTitle("");
        setNewExtraDocFile(null);
        triggerToast(`Dokumen "${newDoc.title}" siap disimpan ke Supabase!`);
      };

      // GENERATOR REDEEM CODE 90 DETIK
      const handleAdminCreateRedeemCode = async (e) => {
        e.preventDefault();
        const code = newCodeCustom.trim().toUpperCase() || "PANUA-" + Math.floor(100000 + Math.random() * 900000);
        const now = Date.now();
        const newEntry = {
          code: code,
          userTarget: newCodeTarget,
          createdBy: user.username,
          note: newCodeNote.trim() || "Akses Brankas 90 Detik",
          createdAt: now,
          expiresAt: now + 90000
        };

        setActiveRedeemCodes(prev => [newEntry, ...prev.filter(c => now < c.expiresAt)]);
        setNewCodeCustom("");
        setNewCodeNote("");
        triggerToast(`Redeem Code [${code}] aktif 90 detik untuk: ${newCodeTarget}!`, "success");

        if (supabase) {
          try {
            await supabase.from('redeem_codes').insert([
              {
                id: "code-" + now,
                code: newEntry.code,
                user_target: newEntry.userTarget,
                created_by: newEntry.createdBy,
                note: newEntry.note,
                created_at_ms: newEntry.createdAt,
                expires_at_ms: newEntry.expiresAt,
                is_active: true
              }
            ]);
          } catch (err) {
            console.error("Supabase insert code error:", err);
          }
        }
      };

      // Handler Chat Pesan
      const handleSendMessage = async (e) => {
        e.preventDefault();
        if (!chatInput.trim()) return;
        const newMsg = {
          id: "m-" + Date.now(),
          sender: user.name,
          userId: user.id,
          isMe: true,
          text: chatInput.trim(),
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          replyTo: replyingTo ? replyingTo.text.slice(0, 35) + "..." : null
        };

        setChatMessages(prev => [...prev, newMsg]);
        setChatInput("");
        setReplyingTo(null);

        if (supabase) {
          try {
            await supabase.from('chat_messages').insert([
              {
                id: newMsg.id,
                sender: newMsg.sender,
                user_id: newMsg.userId,
                text: newMsg.text,
                time: newMsg.time,
                reply_to: newMsg.replyTo
              }
            ]);
          } catch (err) {
            console.error("Supabase chat error:", err);
          }
        }
      };

      // Handler Hapus Satu Pesan Chat
      const handleDeleteSingleChatMessage = (msgId, senderName) => {
        setConfirmDialog({
          title: "Hapus Pesan Chat",
          message: `Apakah Anda yakin ingin menghapus pesan dari ${senderName}? Pesan ini akan dihapus dari obrolan untuk semua anggota.`,
          onConfirm: async () => {
            setChatMessages(prev => prev.filter(m => m.id !== msgId));
            setConfirmDialog(null);
            playNotificationSound('delete');
            triggerToast("Pesan obrolan berhasil dihapus.", "warning");

            if (supabase) {
              try {
                await supabase.from('chat_messages').delete().eq('id', msgId);
              } catch (err) {
                console.error("Gagal menghapus pesan chat:", err);
              }
            }
          }
        });
      };

      // Handler Hapus Masal / Bersihkan Riwayat Chat
      const handleClearAllChatMessages = () => {
        setConfirmDialog({
          title: "Bersihkan Seluruh Riwayat Chat",
          message: "Apakah Anda yakin ingin menghapus SEMUA pesan di Forum Chat Panua? Riwayat obrolan akan dikosongkan secara permanen di database Cloud Supabase.",
          onConfirm: async () => {
            setChatMessages([]);
            setConfirmDialog(null);
            playNotificationSound('delete');
            triggerToast("Seluruh riwayat chat forum berhasil dibersihkan!", "warning");

            if (supabase) {
              try {
                await supabase.from('chat_messages').delete().neq('id', 'keep_none_placeholder');
              } catch (err) {
                console.error("Gagal membersihkan seluruh pesan chat:", err);
              }
            }
          }
        });
      };

      // Handler Buat Grup Komunitas Baru (Disimpan ke Supabase)
      const handleCreateNewGroup = async (e) => {
        e.preventDefault();
        if (!newGroupName.trim() || !newGroupDesc.trim()) {
          triggerToast("Lengkapi nama grup dan deskripsi!", "warning");
          return;
        }

        const newGrp = {
          id: "grp-" + Date.now(),
          name: newGroupName.trim(),
          category: newGroupCategory,
          member_count: 1,
          is_official: user?.role === "admin",
          description: newGroupDesc.trim(),
          created_by: user.username
        };

        setGroups(prev => [{ ...newGrp, joined: true }, ...prev]);
        setUserJoinedGroupIds(prev => new Set([...prev, newGrp.id]));
        setShowCreateGroupModal(false);
        setNewGroupName("");
        setNewGroupDesc("");
        triggerToast(`Grup "${newGrp.name}" berhasil dibuat di Cloud!`, "success");

        if (supabase) {
          try {
            await supabase.from('community_groups').insert([newGrp]);
            await supabase.from('group_memberships').insert([{
              id: "gmb-" + Date.now(),
              group_id: newGrp.id,
              user_id: user.id,
              username: user.username
            }]);
          } catch (err) {
            console.error("Supabase create group error:", err);
          }
        }
      };

      // Handler Gabung / Keluar Grup Komunitas (Disinkronkan ke Supabase)
      const handleToggleJoinGroup = async (group) => {
        const willJoin = !group.joined;
        setGroups(prev => prev.map(g => g.id === group.id ? { 
          ...g, 
          joined: willJoin, 
          memberCount: willJoin ? g.memberCount + 1 : Math.max(1, g.memberCount - 1) 
        } : g));

        setUserJoinedGroupIds(prev => {
          const nextSet = new Set(prev);
          if (willJoin) nextSet.add(group.id);
          else nextSet.delete(group.id);
          return nextSet;
        });

        triggerToast(willJoin ? `Bergabung ke grup ${group.name}!` : `Keluar dari grup ${group.name}.`);

        if (supabase && user) {
          try {
            if (willJoin) {
              await supabase.from('group_memberships').insert([{
                id: `gmb-${group.id}-${user.id}`,
                group_id: group.id,
                user_id: user.id,
                username: user.username
              }]);
              await supabase.from('community_groups').update({ 
                member_count: group.memberCount + 1 
              }).eq('id', group.id);
            } else {
              await supabase.from('group_memberships').delete().match({
                group_id: group.id,
                user_id: user.id
              });
              await supabase.from('community_groups').update({ 
                member_count: Math.max(1, group.memberCount - 1) 
              }).eq('id', group.id);
            }
          } catch (err) {
            console.error("Toggle group error:", err);
          }
        }
      };

      // Handler Hapus Kelompok Grup Panua (Sinkron Cloud Supabase)
      const handleDeleteGroup = (groupId, groupName) => {
        setConfirmDialog({
          title: "Hapus Grup Komunitas",
          message: `Apakah Anda yakin ingin menghapus grup "${groupName}"? Tindakan ini akan menghapus kelompok grup secara permanen dari daftar dan database Cloud Supabase.`,
          onConfirm: async () => {
            setGroups(prev => prev.filter(g => g.id !== groupId));
            setUserJoinedGroupIds(prev => {
              const nextSet = new Set(prev);
              nextSet.delete(groupId);
              return nextSet;
            });
            setConfirmDialog(null);
            triggerToast(`Grup "${groupName}" berhasil dihapus.`, "warning");

            if (supabase) {
              try {
                await supabase.from('group_memberships').delete().eq('group_id', groupId);
                await supabase.from('community_groups').delete().eq('id', groupId);
              } catch (err) {
                console.error("Gagal menghapus grup dari Supabase:", err);
              }
            }
          }
        });
      };

      const handleDeleteRegisteredMember = async (targetId, targetName) => {
        setConfirmDialog({
          title: "Hapus Anggota Terdaftar",
          message: `Apakah Anda yakin ingin menghapus akun anggota "${targetName}" dari database?`,
          onConfirm: async () => {
            setRegisteredUsers(prev => prev.filter(u => u.id !== targetId));
            setSubmittedDossiers(prev => prev.filter(d => d.userId !== targetId));
            setConfirmDialog(null);
            if (supabase) {
              try {
                await supabase.from('users_registry').delete().eq('id', targetId);
                await supabase.from('dossiers').delete().eq('user_id', targetId);
                triggerToast(`Akun "${targetName}" berhasil dihapus dari Cloud.`, "warning");
              } catch (err) {
                console.error("Delete user error:", err);
              }
            } else {
              triggerToast(`Akun "${targetName}" dihapus secara lokal.`, "warning");
            }
          }
        });
      };

      return (
        <div className="min-h-screen flex flex-col bg-pch-bg text-pch-text pb-16 md:pb-0">
          
          {/* Toast Notification */}
          {toast && (
            <div className={`fixed top-4 right-4 z-50 px-4 py-2.5 rounded-xl border text-xs sm:text-sm font-semibold shadow-card-elevated flex items-center gap-2 backdrop-blur-md animate-fade-in ${
              toast.type === "danger" 
                ? "bg-red-950/90 border-pch-danger text-red-200" 
                : toast.type === "warning"
                ? "bg-amber-950/90 border-pch-warning text-amber-200"
                : toast.type === "success"
                ? "bg-emerald-950/90 border-pch-success text-emerald-200"
                : "bg-pch-surface/90 border-pch-border text-pch-text"
            }`}>
              <span className="w-2 h-2 rounded-full bg-current"></span>
              <span>{toast.msg}</span>
            </div>
          )}

          {/* TOP BAR BERSIH KHUSUS PENGGUNA — TOMBOL KONEKSI HANYA UNTUK ADMIN */}
          <div className="bg-pch-secondary/90 border-b border-pch-border/60 px-4 py-1.5 text-xs flex items-center justify-between gap-2">
            <div className="flex-1 text-center text-pch-muted truncate">
              <span className="inline-block w-2 h-2 rounded-full bg-pch-gold animate-pulse mr-2"></span>
              <span><strong>PANUA COMMUNITY GORONTALO</strong> — Independent Community Platform.</span>
            </div>
            {user?.role === "admin" && (
              <button
                onClick={() => setShowSupabaseSettingsModal(true)}
                className={`px-2.5 py-0.5 rounded-full text-[10px] font-semibold border flex items-center gap-1.5 shrink-0 transition-all ${
                  supabase 
                    ? "bg-emerald-950/60 border-pch-success text-pch-success hover:bg-emerald-900/60" 
                    : "bg-amber-950/80 border-pch-warning text-pch-warning hover:bg-amber-900/80"
                }`}
                title="Status & Pengaturan Koneksi Supabase"
              >
                <Icons.Database className="w-3 h-3" />
                <span>{supabase ? "Cloud Aktif" : "Setup Cloud"}</span>
              </button>
            )}
          </div>

          {/* ==================== AUTHENTICATION PORTAL ==================== */}
          {!isAuthenticated ? (
            <div className="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8 relative">
              <div className="absolute top-1/4 left-1/2 -translate-x-1/2 w-96 h-96 bg-pch-purple/15 rounded-full blur-3xl pointer-events-none"></div>
              <div className="absolute bottom-10 left-1/3 w-80 h-80 bg-pch-gold/10 rounded-full blur-3xl pointer-events-none"></div>

              <div className="relative z-10 w-full max-w-md bg-pch-surface/95 backdrop-blur-md border border-pch-border/90 rounded-2xl p-6 sm:p-8 shadow-card-elevated space-y-6">
                
                <div className="flex flex-col items-center text-center space-y-2">
                  <BrandLogo config={appBranding} size="lg" />
                  <div>
                    <h2 className="text-xl sm:text-2xl font-bold tracking-wide gold-gradient-text uppercase">
                      {appBranding.title}
                    </h2>
                    <p className="text-xs text-pch-muted mt-0.5">{appBranding.tagline}</p>
                  </div>
                </div>

                {authView !== "forgot" && (
                  <div className="grid grid-cols-2 p-1 rounded-xl bg-pch-secondary border border-pch-border">
                    <button
                      type="button"
                      onClick={() => setAuthView("login")}
                      className={`py-2 text-xs sm:text-sm font-semibold rounded-lg transition-all ${
                        authView === "login"
                          ? "bg-pch-gold text-black shadow-gold-glow"
                          : "text-pch-muted hover:text-pch-text"
                      }`}
                    >
                      Masuk (Login)
                    </button>
                    <button
                      type="button"
                      onClick={() => setAuthView("register")}
                      className={`py-2 text-xs sm:text-sm font-semibold rounded-lg transition-all ${
                        authView === "register"
                          ? "bg-pch-purple text-white shadow-purple-glow"
                          : "text-pch-muted hover:text-pch-text"
                      }`}
                    >
                      Daftar (Register)
                    </button>
                  </div>
                )}

                {/* LOGIN FORM */}
                {authView === "login" && (
                  <form onSubmit={handleLoginSubmit} className="space-y-4">
                    <div>
                      <label className="text-xs font-semibold text-pch-muted block mb-1">
                        Email atau Username
                      </label>
                      <div className="relative">
                        <Icons.User className="w-4 h-4 text-pch-muted absolute left-3.5 top-3" />
                        <input 
                          type="text"
                          required
                          value={loginIdentifier}
                          onChange={(e) => setLoginIdentifier(e.target.value)}
                          placeholder="Masukkan Email atau Username"
                          className="w-full bg-pch-secondary border border-pch-border rounded-xl pl-10 pr-4 py-2.5 text-sm text-pch-text placeholder-pch-muted/60 focus:outline-none focus:border-pch-purple"
                        />
                      </div>
                    </div>

                    <div>
                      <div className="flex items-center justify-between mb-1">
                        <label className="text-xs font-semibold text-pch-muted">Password</label>
                        <button 
                          type="button"
                          onClick={() => setAuthView("forgot")}
                          className="text-xs text-pch-gold hover:underline"
                        >
                          Lupa Password?
                        </button>
                      </div>
                      <div className="relative">
                        <Icons.Lock className="w-4 h-4 text-pch-muted absolute left-3.5 top-3" />
                        <input 
                          type={showLoginPassword ? "text" : "password"}
                          required
                          value={loginPassword}
                          onChange={(e) => setLoginPassword(e.target.value)}
                          placeholder="••••••••"
                          className="w-full bg-pch-secondary border border-pch-border rounded-xl pl-10 pr-11 py-2.5 text-sm text-pch-text placeholder-pch-muted/60 focus:outline-none focus:border-pch-purple font-mono"
                        />
                        <button
                          type="button"
                          onClick={() => setShowLoginPassword(!showLoginPassword)}
                          className="absolute right-3.5 top-2.5 text-pch-muted hover:text-pch-gold transition-colors"
                        >
                          {showLoginPassword ? <Icons.EyeOff className="w-4 h-4" /> : <Icons.Eye className="w-4 h-4" />}
                        </button>
                      </div>
                    </div>

                    <button
                      type="submit"
                      className="w-full py-2.5 rounded-xl bg-pch-gold text-black font-bold text-sm hover:bg-pch-goldLight transition-all shadow-gold-glow flex items-center justify-center gap-2 mt-2"
                    >
                      <span>Masuk ke Panua Community</span>
                    </button>
                  </form>
                )}

                {/* REGISTER FORM (REALTIME CLOUD DIRECT) */}
                {authView === "register" && (
                  <form onSubmit={handleRegisterSubmit} className="space-y-3.5">
                    <div>
                      <label className="text-xs font-semibold text-pch-muted block mb-1">Nama Lengkap</label>
                      <input 
                        type="text"
                        required
                        value={regName}
                        onChange={(e) => setRegName(e.target.value)}
                        placeholder="Contoh: Ismail Mohamad"
                        className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-sm text-pch-text focus:outline-none focus:border-pch-purple"
                      />
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="text-xs font-semibold text-pch-muted block mb-1">Username</label>
                        <input 
                          type="text"
                          required
                          value={regUsername}
                          onChange={(e) => setRegUsername(e.target.value)}
                          placeholder="ismail_panua"
                          className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-sm text-pch-text font-mono focus:outline-none focus:border-pch-purple"
                        />
                      </div>
                      <div>
                        <label className="text-xs font-semibold text-pch-muted block mb-1">No HP / WhatsApp</label>
                        <input 
                          type="tel"
                          required
                          value={regPhone}
                          onChange={(e) => setRegPhone(e.target.value)}
                          placeholder="081234567890"
                          className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-sm text-pch-text focus:outline-none focus:border-pch-purple"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="text-xs font-semibold text-pch-muted block mb-1">Email</label>
                      <input 
                        type="email"
                        required
                        value={regEmail}
                        onChange={(e) => setRegEmail(e.target.value)}
                        placeholder="ismail@email.com"
                        className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-sm text-pch-text focus:outline-none focus:border-pch-purple"
                      />
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="text-xs font-semibold text-pch-muted block mb-1">Password</label>
                        <div className="relative">
                          <input 
                            type={showRegPassword ? "text" : "password"}
                            required
                            value={regPassword}
                            onChange={(e) => setRegPassword(e.target.value)}
                            placeholder="••••••"
                            className="w-full bg-pch-secondary border border-pch-border rounded-xl pl-3.5 pr-9 py-2 text-sm text-pch-text font-mono focus:outline-none focus:border-pch-purple"
                          />
                          <button
                            type="button"
                            onClick={() => setShowRegPassword(!showRegPassword)}
                            className="absolute right-2.5 top-2 text-pch-muted hover:text-pch-gold"
                          >
                            {showRegPassword ? <Icons.EyeOff className="w-3.5 h-3.5" /> : <Icons.Eye className="w-3.5 h-3.5" />}
                          </button>
                        </div>
                      </div>
                      <div>
                        <label className="text-xs font-semibold text-pch-muted block mb-1">Konfirmasi</label>
                        <div className="relative">
                          <input 
                            type={showRegConfirmPassword ? "text" : "password"}
                            required
                            value={regConfirmPassword}
                            onChange={(e) => setRegConfirmPassword(e.target.value)}
                            placeholder="••••••"
                            className="w-full bg-pch-secondary border border-pch-border rounded-xl pl-3.5 pr-9 py-2 text-sm text-pch-text font-mono focus:outline-none focus:border-pch-purple"
                          />
                          <button
                            type="button"
                            onClick={() => setShowRegConfirmPassword(!showRegConfirmPassword)}
                            className="absolute right-2.5 top-2 text-pch-muted hover:text-pch-gold"
                          >
                            {showRegConfirmPassword ? <Icons.EyeOff className="w-3.5 h-3.5" /> : <Icons.Eye className="w-3.5 h-3.5" />}
                          </button>
                        </div>
                      </div>
                    </div>

                    <label className="flex items-start gap-2 pt-1 cursor-pointer">
                      <input 
                        type="checkbox"
                        checked={regAgreed}
                        onChange={(e) => setRegAgreed(e.target.checked)}
                        className="mt-0.5 rounded accent-pch-gold"
                      />
                      <span className="text-[11px] text-pch-muted leading-tight">
                        Saya menyetujui Ketentuan Penggunaan dan Kebijakan Privasi Panua Community Gorontalo.
                      </span>
                    </label>

                    <button
                      type="submit"
                      disabled={isRegistering}
                      className="w-full py-2.5 rounded-xl bg-pch-purple text-white font-bold text-sm hover:bg-pch-purpleLight transition-all shadow-purple-glow flex items-center justify-center gap-2 mt-1 disabled:opacity-50"
                    >
                      <span>{isRegistering ? "Menyimpan ke Cloud Supabase..." : "Daftar Akun Anggota Panua"}</span>
                    </button>
                  </form>
                )}

                {/* FORGOT PASSWORD FORM */}
                {authView === "forgot" && (
                  <div className="space-y-4">
                    <button
                      type="button"
                      onClick={() => { setAuthView("login"); setForgotSent(false); }}
                      className="text-xs text-pch-gold flex items-center gap-1 hover:underline"
                    >
                      <Icons.ArrowLeft className="w-3.5 h-3.5" />
                      <span>Kembali ke Halaman Masuk</span>
                    </button>

                    <div className="space-y-1">
                      <h3 className="text-base font-bold text-pch-text">Pemulihan Password</h3>
                      <p className="text-xs text-pch-muted">
                        Masukkan email Anda untuk menerima instruksi pemulihan akun.
                      </p>

                                safeCopyToClipboard((appBranding.danaNumber || "081299887766").replace(/\D/g, ''));
                                triggerToast("Nomor DANA berhasil disalin ke clipboard!", "success");
                              }}
                              className="flex-1 py-2.5 rounded-xl bg-pch-gold text-black font-bold text-xs hover:bg-pch-goldLight shadow-gold-glow flex items-center justify-center gap-2"
                            >
                              <Icons.Copy className="w-4 h-4" />
                              <span>Salin Nomor DANA</span>
                            </button>
                          </div>
                        </div>

                        {/* KARTU 2: TRANSFER VIA SCAN QRIS (SEMUA BANK & E-WALLET) */}
                        <div className="p-6 rounded-2xl bg-pch-surface border border-pch-border space-y-5 flex flex-col justify-between shadow-card-elevated">
                          <div className="space-y-4">
                            <div className="flex items-center justify-between">
                              <span className="text-xs font-bold text-pch-goldLight uppercase tracking-wider flex items-center gap-2">
                                <span className="w-2.5 h-2.5 rounded-full bg-pch-gold"></span>
                                <span>Metode 2: Barcode QRIS Resmi</span>
                              </span>
                              <span className="text-[10px] px-2.5 py-0.5 rounded-full bg-amber-950/80 text-pch-goldLight border border-pch-gold/40 font-mono font-bold">
                                Semua Bank & E-Wallet
                              </span>
                            </div>

                            <div className="flex flex-col items-center justify-center p-4 rounded-xl bg-pch-secondary border border-pch-border text-center space-y-3">
                              {appBranding.qrisImageUrl ? (
                                <div className="space-y-2">
                                  <div className="w-64 max-w-full aspect-square mx-auto rounded-xl overflow-hidden border-2 border-pch-gold p-2 bg-white shadow-gold-glow">
                                    <img 
                                      src={appBranding.qrisImageUrl} 
                                      alt="QRIS Panua Community" 
                                      className="w-full h-full object-contain"
                                    />
                                  </div>
                                  <p className="text-[11px] text-pch-goldLight font-bold">
                                    Scan via BCA, Mandiri, BRI, BNI, DANA, OVO, GoPay, ShopeePay
                                  </p>
                                </div>
                              ) : (
                                <div className="py-8 px-4 space-y-3 text-center">
                                  <div className="w-20 h-20 rounded-2xl bg-pch-surface border border-pch-gold/30 flex items-center justify-center mx-auto text-pch-gold/60">
                                    <Icons.QrCode className="w-10 h-10" />
                                  </div>
                                  <div>
                                    <h4 className="font-bold text-sm text-pch-text">Barcode QRIS Siap Dipindai</h4>
                                    <p className="text-xs text-pch-muted max-w-xs mx-auto mt-1">
                                      Admin belum mengunggah gambar barcode QRIS khusus. Anda dapat langsung menggunakan <strong>Nomor DANA Resmi</strong> di samping.
                                    </p>
                                  </div>
                                </div>
                              )}
                            </div>

                            <p className="text-xs text-pch-muted text-center">
                              Pindai langsung menggunakan kamera e-wallet atau aplikasi mobile banking kesayangan Anda.
                            </p>
                          </div>

                          {appBranding.qrisImageUrl && (
                            <div className="pt-2">
                              <a
                                href={appBranding.qrisImageUrl}
                                target="_blank"
                                rel="noreferrer"
                                className="w-full py-2.5 rounded-xl bg-pch-secondary border border-pch-gold/40 text-pch-goldLight font-bold text-xs hover:bg-pch-surface flex items-center justify-center gap-2"
                              >
                                <Icons.ExternalLink className="w-4 h-4" />
                                <span>Buka / Unduh Barcode QRIS Layar Penuh</span>
                              </a>
                            </div>
                          )}
                        </div>
                      </div>

                      {/* FORM KONFIRMASI TRANSFER KE ADMIN VIA WHATSAPP */}
                      <div className="p-6 rounded-2xl bg-pch-surface border border-pch-gold/50 shadow-card-elevated space-y-5">
                        <div className="border-b border-pch-border pb-3">
                          <h3 className="font-bold text-base text-pch-text flex items-center gap-2">
                            <Icons.Check className="w-5 h-5 text-pch-success" />
                            <span>Konfirmasi Bukti Transfer Dana Talangan</span>
                          </h3>
                          <p className="text-xs text-pch-muted mt-0.5">
                            Kirimkan rincian transfer Anda agar Administrator dapat melakukan pencatatan buku kas komunitas secara transparan.
                          </p>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                          <div>
                            <label className="text-xs font-semibold text-pch-muted block mb-1">Nama Donatur / Pengirim</label>
                            <input 
                              type="text" 
                              placeholder={user?.name || "Nama Lengkap Anda"}
                              value={danaConfirmSender}
                              onChange={(e) => setDanaConfirmSender(e.target.value)}
                              className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2.5 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                            />
                          </div>

                          <div>
                            <label className="text-xs font-semibold text-pch-muted block mb-1">Nominal Donasi (Rp)</label>
                            <input 
                              type="number" 
                              placeholder="Contoh: 50000"
                              value={danaConfirmNominal}
                              onChange={(e) => setDanaConfirmNominal(e.target.value)}
                              className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2.5 text-xs text-pch-text font-mono focus:outline-none focus:border-pch-purple"
                            />
                          </div>

                          <div>
                            <label className="text-xs font-semibold text-pch-muted block mb-1">Metode Transfer</label>
                            <select 
                              value={danaConfirmMethod}
                              onChange={(e) => setDanaConfirmMethod(e.target.value)}
                              className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2.5 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                            >
                              <option value="QRIS Barcode">Barcode QRIS (Semua Bank/E-Wallet)</option>
                              <option value="Dompet DANA">Dompet Digital DANA</option>
                              <option value="Transfer Bank Lain">Transfer Bank / Lainnya</option>
                            </select>
                          </div>

                          <div>
                            <label className="text-xs font-semibold text-pch-muted block mb-1">Catatan / Doa Singkat</label>
                            <input 
                              type="text" 
                              placeholder="Untuk kelancaran komunitas Panua"
                              value={danaConfirmNote}
                              onChange={(e) => setDanaConfirmNote(e.target.value)}
                              className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2.5 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                            />
                          </div>
                        </div>

                        <div className="pt-2 flex flex-col sm:flex-row items-center justify-between gap-4">
                          <span className="text-[11px] text-pch-muted leading-relaxed">
                            Akan otomatis membuka WhatsApp resmi Admin dengan pesan konfirmasi yang telah terformat rapi.
                          </span>

                          <button
                            type="button"
                            onClick={handleSendDanaConfirmationWA}
                            className="w-full sm:w-auto px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs flex items-center justify-center gap-2 shadow-sm transition-all"
                          >
                            <Icons.Phone className="w-4 h-4" />
                            <span>Kirim Konfirmasi Bukti Transfer via WhatsApp</span>
                          </button>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* TAB 2: COMMUNITY GROUPS */}
                  {activeTab === "community" && (
                    <div className="space-y-6">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                          <h2 className="text-xl font-bold text-pch-text">Direktori Grup Panua Community</h2>
                          <p className="text-xs text-pch-muted">Wadah interaksi dan kolaborasi pionir Pi Network se-Gorontalo (Sinkron Cloud Realtime).</p>
                        </div>
                        <div className="flex items-center gap-2">
                          <button
                            onClick={() => setShowCreateGroupModal(true)}
                            className="px-3.5 py-2 rounded-xl bg-pch-purple text-white text-xs font-semibold hover:bg-pch-purpleLight flex items-center gap-1.5 shadow-purple-glow shrink-0"
                          >
                            <Icons.Plus className="w-3.5 h-3.5" />
                            <span>Buat Grup</span>
                          </button>
                          <div className="relative w-full sm:w-64">
                            <Icons.Search className="w-4 h-4 text-pch-muted absolute left-3 top-3" />
                            <input 
                              type="text" 
                              placeholder="Cari grup..."
                              value={searchQuery}
                              onChange={(e) => setSearchQuery(e.target.value)}
                              className="w-full bg-pch-secondary border border-pch-border rounded-xl pl-9 pr-4 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                            />
                          </div>
                        </div>
                      </div>

                      {/* Category Filter Pills */}
                      <div className="flex items-center gap-2 overflow-x-auto pb-1 text-xs">
                        {["Semua", "Wilayah", "Edukasi", "Bisnis", "Umum"].map(cat => (
                          <button
                            key={cat}
                            onClick={() => setSelectedCategory(cat)}
                            className={`px-3 py-1.5 rounded-xl font-semibold shrink-0 transition-all ${
                              selectedCategory === cat 
                                ? "bg-pch-gold text-black shadow-gold-glow" 
                                : "bg-pch-surface border border-pch-border text-pch-muted hover:text-pch-text"
                            }`}
                          >
                            {cat}
                          </button>
                        ))}
                      </div>

                      {filteredGroups.length === 0 ? (
                        <div className="p-8 rounded-2xl bg-pch-surface border border-pch-border text-center space-y-3">
                          <Icons.Users className="w-10 h-10 text-pch-muted mx-auto opacity-50" />
                          <p className="text-sm text-pch-muted">Tidak ada grup pada kategori ini. Jadilah yang pertama membuat grup baru!</p>
                        </div>
                      ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                          {filteredGroups.map(grp => (
                            <div key={grp.id} className="p-5 rounded-2xl bg-pch-surface border border-pch-border space-y-3 flex flex-col justify-between">
                              <div className="space-y-2">
                                <div className="flex items-start justify-between gap-2">
                                  <span className="text-[10px] px-2 py-0.5 rounded bg-pch-secondary border border-pch-border text-pch-goldLight font-mono">
                                    {grp.category}
                                  </span>
                                  {grp.isOfficial && (
                                    <span className="text-[10px] px-2 py-0.5 rounded bg-amber-950/80 text-pch-gold border border-pch-gold/40">
                                      Resmi Panua
                                    </span>
                                  )}
                                </div>
                                <h3 className="font-bold text-sm text-pch-text">{grp.name}</h3>
                                <p className="text-xs text-pch-muted leading-relaxed line-clamp-3">{grp.description}</p>
                              </div>
                              <div className="pt-3 border-t border-pch-border flex items-center justify-between gap-2">
                                <span className="text-xs text-pch-muted font-mono">{grp.memberCount} Anggota</span>
                                <div className="flex items-center gap-2">
                                  {(user?.role === "admin" || (grp.createdBy && grp.createdBy === user?.username)) && (
                                    <button
                                      type="button"
                                      onClick={() => handleDeleteGroup(grp.id, grp.name)}
                                      className="p-1.5 rounded-lg bg-pch-secondary border border-pch-border text-pch-muted hover:text-pch-danger hover:border-pch-danger/60 transition-colors"
                                      title="Hapus Grup Ini"
                                    >
                                      <Icons.Trash className="w-3.5 h-3.5" />
                                    </button>
                                  )}
                                  <button
                                    onClick={() => handleToggleJoinGroup(grp)}
                                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                                      grp.joined 
                                        ? "bg-pch-secondary border border-pch-border text-pch-muted hover:text-pch-danger"
                                        : "bg-pch-gold text-black hover:bg-pch-goldLight shadow-gold-glow"
                                    }`}
                                  >
                                    {grp.joined ? "Sudah Bergabung" : "Gabung Grup"}
                                  </button>
                                </div>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}

                  {/* TAB 3: CHAT FORUM */}
                  {activeTab === "chat" && (
                    <div className="p-4 sm:p-6 rounded-2xl bg-pch-surface border border-pch-border h-[650px] flex flex-col justify-between">
                      <div className="pb-3 border-b border-pch-border flex items-center justify-between flex-wrap gap-2">
                        <div className="flex items-center gap-3">
                          <BrandLogo config={appBranding} size="sm" />
                          <div>
                            <h3 className="font-bold text-sm text-pch-text">Forum Resmi Panua Community Gorontalo</h3>
                            <p className="text-[10px] text-pch-muted">Komunikasi publik perintis & anggota secara realtime di Supabase ({chatMessages.length} Pesan)</p>
                          </div>
                        </div>
                        <div className="flex items-center gap-2">
                          {/* Toggle Suara Notifikasi */}
                          <button
                            type="button"
                            onClick={() => {
                              const next = !isSoundNotificationEnabled;
                              setIsSoundNotificationEnabled(next);
                              if (next) playNotificationSound('message');
                              triggerToast(next ? "Suara notifikasi obrolan diaktifkan!" : "Suara notifikasi dibisukan.", "normal");
                            }}
                            className={`p-2 rounded-xl border text-xs font-semibold flex items-center gap-1 transition-all ${
                              isSoundNotificationEnabled 
                                ? "bg-pch-secondary border-pch-gold/50 text-pch-goldLight" 
                                : "bg-pch-secondary border-pch-border text-pch-muted hover:text-pch-text"
                            }`}
                            title={isSoundNotificationEnabled ? "Matikan Nada Notifikasi" : "Aktifkan Nada Notifikasi"}
                          >
                            {isSoundNotificationEnabled ? <Icons.Volume2 className="w-4 h-4" /> : <Icons.VolumeX className="w-4 h-4" />}
                          </button>

                          {/* Tombol Hapus Masal Chat (Admin atau jika ada pesan) */}
                          {(user?.role === "admin" || chatMessages.length > 0) && (
                            <button
                              type="button"
                              onClick={handleClearAllChatMessages}
                              className="px-2.5 py-1.5 rounded-xl bg-red-950/60 border border-pch-danger/60 text-pch-danger hover:bg-red-900/60 text-xs font-semibold flex items-center gap-1.5 transition-all"
                              title="Bersihkan Semua Pesan Obrolan"
                            >
                              <Icons.Trash className="w-3.5 h-3.5" />
                              <span className="hidden sm:inline">Bersihkan Forum</span>
                            </button>
                          )}

                          <span className="text-[10px] px-2.5 py-1 rounded-full bg-emerald-950/80 border border-pch-success text-pch-success font-semibold flex items-center gap-1.5 shrink-0">
                            <span className="w-1.5 h-1.5 rounded-full bg-current animate-ping"></span>
                            <span>Streaming Aktif</span>
                          </span>
                        </div>
                      </div>

                      <div ref={chatScrollRef} className="flex-1 overflow-y-auto py-4 space-y-3.5 pr-2">
                        {chatMessages.length === 0 ? (
                          <div className="h-full flex flex-col items-center justify-center text-pch-muted space-y-2">
                            <Icons.MessageSquare className="w-8 h-8 opacity-40" />
                            <p className="text-xs">Belum ada percakapan. Mulai obrolan pertama!</p>
                          </div>
                        ) : (
                          chatMessages.map(msg => (
                            <div key={msg.id} className={`flex flex-col group ${msg.isMe ? "items-end" : "items-start"}`}>
                              {msg.replyTo && (
                                <span className="text-[10px] text-pch-muted italic mb-1 bg-pch-secondary/80 px-2 py-0.5 rounded border border-pch-border/60">
                                  Membalas: "{msg.replyTo}"
                                </span>
                              )}
                              <div className={`max-w-[85%] sm:max-w-md p-3 rounded-2xl text-xs space-y-1 relative shadow-sm ${
                                msg.isMe 
                                ? "bg-pch-purple text-white rounded-br-sm" 
                                : "bg-pch-secondary border border-pch-border text-pch-text rounded-bl-sm"
                              }`}>
                                {!msg.isMe && <span className="font-bold text-pch-goldLight block text-[11px]">{msg.sender}</span>}
                                <p className="leading-relaxed whitespace-pre-wrap">{msg.text}</p>
                                
                                <div className="flex items-center justify-end gap-2 text-[10px] opacity-75 pt-1 border-t border-white/10 mt-1">
                                  <span>{msg.time}</span>
                                  {!msg.isMe && (
                                    <button onClick={() => setReplyingTo(msg)} className="hover:underline font-semibold text-pch-goldLight">
                                      Balas
                                    </button>
                                  )}
                                  {(msg.isMe || user?.role === "admin") && (
                                    <button 
                                      type="button"
                                      onClick={() => handleDeleteSingleChatMessage(msg.id, msg.sender)}
                                      className="text-red-400 hover:text-red-200 transition-colors p-0.5 ml-1"
                                      title="Hapus Pesan Ini"
                                    >
                                      <Icons.Trash className="w-3 h-3" />
                                    </button>
                                  )}
                                </div>
                              </div>
                            </div>
                          ))
                        )}
                      </div>

                      <form onSubmit={handleSendMessage} className="pt-3 border-t border-pch-border space-y-2">
                        {replyingTo && (
                          <div className="flex items-center justify-between bg-pch-secondary px-3 py-1 rounded-lg text-[11px] text-pch-goldLight">
                            <span>Membalas @{replyingTo.sender}: "{replyingTo.text.slice(0, 30)}..."</span>
                            <button type="button" onClick={() => setReplyingTo(null)} className="text-pch-muted hover:text-pch-text">
                              <Icons.X className="w-3.5 h-3.5" />
                            </button>
                          </div>
                        )}
                        <div className="flex items-center gap-2">
                          <input 
                            type="text" 
                            placeholder="Ketik pesan untuk forum Panua Community..."
                            value={chatInput}
                            onChange={(e) => setChatInput(e.target.value)}
                            className="flex-1 bg-pch-secondary border border-pch-border rounded-xl px-4 py-2.5 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                          />
                          <button 
                            type="submit"
                            className="p-2.5 rounded-xl bg-pch-gold text-black hover:bg-pch-goldLight transition-all shadow-gold-glow shrink-0"
                          >
                            <Icons.Send className="w-4 h-4" />
                          </button>
                        </div>
                      </form>
                    </div>
                  )}

                  {/* TAB 4: MEETINGS */}
                  {activeTab === "meetings" && (
                    <div className="space-y-6">
                      {/* HEADER RAPAT ONLINE DEDICATED */}
                      <div className="p-5 rounded-2xl bg-gradient-to-r from-pch-surface via-pch-secondary to-pch-surface border border-pch-border flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                          <div className="flex items-center gap-2">
                            <span className="w-2.5 h-2.5 rounded-full bg-pch-success animate-ping"></span>
                            <h2 className="text-lg font-bold text-pch-text">Rapat Online Komunitas (WebRTC Ringan & Bebas Hambatan)</h2>
                          </div>
                          <p className="text-xs text-pch-muted mt-1">
                            Konferensi video cepat tanpa perlu login moderator. Audio, mikrofon, kamera, dan screen share langsung terhubung.
                          </p>
                        </div>
                        <div className="flex items-center gap-2">
                          <button
                            type="button"
                            onClick={() => setShowCreateMeetingModal(true)}
                            className="px-4 py-2.5 rounded-xl bg-pch-gold text-black text-xs font-bold hover:bg-pch-goldLight flex items-center gap-1.5 shadow-gold-glow shrink-0 transition-all cursor-pointer"
                          >
                            <Icons.Plus className="w-4 h-4" />
                            <span>Jadwalkan Rapat Baru</span>
                          </button>
                        </div>
                      </div>

                      {/* ACTIVE EMBEDDED MEETING ROOM */}
                      {activeJitsiRoom ? (
                        <div className="space-y-3">
                          <div className="flex items-center justify-between p-3.5 rounded-xl bg-pch-surface border border-pch-gold/40 flex-wrap gap-2">
                            <div className="flex items-center gap-2">
                              <span className="w-2.5 h-2.5 rounded-full bg-pch-success animate-ping"></span>
                              <span className="text-xs font-bold text-pch-goldLight">Sedang Berlangsung: {activeJitsiRoom.title}</span>
                            </div>
                            <div className="flex items-center gap-2 flex-wrap">
                              <a 
                                href={activeJitsiRoom.url}
                                target="_blank"
                                rel="noreferrer"
                                className="px-3 py-1.5 rounded-lg bg-pch-gold text-black text-xs font-bold hover:bg-pch-goldLight shadow-gold-glow flex items-center gap-1"
                              >
                                <Icons.ExternalLink className="w-3.5 h-3.5" />
                                <span>Buka Layar Penuh (Mikrofon & Kamera Optimal)</span>
                              </a>
                              <button
                                onClick={() => handleShareMeetingToWA({
                                  title: activeJitsiRoom.title,
                                  host: user?.name || "Host",
                                  date: "Sedang Berlangsung",
                                  duration: "Live",
                                  room: activeJitsiRoom.room,
                                  directUrl: activeJitsiRoom.url,
                                  provider: activeJitsiRoom.provider
                                })}
                                className="px-3 py-1.5 rounded-lg bg-emerald-950/80 border border-pch-success text-pch-success text-xs font-semibold flex items-center gap-1"
                              >
                                <Icons.Phone className="w-3.5 h-3.5" />
                                <span>Undang via WA</span>
                              </button>
                              <button 
                                onClick={() => setActiveJitsiRoom(null)}
                                className="px-3 py-1.5 rounded-lg bg-red-950/80 border border-pch-danger text-red-200 text-xs font-semibold hover:bg-red-900/80"
                              >
                                Tutup Rapat
                              </button>
                            </div>
                          </div>

                          <div className="w-full h-[560px] rounded-2xl overflow-hidden border border-pch-border bg-black shadow-card-elevated">
                            <iframe 
                              src={activeJitsiRoom.url}
                              title="WebRTC Video Conference"
                              allow="camera *; microphone *; fullscreen *; display-capture *; autoplay *"
                              className="w-full h-full border-0"
                            ></iframe>
                          </div>
                        </div>
                      ) : (
                        /* KONDISI RAPAT: KOSONG SECARA DEFAULT ATAU MENAMPILKAN JADWAL YANG TELAH DIBUAT */
                        meetings.length === 0 ? (
                          /* EMPTY STATE RESMI (HALAMAN KOSONG SAAT BELUM ADA RAPAT) */
                          <div className="p-8 sm:p-12 rounded-2xl bg-pch-surface border border-pch-border text-center space-y-4 max-w-lg mx-auto shadow-card-elevated my-6">
                            <div className="w-16 h-16 rounded-2xl bg-pch-secondary border border-pch-gold/40 text-pch-gold mx-auto flex items-center justify-center shadow-gold-glow">
                              <Icons.Video className="w-8 h-8" />
                            </div>
                            <div className="space-y-1.5">

                                    onClick={() => copyFieldValue(memberDossier.noRekening, "Nomor Rekening")}

                                  </button>

                                    type="button"
                                    onClick={() => copyFieldValue(memberDossier.walletPi, "Wallet Pi")}
                                    className="text-[10px] text-pch-gold hover:text-pch-goldLight flex items-center gap-1 font-semibold"
                                    title="Salin Wallet Pi"
                                  >
                                    <Icons.Copy className="w-2.5 h-2.5" />
                                    <span>Salin</span>
                                  </button>
                                </div>
                                <div className="relative">
                                  <input 
                                    type="text" 
                                    value={memberDossier.walletPi || ""}
                                    onChange={(e) => updateDossierField("walletPi", e.target.value)}

                                    className="w-full bg-pch-secondary border border-pch-border rounded-xl pl-3.5 pr-9 py-2 text-xs text-pch-text font-mono focus:outline-none focus:border-pch-purple"
                                  />
                                  <button
                                    type="button"
                                    onClick={() => copyFieldValue(memberDossier.walletPi, "Wallet Pi")}
                                    className="absolute right-2 top-1/2 -translate-y-1/2 p-1 text-pch-muted hover:text-pch-gold transition-colors"
                                    title="Salin Wallet Pi"
                                  >
                                    <Icons.Copy className="w-3.5 h-3.5" />
                                  </button>
                                </div>
                              </div>

                              <div>
                                <div className="flex items-center justify-between mb-1">
                                  <label className="text-xs font-semibold text-pch-muted">Alamat Wallet Publik OKX</label>
                                  <button
                                    type="button"
                                    onClick={() => copyFieldValue(memberDossier.walletOkx, "Wallet OKX")}
                                    className="text-[10px] text-pch-gold hover:text-pch-goldLight flex items-center gap-1 font-semibold"
                                    title="Salin Wallet OKX"
                                  >
                                    <Icons.Copy className="w-2.5 h-2.5" />
                                    <span>Salin</span>
                                  </button>
                                </div>
                                <div className="relative">
                                  <input 
                                    type="text" 
                                    value={memberDossier.walletOkx || ""}
                                    onChange={(e) => updateDossierField("walletOkx", e.target.value)}
                                    placeholder="Public Address OKX (0x...)"
                                    className="w-full bg-pch-secondary border border-pch-border rounded-xl pl-3.5 pr-9 py-2 text-xs text-pch-text font-mono focus:outline-none focus:border-pch-purple"

                                  <button
                                    type="button"
                                    onClick={() => copyFieldValue(memberDossier.walletOkx, "Wallet OKX")}

                                    title="Salin Wallet OKX"
                                  >
                                    <Icons.Copy className="w-3.5 h-3.5" />
                                  </button>
                                </div>
                              </div>
                            </div>

                                { key: 'fotoKk', label: 'Foto Kartu Keluarga (KK)', data: memberDossier.fotoKk },
                                { key: 'fotoNpwp', label: 'Foto NPWP', data: memberDossier.fotoNpwp },
                                { key: 'pasfoto', label: 'Pasfoto Formal (4x6)', data: memberDossier.pasfoto },
                                { key: 'kartuKeanggotaan', label: 'Kartu Anggota Panua Community', data: memberDossier.kartuKeanggotaan }
                              ].map(item => {
                                const fileUrl = item.data?.driveUrl || item.data?.base64 || (typeof item.data === 'string' ? item.data : null);
                                const hasFile = Boolean(fileUrl);

                                return (
                                  <div key={item.key} className="p-3.5 rounded-xl bg-pch-secondary border border-pch-border flex flex-col justify-between space-y-3 shadow-sm">
                                    <div>
                                      <div className="flex items-center justify-between gap-1">
                                        <span className="text-[11px] font-bold text-pch-text block truncate">{item.label}</span>
                                        {hasFile && (
                                          <button
                                            type="button"
                                            onClick={() => handleCopyDocLink(item.data, item.label)}
                                            className="text-[10px] text-pch-gold hover:text-pch-goldLight flex items-center gap-0.5"
                                            title="Salin Info / Tautan Berkas"
                                          >
                                            <Icons.Copy className="w-2.5 h-2.5" />
                                            <span>Salin</span>
                                          </button>
                                        )}
                                      </div>
                                      <div className="mt-2 flex items-center gap-2">
                                        <Icons.FileText className="w-4 h-4 text-pch-gold shrink-0" />
                                        <span className="text-xs font-mono text-pch-goldLight truncate">{item.data?.name || "Belum ada berkas"}</span>
                                      </div>
                                      <span className="text-[10px] text-pch-muted mt-1 block">
                                        {item.data?.driveUrl ? (
                                          <span className="text-pch-success font-semibold flex items-center gap-1">
                                            <Icons.Check className="w-3 h-3" /> Ada di Cloud Supabase
                                          </span>
                                        ) : item.data?.base64 ? (
                                          <span className="text-pch-goldLight">Siap upload ({item.data.size || "file"})</span>
                                        ) : (
                                          `Ukuran: ${item.data?.size || "-"}`
                                        )}
                                      </span>
                                    </div>

                                    <div className="space-y-2 pt-2 border-t border-pch-border/60">

                                      {hasFile && (
                                        <div className="grid grid-cols-2 gap-2">
                                          <button
                                            type="button"
                                            onClick={() => setPreviewModalDoc({ title: item.label, url: fileUrl, name: item.data?.name })}
                                            className="py-1.5 px-2 rounded-lg bg-pch-gold/15 border border-pch-gold/40 text-pch-goldLight hover:bg-pch-gold/25 text-xs font-semibold flex items-center justify-center gap-1.5 transition-colors"
                                            title="Lihat Pratinjau Berkas"
                                          >
                                            <Icons.Eye className="w-3.5 h-3.5 text-pch-gold" />
                                            <span>Preview</span>
                                          </button>

                                          <button
                                            type="button"
                                            onClick={() => handleDownloadDocument(item.data, item.label)}
                                            className="py-1.5 px-2 rounded-lg bg-emerald-950/70 border border-pch-success/50 text-pch-success hover:bg-emerald-900/60 text-xs font-semibold flex items-center justify-center gap-1.5 transition-colors"
                                            title="Unduh Berkas ke Perangkat"
                                          >
                                            <Icons.Download className="w-3.5 h-3.5" />
                                            <span>Download</span>
                                          </button>
                                        </div>
                                      )}

                                      {/* Tombol Pilih / Ganti Berkas */}
                                      <label className="text-[11px] py-1.5 px-2.5 rounded-lg bg-pch-purple/20 border border-pch-purple text-pch-purpleLight hover:bg-pch-purple/30 cursor-pointer text-center font-medium block transition-colors">

                                          type="file" 
                                          accept=".pdf,image/*" 
                                          className="hidden"

                                            const file = e.target.files[0];
                                            if (file) {
                                              if (file.size > 15 * 1024 * 1024) {
                                                triggerToast("Ukuran file maksimal 15MB!", "danger");
                                                return;
                                              }
                                              const compressed = await compressImageFile(file);
                                              isDossierDirtyRef.current = true;
                                              setMemberDossier(prev => ({
                                                ...prev,
                                                [item.key]: compressed
                                              }));
                                              triggerToast(`File ${item.label} siap disimpan!`, "success");
                                            }
                                          }}
                                        />
                                      </label>
                                    </div>
                                  </div>
                                );
                              })}
                            </div>
                          </div>

                              <span>4. Dokumen Tambahan Lainnya</span>

                              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">

                                        <h5 className="text-xs font-bold text-pch-text truncate">{doc.title}</h5>
                                        <p className="text-[10px] text-pch-muted font-mono">{doc.fileName} • {doc.size}</p>

                                      <div className="flex items-center gap-1.5 shrink-0">

                                          <>
                                            <button
                                              type="button"
                                              onClick={() => setPreviewModalDoc({ title: doc.title, url: exUrl, name: doc.fileName })}
                                              className="px-2 py-1 rounded-lg bg-pch-gold/15 border border-pch-gold/40 text-pch-goldLight text-[11px] font-semibold flex items-center gap-1"
                                              title="Preview Dokumen"
                                            >
                                              <Icons.Eye className="w-3 h-3 text-pch-gold" />
                                              <span>Preview</span>
                                            </button>
                                            <button
