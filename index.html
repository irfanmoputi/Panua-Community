                                        if (file) {
                                          if (file.size > 15 * 1024 * 1024) {
                                            triggerToast("Ukuran file maksimal 15MB!", "danger");
                                            return;
                                          }
                                          const compressed = await compressImageFile(file);
                                          setMemberDossier(prev => ({
                                            ...prev,
                                            [item.key]: compressed
                                          }));
                                          triggerToast(`File ${item.label} siap disimpan!`);
                                        }
                                      }}
                                    />
                                  </label>
                                </div>
                              ))}
                            </div>
                          </div>

                          {/* 4. Dokumen Tambahan Lainnya */}
                          <div className="p-5 sm:p-6 rounded-2xl bg-pch-surface border border-pch-border space-y-4">
                            <h4 className="font-bold text-sm text-pch-goldLight flex items-center gap-2 border-b border-pch-border pb-3">
                              <Icons.Plus className="w-4 h-4 text-pch-gold" />
                              <span>4. Dokumen Tambahan Lainnya</span>
                            </h4>

                            {memberDossier.extraDocs && memberDossier.extraDocs.length > 0 ? (
                              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                {memberDossier.extraDocs.map(doc => (
                                  <div key={doc.id} className="p-3 rounded-xl bg-pch-secondary border border-pch-border flex items-center justify-between">
                                    <div className="space-y-0.5 truncate pr-2">
                                      <h5 className="text-xs font-bold text-pch-text truncate">{doc.title}</h5>
                                      <p className="text-[10px] text-pch-muted font-mono">{doc.fileName} • {doc.size}</p>
                                    </div>
                                    <button 
                                      onClick={() => {
                                        setMemberDossier(prev => ({
                                          ...prev,
                                          extraDocs: prev.extraDocs.filter(d => d.id !== doc.id)
                                        }));
                                        triggerToast(`Dokumen "${doc.title}" dihapus.`);
                                      }}
                                      className="p-1.5 rounded-lg bg-pch-surface border border-pch-border text-pch-danger hover:bg-red-950/40"
                                      title="Hapus"
                                    >
                                      <Icons.Trash className="w-3.5 h-3.5" />
                                    </button>
                                  </div>
                                ))}
                              </div>
                            ) : (
                              <p className="text-xs text-pch-muted italic">Belum ada dokumen tambahan.</p>
                            )}

                            <form onSubmit={handleAddExtraDocument} className="pt-2 flex flex-col sm:flex-row items-center gap-2.5">
                              <input 
                                type="text" 
                                placeholder="Judul Dokumen Tambahan"
                                value={newExtraDocTitle}
                                onChange={(e) => setNewExtraDocTitle(e.target.value)}
                                className="flex-1 bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                              />
                              <input 
                                type="file" 
                                accept=".pdf,image/*" 
                                onChange={(e) => setNewExtraDocFile(e.target.files[0])}
                                className="w-full sm:w-auto text-xs text-pch-muted file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:bg-pch-secondary file:text-pch-text file:border file:border-pch-border"
                              />
                              <button 
                                type="submit"
                                className="w-full sm:w-auto px-4 py-2 rounded-xl bg-pch-purple text-white text-xs font-semibold hover:bg-pch-purpleLight shrink-0 shadow-purple-glow"
                              >
                                Tambah Dokumen
                              </button>
                            </form>
                          </div>

                          {/* Save & Sync Button */}
                          <div className="p-5 rounded-2xl bg-pch-secondary border border-pch-gold/40 flex flex-col sm:flex-row items-center justify-between gap-4">
                            <div className="space-y-1 text-center sm:text-left">
                              <h4 className="text-sm font-bold text-pch-text">Simpan & Kirim Semua Dokumen ke Admin</h4>
                              <p className="text-xs text-pch-muted">
                                Dokumen Anda tersimpan di Cloud Database Panua Community Gorontalo.
                              </p>
                            </div>
                            <button 
                              onClick={handleSaveAndSendDossierToAdmin}
                              disabled={isSavingDossier}
                              className="w-full sm:w-auto px-6 py-2.5 rounded-xl bg-pch-gold text-black font-bold text-sm hover:bg-pch-goldLight transition-all shadow-gold-glow flex items-center justify-center gap-2 shrink-0 disabled:opacity-50"
                            >
                              <Icons.Upload className="w-4 h-4" />
                              <span>{isSavingDossier ? "Menyimpan Realtime..." : "Simpan & Kirim Dokumen"}</span>
                            </button>
                          </div>
                        </div>
                      )}
                    </div>
                  )}

                  {/* TAB 6: PROFILE */}
                  {activeTab === "profile" && (
                    <div className="max-w-2xl mx-auto space-y-6">
                      <div className="p-6 rounded-2xl bg-pch-surface border border-pch-border space-y-6">
                        <div className="flex flex-col sm:flex-row items-center gap-5">
                          <div className="relative group">
                            <UserAvatar user={user} branding={appBranding} size="lg" />
                            <label className="absolute inset-0 bg-black/60 rounded-full flex flex-col items-center justify-center text-white opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer">
                              <Icons.Upload className="w-5 h-5 mb-1 text-pch-gold" />
                              <span className="text-[10px] font-semibold">Ganti Foto</span>
                              <input 
                                type="file" 
                                accept="image/*"
                                onChange={handleProfilePhotoUpload}
                                className="hidden"
                              />
                            </label>
                          </div>

                          <div className="space-y-1 text-center sm:text-left">
                            <h2 className="text-xl font-bold text-pch-text">{user.name}</h2>
                            <p className="text-xs text-pch-gold font-mono">@{user.username} • {user.role.toUpperCase()}</p>
                            <p className="text-xs text-pch-muted">{user.email}</p>
                            <p className="text-xs text-pch-purpleLight font-mono">{user.phone || "No HP belum diatur"}</p>
                          </div>
                        </div>

                        <div className="space-y-4 pt-4 border-t border-pch-border">
                          <div>
                            <label className="text-xs font-semibold text-pch-muted">Nama Lengkap</label>
                            <input 
                              type="text" 
                              value={user.name} 
                              onChange={(e) => setUser({ ...user, name: e.target.value })}
                              className="w-full mt-1 bg-pch-secondary border border-pch-border rounded-xl px-4 py-2 text-sm text-pch-text focus:outline-none focus:border-pch-purple"
                            />
                          </div>

                          <div>
                            <label className="text-xs font-semibold text-pch-muted">No HP / WhatsApp</label>
                            <input 
                              type="tel" 
                              value={user.phone || ""} 
                              onChange={(e) => setUser({ ...user, phone: e.target.value })}
                              className="w-full mt-1 bg-pch-secondary border border-pch-border rounded-xl px-4 py-2 text-sm text-pch-text focus:outline-none focus:border-pch-purple"
                            />
                          </div>

                          <div>
                            <label className="text-xs font-semibold text-pch-muted">Bio Anggota Panua</label>
                            <textarea 
                              rows="2"
                              value={user.bio} 
                              onChange={(e) => setUser({ ...user, bio: e.target.value })}
                              className="w-full mt-1 bg-pch-secondary border border-pch-border rounded-xl px-4 py-2 text-sm text-pch-text focus:outline-none focus:border-pch-purple"
                            ></textarea>
                          </div>

                          <div className="pt-2 flex gap-3">
                            <button 
                              onClick={async () => {
                                if (supabase) {
                                  await supabase.from('users_registry').update({
                                    name: user.name,
                                    phone: user.phone,
                                    bio: user.bio
                                  }).eq('id', user.id);
                                }
                                triggerToast("Pengaturan profil berhasil disimpan.", "success");
                              }}
                              className="flex-1 py-2.5 rounded-xl bg-pch-gold text-black font-semibold text-sm hover:bg-pch-goldLight shadow-gold-glow"
                            >
                              Simpan Profil
                            </button>
                            <button 
                              onClick={handleLogoutSession}
                              className="px-4 py-2.5 rounded-xl bg-pch-secondary border border-pch-border text-pch-muted hover:text-pch-danger text-sm font-semibold flex items-center gap-1.5"
                            >
                              <Icons.LogOut className="w-4 h-4" />
                              <span>Keluar</span>
                            </button>
                          </div>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* TAB 7: ADMIN CONSOLE (KHUSUS ROLE ADMIN) */}
                  {activeTab === "admin" && user?.role === "admin" && (
                    <div className="space-y-6">
                      <div className="p-5 rounded-2xl bg-pch-surface border border-pch-purple/50 flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                          <div className="flex items-center gap-2">
                            <Icons.Shield className="w-5 h-5 text-pch-purpleLight" />
                            <h2 className="text-lg font-bold text-pch-text">Panel Administrasi Panua Community</h2>
                          </div>
                          <p className="text-xs text-pch-muted mt-1">
                            Kelola identitas komunitas, terbitkan kode akses 90 detik, dan pantau arsip berkas anggota Gorontalo.
                          </p>
                        </div>
                        <div className="flex items-center gap-2 self-start">
                          <button
                            onClick={() => setShowSupabaseSettingsModal(true)}
                            className="px-3 py-1.5 rounded-lg bg-pch-secondary border border-pch-gold/40 text-xs text-pch-goldLight hover:bg-pch-surface flex items-center gap-1.5"
                          >
                            <Icons.Database className="w-3.5 h-3.5" />
                            <span>Koneksi Supabase</span>
                          </button>
                          <span className="text-xs font-mono bg-pch-purple/20 text-pch-purpleLight border border-pch-purple px-3 py-1 rounded-lg">
                            SUPER_ADMIN
                          </span>
                        </div>
                      </div>

                      {/* 1. Pengaturan Nama & Logo Aplikasi */}
                      <div className="p-6 rounded-2xl bg-pch-surface border border-pch-gold/50 shadow-card-elevated space-y-6">
                        <h3 className="font-bold text-base text-pch-text border-b border-pch-border pb-3 flex items-center gap-2">
                          <Icons.Edit className="w-4 h-4 text-pch-gold" />
                          <span>1. Pengaturan Identitas, Judul & Logo Panua Community</span>
                        </h3>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                          <div className="space-y-4">
                            <div>
                              <label className="text-xs font-semibold text-pch-muted block mb-1">Nama Judul Aplikasi</label>
                              <input 
                                type="text" 
                                value={brandingDraft.title}
                                onChange={(e) => setBrandingDraft({ ...brandingDraft, title: e.target.value })}
                                className="w-full bg-pch-secondary border border-pch-border rounded-xl px-4 py-2 text-sm text-pch-text font-bold focus:outline-none focus:border-pch-purple"
                              />
                            </div>

                            <div>
                              <label className="text-xs font-semibold text-pch-muted block mb-1">Tagline Komunitas</label>
                              <input 
                                type="text" 
                                value={brandingDraft.tagline}
                                onChange={(e) => setBrandingDraft({ ...brandingDraft, tagline: e.target.value })}
                                className="w-full bg-pch-secondary border border-pch-border rounded-xl px-4 py-2 text-sm text-pch-text focus:outline-none focus:border-pch-purple"
                              />
                            </div>

                            <div>
                              <label className="text-xs font-semibold text-pch-muted block mb-1">Nomor WhatsApp Resmi Admin</label>
                              <input 
                                type="tel" 
                                value={brandingDraft.adminWhatsapp}
                                onChange={(e) => setBrandingDraft({ ...brandingDraft, adminWhatsapp: e.target.value })}
                                className="w-full bg-pch-secondary border border-pch-border rounded-xl px-4 py-2 text-xs font-mono text-pch-text focus:outline-none focus:border-pch-purple"
                              />
                            </div>

                            <div>
                              <label className="text-xs font-semibold text-pch-muted block mb-1.5">Format Tampilan Logo</label>
                              <div className="grid grid-cols-2 gap-2">
                                <button
                                  type="button"
                                  onClick={() => setBrandingDraft({ ...brandingDraft, logoType: "panua", customLogoUrl: "" })}
                                  className={`py-2 px-3 rounded-xl text-xs font-semibold border transition-all ${
                                    brandingDraft.logoType === "panua"
                                      ? "bg-pch-gold text-black border-pch-gold shadow-gold-glow"
                                      : "bg-pch-secondary border-pch-border text-pch-muted"
                                  }`}
                                >
                                  Logo Segel Panua Resmi
                                </button>
                                <button
                                  type="button"
                                  onClick={() => setBrandingDraft({ ...brandingDraft, logoType: "custom" })}
                                  className={`py-2 px-3 rounded-xl text-xs font-semibold border transition-all ${
                                    brandingDraft.logoType === "custom"
                                      ? "bg-pch-purple text-white border-pch-purple shadow-purple-glow"
                                      : "bg-pch-secondary border-pch-border text-pch-muted"
                                  }`}
                                >
                                  Logo Kustom Bulat
                                </button>
                              </div>

                              {brandingDraft.logoType === "custom" && (
                                <div className="p-3.5 rounded-xl bg-pch-secondary border border-pch-purple/50 space-y-3 mt-3">
                                  <div className="flex items-center justify-between">
                                    <label className="text-xs font-bold text-pch-purpleLight">
                                      Unggah Gambar Logo Bulat Kustom
                                    </label>
                                    {brandingDraft.customLogoUrl && (
                                      <button
                                        type="button"
                                        onClick={() => setBrandingDraft({ ...brandingDraft, customLogoUrl: "" })}
                                        className="text-[10px] text-pch-danger hover:underline"
                                      >
                                        Hapus Logo
                                      </button>
                                    )}
                                  </div>

                                  <label className="w-full sm:w-auto px-4 py-2 rounded-xl bg-pch-purple text-white text-xs font-bold hover:bg-pch-purpleLight transition-all shadow-purple-glow cursor-pointer text-center flex items-center justify-center gap-2">
                                    <Icons.Upload className="w-4 h-4" />
                                    <span>Pilih File Logo (JPG/PNG/SVG)</span>
                                    <input
                                      type="file"
                                      accept="image/*"
                                      className="hidden"
                                      onChange={async (e) => {
                                        const file = e.target.files[0];
                                        if (file) {
                                          if (file.size > 3 * 1024 * 1024) {
                                            triggerToast("Ukuran logo maksimal 3MB!", "danger");
                                            return;
                                          }
                                          const compressed = await compressImageFile(file, 400, 0.85);
                                          let logoUrl = compressed.base64;
                                          if (supabase) {
                                            const uploaded = await uploadFileToSupabaseStorage(compressed, 'branding');
                                            if (uploaded) logoUrl = uploaded;
                                          }
                                          setBrandingDraft(prev => ({ ...prev, customLogoUrl: logoUrl }));
                                          triggerToast("Logo kustom berhasil dimuat! Pratinjau diperbarui.");
                                        }
                                      }}
                                    />
                                  </label>
                                </div>
                              )}
                            </div>
                          </div>

                          <div className="flex flex-col justify-between p-5 rounded-2xl bg-pch-secondary/50 border border-pch-border space-y-4">
                            <div>
                              <span className="text-xs font-semibold text-pch-muted uppercase tracking-wider block mb-3">
                                Pratinjau Tampilan Header & Avatar
                              </span>
                              <div className="p-4 rounded-xl bg-pch-bg border border-pch-gold/40 flex items-center gap-3">
                                <BrandLogo config={brandingDraft} size="lg" />
                                <div>
                                  <h4 className="font-bold text-base gold-gradient-text uppercase">
                                    {brandingDraft.title}
                                  </h4>
                                  <p className="text-xs text-pch-muted">
                                    {brandingDraft.tagline}
                                  </p>
                                </div>
                              </div>
                            </div>

                            <button 
                              onClick={handleSaveBranding}
                              className="w-full py-3 rounded-xl bg-pch-gold text-black font-bold text-sm hover:bg-pch-goldLight transition-all flex items-center justify-center gap-2 shadow-gold-glow"
                            >
                              <Icons.Check className="w-4 h-4" />
                              <span>Simpan Perubahan Identitas</span>
                            </button>
                          </div>
                        </div>
                      </div>

                      {/* 2. Generator Redeem Code 90 Detik */}
                      <div className="p-6 rounded-2xl bg-pch-surface border border-pch-purple/50 shadow-card-elevated space-y-6">
                        <h3 className="font-bold text-base text-pch-text border-b border-pch-border pb-3 flex items-center gap-2">
                          <Icons.Key className="w-4 h-4 text-pch-purpleLight" />
                          <span>2. Generator Redeem Code 90 Detik (Auto-Delete Realtime)</span>
                        </h3>

                        <form onSubmit={handleAdminCreateRedeemCode} className="p-4 rounded-xl bg-pch-secondary border border-pch-border space-y-3">
                          <span className="text-xs font-bold text-pch-goldLight block">Terbitkan Kode Baru untuk Anggota</span>
                          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <div>
                              <label className="text-[11px] text-pch-muted block mb-1">Target Anggota</label>
                              <select 
                                value={newCodeTarget}
                                onChange={(e) => setNewCodeTarget(e.target.value)}
                                className="w-full bg-pch-surface border border-pch-border rounded-xl px-3 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                              >
                                <option value="all">Semua Anggota (Umum)</option>
                                {registeredUsers.filter(u => u.role !== 'admin').map(u => (
                                  <option key={u.id} value={u.username}>{u.name} (@{u.username})</option>
                                ))}
                              </select>
                            </div>

                            <div>
                              <label className="text-[11px] text-pch-muted block mb-1">Kode Kustom (Opsional)</label>
                              <input 
                                type="text" 
                                placeholder="Kosongkan untuk acak"
                                value={newCodeCustom}
                                onChange={(e) => setNewCodeCustom(e.target.value)}
                                className="w-full bg-pch-surface border border-pch-border rounded-xl px-3 py-2 text-xs text-pch-text font-mono uppercase focus:outline-none focus:border-pch-purple"
                              />
                            </div>

                            <div>
                              <label className="text-[11px] text-pch-muted block mb-1">Catatan Akses</label>
                              <input 
                                type="text" 
                                placeholder="Misal: Akses Verifikasi KYC"
                                value={newCodeNote}
                                onChange={(e) => setNewCodeNote(e.target.value)}
                                className="w-full bg-pch-surface border border-pch-border rounded-xl px-3 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                              />
                            </div>
                          </div>

                          <button 
                            type="submit"
                            className="px-4 py-2 rounded-xl bg-pch-purple text-white text-xs font-bold hover:bg-pch-purpleLight flex items-center gap-1.5 shadow-purple-glow"
                          >
                            <Icons.Plus className="w-3.5 h-3.5" />
                            <span>Terbitkan Kode 90 Detik</span>
                          </button>
                        </form>

                        <div className="space-y-2">
                          <div className="flex items-center justify-between">
                            <span className="text-xs font-bold text-pch-text block">Daftar Kode Aktif (Otomatis Hilang Setelah 90 Detik)</span>
                            <span className="text-[10px] text-pch-warning font-mono bg-amber-950/40 px-2.5 py-0.5 rounded border border-pch-warning/40">Durasi: 90 Detik (1.5 Menit)</span>
                          </div>
                          <div className="overflow-x-auto">
                            <table className="w-full text-xs text-left">
                              <thead className="bg-pch-secondary text-pch-muted uppercase border-b border-pch-border">
                                <tr>
                                  <th className="p-3">Kode</th>
                                  <th className="p-3">Target</th>
                                  <th className="p-3">Sisa Waktu</th>
                                  <th className="p-3">Catatan</th>
                                  <th className="p-3">Aksi</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-pch-border">
                                {activeRedeemCodes.length === 0 ? (
                                  <tr>
                                    <td colSpan="5" className="p-4 text-center text-pch-muted italic">
                                      Tidak ada kode aktif saat ini. Kode otomatis hilang setelah lewat 90 detik.
                                    </td>
                                  </tr>
                                ) : (
                                  activeRedeemCodes.map((item, idx) => {
                                    const remainingSeconds = Math.max(0, Math.ceil((item.expiresAt - currentTime) / 1000));
                                    return (
                                      <tr key={idx}>
                                        <td className="p-3 font-mono font-bold text-pch-goldLight">{item.code}</td>
                                        <td className="p-3 font-mono text-pch-text">@{item.userTarget}</td>
                                        <td className="p-3">
                                          <span className={`px-2 py-0.5 rounded-full font-mono font-bold text-[10px] border flex items-center gap-1 w-fit ${
                                            remainingSeconds <= 20 ? "bg-red-950/80 border-pch-danger text-pch-danger animate-pulse" : "bg-amber-950/80 border-pch-warning text-pch-warning"
                                          }`}>
                                            <span className="w-1.5 h-1.5 rounded-full bg-current"></span>
                                            <span>{remainingSeconds} detik</span>
                                          </span>
                                        </td>
                                        <td className="p-3 text-pch-muted">{item.note}</td>
                                        <td className="p-3">
                                          <button 
                                            onClick={() => {
                                              safeCopyToClipboard(item.code);
                                              triggerToast(`Kode [${item.code}] disalin ke clipboard!`);
                                            }}
                                            className="px-2.5 py-1 rounded bg-pch-surface border border-pch-border text-pch-muted hover:text-pch-gold text-[11px] flex items-center gap-1"
                                          >
                                            <Icons.Copy className="w-3 h-3" />
                                            <span>Salin</span>
                                          </button>
                                        </td>
                                      </tr>
                                    );
                                  })
                                )}
                              </tbody>
                            </table>
                          </div>
                        </div>

                        {/* 3. Arsip Berkas Anggota di Supabase */}
                        <div className="space-y-2 pt-4 border-t border-pch-border">
                          <span className="text-xs font-bold text-pch-text block">Arsip Berkas Brankas Anggota di Cloud Supabase ({submittedDossiers.length} Berkas)</span>
                          <div className="overflow-x-auto">
                            <table className="w-full text-xs text-left">
                              <thead className="bg-pch-secondary text-pch-muted uppercase border-b border-pch-border">
                                <tr>
                                  <th className="p-3">Nama Anggota</th>
                                  <th className="p-3">Kontak (WA)</th>
                                  <th className="p-3">Username Pi / NIK</th>
                                  <th className="p-3">Status Cloud</th>
                                  <th className="p-3">Inspeksi Berkas</th>
                                  <th className="p-3">Kirim Kode / Akses</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-pch-border">
                                {submittedDossiers.length === 0 ? (
                                  <tr>
                                    <td colSpan="6" className="p-4 text-center text-pch-muted italic">
                                      Belum ada berkas anggota yang diunggah ke Cloud.
                                    </td>
                                  </tr>
                                ) : (
                                  submittedDossiers.map(dos => (
                                    <tr key={dos.id}>
                                      <td className="p-3">
                                        <span className="font-bold text-pch-text block">{dos.namaLengkap}</span>
                                        <span className="text-[10px] text-pch-muted font-mono">@{dos.username}</span>
                                      </td>
                                      <td className="p-3 font-mono text-pch-text">{dos.noHp}</td>
                                      <td className="p-3">
                                        <span className="text-pch-goldLight font-mono block">{dos.usernamePi}</span>
                                        <span className="text-[10px] text-pch-muted font-mono">NIK: {dos.nik}</span>
                                      </td>
                                      <td className="p-3">
                                        <span className="text-[10px] px-2 py-0.5 rounded bg-emerald-950 text-pch-success border border-pch-success/30 font-semibold block w-fit">
                                          {dos.status} ({dos.docsCount || 5} Berkas)
                                        </span>
                                      </td>
                                      <td className="p-3">
                                        <button 
                                          onClick={() => setSelectedDossierDetail(dos)}
                                          className="px-2.5 py-1 rounded bg-pch-secondary border border-pch-gold/40 text-pch-goldLight hover:bg-pch-surface text-xs font-semibold flex items-center gap-1"
                                        >
                                          <Icons.Eye className="w-3.5 h-3.5" />
                                          <span>Buka Berkas</span>
                                        </button>
                                      </td>
                                      <td className="p-3">
                                        <button 
                                          onClick={() => handleAdminSendDossierViaWA(dos, activeRedeemCodes[0]?.code)}
                                          className="px-3 py-1.5 rounded-lg bg-emerald-950/80 border border-pch-success text-pch-success hover:bg-emerald-900/60 font-semibold text-xs flex items-center gap-1.5"
                                        >
                                          <Icons.Phone className="w-3.5 h-3.5" />
                                          <span>Kirim WA</span>
                                        </button>
                                      </td>
                                    </tr>
                                  ))
                                )}
                              </tbody>
                            </table>
                          </div>
                        </div>

                        {/* 4. Direktori & Manajemen Anggota Terdaftar */}
                        <div className="space-y-2 pt-4 border-t border-pch-border">
                          <span className="text-xs font-bold text-pch-text block">Daftar Akun Anggota Terdaftar ({registeredUsers.length} Orang)</span>
                          <div className="overflow-x-auto">
                            <table className="w-full text-xs text-left">
                              <thead className="bg-pch-secondary text-pch-muted uppercase border-b border-pch-border">
                                <tr>
                                  <th className="p-3">Nama Anggota</th>
                                  <th className="p-3">Username</th>
                                  <th className="p-3">Email</th>
                                  <th className="p-3">No HP</th>
                                  <th className="p-3">Tanggal Daftar</th>
                                  <th className="p-3">Aksi</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-pch-border">
                                {registeredUsers.length === 0 ? (
                                  <tr>
                                    <td colSpan="6" className="p-4 text-center text-pch-muted italic">
                                      Belum ada anggota baru yang mendaftar di database.
                                    </td>
                                  </tr>
                                ) : (
                                  registeredUsers.map(u => (
                                    <tr key={u.id}>
                                      <td className="p-3 font-semibold text-pch-text">{u.name}</td>
                                      <td className="p-3 font-mono text-pch-goldLight">@{u.username}</td>
                                      <td className="p-3 text-pch-muted">{u.email}</td>
                                      <td className="p-3 font-mono text-pch-text">{u.phone}</td>
                                      <td className="p-3 text-pch-muted">{u.registeredAt || "Hari ini"}</td>
                                      <td className="p-3">
                                        <button
                                          onClick={() => handleDeleteRegisteredMember(u.id, u.name)}
                                          className="p-1 rounded bg-red-950/60 border border-pch-danger/60 text-pch-danger hover:bg-red-900/60"
                                          title="Hapus Akun"
                                        >
                                          <Icons.Trash className="w-3.5 h-3.5" />
                                        </button>
                                      </td>
                                    </tr>
                                  ))
                                )}
                              </tbody>
                            </table>
                          </div>
                        </div>

                      </div>
                    </div>
                  )}

                </main>
              </div>

              {/* MOBILE BOTTOM NAVIGATION */}
              <nav className="md:hidden fixed bottom-0 left-0 right-0 z-50 bg-pch-bg/95 backdrop-blur-lg border-t border-pch-border px-2 py-1.5 flex items-center justify-around">
                {[
                  { id: "dashboard", label: "Beranda", icon: Icons.Home },
                  { id: "community", label: "Grup", icon: Icons.Users },
                  { id: "chat", label: "Chat", icon: Icons.MessageSquare },
                  { id: "meetings", label: "Rapat", icon: Icons.Video },
                  { id: "vault", label: "Vault", icon: Icons.Lock },
                  { id: "profile", label: "Profil", icon: Icons.User },
                  ...(user?.role === "admin" ? [{ id: "admin", label: "Admin", icon: Icons.Shield }] : [])
                ].map(item => {
                  const Icon = item.icon;
                  const isActive = activeTab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => { setActiveTab(item.id); setActiveJitsiRoom(null); }}
                      className={`flex flex-col items-center justify-center py-1 px-2 rounded-xl transition-all ${
                        isActive ? "text-pch-gold scale-105 font-bold" : "text-pch-muted hover:text-pch-text"
                      }`}
                    >
                      <Icon className="w-5 h-5" />
                      <span className="text-[10px] mt-0.5">{item.label}</span>
                    </button>
                  );
                })}
              </nav>
            </div>
          )}

          {/* MODAL: KONFIGURASI SUPABASE (HANYA DIAKSES OLEH ADMIN DARI DALAM PANEL ADMIN) */}
          {showSupabaseSettingsModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-pch-surface border border-pch-border rounded-2xl max-w-md w-full p-6 space-y-4 shadow-card-elevated">
                <div className="flex items-center justify-between pb-2 border-b border-pch-border">
                  <h3 className="font-bold text-base text-pch-text flex items-center gap-2">
                    <Icons.Database className="w-4 h-4 text-pch-gold" />
                    <span>Konfigurasi Supabase Cloud</span>
                  </h3>
                  <button onClick={() => setShowSupabaseSettingsModal(false)} className="text-pch-muted hover:text-pch-text">
                    <Icons.X className="w-5 h-5" />
                  </button>
                </div>

                <p className="text-xs text-pch-muted">
                  Masukkan <strong>Project URL</strong> dan <strong>Anon Public Key</strong> dari dashboard Supabase Anda (Settings &gt; API).
                </p>

                <div className="space-y-3">
                  <div>
                    <label className="text-xs font-semibold text-pch-muted block mb-1">Supabase Project URL</label>
                    <input 
                      type="url" 
                      placeholder="https://xyzprojectid.supabase.co"
                      id="input-supabase-url"
                      defaultValue={supabaseConfig.url}
                      className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3 py-2 text-xs font-mono text-pch-text focus:outline-none focus:border-pch-purple"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-semibold text-pch-muted block mb-1">Supabase Anon Public Key</label>
                    <input 
                      type="password" 
                      placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6..."
                      id="input-supabase-key"
                      defaultValue={supabaseConfig.key}
                      className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3 py-2 text-xs font-mono text-pch-text focus:outline-none focus:border-pch-purple"
                    />
                  </div>

                  {supabaseConfig.url && supabaseConfig.key && (
                    <button
                      type="button"
                      onClick={() => {
                        const shareUrl = `${window.location.origin}${window.location.pathname}?sb_url=${encodeURIComponent(supabaseConfig.url)}&sb_key=${encodeURIComponent(supabaseConfig.key)}`;
                        safeCopyToClipboard(shareUrl);
                        triggerToast("Link Auto-Connect Supabase disalin! Bagikan ke anggota agar HP mereka langsung terhubung otomatis.", "success");
                      }}
                      className="w-full py-2 rounded-xl bg-pch-purple/20 border border-pch-purple text-pch-purpleLight text-xs font-semibold hover:bg-pch-purple/30 flex items-center justify-center gap-1.5"
                    >
                      <Icons.Copy className="w-3.5 h-3.5" />
                      <span>Salin Link Auto-Connect untuk HP Anggota</span>
                    </button>
                  )}
                </div>

                <div className="pt-2 flex gap-3">
                  <button 
                    onClick={() => setShowSupabaseSettingsModal(false)}
                    className="flex-1 py-2.5 rounded-xl bg-pch-secondary border border-pch-border text-pch-muted text-xs font-semibold"
                  >
                    Batal
                  </button>
                  <button 
                    onClick={() => {
                      const urlEl = document.getElementById('input-supabase-url');
                      const keyEl = document.getElementById('input-supabase-key');
                      handleSaveSupabaseConfig(urlEl ? urlEl.value : '', keyEl ? keyEl.value : '');
                    }}
                    className="flex-1 py-2.5 rounded-xl bg-pch-gold text-black text-xs font-semibold hover:bg-pch-goldLight shadow-gold-glow"
                  >
                    Simpan & Sambungkan
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* CONFIRMATION DIALOG */}
          {confirmDialog && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-pch-surface border border-pch-border rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-card-elevated">
                <div className="flex items-center gap-2 text-pch-warning font-semibold">
                  <Icons.AlertTriangle className="w-5 h-5 shrink-0" />
                  <h3 className="font-bold text-sm text-pch-text">{confirmDialog.title}</h3>
                </div>
                <p className="text-xs text-pch-muted leading-relaxed">
                  {confirmDialog.message}
                </p>
                <div className="pt-2 flex gap-3">
                  <button 
                    onClick={() => setConfirmDialog(null)}
                    className="flex-1 py-2 rounded-xl bg-pch-secondary border border-pch-border text-pch-muted text-xs font-semibold"
                  >
                    Batal
                  </button>
                  <button 
                    onClick={confirmDialog.onConfirm}
                    className="flex-1 py-2 rounded-xl bg-pch-danger text-white text-xs font-semibold hover:bg-red-600 shadow-sm"
                  >
                    Konfirmasi
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: DETAIL INSPEKSI 15 BERKAS DOSSIER ANGGOTA OLEH ADMIN */}
          {selectedDossierDetail && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-pch-surface border border-pch-gold/50 rounded-2xl max-w-2xl w-full p-6 space-y-5 shadow-card-elevated my-8">
                <div className="flex items-center justify-between pb-3 border-b border-pch-border">
                  <div>
                    <h3 className="font-bold text-base text-pch-text flex items-center gap-2">
                      <Icons.Shield className="w-4 h-4 text-pch-gold" />
                      <span>Arsip Lengkap Brankas: {selectedDossierDetail.namaLengkap}</span>
                    </h3>
                    <p className="text-xs text-pch-muted font-mono">@{selectedDossierDetail.username} • Kontak: {selectedDossierDetail.noHp}</p>
                  </div>
                  <button onClick={() => setSelectedDossierDetail(null)} className="text-pch-muted hover:text-pch-text">
                    <Icons.X className="w-5 h-5" />
                  </button>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                  <div className="p-3 rounded-xl bg-pch-secondary border border-pch-border space-y-1">
                    <span className="text-pch-muted block font-semibold">Username Pi Network</span>
                    <span className="text-pch-goldLight font-mono font-bold">
                      {selectedDossierDetail?.usernamePi || "-"}
                    </span>
                  </div>
                  <div className="p-3 rounded-xl bg-pch-secondary border border-pch-border space-y-1">
                    <span className="text-pch-muted block font-semibold">NIK (Nomor Induk Kependudukan)</span>
                    <span className="text-pch-text font-mono font-bold">
                      {selectedDossierDetail?.nik || "-"}
                    </span>
                  </div>
                  <div className="p-3 rounded-xl bg-pch-secondary border border-pch-border space-y-1">
                    <span className="text-pch-muted block font-semibold">Tempat & Tanggal Lahir (TTL)</span>
                    <span className="text-pch-text">
                      {selectedDossierDetail?.ttl || "-"}
                    </span>
                  </div>
                  <div className="p-3 rounded-xl bg-pch-secondary border border-pch-border space-y-1">
                    <span className="text-pch-muted block font-semibold">Rekening Bank</span>
                    <span className="text-pch-text font-mono">
                      {selectedDossierDetail?.rekening || "-"}
                    </span>
                  </div>
                  <div className="p-3 rounded-xl bg-pch-secondary border border-pch-border space-y-1">
                    <span className="text-pch-muted block font-semibold">Alamat Wallet Pi</span>
                    <span className="text-pch-goldLight font-mono truncate block">
                      {selectedDossierDetail?.walletPi || "-"}
                    </span>
                  </div>
                  <div className="p-3 rounded-xl bg-pch-secondary border border-pch-border space-y-1">
                    <span className="text-pch-muted block font-semibold">Alamat Wallet OKX</span>
                    <span className="text-pch-purpleLight font-mono truncate block">
                      {selectedDossierDetail?.walletOkx || "-"}
                    </span>
                  </div>
                  <div className="sm:col-span-2 p-3 rounded-xl bg-pch-secondary border border-pch-border space-y-1">
                    <span className="text-pch-muted block font-semibold">Alamat Domisili Lengkap</span>
                    <span className="text-pch-text">
                      {selectedDossierDetail?.alamatLengkap || "-"}
                    </span>
                  </div>
                </div>

                <div className="space-y-2">
                  <span className="text-xs font-bold text-pch-goldLight block">Berkas Fisik Tersimpan di Supabase Storage:</span>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                    {[
                      { label: "Foto KTP Elektronik", url: selectedDossierDetail?.fotoKtpUrl },
                      { label: "Foto Kartu Keluarga (KK)", url: selectedDossierDetail?.fotoKkUrl },
                      { label: "Foto NPWP", url: selectedDossierDetail?.fotoNpwpUrl },
                      { label: "Pasfoto Formal (4x6)", url: selectedDossierDetail?.pasfotoUrl },
                      { label: "Kartu Keanggotaan Panua", url: selectedDossierDetail?.ktaUrl }
                    ].map((f, idx) => (
                      <div key={idx} className="p-2.5 rounded-lg bg-pch-secondary border border-pch-border flex items-center justify-between">
                        <span className="text-pch-text">{f.label}</span>
                        {f.url && f.url.startsWith("http") ? (
                          <a 
                            href={f.url} 
                            target="_blank" 
                            rel="noreferrer" 
                            className="text-pch-success underline font-semibold flex items-center gap-1"
                          >
                            <Icons.ExternalLink className="w-3.5 h-3.5" />
                            <span>Buka di Storage</span>
                          </a>
                        ) : (
                          <span className="text-pch-muted italic">Belum diunggah</span>
                        )}
                      </div>
                    ))}
                  </div>
                </div>

                <div className="pt-2 flex flex-col sm:flex-row gap-3">
                  <button 
                    onClick={() => handleAdminSendDossierViaWA(selectedDossierDetail, activeRedeemCodes[0]?.code)}
                    className="flex-1 py-2.5 rounded-xl bg-emerald-950/80 border border-pch-success text-pch-success hover:bg-emerald-900/60 font-semibold text-xs flex items-center justify-center gap-2"
                  >
                    <Icons.Phone className="w-3.5 h-3.5" />
                    <span>Kirim Informasi Lengkap via WhatsApp Anggota</span>
                  </button>
                  <button 
                    onClick={() => setSelectedDossierDetail(null)}
                    className="px-5 py-2.5 rounded-xl bg-pch-secondary border border-pch-border text-pch-muted text-xs font-semibold hover:text-pch-text"
                  >
                    Tutup
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
