                          <div className="flex items-end">
                            <button
                              type="submit"
                              className="w-full py-2 rounded-xl bg-pch-gold text-black font-bold text-xs hover:bg-pch-goldLight transition-all shadow-gold-glow flex items-center justify-center gap-2"
                            >
                              <Icons.Plus className="w-4 h-4" />
                              <span>Terbitkan Kode (90 Detik)</span>
                            </button>
                          </div>
                        </form>

                        {/* Tabel Kode Aktif */}
                        <div className="space-y-2">
                          <h4 className="text-xs font-bold text-pch-goldLight uppercase tracking-wider">Kode Akses Yang Sedang Aktif (Realtime Countdown)</h4>
                          {activeRedeemCodes.length === 0 ? (
                            <p className="text-xs text-pch-muted italic">Tidak ada kode yang aktif saat ini. Terbitkan kode baru di atas.</p>
                          ) : (
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                              {activeRedeemCodes.map(c => {
                                const remainingSec = Math.max(0, Math.ceil((c.expiresAt - currentTime) / 1000));
                                return (
                                  <div key={c.code} className="p-3.5 rounded-xl bg-pch-secondary border border-pch-gold/40 flex items-center justify-between">
                                    <div>
                                      <div className="flex items-center gap-2">
                                        <span className="font-mono font-bold text-sm text-pch-goldLight">{c.code}</span>
                                        <button 
                                          type="button" 
                                          onClick={() => {
                                            safeCopyToClipboard(c.code);
                                            triggerToast(`Kode ${c.code} disalin!`, "success");
                                          }}
                                          className="text-pch-muted hover:text-pch-text p-0.5"
                                        >
                                          <Icons.Copy className="w-3.5 h-3.5" />
                                        </button>
                                      </div>
                                      <p className="text-[10px] text-pch-muted mt-0.5">Target: <strong>{c.userTarget}</strong></p>
                                    </div>
                                    <div className="text-right">
                                      <span className="text-xs font-bold font-mono text-pch-warning animate-pulse">
                                        {remainingSec}s
                                      </span>
                                      <p className="text-[9px] text-pch-muted">Sisa Waktu</p>
                                    </div>
                                  </div>
                                );
                              })}
                            </div>
                          )}
                        </div>
                      </div>

                      {/* 3. Arsip 15 Berkas Brankas Anggota */}
                      <div className="p-6 rounded-2xl bg-pch-surface border border-pch-border shadow-card-elevated space-y-4">
                        <div className="border-b border-pch-border pb-3 flex items-center justify-between flex-wrap gap-2">
                          <div>
                            <h3 className="font-bold text-base text-pch-text flex items-center gap-2">
                              <Icons.FileText className="w-4 h-4 text-pch-gold" />
                              <span>3. Arsip 15 Berkas Brankas Anggota (Dossiers)</span>
                            </h3>
                            <p className="text-xs text-pch-muted mt-0.5">Seluruh berkas identitas anggota tersimpan di Supabase Realtime Storage.</p>
                          </div>
                          <span className="text-xs font-mono px-3 py-1 rounded-full bg-pch-secondary border border-pch-border text-pch-goldLight">
                            {submittedDossiers.length} Berkas Masuk
                          </span>
                        </div>

                        {submittedDossiers.length === 0 ? (
                          <div className="p-8 text-center text-pch-muted space-y-2">
                            <Icons.FileText className="w-10 h-10 mx-auto opacity-30" />
                            <p className="text-xs">Belum ada anggota yang mengirimkan berkas brankas ke Cloud.</p>
                          </div>
                        ) : (
                          <div className="overflow-x-auto">
                            <table className="w-full text-left text-xs">
                              <thead>
                                <tr className="border-b border-pch-border text-pch-muted font-mono">
                                  <th className="py-2.5 px-3">Anggota</th>
                                  <th className="py-2.5 px-3">NIK</th>
                                  <th className="py-2.5 px-3">Rekening Bank</th>
                                  <th className="py-2.5 px-3">Status Berkas</th>
                                  <th className="py-2.5 px-3 text-right">Aksi</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-pch-border/50">
                                {submittedDossiers.map(dos => (
                                  <tr key={dos.id} className="hover:bg-pch-secondary/40 transition-colors">
                                    <td className="py-3 px-3">
                                      <p className="font-bold text-pch-text">{dos.namaLengkap}</p>
                                      <p className="text-[10px] text-pch-gold font-mono">@{dos.username} • {dos.noHp || "-"}</p>
                                    </td>
                                    <td className="py-3 px-3 font-mono">{dos.nik || "-"}</td>
                                    <td className="py-3 px-3 font-mono">{dos.rekening || "-"}</td>
                                    <td className="py-3 px-3">
                                      <span className="text-[10px] px-2 py-0.5 rounded bg-emerald-950 text-pch-success border border-pch-success/40">
                                        {dos.docsCount} Dokumen
                                      </span>
                                    </td>
                                    <td className="py-3 px-3 text-right space-x-1.5">
                                      <button
                                        type="button"
                                        onClick={() => setSelectedDossierDetail(dos)}
                                        className="px-2.5 py-1 rounded-lg bg-pch-purple text-white text-[11px] font-semibold hover:bg-pch-purpleLight"
                                      >
                                        Buka Berkas
                                      </button>
                                      <button
                                        type="button"
                                        onClick={() => {
                                          const activeCode = activeRedeemCodes.find(c => c.userTarget === "all" || c.userTarget?.toLowerCase() === dos.username?.toLowerCase());
                                          handleAdminSendDossierViaWA(dos, activeCode?.code || "");
                                        }}
                                        className="px-2.5 py-1 rounded-lg bg-emerald-950 border border-pch-success text-pch-success text-[11px] font-semibold hover:bg-emerald-900"
                                      >
                                        Kirim ke WA
                                      </button>
                                    </td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        )}
                      </div>

                      {/* 4. Daftar Akun Anggota Terdaftar */}
                      <div className="p-6 rounded-2xl bg-pch-surface border border-pch-border shadow-card-elevated space-y-4">
                        <div className="border-b border-pch-border pb-3 flex items-center justify-between flex-wrap gap-2">
                          <div>
                            <h3 className="font-bold text-base text-pch-text flex items-center gap-2">
                              <Icons.Users className="w-4 h-4 text-pch-gold" />
                              <span>4. Daftar Seluruh Akun Anggota Terdaftar</span>
                            </h3>
                            <p className="text-xs text-pch-muted mt-0.5">Daftar pengguna yang telah terdaftar di database Supabase Cloud.</p>
                          </div>
                          <span className="text-xs font-mono px-3 py-1 rounded-full bg-pch-secondary border border-pch-border text-pch-goldLight">
                            {registeredUsers.length} Anggota
                          </span>
                        </div>

                        {registeredUsers.length === 0 ? (
                          <div className="p-8 text-center text-pch-muted">
                            <p className="text-xs">Belum ada akun anggota yang terdaftar di sistem.</p>
                          </div>
                        ) : (
                          <div className="overflow-x-auto">
                            <table className="w-full text-left text-xs">
                              <thead>
                                <tr className="border-b border-pch-border text-pch-muted font-mono">
                                  <th className="py-2.5 px-3">Nama</th>
                                  <th className="py-2.5 px-3">Username</th>
                                  <th className="py-2.5 px-3">Email</th>
                                  <th className="py-2.5 px-3">No HP</th>
                                  <th className="py-2.5 px-3">Tanggal Daftar</th>
                                  <th className="py-2.5 px-3 text-right">Aksi</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-pch-border/50">
                                {registeredUsers.map(usr => (
                                  <tr key={usr.id} className="hover:bg-pch-secondary/40 transition-colors">
                                    <td className="py-3 px-3 font-semibold text-pch-text">{usr.name}</td>
                                    <td className="py-3 px-3 font-mono text-pch-gold">@{usr.username}</td>
                                    <td className="py-3 px-3 text-pch-muted">{usr.email}</td>
                                    <td className="py-3 px-3 font-mono">{usr.phone || "-"}</td>
                                    <td className="py-3 px-3 text-pch-muted">{usr.registeredAt}</td>
                                    <td className="py-3 px-3 text-right">
                                      <button
                                        type="button"
                                        onClick={() => handleDeleteRegisteredMember(usr.id, usr.name)}
                                        className="p-1 rounded-lg bg-red-950/60 border border-pch-danger/60 text-pch-danger hover:bg-red-900/60 transition-colors"
                                        title="Hapus Akun"
                                      >
                                        <Icons.Trash className="w-3.5 h-3.5" />
                                      </button>
                                    </td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        )}
                      </div>
                    </div>
                  )}

                </main>
              </div>

              {/* MOBILE BOTTOM NAVIGATION BAR */}
              <nav className="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-pch-secondary/95 backdrop-blur-lg border-t border-pch-border/80 px-2 py-1.5 flex items-center justify-around shadow-card-elevated">
                {[
                  { id: "dashboard", label: "Beranda", icon: Icons.Home },
                  { id: "dana_talangan", label: "Dana", icon: Icons.Wallet },
                  { id: "community", label: "Grup", icon: Icons.Users },
                  { id: "chat", label: "Chat", icon: Icons.MessageSquare },
                  { id: "meetings", label: "Rapat", icon: Icons.Video },
                  { id: "vault", label: "Vault", icon: Icons.Lock },
                  { id: "profile", label: "Profil", icon: Icons.User },
                  ...(user?.role === "admin" ? [{ id: "admin", label: "Admin", icon: Icons.Shield }] : [])
                ].map(item => {
                  const Icon = item.icon;
                  const isActive = activeTab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => { setActiveTab(item.id); setActiveJitsiRoom(null); }}
                      className={`relative flex flex-col items-center justify-center py-1 px-1.5 rounded-lg min-w-[42px] transition-all ${
                        isActive ? "text-pch-gold font-bold" : "text-pch-muted hover:text-pch-text"
                      }`}
                    >
                      <Icon className="w-4 h-4" />
                      <span className="text-[9px] mt-0.5 truncate">{item.label}</span>
                      {item.id === "chat" && unreadChatCount > 0 && (
                        <span className="absolute -top-0.5 right-1 w-2 h-2 rounded-full bg-pch-purple shadow-purple-glow animate-pulse"></span>
                      )}
                    </button>
                  );
                })}
              </nav>

            </div>
          )}

          {/* ==================== GLOBAL MODALS ==================== */}

          {/* 1. Modal Detail Berkas Anggota (Inspeksi 15 Berkas oleh Admin) */}
          {selectedDossierDetail && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-2xl bg-pch-surface border border-pch-border rounded-2xl p-6 shadow-card-elevated space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-pch-border pb-3">
                  <div>
                    <h3 className="font-bold text-base text-pch-text">Inspeksi Berkas: {selectedDossierDetail.namaLengkap}</h3>
                    <p className="text-xs text-pch-gold font-mono">@{selectedDossierDetail.username} • {selectedDossierDetail.noHp}</p>
                  </div>
                  <button 
                    type="button" 
                    onClick={() => setSelectedDossierDetail(null)}
                    className="p-1 rounded-lg bg-pch-secondary border border-pch-border text-pch-muted hover:text-pch-text"
                  >
                    <Icons.X className="w-4 h-4" />
                  </button>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                  <div className="p-3 rounded-xl bg-pch-secondary border border-pch-border space-y-1">
                    <span className="text-pch-muted font-semibold block">Identitas Diri:</span>
                    <p>NIK: <strong className="font-mono text-pch-text">{selectedDossierDetail.nik || "-"}</strong></p>
                    <p>TTL: <strong className="text-pch-text">{selectedDossierDetail.ttl || "-"}</strong></p>
                    <p>Alamat: <strong className="text-pch-text">{selectedDossierDetail.alamatLengkap || "-"}</strong></p>
                  </div>
                  <div className="p-3 rounded-xl bg-pch-secondary border border-pch-border space-y-1">
                    <span className="text-pch-muted font-semibold block">Rekening & Wallet:</span>
                    <p>Rekening: <strong className="font-mono text-pch-text">{selectedDossierDetail.rekening || "-"}</strong> ({selectedDossierDetail.namaRekening || "-"})</p>
                    <p>Wallet Pi: <strong className="font-mono text-pch-goldLight truncate block">{selectedDossierDetail.walletPi || "-"}</strong></p>
                    <p>Wallet OKX: <strong className="font-mono text-pch-purpleLight truncate block">{selectedDossierDetail.walletOkx || "-"}</strong></p>
                  </div>
                </div>

                <div className="space-y-2">
                  <h4 className="font-bold text-xs text-pch-goldLight uppercase">Dokumen Terlampir di Supabase Storage:</h4>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    {[
                      { label: "Foto KTP Elektronik", url: selectedDossierDetail.fotoKtpUrl },
                      { label: "Foto Kartu Keluarga (KK)", url: selectedDossierDetail.fotoKkUrl },
                      { label: "Foto NPWP", url: selectedDossierDetail.fotoNpwpUrl },
                      { label: "Pasfoto Formal", url: selectedDossierDetail.pasfotoUrl },
                      { label: "Kartu Keanggotaan (KTA)", url: selectedDossierDetail.ktaUrl }
                    ].map((d, i) => (
                      <div key={i} className="p-2.5 rounded-xl bg-pch-secondary border border-pch-border flex items-center justify-between text-xs">
                        <span className="text-pch-text font-medium">{d.label}</span>
                        {d.url ? (
                          <a 
                            href={d.url} 
                            target="_blank" 
                            rel="noreferrer"
                            className="px-2.5 py-1 rounded bg-pch-gold text-black font-bold text-[10px] hover:bg-pch-goldLight flex items-center gap-1"
                          >
                            <Icons.ExternalLink className="w-3 h-3" />
                            <span>Buka</span>
                          </a>
                        ) : (
                          <span className="text-pch-muted italic text-[10px]">Belum diunggah</span>
                        )}
                      </div>
                    ))}
                  </div>

                  {selectedDossierDetail.extraDocs && selectedDossierDetail.extraDocs.length > 0 && (
                    <div className="pt-2 space-y-1.5">
                      <span className="text-xs font-semibold text-pch-muted block">Dokumen Tambahan Lainnya:</span>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        {selectedDossierDetail.extraDocs.map((ex, idx) => (
                          <div key={idx} className="p-2.5 rounded-xl bg-pch-secondary border border-pch-border flex items-center justify-between text-xs">
                            <span className="text-pch-text truncate pr-2">{ex.title}</span>
                            {ex.base64 || ex.driveUrl ? (
                              <a 
                                href={ex.base64 || ex.driveUrl} 
                                target="_blank" 
                                rel="noreferrer"
                                className="px-2 py-0.5 rounded bg-pch-purple text-white text-[10px] font-semibold"
                              >
                                Lihat
                              </a>
                            ) : null}
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* 2. Modal Buat Jadwal Rapat Baru */}
          {showCreateMeetingModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-md bg-pch-surface border border-pch-border rounded-2xl p-6 shadow-card-elevated space-y-4">
                <div className="flex items-center justify-between border-b border-pch-border pb-3">
                  <h3 className="font-bold text-sm text-pch-text flex items-center gap-2">
                    <Icons.Video className="w-4 h-4 text-pch-gold" />
                    <span>Jadwalkan Rapat Online Baru</span>
                  </h3>
                  <button 
                    type="button" 
                    onClick={() => setShowCreateMeetingModal(false)}
                    className="p-1 rounded-lg bg-pch-secondary text-pch-muted hover:text-pch-text"
                  >
                    <Icons.X className="w-4 h-4" />
                  </button>
                </div>

                <form onSubmit={handleCreateNewMeeting} className="space-y-3">
                  <div>
                    <label className="text-xs font-semibold text-pch-muted block mb-1">Judul / Topik Rapat</label>
                    <input 
                      type="text" 
                      required
                      placeholder="Contoh: Rapat Koordinasi Wilayah Kota"
                      value={newMeetingTitle}
                      onChange={(e) => setNewMeetingTitle(e.target.value)}
                      className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-semibold text-pch-muted block mb-1">Nama Host / Pemandu</label>
                      <input 
                        type="text" 
                        placeholder={user?.name || "Host Rapat"}
                        value={newMeetingHost}
                        onChange={(e) => setNewMeetingHost(e.target.value)}
                        className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-pch-muted block mb-1">Durasi</label>
                      <select
                        value={newMeetingDuration}
                        onChange={(e) => setNewMeetingDuration(e.target.value)}
                        className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                      >
                        <option value="30 Menit">30 Menit</option>
                        <option value="60 Menit">60 Menit</option>
                        <option value="90 Menit">90 Menit</option>
                        <option value="120 Menit">120 Menit</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="text-xs font-semibold text-pch-muted block mb-1">Jadwal Pelaksanaan</label>
                    <input 
                      type="text" 
                      placeholder="Contoh: Malam Ini, 20:00 WITA"
                      value={newMeetingDate}
                      onChange={(e) => setNewMeetingDate(e.target.value)}
                      className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-semibold text-pch-muted block mb-1">Platform Video Conference</label>
                    <select
                      value={newMeetingProvider}
                      onChange={(e) => setNewMeetingProvider(e.target.value)}
                      className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                    >
                      <option value="mirotalk">MiroTalk WebRTC (Ringan, Tanpa Login Moderator)</option>
                      <option value="google-meet">Google Meet (Tab Terbuka Otomatis)</option>
                      <option value="custom">Tautan Kustom (Zoom / URL Lain)</option>
                    </select>
                  </div>

                  {newMeetingProvider === "custom" && (
                    <div>
                      <label className="text-xs font-semibold text-pch-purpleLight block mb-1">Masukkan URL Rapat Kustom</label>
                      <input 
                        type="url" 
                        required
                        placeholder="https://zoom.us/j/... atau URL lainnya"
                        value={newMeetingCustomUrl}
                        onChange={(e) => setNewMeetingCustomUrl(e.target.value)}
                        className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                      />
                    </div>
                  )}

                  <div className="pt-2 flex gap-3">
                    <button
                      type="button"
                      onClick={() => setShowCreateMeetingModal(false)}
                      className="flex-1 py-2 rounded-xl bg-pch-secondary border border-pch-border text-pch-muted hover:text-pch-text text-xs"
                    >
                      Batal
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2 rounded-xl bg-pch-gold text-black font-bold text-xs hover:bg-pch-goldLight shadow-gold-glow"
                    >
                      Simpan Rapat
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 3. Modal Buat Grup Panua Baru */}
          {showCreateGroupModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-md bg-pch-surface border border-pch-border rounded-2xl p-6 shadow-card-elevated space-y-4">
                <div className="flex items-center justify-between border-b border-pch-border pb-3">
                  <h3 className="font-bold text-sm text-pch-text flex items-center gap-2">
                    <Icons.Users className="w-4 h-4 text-pch-purpleLight" />
                    <span>Buat Grup Komunitas Panua Baru</span>
                  </h3>
                  <button 
                    type="button" 
                    onClick={() => setShowCreateGroupModal(false)}
                    className="p-1 rounded-lg bg-pch-secondary text-pch-muted hover:text-pch-text"
                  >
                    <Icons.X className="w-4 h-4" />
                  </button>
                </div>

                <form onSubmit={handleCreateNewGroup} className="space-y-3">
                  <div>
                    <label className="text-xs font-semibold text-pch-muted block mb-1">Nama Grup</label>
                    <input 
                      type="text" 
                      required
                      placeholder="Contoh: Pionir Bone Bolango"
                      value={newGroupName}
                      onChange={(e) => setNewGroupName(e.target.value)}
                      className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-semibold text-pch-muted block mb-1">Kategori</label>
                    <select
                      value={newGroupCategory}
                      onChange={(e) => setNewGroupCategory(e.target.value)}
                      className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                    >
                      <option value="Wilayah">Wilayah</option>
                      <option value="Edukasi">Edukasi</option>
                      <option value="Bisnis">Bisnis</option>
                      <option value="Umum">Umum</option>
                    </select>
                  </div>

                  <div>
                    <label className="text-xs font-semibold text-pch-muted block mb-1">Deskripsi Singkat</label>
                    <textarea 
                      rows="3"
                      required
                      placeholder="Tuliskan tujuan dan cakupan anggota grup..."
                      value={newGroupDesc}
                      onChange={(e) => setNewGroupDesc(e.target.value)}
                      className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                    ></textarea>
                  </div>

                  <div className="pt-2 flex gap-3">
                    <button
                      type="button"
                      onClick={() => setShowCreateGroupModal(false)}
                      className="flex-1 py-2 rounded-xl bg-pch-secondary border border-pch-border text-pch-muted hover:text-pch-text text-xs"
                    >
                      Batal
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2 rounded-xl bg-pch-purple text-white font-bold text-xs hover:bg-pch-purpleLight shadow-purple-glow"
                    >
                      Buat Grup
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 4. Modal Pengaturan Koneksi Supabase (Khusus Admin) */}
          {showSupabaseSettingsModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-lg bg-pch-surface border border-pch-gold/50 rounded-2xl p-6 shadow-card-elevated space-y-4">
                <div className="flex items-center justify-between border-b border-pch-border pb-3">
                  <div className="flex items-center gap-2">
                    <Icons.Database className="w-5 h-5 text-pch-gold" />
                    <h3 className="font-bold text-base text-pch-text">Pengaturan Koneksi Cloud Supabase</h3>
                  </div>
                  <button 
                    type="button" 
                    onClick={() => setShowSupabaseSettingsModal(false)}
                    className="p-1 rounded-lg bg-pch-secondary text-pch-muted hover:text-pch-text"
                  >
                    <Icons.X className="w-4 h-4" />
                  </button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="font-semibold text-pch-muted block mb-1">Project URL Supabase</label>
                    <input 
                      type="text" 
                      id="input_sb_url"
                      defaultValue={supabaseConfig.url}
                      placeholder="https://xxxx.supabase.co"
                      className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 font-mono text-pch-text focus:outline-none focus:border-pch-gold"
                    />
                  </div>

                  <div>
                    <label className="font-semibold text-pch-muted block mb-1">Anon Public Key</label>
                    <input 
                      type="text" 
                      id="input_sb_key"
                      defaultValue={supabaseConfig.key}
                      placeholder="sb_publishable_... atau eyJhbGci..."
                      className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 font-mono text-pch-text focus:outline-none focus:border-pch-gold"
                    />
                  </div>

                  <p className="text-[11px] text-pch-muted leading-relaxed">
                    Kredensial ini digunakan untuk menghubungkan seluruh database anggota, 15 berkas brankas, chat forum, dan grup ke server Supabase secara realtime.
                  </p>
                </div>

                <div className="pt-2 flex flex-col sm:flex-row gap-3">
                  <button
                    type="button"
                    disabled={isTestingSupabase}
                    onClick={() => {
                      const u = document.getElementById('input_sb_url')?.value;
                      const k = document.getElementById('input_sb_key')?.value;
                      handleSaveSupabaseConfig(u, k);
                    }}
                    className="flex-1 py-2.5 rounded-xl bg-pch-gold text-black font-bold text-xs hover:bg-pch-goldLight shadow-gold-glow flex items-center justify-center gap-2 disabled:opacity-50"
                  >
                    <Icons.Check className="w-4 h-4" />
                    <span>{isTestingSupabase ? "Menguji Koneksi..." : "Tes Koneksi & Simpan"}</span>
                  </button>

                  <button
                    type="button"
                    onClick={() => {
                      fetchLatestFromSupabase(false);
                    }}
                    className="px-4 py-2.5 rounded-xl bg-pch-secondary border border-pch-border text-pch-text text-xs hover:border-pch-purple flex items-center justify-center gap-1.5"
                  >
                    <Icons.Database className="w-3.5 h-3.5 text-pch-purpleLight" />
                    <span>Tarik Data Terbaru</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 5. Modal Konfirmasi Dialog Global */}
          {confirmDialog && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-sm bg-pch-surface border border-pch-danger/60 rounded-2xl p-5 shadow-card-elevated space-y-4">
                <div className="flex items-center gap-2.5 text-pch-danger">
                  <Icons.AlertTriangle className="w-5 h-5 shrink-0" />
                  <h4 className="font-bold text-sm text-pch-text">{confirmDialog.title || "Konfirmasi"}</h4>
                </div>
                <p className="text-xs text-pch-muted leading-relaxed">{confirmDialog.message}</p>
                <div className="pt-2 flex gap-3">
                  <button
                    type="button"
                    onClick={() => setConfirmDialog(null)}
                    className="flex-1 py-2 rounded-xl bg-pch-secondary border border-pch-border text-pch-muted hover:text-pch-text text-xs"
                  >
                    Batal
                  </button>
                  <button
                    type="button"
                    onClick={confirmDialog.onConfirm}
                    className="flex-1 py-2 rounded-xl bg-pch-danger text-white font-bold text-xs hover:bg-red-600 shadow-sm"
                  >
                    Ya, Lanjutkan
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 6. Modal Pratinjau Dokumen / Preview File */}
          {previewModalDoc && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-3 sm:p-5 animate-fade-in">
              <div className="w-full max-w-3xl bg-pch-surface border border-pch-gold/50 rounded-2xl overflow-hidden shadow-card-elevated flex flex-col max-h-[92vh]">
                {/* Modal Header */}
                <div className="p-4 bg-pch-secondary border-b border-pch-border flex items-center justify-between gap-3">
                  <div className="flex items-center gap-2.5 truncate">
                    <div className="w-8 h-8 rounded-lg bg-pch-gold/15 border border-pch-gold/40 text-pch-gold flex items-center justify-center shrink-0">
                      <Icons.FileText className="w-4 h-4" />
                    </div>
                    <div className="truncate">
                      <h3 className="font-bold text-sm text-pch-text truncate">{previewModalDoc.title}</h3>
                      <p className="text-[10px] text-pch-muted font-mono truncate">{previewModalDoc.name || "Berkas Tersimpan"}</p>
                    </div>
                  </div>

                  <div className="flex items-center gap-2 shrink-0">
                    <button
                      type="button"
                      onClick={() => handleDownloadDocument(previewModalDoc, previewModalDoc.title)}
                      className="px-3 py-1.5 rounded-xl bg-pch-gold text-black font-bold text-xs hover:bg-pch-goldLight transition-all shadow-gold-glow flex items-center gap-1.5"
                      title="Download Berkas"
                    >
                      <Icons.Download className="w-3.5 h-3.5" />
                      <span className="hidden sm:inline">Download</span>
                    </button>
                    <button
                      type="button"
                      onClick={() => setPreviewModalDoc(null)}
                      className="p-1.5 rounded-xl bg-pch-surface border border-pch-border text-pch-muted hover:text-pch-text hover:border-pch-danger transition-colors"
                      title="Tutup"
                    >
                      <Icons.X className="w-4 h-4" />
                    </button>
                  </div>
                </div>

                {/* Modal Content Preview */}
                <div className="flex-1 overflow-auto p-4 flex items-center justify-center bg-black/60 min-h-[300px]">
                  {previewModalDoc.url ? (
                    (previewModalDoc.url.startsWith('data:image') || previewModalDoc.url.match(/\.(jpeg|jpg|gif|png|webp|svg)/i) || !previewModalDoc.url.includes('.pdf')) ? (
                      <img 
                        src={previewModalDoc.url} 
                        alt={previewModalDoc.title} 
                        className="max-h-[72vh] w-auto max-w-full rounded-xl object-contain shadow-2xl border border-pch-border"
                        onError={(e) => {
                          e.target.style.display = 'none';
                        }}
                      />
                    ) : (
                      <iframe 
                        src={previewModalDoc.url} 
                        className="w-full h-[70vh] rounded-xl border border-pch-border"
                        title={previewModalDoc.title}
                      ></iframe>
                    )
                  ) : (
                    <div className="text-center text-pch-muted py-12">
                      <Icons.AlertTriangle className="w-10 h-10 mx-auto text-pch-warning mb-2" />
                      <p className="text-xs">Berkas tidak dapat dipratinjau langsung.</p>
                    </div>
                  )}
                </div>

                {/* Modal Footer */}
                <div className="p-3 bg-pch-secondary border-t border-pch-border flex items-center justify-between gap-3 text-xs">
                  <span className="text-[11px] text-pch-muted truncate">
                    {previewModalDoc.url?.startsWith('http') ? "Tersimpan aman di Cloud Supabase Storage" : "Berkas terenkripsi siap disinkronkan"}
                  </span>
                  <div className="flex items-center gap-2">
                    {previewModalDoc.url?.startsWith('http') && (
                      <a
                        href={previewModalDoc.url}
                        target="_blank"
                        rel="noreferrer"
                        className="px-3 py-1.5 rounded-lg bg-pch-surface border border-pch-border hover:border-pch-gold text-pch-goldLight text-[11px] font-semibold flex items-center gap-1"
                      >
                        <Icons.ExternalLink className="w-3.5 h-3.5" />
                        <span>Buka Tab Baru</span>
                      </a>
                    )}
                    <button
                      type="button"
                      onClick={() => setPreviewModalDoc(null)}
                      className="px-3 py-1.5 rounded-lg bg-pch-surface border border-pch-border text-pch-muted hover:text-pch-text text-[11px]"
                    >
                      Tutup
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // React Error Boundary Component (Mencegah Layar Putih Jika Terjadi Kendala Runtime)
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("PANUA Community Runtime Error:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-pch-bg text-pch-text flex flex-col items-center justify-center p-6 text-center space-y-4">
              <div className="w-16 h-16 rounded-2xl bg-amber-950/80 border border-pch-warning flex items-center justify-center text-pch-warning shadow-gold-glow">
                <Icons.AlertTriangle className="w-8 h-8" />
              </div>
              <div className="space-y-1">
                <h2 className="text-lg font-bold text-white">Sesi Aplikasi Perlu Diperbarui</h2>
                <p className="text-xs text-pch-muted max-w-sm mx-auto">
                  Terjadi pembaruan berkas aplikasi di server. Silakan tekan tombol di bawah untuk menyegarkan tampilan.
                </p>
              </div>
              <button
                type="button"
                onClick={() => {
                  try { localStorage.removeItem('panua_active_session'); } catch(e) {}
                  window.location.reload();
                }}
                className="px-5 py-2.5 bg-pch-gold text-black rounded-xl font-bold text-xs hover:bg-pch-goldLight transition-all shadow-gold-glow"
              >
                Segarkan & Masuk Kembali
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // Mount Aplikasi React
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
