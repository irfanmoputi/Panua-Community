    function safeCopyToClipboard(text) {
      try {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.left = "-999999px";
        textArea.style.top = "-999999px";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        document.execCommand('copy');
        textArea.remove();
        return true;
      } catch (err) {
        return false;
      }
    }

    function dataURLtoBlob(dataurl) {
      const arr = dataurl.split(',');
      const mime = arr[0].match(/:(.*?);/)[1];
      const bstr = atob(arr[1]);
      let n = bstr.length;
      const u8arr = new Uint8Array(n);
      while(n--){
        u8arr[n] = bstr.charCodeAt(n);
      }
      return new Blob([u8arr], {type:mime});
    }

      const compressImageFile = (file, maxWidth = 1200, quality = 0.75) => {
        return new Promise((resolve) => {
          if (!file || !file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = (e) => resolve({
              name: file ? file.name : "berkas.dat",
              type: file ? file.type : "application/octet-stream",
              base64: e.target.result,
              size: file ? (file.size / (1024 * 1024)).toFixed(2) + " MB" : "0 MB"
            });
            reader.readAsDataURL(file);
            return;
          }

          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              let width = img.width;
              let height = img.height;
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              const compressedBase64 = canvas.toDataURL('image/jpeg', quality);
              const approxKB = Math.round((compressedBase64.length * 3 / 4) / 1024);
              resolve({
                name: file.name,
                type: 'image/jpeg',
                base64: compressedBase64,
                size: approxKB > 1024 ? (approxKB / 1024).toFixed(2) + " MB" : approxKB + " KB"

            .from('users_registry')

            .or(`username.ilike.${id},email.ilike.${id}`)
            .limit(1)
            .maybeSingle();

          if (error) {
            triggerToast("Gagal menghubungi database: " + error.message, "danger");
            return;
          }

          if (member) {
            const memberSession = {
              id: member.id,
              name: member.name,
              username: member.username,
              email: member.email,
              phone: member.phone,
              role: member.role || 'member',
              bio: member.bio,
              avatarUrl: member.avatar_url,
              registeredAt: new Date(member.created_at).toLocaleDateString('id-ID')
            };
            setUser(memberSession);
            setIsAuthenticated(true);
            triggerToast(`Selamat datang kembali, ${member.name}!`, "success");
            return;
          }

          triggerToast("Email atau Username tidak ditemukan di database komunitas!", "danger");
        } catch (err) {
          triggerToast("Terjadi kendala jaringan: " + err.message, "danger");
        }
      };

      // HANDLER REGISTER (CLOUD-FIRST: WAJIB MASUK DATABASE SUPABASE TERLEBIH DAHULU)
      const handleRegisterSubmit = async (e) => {
        e.preventDefault();
        if (!regName.trim() || !regUsername.trim() || !regEmail.trim() || !regPhone.trim() || !regPassword) {
          triggerToast("Lengkapi semua field pendaftaran termasuk No HP!", "warning");
          return;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(regEmail.trim())) {
          triggerToast("Format email tidak valid!", "warning");
          return;
        }

        if (regPassword.length < 6) {
          triggerToast("Password minimal 6 karakter!", "warning");
          return;
        }

        if (regPassword !== regConfirmPassword) {
          triggerToast("Konfirmasi password tidak cocok!", "danger");
          return;
        }

        if (!regAgreed) {
          triggerToast("Anda harus menyetujui Ketentuan Komunitas!", "warning");
          return;
        }

        // VALIDASI KONEKSI DATABASE
        if (!supabase) {
          triggerToast("Gagal: Database Cloud Supabase belum dikonfigurasi pada sistem ini. Hubungi Admin untuk link pendaftaran.", "danger");
          return;
        }

        setIsRegistering(true);
        const cleanUsername = regUsername.trim().replace(/\s+/g, '_').toLowerCase();
        const cleanEmail = regEmail.trim().toLowerCase();

        try {
          // 1. Cek duplikasi di Supabase Database secara riil
          const { data: existing, error: checkErr } = await supabase
            .from('users_registry')
            .select('id, username, email')
            .or(`username.ilike.${cleanUsername},email.ilike.${cleanEmail}`)
            .limit(1)
            .maybeSingle();

          if (checkErr) {
            console.error("Cek Supabase error:", checkErr);
            triggerToast("Kendala Database: " + checkErr.message, "danger");
            setIsRegistering(false);
            return;
          }

          if (existing) {
            triggerToast("Username atau Email sudah terdaftar di komunitas!", "danger");
            setIsRegistering(false);
            return;
          }

          // 2. Simpan Akun Baru ke Supabase Database secara Realtime
          const newId = "usr-" + Date.now();
          const { error: insertErr } = await supabase
            .from('users_registry')
            .insert([
              {
                id: newId,
                username: cleanUsername,
                name: regName.trim(),
                email: cleanEmail,
                phone: regPhone.trim(),
                role: 'member',
                bio: 'Anggota resmi Panua Community Gorontalo.',
                avatar_url: '',
                password_hash: 'PROTECTED'
              }
            ]);

          if (insertErr) {
            console.error("Supabase insert error:", insertErr);
            triggerToast("Gagal menyimpan ke database Cloud: " + insertErr.message, "danger");
            setIsRegistering(false);
            return;
          }

          // 3. JIKA BERHASIL TERSIMPAN DI CLOUD, AKTIFKAN SESI ANGGOTA
          const newUser = {
            id: newId,
            email: cleanEmail,
            name: regName.trim(),
            username: cleanUsername,
            phone: regPhone.trim(),
            role: "member",
            bio: "Anggota resmi Panua Community Gorontalo.",
            publicWallet: "",
            avatarUrl: "",
            registeredAt: new Date().toLocaleDateString('id-ID')
          };

          setUser(newUser);
          setIsAuthenticated(true);

          setRegName("");
          setRegUsername("");
          setRegEmail("");
          setRegPhone("");
          setRegPassword("");
          setRegConfirmPassword("");
          setRegAgreed(false);

          triggerToast("Pendaftaran Berhasil! Akun Anda aktif di Cloud Supabase.", "success");
        } catch (err) {
          console.error("Network error:", err);
          triggerToast("Terjadi kendala jaringan: " + err.message, "danger");
        } finally {
          setIsRegistering(false);
        }
      };

      const handleForgotSubmit = (e) => {
        e.preventDefault();
        if (!forgotEmail.trim()) {
          triggerToast("Masukkan alamat email terdaftar Anda!", "warning");
          return;
        }
        setForgotSent(true);
        triggerToast("Instruksi pemulihan kata sandi telah dikirimkan ke email Anda.");
      };

      const handleLogoutSession = () => {
        setConfirmDialog({
          title: "Konfirmasi Keluar Sesi",
          message: "Apakah Anda yakin ingin keluar dari akun Panua Community Anda?",
          onConfirm: () => {
            setIsAuthenticated(false);
            setUser(null);
            setLoginPassword("");
            setActiveTab("dashboard");
            setConfirmDialog(null);
            triggerToast("Anda telah keluar dari sesi aplikasi.", "warning");
          }
        });
      };

      const handleProfilePhotoUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        if (file.size > 2 * 1024 * 1024) {
          triggerToast("Ukuran foto maksimal 2MB!", "danger");
          return;
        }

        const compressed = await compressImageFile(file, 600, 0.8);
        let photoUrl = compressed.base64;

        if (supabase) {
          triggerToast("Mengunggah foto profil ke Cloud...", "warning");
          const cloudUrl = await uploadFileToSupabaseStorage(compressed, `avatars/${user.username}`);
          if (cloudUrl) photoUrl = cloudUrl;

          await supabase.from('users_registry').update({ avatar_url: photoUrl }).eq('id', user.id);
        }

        setUser(prev => ({ ...prev, avatarUrl: photoUrl }));
        triggerToast("Foto profil Panua Community Anda berhasil diperbarui!", "success");
      };

      // VERIFIKASI REDEEM CODE 90 DETIK -> AKSES BRANKAS 1 JAM
      const handleUnlockVault = async (e) => {
        e.preventDefault();
        const codeTrim = vaultRedeemInput.trim().toUpperCase();
        if (!codeTrim) {
          triggerToast("Masukkan Redeem Code / Token Akses!", "warning");
          return;
        }

        const grantVaultAccessOneHour = () => {
          const oneHourMs = 60 * 60 * 1000;
          const expiryTime = Date.now() + oneHourMs;
          setVaultUnlockedUntil(expiryTime);
          localStorage.setItem('panua_vault_unlock_until', String(expiryTime));
          setVaultRedeemInput("");
          triggerToast("Akses Brankas Diterima! Sesi aktif selama 1 Jam.", "success");
        };

        if (user?.role === "admin") {
          grantVaultAccessOneHour();
          return;
        }

        if (!supabase) {
          triggerToast("Server Cloud belum terhubung. Hubungi Admin.", "danger");
          return;
        }

        setIsVerifyingCode(true);
        const now = Date.now();

        try {
          const { data, error } = await supabase
            .from('redeem_codes')
            .select('*')
            .eq('code', codeTrim)
            .eq('is_active', true)
            .limit(1)
            .maybeSingle();

          if (error || !data) {
            setIsVerifyingCode(false);
            triggerToast("Redeem Code tidak valid atau sudah kadaluwarsa (>90 detik)!", "danger");
            return;
          }

          const target = (data.user_target || 'all').toLowerCase();
          if (target !== 'all' && target !== user.username.toLowerCase()) {
            setIsVerifyingCode(false);
            triggerToast("Redeem Code ini diterbitkan khusus untuk username lain!", "danger");
            return;
          }

          const expiresAt = Number(data.expires_at_ms);
          if (now > expiresAt + 15000) {
            setIsVerifyingCode(false);
            await supabase.from('redeem_codes').update({ is_active: false }).eq('id', data.id);
            triggerToast("Redeem Code telah kedaluwarsa (> 90 detik). Minta kode baru ke Admin via WA.", "danger");
            return;
          }

          setIsVerifyingCode(false);
          grantVaultAccessOneHour();
        } catch (err) {
          setIsVerifyingCode(false);
          triggerToast("Gagal memverifikasi kode: " + err.message, "danger");
        }
      };

      const handleRequestCodeViaWhatsapp = () => {
        const adminNumber = appBranding.adminWhatsapp.replace(/\D/g, '');
        const message = `Halo Admin ${appBranding.title} (Gorontalo),\n\nSaya ingin meminta Kode Akses / Redeem Code untuk membuka menu My Secure Vault:\nNama: ${user.name}\nUsername: ${user.username}\nEmail: ${user.email}\nNo HP: ${user.phone || '-'}\n\nMohon buatkan kode akses 90 detik untuk sesi 1 jam di Supabase. Terima kasih!`;
        const waUrl = `https://wa.me/${adminNumber}?text=${encodeURIComponent(message)}`;
        window.open(waUrl, '_blank');
        triggerToast("Membuka WhatsApp untuk mengirim permohonan ke Admin...");
      };

      const handleAdminSendDossierViaWA = (dossier, codeToSend = "") => {
        if (!dossier.noHp) {
          triggerToast("Nomor HP anggota tidak tersedia!", "warning");
          return;
        }
        const cleanNumber = dossier.noHp.replace(/\D/g, '').replace(/^0/, '62');
        let text = `Halo Sdr/i ${dossier.namaLengkap},\n\nAdmin ${appBranding.title} (Gorontalo) menyampaikan informasi arsip brankas Anda:\n• Status Dokumen: Tersimpan di Supabase Realtime Storage\n• NIK: ${dossier.nik}\n• Username Pi: ${dossier.usernamePi}\n• Rekening: ${dossier.rekening}\n`;
        if (codeToSend) {
          text += `\n🔑 KODE AKSES / REDEEM CODE BRANKAS (BERLAKU 90 DETIK):\n👉 *${codeToSend}*\n⚠️ *PENTING:* Kode ini aktif selama tepat 90 detik (1.5 menit). Harap segera masukkan di aplikasi untuk membuka My Secure Vault selama 1 Jam.\n`;
        } else {
          text += `\n⚠️ Belum ada kode aktif. Silakan minta admin membuatkan kode akses 90 detik baru.\n`;
        }
        text += `\nSalam Komunitas Panua Pi Network Gorontalo!`;

        const waUrl = `https://wa.me/${cleanNumber}?text=${encodeURIComponent(text)}`;
        window.open(waUrl, '_blank');
        triggerToast(`Membuka WhatsApp ke ${dossier.namaLengkap}...`);
      };

      // SIMPAN 15 BERKAS DOSSIER KE CLOUD SUPABASE
      const handleSaveAndSendDossierToAdmin = async () => {
        if (!supabase) {
          triggerToast("Gagal: Database Cloud Supabase belum terhubung!", "danger");
          return;
        }

        setIsSavingDossier(true);
        triggerToast("Mengunggah berkas ke Supabase Storage & Database Realtime...", "warning");

        try {
          let ktpUrl = memberDossier.fotoKtp?.driveUrl || "";
          let kkUrl = memberDossier.fotoKk?.driveUrl || "";
          let npwpUrl = memberDossier.fotoNpwp?.driveUrl || "";
          let pasfotoUrl = memberDossier.pasfoto?.driveUrl || "";
          let ktaUrl = memberDossier.kartuKeanggotaan?.driveUrl || "";

          const prefix = `dossiers/${user.username}`;
          if (memberDossier.fotoKtp?.base64 && !ktpUrl) ktpUrl = await uploadFileToSupabaseStorage(memberDossier.fotoKtp, `${prefix}/ktp`);
          if (memberDossier.fotoKk?.base64 && !kkUrl) kkUrl = await uploadFileToSupabaseStorage(memberDossier.fotoKk, `${prefix}/kk`);
          if (memberDossier.fotoNpwp?.base64 && !npwpUrl) npwpUrl = await uploadFileToSupabaseStorage(memberDossier.fotoNpwp, `${prefix}/npwp`);
          if (memberDossier.pasfoto?.base64 && !pasfotoUrl) pasfotoUrl = await uploadFileToSupabaseStorage(memberDossier.pasfoto, `${prefix}/pasfoto`);
          if (memberDossier.kartuKeanggotaan?.base64 && !ktaUrl) ktaUrl = await uploadFileToSupabaseStorage(memberDossier.kartuKeanggotaan, `${prefix}/kta`);

          const updatedDossier = {
            ...memberDossier,
            fotoKtp: ktpUrl ? { name: "KTP Elektronik Terunggah", driveUrl: ktpUrl } : memberDossier.fotoKtp,
            fotoKk: kkUrl ? { name: "Kartu Keluarga Terunggah", driveUrl: kkUrl } : memberDossier.fotoKk,
            fotoNpwp: npwpUrl ? { name: "NPWP Terunggah", driveUrl: npwpUrl } : memberDossier.fotoNpwp,
            pasfoto: pasfotoUrl ? { name: "Pasfoto Formal Terunggah", driveUrl: pasfotoUrl } : memberDossier.pasfoto,
            kartuKeanggotaan: ktaUrl ? { name: "KTA Panua Terunggah", driveUrl: ktaUrl } : memberDossier.kartuKeanggotaan,
            isSavedToAdmin: true,
            lastSynced: new Date().toLocaleDateString('id-ID') + ", " + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + " WITA"
          };

          setMemberDossier(updatedDossier);

          const dossierId = "dos-" + user.username.replace(/[^a-zA-Z0-9]/g, '_');
          const totalDocs = (ktpUrl ? 1 : 0) + (kkUrl ? 1 : 0) + (npwpUrl ? 1 : 0) + (pasfotoUrl ? 1 : 0) + (ktaUrl ? 1 : 0) + (updatedDossier.extraDocs?.length || 0);

          const { error: upsertErr } = await supabase.from('dossiers').upsert([
            {
              id: dossierId,
              user_id: user.id,
              username: user.username,
              nama_lengkap: updatedDossier.namaLengkap,
              email: updatedDossier.email,
              no_hp: updatedDossier.noHp,
              username_pi: updatedDossier.usernamePi,
              ttl: updatedDossier.ttl,
              nik: updatedDossier.nik,
              alamat_lengkap: updatedDossier.alamatLengkap,
              nama_rekening: updatedDossier.namaRekening,
              no_rekening: updatedDossier.noRekening,
              wallet_pi: updatedDossier.walletPi,
              wallet_okx: updatedDossier.walletOkx,
              foto_ktp_url: ktpUrl,
              foto_kk_url: kkUrl,
              foto_npwp_url: npwpUrl,
              pasfoto_url: pasfotoUrl,
              kta_url: ktaUrl,
              extra_docs: updatedDossier.extraDocs || [],
              docs_count: totalDocs,
              status: 'Tersimpan di Cloud Supabase Realtime',
              updated_at: new Date().toISOString()
            }
          ], { onConflict: 'id' });

          if (upsertErr) {
            console.error("Dossier upsert error:", upsertErr);
            triggerToast("Gagal simpan ke Supabase: " + upsertErr.message, "danger");
          } else {
            triggerToast("Sukses! 15 Berkas & Identitas tersimpan di Cloud Supabase Realtime!", "success");
          }
        } catch (err) {
          console.error("Error saving dossier:", err);
          triggerToast("Gagal mengunggah berkas. Periksa koneksi internet Anda.", "danger");
        } finally {
          setIsSavingDossier(false);
        }
      };

      const handleAddExtraDocument = async (e) => {
        e.preventDefault();
        if (!newExtraDocTitle.trim() || !newExtraDocFile) {
          triggerToast("Masukkan judul dokumen dan pilih berkas!", "warning");
          return;
        }

        const compressed = await compressImageFile(newExtraDocFile);
        let cloudUrl = "";
        if (supabase) {
          cloudUrl = await uploadFileToSupabaseStorage(compressed, `dossiers/${user.username}/extra`);
        }

        const newDoc = {
          id: "doc-" + Date.now(),
          title: newExtraDocTitle.trim(),
          fileName: compressed.name,
          type: compressed.type,
          size: compressed.size,
          uploadedAt: new Date().toLocaleDateString('id-ID'),
          driveUrl: cloudUrl || compressed.base64
        };

        setMemberDossier(prev => ({
          ...prev,
          extraDocs: [...(prev.extraDocs || []), newDoc]
        }));
        setNewExtraDocTitle("");
        setNewExtraDocFile(null);
        triggerToast(`Dokumen "${newDoc.title}" siap disimpan ke Supabase!`);
      };

      // GENERATOR REDEEM CODE 90 DETIK
      const handleAdminCreateRedeemCode = async (e) => {
        e.preventDefault();
        const code = newCodeCustom.trim().toUpperCase() || "PANUA-" + Math.floor(100000 + Math.random() * 900000);
        const now = Date.now();
        const newEntry = {
          code: code,
          userTarget: newCodeTarget,
          createdBy: user.username,
          note: newCodeNote.trim() || "Akses Brankas 90 Detik",
          createdAt: now,
          expiresAt: now + 90000
        };

        setActiveRedeemCodes(prev => [newEntry, ...prev.filter(c => now < c.expiresAt)]);
        setNewCodeCustom("");
        setNewCodeNote("");
        triggerToast(`Redeem Code [${code}] aktif 90 detik untuk: ${newCodeTarget}!`, "success");

        if (supabase) {
          try {
            await supabase.from('redeem_codes').insert([
              {
                id: "code-" + now,
                code: newEntry.code,
                user_target: newEntry.userTarget,
                created_by: newEntry.createdBy,
                note: newEntry.note,
                created_at_ms: newEntry.createdAt,
                expires_at_ms: newEntry.expiresAt,
                is_active: true
              }
            ]);
          } catch (err) {
            console.error("Supabase insert code error:", err);
          }
        }
      };

      // Simpan Konfigurasi Supabase
      const handleSaveSupabaseConfig = (url, key) => {
        const cleanUrl = (url || '').trim().replace(/\/$/, '');
        const cleanKey = (key || '').trim();

        if (!cleanUrl || !cleanKey) {
          triggerToast("Masukkan Project URL & Anon Key Supabase!", "danger");
          return;
        }

        localStorage.setItem('panua_supabase_url', cleanUrl);
        localStorage.setItem('panua_supabase_key', cleanKey);
        setSupabaseConfig({
          url: cleanUrl,
          key: cleanKey
        });
        setShowSupabaseSettingsModal(false);
        triggerToast("Menghubungkan ke Supabase Cloud...", "warning");
      };

      // Simpan Branding oleh Admin
      const handleSaveBranding = async () => {
        if (!brandingDraft.title.trim()) {
          triggerToast("Nama judul aplikasi tidak boleh kosong!", "danger");
          return;
        }

        setAppBranding({ ...brandingDraft });

        if (supabase) {
          try {
            await supabase.from('app_branding').upsert([
              {
                id: 'primary',
                title: brandingDraft.title,
                tagline: brandingDraft.tagline,
                logo_type: brandingDraft.logoType,
                custom_logo_url: brandingDraft.customLogoUrl,
                admin_whatsapp: brandingDraft.adminWhatsapp,
                meeting_provider: brandingDraft.meetingProvider,
                updated_at: new Date().toISOString()
              }
            ], { onConflict: 'id' });
            triggerToast("Identitas Panua Community tersimpan di Cloud!", "success");
          } catch (err) {
            console.error("Supabase branding error:", err);
          }
        }
      };

      // Handler Chat Pesan
      const handleSendMessage = async (e) => {
        e.preventDefault();
        if (!chatInput.trim()) return;
        const newMsg = {
          id: "m-" + Date.now(),
          sender: user.name,
          userId: user.id,
          isMe: true,
          text: chatInput.trim(),
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          replyTo: replyingTo ? replyingTo.text.slice(0, 35) + "..." : null
        };

        setChatMessages(prev => [...prev, newMsg]);
        setChatInput("");
        setReplyingTo(null);

        if (supabase) {
          try {
            await supabase.from('chat_messages').insert([
              {
                id: newMsg.id,
                sender: newMsg.sender,
                user_id: newMsg.userId,
                text: newMsg.text,
                time: newMsg.time,
                reply_to: newMsg.replyTo
              }
            ]);
          } catch (err) {
            console.error("Supabase chat error:", err);
          }
        }
      };

      const handleCreateNewMeeting = (e) => {
        e.preventDefault();
        if (!newMeetingTitle.trim()) {
          triggerToast("Masukkan judul rapat online!", "warning");
          return;
        }

        const roomSlug = "Panua-" + newMeetingTitle.trim().replace(/[^a-zA-Z0-9]/g, "-") + "-" + Math.floor(100 + Math.random() * 900);
        const newMeet = {
          id: "meet-" + Date.now(),
          title: newMeetingTitle.trim(),
          host: newMeetingHost.trim() || user.name,
          date: newMeetingDate.trim() || "Hari Ini",
          duration: newMeetingDuration,
          room: roomSlug,
          status: "Terjadwal"
        };

        setMeetings(prev => [newMeet, ...prev]);
        setShowCreateMeetingModal(false);
        setNewMeetingTitle("");
        setNewMeetingHost("");
        setNewMeetingDate("");
        triggerToast(`Rapat "${newMeet.title}" berhasil dijadwalkan!`);
      };

      const handleCreateNewGroup = (e) => {
        e.preventDefault();
        if (!newGroupName.trim() || !newGroupDesc.trim()) {
          triggerToast("Lengkapi nama grup dan deskripsi!", "warning");
          return;
        }

        const newGrp = {
          id: "grp-" + Date.now(),
          name: newGroupName.trim(),
          category: newGroupCategory,
          memberCount: 1,
          isOfficial: user?.role === "admin",
          joined: true,
          description: newGroupDesc.trim()
        };

        setGroups(prev => [newGrp, ...prev]);
        setShowCreateGroupModal(false);
        setNewGroupName("");
        setNewGroupDesc("");
        triggerToast(`Grup "${newGrp.name}" berhasil dibuat!`);
      };

      const handleDeleteRegisteredMember = async (targetId, targetName) => {
        setConfirmDialog({
          title: "Hapus Anggota Terdaftar",
          message: `Apakah Anda yakin ingin menghapus akun anggota "${targetName}" dari database?`,
          onConfirm: async () => {
            setRegisteredUsers(prev => prev.filter(u => u.id !== targetId));
            setSubmittedDossiers(prev => prev.filter(d => d.userId !== targetId));
            setConfirmDialog(null);

            if (supabase) {
              await supabase.from('users_registry').delete().eq('id', targetId);
              await supabase.from('dossiers').delete().eq('user_id', targetId);
            }
            triggerToast(`Akun ${targetName} berhasil dihapus dari Cloud.`);
          }
        });
      };

      const filteredGroups = useMemo(() => {
        return groups.filter(g => {
          const matchCat = selectedCategory === "Semua" || g.category === selectedCategory;
          const matchSearch = g.name.toLowerCase().includes(searchQuery.toLowerCase()) || g.description.toLowerCase().includes(searchQuery.toLowerCase());
          return matchCat && matchSearch;
        });
      }, [groups, selectedCategory, searchQuery]);

      return (
        <div className="min-h-screen flex flex-col bg-pch-bg text-pch-text pb-20 md:pb-0">
          
          {/* TOAST POPUP */}
          {toast && (
            <div className={`fixed top-4 right-4 z-50 flex items-center gap-3 px-4 py-3 rounded-xl shadow-card-elevated border transition-all duration-300 ${
              toast.type === "danger" 
                ? "bg-red-950/90 border-pch-danger text-red-200" 
                : toast.type === "warning"
                ? "bg-amber-950/90 border-pch-warning text-amber-200"
                : "bg-pch-surface border-pch-gold text-pch-goldLight"
            }`}>
              <Icons.Shield className="w-5 h-5 shrink-0" />
              <span className="text-sm font-medium">{toast.msg}</span>
              <button onClick={() => setToast(null)} className="ml-2 hover:opacity-75"><Icons.X className="w-4 h-4" /></button>
            </div>
          )}

          {/* TOP DISCLAIMER — BERSIH, HANYA IDENTITAS RESMI TANPA TULISAN ADMIN */}
          <div className="bg-pch-secondary/90 border-b border-pch-border/60 px-4 py-1.5 text-xs text-center text-pch-muted flex items-center justify-center">
            <span className="inline-block w-2 h-2 rounded-full bg-pch-gold animate-pulse mr-2"></span>
            <span><strong>PANUA COMMUNITY GORONTALO</strong> — Independent Community Platform. Not Officially Affiliated with Pi Network.</span>
          </div>

          {/* ==================== AUTHENTICATION PORTAL ==================== */}
          {!isAuthenticated ? (
            <div className="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8 relative">
              <div className="absolute top-1/4 left-1/2 -translate-x-1/2 w-96 h-96 bg-pch-purple/15 rounded-full blur-3xl pointer-events-none"></div>
              <div className="absolute bottom-10 left-1/3 w-80 h-80 bg-pch-gold/10 rounded-full blur-3xl pointer-events-none"></div>

              <div className="relative z-10 w-full max-w-md bg-pch-surface/95 backdrop-blur-md border border-pch-border/90 rounded-2xl p-6 sm:p-8 shadow-card-elevated space-y-6">
                
                <div className="flex flex-col items-center text-center space-y-2">
                  <BrandLogo config={appBranding} size="lg" />
                  <div>
                    <h2 className="text-xl sm:text-2xl font-bold tracking-wide gold-gradient-text uppercase">
                      {appBranding.title}
                    </h2>
                    <p className="text-xs text-pch-muted mt-0.5">{appBranding.tagline}</p>
                  </div>
                </div>

                {authView !== "forgot" && (
                  <div className="grid grid-cols-2 p-1 rounded-xl bg-pch-secondary border border-pch-border">
                    <button
                      type="button"
                      onClick={() => setAuthView("login")}
                      className={`py-2 text-xs sm:text-sm font-semibold rounded-lg transition-all ${
                        authView === "login"
                          ? "bg-pch-gold text-black shadow-gold-glow"
                          : "text-pch-muted hover:text-pch-text"
                      }`}
                    >
                      Masuk (Login)
                    </button>
                    <button
                      type="button"
                      onClick={() => setAuthView("register")}
                      className={`py-2 text-xs sm:text-sm font-semibold rounded-lg transition-all ${
                        authView === "register"
                          ? "bg-pch-purple text-white shadow-purple-glow"
                          : "text-pch-muted hover:text-pch-text"
                      }`}
                    >
                      Daftar (Register)
                    </button>
                  </div>
                )}

                {/* LOGIN FORM */}
                {authView === "login" && (
                  <form onSubmit={handleLoginSubmit} className="space-y-4">
                    <div>
                      <label className="text-xs font-semibold text-pch-muted block mb-1">
                        Email atau Username
                      </label>
                      <div className="relative">
                        <Icons.User className="w-4 h-4 text-pch-muted absolute left-3.5 top-3" />
                        <input 
                          type="text"
                          required
                          value={loginIdentifier}
                          onChange={(e) => setLoginIdentifier(e.target.value)}
                          placeholder="Masukkan Email atau Username"
                          className="w-full bg-pch-secondary border border-pch-border rounded-xl pl-10 pr-4 py-2.5 text-sm text-pch-text placeholder-pch-muted/60 focus:outline-none focus:border-pch-purple"
                        />
                      </div>
                    </div>

                    <div>
                      <div className="flex items-center justify-between mb-1">
                        <label className="text-xs font-semibold text-pch-muted">Password</label>
                        <button 
                          type="button"
                          onClick={() => setAuthView("forgot")}
                          className="text-xs text-pch-gold hover:underline"
                        >
                          Lupa Password?
                        </button>
                      </div>
                      <div className="relative">
                        <Icons.Lock className="w-4 h-4 text-pch-muted absolute left-3.5 top-3" />
                        <input 
                          type={showLoginPassword ? "text" : "password"}
                          required
                          value={loginPassword}
                          onChange={(e) => setLoginPassword(e.target.value)}
                          placeholder="••••••••"
                          className="w-full bg-pch-secondary border border-pch-border rounded-xl pl-10 pr-11 py-2.5 text-sm text-pch-text placeholder-pch-muted/60 focus:outline-none focus:border-pch-purple font-mono"
                        />
                        <button
                          type="button"
                          onClick={() => setShowLoginPassword(!showLoginPassword)}
                          className="absolute right-3.5 top-2.5 text-pch-muted hover:text-pch-gold transition-colors"
                        >
                          {showLoginPassword ? <Icons.EyeOff className="w-4 h-4" /> : <Icons.Eye className="w-4 h-4" />}
                        </button>
                      </div>
                    </div>

                    <button
                      type="submit"
                      className="w-full py-2.5 rounded-xl bg-pch-gold text-black font-bold text-sm hover:bg-pch-goldLight transition-all shadow-gold-glow flex items-center justify-center gap-2 mt-2"
                    >
                      <span>Masuk ke Panua Community</span>
                    </button>
                  </form>
                )}

                {/* REGISTER FORM */}
                {authView === "register" && (
                  <form onSubmit={handleRegisterSubmit} className="space-y-3.5">
                    <div>
                      <label className="text-xs font-semibold text-pch-muted block mb-1">Nama Lengkap</label>
                      <input 
                        type="text"
                        required
                        value={regName}
                        onChange={(e) => setRegName(e.target.value)}
                        placeholder="Contoh: Ismail Mohamad"
                        className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-sm text-pch-text focus:outline-none focus:border-pch-purple"
                      />
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="text-xs font-semibold text-pch-muted block mb-1">Username</label>
                        <input 
                          type="text"
                          required
                          value={regUsername}
                          onChange={(e) => setRegUsername(e.target.value)}
                          placeholder="ismail_panua"
                          className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-sm text-pch-text font-mono focus:outline-none focus:border-pch-purple"
                        />
                      </div>
                      <div>
                        <label className="text-xs font-semibold text-pch-muted block mb-1">No HP / WhatsApp</label>
                        <input 
                          type="tel"
                          required
                          value={regPhone}
                          onChange={(e) => setRegPhone(e.target.value)}
                          placeholder="081234567890"
                          className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-sm text-pch-text focus:outline-none focus:border-pch-purple"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="text-xs font-semibold text-pch-muted block mb-1">Email</label>
                      <input 
                        type="email"
                        required
                        value={regEmail}
                        onChange={(e) => setRegEmail(e.target.value)}
                        placeholder="ismail@email.com"
                        className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-sm text-pch-text focus:outline-none focus:border-pch-purple"
                      />
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="text-xs font-semibold text-pch-muted block mb-1">Password</label>
                        <div className="relative">
                          <input 
                            type={showRegPassword ? "text" : "password"}
                            required
                            value={regPassword}
                            onChange={(e) => setRegPassword(e.target.value)}
                            placeholder="••••••"
                            className="w-full bg-pch-secondary border border-pch-border rounded-xl pl-3.5 pr-9 py-2 text-sm text-pch-text font-mono focus:outline-none focus:border-pch-purple"
                          />
                          <button
                            type="button"
                            onClick={() => setShowRegPassword(!showRegPassword)}
                            className="absolute right-2.5 top-2 text-pch-muted hover:text-pch-gold"
                          >
                            {showRegPassword ? <Icons.EyeOff className="w-3.5 h-3.5" /> : <Icons.Eye className="w-3.5 h-3.5" />}
                          </button>
                        </div>
                      </div>
                      <div>
                        <label className="text-xs font-semibold text-pch-muted block mb-1">Konfirmasi</label>
                        <div className="relative">
                          <input 
                            type={showRegConfirmPassword ? "text" : "password"}
                            required
                            value={regConfirmPassword}
                            onChange={(e) => setRegConfirmPassword(e.target.value)}
                            placeholder="••••••"
                            className="w-full bg-pch-secondary border border-pch-border rounded-xl pl-3.5 pr-9 py-2 text-sm text-pch-text font-mono focus:outline-none focus:border-pch-purple"
                          />
                          <button
                            type="button"
                            onClick={() => setShowRegConfirmPassword(!showRegConfirmPassword)}
                            className="absolute right-2.5 top-2 text-pch-muted hover:text-pch-gold"
                          >
                            {showRegConfirmPassword ? <Icons.EyeOff className="w-3.5 h-3.5" /> : <Icons.Eye className="w-3.5 h-3.5" />}
                          </button>
                        </div>
                      </div>
                    </div>

                    <label className="flex items-start gap-2 pt-1 cursor-pointer">
                      <input 
                        type="checkbox"
                        checked={regAgreed}
                        onChange={(e) => setRegAgreed(e.target.checked)}
                        className="mt-0.5 rounded accent-pch-gold"
                      />
                      <span className="text-[11px] text-pch-muted leading-tight">
                        Saya menyetujui Ketentuan Penggunaan dan Kebijakan Privasi Panua Community Gorontalo.
                      </span>
                    </label>

                    <button
                      type="submit"
                      disabled={isRegistering}
                      className="w-full py-2.5 rounded-xl bg-pch-purple text-white font-bold text-sm hover:bg-pch-purpleLight transition-all shadow-purple-glow flex items-center justify-center gap-2 mt-1 disabled:opacity-50"
                    >
                      <span>{isRegistering ? "Menyimpan ke Cloud..." : "Daftar Akun Anggota Panua"}</span>
                    </button>
                  </form>
                )}

                {/* FORGOT PASSWORD FORM */}
                {authView === "forgot" && (
                  <div className="space-y-4">
                    <button
                      type="button"
                      onClick={() => { setAuthView("login"); setForgotSent(false); }}
                      className="text-xs text-pch-gold flex items-center gap-1 hover:underline"
                    >
                      <Icons.ArrowLeft className="w-3.5 h-3.5" />
                      <span>Kembali ke Halaman Masuk</span>
                    </button>

                    <div className="space-y-1">
                      <h3 className="text-base font-bold text-pch-text">Pemulihan Password</h3>
                      <p className="text-xs text-pch-muted">
                        Masukkan email Anda untuk menerima instruksi pemulihan akun.
                      </p>
                    </div>

                    {forgotSent ? (
                      <div className="p-4 rounded-xl bg-emerald-950/60 border border-pch-success text-xs text-pch-success space-y-2">
                        <div className="flex items-center gap-2 font-bold">
                          <Icons.Check className="w-4 h-4" />
                          <span>Tautan Berhasil Dikirim!</span>
                        </div>
                        <p className="text-[11px] text-pch-muted">
                          Silakan periksa inbox email <strong>{forgotEmail}</strong> Anda.
                        </p>
                      </div>
                    ) : (
                      <form onSubmit={handleForgotSubmit} className="space-y-3">
                        <input 
                          type="email" 
                          required
                          value={forgotEmail}
                          onChange={(e) => setForgotEmail(e.target.value)}
                          placeholder="emailanda@gmail.com"
                          className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-sm text-pch-text focus:outline-none focus:border-pch-purple"
                        />
                        <button
                          type="submit"
                          className="w-full py-2.5 rounded-xl bg-pch-gold text-black font-bold text-sm hover:bg-pch-goldLight shadow-gold-glow"
                        >
                          Kirim Instruksi Pemulihan
                        </button>
                      </form>
                    )}
                  </div>
                )}

              </div>
            </div>
          ) : (
            /* ==================== MAIN APPLICATION SHELL ==================== */
            <div className="flex-1 flex flex-col md:flex-row">
              {/* DESKTOP SIDEBAR */}
              <aside className="hidden md:flex flex-col w-64 border-r border-pch-border bg-pch-secondary/80 p-4 space-y-6">
                <div className="flex items-center gap-3 px-1">
                  <BrandLogo config={appBranding} size="md" />
                  <div className="truncate">
                    <h1 className="font-bold text-xs gold-gradient-text uppercase truncate">{appBranding.title}</h1>
                    <p className="text-[9px] text-pch-muted truncate">{appBranding.tagline}</p>
                  </div>
                </div>

                <nav className="flex-1 space-y-1.5">
                  {[
                    { id: "dashboard", label: "Beranda", icon: Icons.Home },
                    { id: "community", label: "Grup Panua", icon: Icons.Users },
                    { id: "chat", label: "Chat Forum", icon: Icons.MessageSquare },
                    { id: "meetings", label: "Rapat Online", icon: Icons.Video },
                    { id: "vault", label: "My Secure Vault", icon: Icons.Lock },
                    { id: "profile", label: "Profil Anggota", icon: Icons.User },
                    ...(user?.role === "admin" ? [{ id: "admin", label: "Panel Admin", icon: Icons.Shield }] : [])
                  ].map(item => {
                    const Icon = item.icon;
                    const isActive = activeTab === item.id;
                    return (
                      <button
                        key={item.id}
                        onClick={() => { setActiveTab(item.id); setActiveJitsiRoom(null); }}
                        className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                          isActive 
                            ? "bg-pch-gold text-black shadow-gold-glow font-bold" 
                            : "text-pch-muted hover:text-pch-text hover:bg-pch-surface"
                        }`}
                      >
                        <Icon className="w-4 h-4 shrink-0" />
                        <span>{item.label}</span>
                      </button>
                    );
                  })}
                </nav>

                <div className="p-3 rounded-xl bg-pch-surface border border-pch-border space-y-2">
                  <div className="flex items-center gap-2.5">
                    <UserAvatar user={user} branding={appBranding} size="md" />
                    <div className="truncate text-left flex-1">
                      <p className="text-xs font-bold text-pch-text truncate">{user.name}</p>
                      <p className="text-[10px] text-pch-gold truncate font-mono">@{user.username}</p>
                    </div>
                  </div>
                  <button
                    onClick={handleLogoutSession}
                    className="w-full py-1.5 rounded-lg bg-pch-secondary border border-pch-border text-[11px] text-pch-danger hover:bg-red-950/40 flex items-center justify-center gap-1.5"
                  >
                    <Icons.LogOut className="w-3.5 h-3.5" />
                    <span>Keluar Sesi</span>
                  </button>
                </div>
              </aside>

              {/* MAIN CONTENT AREA */}
              <div className="flex-1 flex flex-col min-w-0">
                {/* HEADER BERSIH TANPA STATUS TEKNIS DATABASE */}
                <header className="h-14 border-b border-pch-border bg-pch-surface/70 backdrop-blur-md px-4 sm:px-6 flex items-center justify-between gap-4">
                  <div className="flex items-center gap-2.5 md:hidden">
                    <BrandLogo config={appBranding} size="sm" />
                    <span className="font-bold text-xs gold-gradient-text uppercase truncate max-w-[150px]">{appBranding.title}</span>
                  </div>

                  <div className="hidden md:flex items-center gap-3 text-xs text-pch-muted">
                    <span className="flex items-center gap-1.5">
                      <span className={`w-2 h-2 rounded-full ${isOnline ? "bg-emerald-400" : "bg-red-500"}`}></span>
                      <span>{isOnline ? "Komunitas Terhubung" : "Mode Offline"}</span>
                    </span>
                  </div>

                  <div className="flex items-center gap-3">
                    <UserAvatar user={user} branding={appBranding} size="sm" />
                    <button 
                      onClick={handleLogoutSession}
                      className="p-1.5 rounded-lg bg-pch-secondary border border-pch-border text-pch-muted hover:text-pch-danger md:hidden"
                      title="Keluar"
                    >
                      <Icons.LogOut className="w-4 h-4" />
                    </button>
                  </div>
                </header>

                {/* MAIN CONTENT CONTAINER */}
                <main className="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto">
                  
                  {/* TAB 1: DASHBOARD */}
                  {activeTab === "dashboard" && (
                    <div className="space-y-6">
                      <div className="p-6 rounded-2xl bg-gradient-to-r from-pch-surface via-pch-secondary to-pch-surface border border-pch-border flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div className="flex items-center gap-4">
                          <UserAvatar user={user} branding={appBranding} size="lg" />
                          <div>
                            <span className="text-[11px] font-bold text-pch-gold uppercase tracking-wider">Dashboard Resmi Komunitas</span>
                            <h2 className="text-xl sm:text-2xl font-bold text-pch-text mt-1">Halo, {user.name}!</h2>
                            <p className="text-xs text-pch-muted mt-0.5">Selamat datang di Panua Community — Pi Network Gorontalo - Indonesia.</p>
                          </div>
                        </div>
                        <button 
                          onClick={() => setActiveTab("vault")}
                          className="px-4 py-2.5 rounded-xl bg-pch-gold text-black font-bold text-xs sm:text-sm hover:bg-pch-goldLight transition-all shadow-gold-glow flex items-center gap-2 self-start sm:self-auto"
                        >
                          <Icons.Lock className="w-4 h-4" />
                          <span>Buka My Secure Vault</span>
                        </button>
                      </div>

                      {/* Stat Cards Bersih */}
                      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                        <div className="p-4 rounded-xl bg-pch-surface border border-pch-border">
                          <span className="text-xs text-pch-muted block">Anggota Komunitas</span>
                          <span className="text-xl font-bold text-pch-goldLight font-mono">{registeredUsers.length + 1}</span>
                        </div>
                        <div className="p-4 rounded-xl bg-pch-surface border border-pch-border">
                          <span className="text-xs text-pch-muted block">Grup Panua Aktif</span>
                          <span className="text-xl font-bold text-pch-purpleLight font-mono">{groups.length}</span>
                        </div>
                        <div className="p-4 rounded-xl bg-pch-surface border border-pch-border">
                          <span className="text-xs text-pch-muted block">Status Brankas</span>
                          <span className={`text-xs font-bold block mt-1.5 ${vaultUnlocked ? "text-pch-success" : "text-pch-warning"}`}>
                            {vaultUnlocked ? "Terbuka (Sesi 1 Jam)" : "Terkunci (Perlu Redeem Code)"}
                          </span>
                        </div>
                        <div className="p-4 rounded-xl bg-pch-surface border border-pch-border">
                          <span className="text-xs text-pch-muted block">Status Jaringan</span>
                          <span className="text-xs font-bold block mt-1.5 text-pch-success flex items-center gap-1.5">
                            <span className="w-2 h-2 rounded-full bg-pch-success animate-pulse"></span>
                            <span>Sistem Aktif</span>
                          </span>
                        </div>
                      </div>

                      {/* Quick Navigation Cards */}
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <button 
                          onClick={() => setActiveTab("chat")}
                          className="p-4 rounded-xl bg-pch-secondary border border-pch-border hover:border-pch-purple text-left transition-all group"
                        >
                          <Icons.MessageSquare className="w-6 h-6 text-pch-purple group-hover:scale-110 transition-transform mb-2" />
                          <h4 className="font-bold text-sm text-pch-text">Forum Obrolan Realtime</h4>
                          <p className="text-xs text-pch-muted mt-1">Koordinasi langsung dan pesan publik sesama anggota Panua.</p>
                        </button>

                        <button 
                          onClick={() => setActiveTab("meetings")}
                          className="p-4 rounded-xl bg-pch-secondary border border-pch-border hover:border-pch-gold text-left transition-all group"
                        >
                          <Icons.Video className="w-6 h-6 text-pch-gold group-hover:scale-110 transition-transform mb-2" />
                          <h4 className="font-bold text-sm text-pch-text">Rapat Online Dedicated</h4>
                          <p className="text-xs text-pch-muted mt-1">Konferensi video & mikrofon berkecepatan tinggi terisolasi.</p>
                        </button>

                        <button 
                          onClick={() => setActiveTab("community")}
                          className="p-4 rounded-xl bg-pch-secondary border border-pch-border hover:border-pch-purple text-left transition-all group"
                        >
                          <Icons.Users className="w-6 h-6 text-pch-purpleLight group-hover:scale-110 transition-transform mb-2" />
                          <h4 className="font-bold text-sm text-pch-text">Grup & Wilayah Panua</h4>
                          <p className="text-xs text-pch-muted mt-1">Jelajahi sub-komunitas edukasi, UMKM, dan node Gorontalo.</p>
                        </button>
                      </div>
                    </div>
                  )}

                  {/* TAB 2: COMMUNITY GROUPS */}
                  {activeTab === "community" && (
                    <div className="space-y-6">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                          <h2 className="text-xl font-bold text-pch-text">Direktori Grup Panua Community</h2>
                          <p className="text-xs text-pch-muted">Wadah interaksi dan kolaborasi pionir Pi Network se-Gorontalo.</p>
                        </div>
                        <div className="flex items-center gap-2">
                          <button
                            onClick={() => setShowCreateGroupModal(true)}
                            className="px-3.5 py-2 rounded-xl bg-pch-purple text-white text-xs font-semibold hover:bg-pch-purpleLight flex items-center gap-1.5 shadow-purple-glow shrink-0"
                          >
                            <Icons.Plus className="w-3.5 h-3.5" />
                            <span>Buat Grup</span>
                          </button>
                          <div className="relative w-full sm:w-64">
                            <Icons.Search className="w-4 h-4 text-pch-muted absolute left-3 top-3" />
                            <input 
                              type="text" 
                              placeholder="Cari grup..."
                              value={searchQuery}
                              onChange={(e) => setSearchQuery(e.target.value)}
                              className="w-full bg-pch-secondary border border-pch-border rounded-xl pl-9 pr-4 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                            />
                          </div>
                        </div>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {filteredGroups.map(grp => (
                          <div key={grp.id} className="p-5 rounded-2xl bg-pch-surface border border-pch-border space-y-3">
                            <div className="flex items-start justify-between gap-2">
                              <span className="text-[10px] px-2 py-0.5 rounded bg-pch-secondary border border-pch-border text-pch-goldLight font-mono">
                                {grp.category}
                              </span>
                              {grp.isOfficial && (
                                <span className="text-[10px] px-2 py-0.5 rounded bg-amber-950/80 text-pch-gold border border-pch-gold/40">
                                  Resmi Panua
                                </span>
                              )}
                            </div>
                            <h3 className="font-bold text-sm text-pch-text">{grp.name}</h3>
                            <p className="text-xs text-pch-muted leading-relaxed">{grp.description}</p>
                            <div className="pt-2 border-t border-pch-border flex items-center justify-between">
                              <span className="text-xs text-pch-muted font-mono">{grp.memberCount} Anggota</span>
                              <button
                                onClick={() => {
                                  setGroups(prev => prev.map(g => g.id === grp.id ? { ...g, joined: !g.joined } : g));
                                  triggerToast(grp.joined ? `Keluar dari ${grp.name}` : `Bergabung ke ${grp.name}!`);
                                }}
                                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                                  grp.joined 
                                    ? "bg-pch-secondary border border-pch-border text-pch-muted hover:text-pch-danger"
                                    : "bg-pch-gold text-black hover:bg-pch-goldLight shadow-gold-glow"
                                }`}
                              >
                                {grp.joined ? "Sudah Bergabung" : "Gabung Grup"}
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>

                            >
                              <Icons.Phone className="w-3.5 h-3.5" />
                              <span>Minta Kode Akses 90 Detik ke Admin via WA</span>
                            </button>
                          </div>

                      ) : (
                        <div className="space-y-6">
                          <div className="p-4 rounded-2xl bg-gradient-to-r from-emerald-950/40 via-pch-surface to-pch-surface border border-pch-success/40 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                              <div className="w-10 h-10 rounded-xl bg-emerald-950 border border-pch-success text-pch-success flex items-center justify-center shrink-0">

                              </div>
                              <div>
                                <div className="flex items-center gap-2 flex-wrap">

                                <label className="text-xs font-semibold text-pch-muted block mb-1">Email</label>
                                <input 
                                  type="email"

                                  onChange={(e) => setMemberDossier({ ...memberDossier, email: e.target.value })}
                                  className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                                />
                              </div>

                              <div>
                                <label className="text-xs font-semibold text-pch-muted block mb-1">No HP / WhatsApp</label>
                                <input

                                  value={memberDossier.noHp}

                                />

                              <div>
                                <label className="text-xs font-semibold text-pch-muted block mb-1">Username Pi Network</label>
                                <input 
                                  type="text" 
                                  value={memberDossier.usernamePi}
                                  onChange={(e) => setMemberDossier({ ...memberDossier, usernamePi: e.target.value })}
                                  placeholder="@username_pi"
                                  className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text font-mono focus:outline-none focus:border-pch-purple"
                                />
                              </div>

                              <div>
                                <label className="text-xs font-semibold text-pch-muted block mb-1">Tempat & Tanggal Lahir (TTL)</label>
                                <input 
                                  type="text" 
                                  value={memberDossier.ttl}
                                  onChange={(e) => setMemberDossier({ ...memberDossier, ttl: e.target.value })}

                                  className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                                />
                              </div>

                              <div>
                                <label className="text-xs font-semibold text-pch-muted block mb-1">NIK (16 Digit)</label>
                                <input 
                                  type="text" 
                                  value={memberDossier.nik}
                                  onChange={(e) => setMemberDossier({ ...memberDossier, nik: e.target.value })}
                                  placeholder="7501..."
                                  className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text font-mono focus:outline-none focus:border-pch-purple"

                              </div>

                              <div className="sm:col-span-2 lg:col-span-3">
                                <label className="text-xs font-semibold text-pch-muted block mb-1">Alamat Lengkap Domisili</label>
                                <textarea 
                                  rows="2"
                                  value={memberDossier.alamatLengkap}
                                  onChange={(e) => setMemberDossier({ ...memberDossier, alamatLengkap: e.target.value })}
                                  className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                                ></textarea>
                              </div>
                            </div>
                          </div>

                              <Icons.Database className="w-4 h-4 text-pch-gold" />
                              <span>2. Rekening Bank & Alamat Wallet Publik</span>
                            </h4>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                              <div>
                                <label className="text-xs font-semibold text-pch-muted block mb-1">Nama Pemilik Rekening</label>
                                <input 
                                  type="text" 
                                  value={memberDossier.namaRekening}
                                  onChange={(e) => setMemberDossier({ ...memberDossier, namaRekening: e.target.value })}
                                  className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                                />
                              </div>

                              <div>
                                <label className="text-xs font-semibold text-pch-muted block mb-1">Bank & Nomor Rekening</label>
                                <input 
                                  type="text" 
                                  value={memberDossier.noRekening}
                                  onChange={(e) => setMemberDossier({ ...memberDossier, noRekening: e.target.value })}

                                  className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text font-mono focus:outline-none focus:border-pch-purple"
                                />
                              </div>

                              <div>
                                <label className="text-xs font-semibold text-pch-muted block mb-1">Alamat Wallet Publik Pi Network</label>
                                <input 
                                  type="text" 
                                  value={memberDossier.walletPi}
                                  onChange={(e) => setMemberDossier({ ...memberDossier, walletPi: e.target.value })}
                                  placeholder="Public Address (G...)"
                                  className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text font-mono focus:outline-none focus:border-pch-purple"

                              </div>

                              <div>
                                <label className="text-xs font-semibold text-pch-muted block mb-1">Alamat Wallet Publik OKX</label>
                                <input 
                                  type="text" 
                                  value={memberDossier.walletOkx}
                                  onChange={(e) => setMemberDossier({ ...memberDossier, walletOkx: e.target.value })}
                                  placeholder="Public Address OKX (0x...)"
                                  className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text font-mono focus:outline-none focus:border-pch-purple"
                                />
                              </div>
                            </div>
                          </div>

                          {/* 3. Berkas Dokumen Utama */}

                              <Icons.FileText className="w-4 h-4 text-pch-gold" />

                                { key: 'fotoKk', label: 'Foto Kartu Keluarga (KK)', data: memberDossier.fotoKk },
                                { key: 'fotoNpwp', label: 'Foto NPWP', data: memberDossier.fotoNpwp },
                                { key: 'pasfoto', label: 'Pasfoto Formal (4x6)', data: memberDossier.pasfoto },

                                        <span className="text-pch-goldLight">Siap upload ({item.data.size})</span>
                                      ) : (
                                        `Ukuran: ${item.data?.size || "-"}`
                                      )}

                                      accept=".pdf,image/*" 
                                      className="hidden"
