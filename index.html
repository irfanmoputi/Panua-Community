    const stringManifest = JSON.stringify(manifestObject);
    const blobManifest = new Blob([stringManifest], { type: 'application/json' });
    const manifestURL = URL.createObjectURL(blobManifest);
    document.getElementById('pwa-manifest-link').setAttribute('href', manifestURL);

    // Register Safe Service Worker (Static assets only, strict NO-CACHE for Vault & API)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swBlob = new Blob([`
          const CACHE_NAME = 'pch-static-v1.0';
          const STATIC_ASSETS = ['/'];
          self.addEventListener('install', (e) => {
            e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(STATIC_ASSETS)));
            self.skipWaiting();
          });
          self.addEventListener('activate', (e) => {
            e.waitUntil(caches.keys().then(keys => Promise.all(
              keys.map(k => { if(k !== CACHE_NAME) return caches.delete(k); })
            )));
            self.clients.claim();
          });
          self.addEventListener('fetch', (e) => {
            const url = new URL(e.request.url);
            // STRICT RULE: Never cache private documents, API requests or auth tokens
            if (url.pathname.includes('/vault') || url.pathname.includes('/rest/v1') || url.pathname.includes('/auth/')) {
              return;
            }
            e.respondWith(
              caches.match(e.request).then(res => res || fetch(e.request).catch(() => res))
            );
          });
        `], { type: 'application/javascript' });
        const swURL = URL.createObjectURL(swBlob);
        navigator.serviceWorker.register(swURL).catch(err => console.log('SW registration note:', err));
      });
    }
  </script>

    // Safe clipboard copy helper for iframe sandbox environments
    function safeCopyToClipboard(text) {
      try {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.left = "-999999px";
        textArea.style.top = "-999999px";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        document.execCommand('copy');
        textArea.remove();
        return true;
      } catch (err) {
        return false;
      }

function getVaultFolder() {
  const scriptProps = PropertiesService.getScriptProperties();
  const folderId = scriptProps.getProperty("VAULT_FOLDER_ID");
  if (folderId) {
    try { return DriveApp.getFolderById(folderId); } catch (e) {}
  }
  const folders = DriveApp.getFoldersByName("PCH_SECURE_VAULT_ISOLATED");
  if (folders.hasNext()) return folders.next();
  const newFolder = DriveApp.createFolder("PCH_SECURE_VAULT_ISOLATED");
  newFolder.setSharing(DriveApp.Access.PRIVATE, DriveApp.Permission.NONE);
  return newFolder;
}

function getDatabaseSpreadsheet() {
  const scriptProps = PropertiesService.getScriptProperties();
  const ssId = scriptProps.getProperty("DB_SPREADSHEET_ID");
  if (ssId) {
    try { return SpreadsheetApp.openById(ssId); } catch (e) {}
  }
  const files = DriveApp.getFilesByName("PCH_COMMUNITY_DATABASE");
  if (files.hasNext()) return SpreadsheetApp.open(files.next());
  return SpreadsheetApp.create("PCH_COMMUNITY_DATABASE");
}

function doGet(e) {
  try {
    const params = e ? e.parameter : {};
    const action = params.action || 'ping';

    if (action === 'ping') {
      return responseJSON({ status: 'ok', version: '3.0.0', timestamp: new Date().toISOString() });
    }

    if (action === 'getAppConfig') {
      const scriptProps = PropertiesService.getScriptProperties();
      return responseJSON({
        status: 'ok',
        config: {
          title: scriptProps.getProperty('APP_TITLE') || 'PI COMMUNITY HUB',

          text += `\n⚠️ Belum ada kode aktif. Silakan minta admin membuatkan kode akses 60 detik baru.\n`;
        }
        text += `\nUntuk unduhan berkas fisik, Anda dapat mengunduhnya langsung dari brankas aplikasi setelah dibuka. Salam Komunitas!`;

        const waUrl = `https://wa.me/${cleanNumber}?text=${encodeURIComponent(text)}`;
        window.open(waUrl, '_blank');
        triggerToast(`Membuka WhatsApp ke ${dossier.namaLengkap}...`);
      };

      // Member Save & Sync Entire Dossier to Admin Google Drive
      const handleSaveAndSendDossierToAdmin = () => {
        setMemberDossier(prev => ({
          ...prev,
          isSavedToAdmin: true,
          lastSynced: new Date().toLocaleDateString('id-ID') + ", " + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + " WIB"
        }));

        setSubmittedDossiers(prev => {
          const filtered = prev.filter(d => d.userId !== user.id);
          return [
            ...filtered,
            {
              id: "dos-" + Date.now(),
              userId: user.id,
              username: user.username,
              namaLengkap: memberDossier.namaLengkap,
              email: memberDossier.email,
              noHp: memberDossier.noHp,
              usernamePi: memberDossier.usernamePi,
              ttl: memberDossier.ttl,
              nik: memberDossier.nik,
              rekening: memberDossier.noRekening,
              walletPi: memberDossier.walletPi,
              walletOkx: memberDossier.walletOkx,
              docsCount: 5 + memberDossier.extraDocs.length,
              status: "Tersimpan di Google Drive Admin",
              lastUpdate: "Hari ini"
            }
          ];
        });

        if (gasConfig.connected && gasConfig.webAppUrl) {
          fetch(gasConfig.webAppUrl, {
            method: 'POST',
            body: JSON.stringify({
              action: 'saveMemberDossier',
              userId: user.id,
              username: user.username,
              dossier: memberDossier
            })
          }).catch(err => console.log('GAS sync note:', err));
        }

        triggerToast("Seluruh identitas dan berkas berhasil disimpan & dikirim ke Google Drive Admin!");
      };

      // Add Custom Extra Document
      const handleAddExtraDocument = (e) => {
        e.preventDefault();
        if (!newExtraDocTitle.trim() || !newExtraDocFile) {
          triggerToast("Masukkan judul dokumen dan pilih berkas!", "warning");
          return;
        }

        const newDoc = {
          id: "doc-" + Date.now(),
          title: newExtraDocTitle.trim(),
          fileName: newExtraDocFile.name,
          size: (newExtraDocFile.size / (1024 * 1024)).toFixed(2) + " MB",
          uploadedAt: new Date().toLocaleDateString('id-ID')
        };

        setMemberDossier(prev => ({
          ...prev,
          extraDocs: [...prev.extraDocs, newDoc]
        }));
        setNewExtraDocTitle("");
        setNewExtraDocFile(null);
        triggerToast(`Dokumen "${newDoc.title}" berhasil ditambahkan ke brankas!`);
      };

      // Admin Generate Redeem Code (Aktif Selama 60 Detik / 1 Menit Saja)
      const handleAdminCreateRedeemCode = (e) => {
        e.preventDefault();
        const code = newCodeCustom.trim().toUpperCase() || "PCH-" + Math.floor(100000 + Math.random() * 900000);
        const now = Date.now();
        const newEntry = {
          code: code,
          userTarget: newCodeTarget,
          createdBy: user.username,
          note: newCodeNote.trim() || "Akses 60 Detik",
          createdAt: now,
          expiresAt: now + 60000 // Validitas tepat 60 detik (1 menit)
        };
        setActiveRedeemCodes(prev => [newEntry, ...prev.filter(c => now < c.expiresAt)]);
        setNewCodeCustom("");
        setNewCodeNote("");
        triggerToast(`Redeem Code [${code}] berhasil diterbitkan! Aktif selama 60 detik untuk: ${newCodeTarget}!`, "success");

        if (gasConfig.connected && gasConfig.webAppUrl) {
          fetch(gasConfig.webAppUrl, {
            method: 'POST',
            body: JSON.stringify({
              action: 'generateRedeemCode',
              code: newEntry.code,
              userTarget: newEntry.userTarget,
              actor: newEntry.createdBy,
              note: newEntry.note,
              createdAt: new Date(now).toISOString(),
              expiresAt: new Date(newEntry.expiresAt).toISOString()
            })
          }).catch(err => console.log('GAS sync note:', err));
        }
      };

      // Connect Google Apps Script Web App Endpoint
      const handleSaveGasConfig = async (url) => {
        if (!url || !url.startsWith("https://script.google.com/macros/s/")) {
          triggerToast("Masukkan URL Web App Google Apps Script yang valid (https://script.google.com/...)", "danger");
          return;
        }

        try {
          triggerToast("Menghubungkan ke Google Apps Script Web App...", "warning");
          setGasConfig({
            webAppUrl: url,
            connected: true,
            lastSync: new Date().toLocaleTimeString()
          });
          setDemoMode(false);
          setShowGasModal(false);
          triggerToast("Sukses terhubung ke Google Apps Script Backend (Drive Vault & Sheets DB)!");
        } catch (e) {
          setGasConfig({
            webAppUrl: url,
            connected: true,
            lastSync: new Date().toLocaleTimeString()
          });
          setDemoMode(false);
          setShowGasModal(false);
          triggerToast("Endpoint GAS terpasang! Data tersimpan via Google Apps Script.", "success");
        }
      };

      // Admin Save App Branding Settings
      const handleSaveBranding = () => {
        if (!brandingDraft.title.trim()) {
          triggerToast("Nama judul aplikasi tidak boleh kosong!", "danger");
          return;
        }

        setAppBranding({ ...brandingDraft });

        if (gasConfig.connected && gasConfig.webAppUrl) {
          fetch(gasConfig.webAppUrl, {
            method: 'POST',
            body: JSON.stringify({
              action: 'saveAppConfig',
              actor: user.username,
              config: brandingDraft
            })
          }).catch(err => console.log('GAS sync note:', err));
        }

        triggerToast("Branding & identitas aplikasi berhasil diperbarui oleh Admin!");
      };

      // Handle Custom Logo File Upload by Admin
      const handleLogoFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        if (file.size > 2 * 1024 * 1024) {
          triggerToast("Ukuran logo maksimal 2MB!", "danger");
          return;
        }

        const reader = new FileReader();
        reader.onload = (uploadEvent) => {
          const base64Data = uploadEvent.target.result;
          setBrandingDraft(prev => ({
            ...prev,
            logoType: "custom",
            customLogoUrl: base64Data
          }));
          triggerToast("Pratinjau logo baru siap disimpan!");
        };
        reader.readAsDataURL(file);
      };

      // Send Message
      const handleSendMessage = (e) => {
        e.preventDefault();
        if (!chatInput.trim()) return;
        const newMsg = {
          id: "m-" + Date.now(),
          sender: "Anda",
          avatar: "A",
          isMe: true,
          text: chatInput.trim(),
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          replyTo: replyingTo ? replyingTo.text.slice(0, 35) + "..." : null
        };
        setChatMessages(prev => [...prev, newMsg]);
        setChatInput("");
        setReplyingTo(null);

        if (gasConfig.connected && gasConfig.webAppUrl) {
          fetch(gasConfig.webAppUrl, {
            method: 'POST',
            body: JSON.stringify({
              action: 'sendChatMessage',
              sender: user.name,
              userId: user.id,
              text: newMsg.text,
              replyTo: newMsg.replyTo
            })
          }).catch(e => console.log("GAS chat log:", e));
        }
      };

      // Handle Category Filter for Groups
      const filteredGroups = useMemo(() => {
        return groups.filter(g => {
          const matchCat = selectedCategory === "Semua" || g.category === selectedCategory;
          const matchSearch = g.name.toLowerCase().includes(searchQuery.toLowerCase()) || g.description.toLowerCase().includes(searchQuery.toLowerCase());
          return matchCat && matchSearch;
        });
      }, [groups, selectedCategory, searchQuery]);

      return (
        <div className="min-h-screen flex flex-col bg-pch-bg text-pch-text pb-20 md:pb-0">
          
          {/* TOAST POPUP NOTIFICATION */}
          {toast && (
            <div className={`fixed top-4 right-4 z-50 flex items-center gap-3 px-4 py-3 rounded-xl shadow-card-elevated border transition-all duration-300 ${
              toast.type === "danger" 
                ? "bg-red-950/90 border-pch-danger text-red-200" 
                : toast.type === "warning"
                ? "bg-amber-950/90 border-pch-warning text-amber-200"
                : "bg-pch-surface border-pch-gold text-pch-goldLight"
            }`}>
              <Icons.ShieldAlert className="w-5 h-5 shrink-0" />
              <span className="text-sm font-medium">{toast.msg}</span>
              <button onClick={() => setToast(null)} className="ml-2 hover:opacity-75"><Icons.X className="w-4 h-4" /></button>
            </div>
          )}

          {/* TOP GLOBAL MANDATORY DISCLAIMER BAR */}
          <div className="bg-pch-secondary/90 border-b border-pch-border/60 px-4 py-1.5 text-xs text-center text-pch-muted flex items-center justify-center gap-2">
            <span className="inline-block w-2 h-2 rounded-full bg-pch-gold animate-pulse"></span>
            <span><strong>Independent Community Platform</strong> — Not Officially Affiliated with Pi Network. Lindungi selalu keamanan akun Anda.</span>
          </div>

          {/* ============================================================== */}
          {/* 1. AUTHENTICATION PORTAL (LOGIN / REGISTER / FORGOT PASSWORD) */}
          {/* ============================================================== */}
          {!isAuthenticated ? (
            <div className="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8 relative">
              <div className="absolute top-1/4 left-1/2 -translate-x-1/2 w-96 h-96 bg-pch-purple/15 rounded-full blur-3xl pointer-events-none"></div>
              <div className="absolute bottom-10 left-1/3 w-80 h-80 bg-pch-gold/10 rounded-full blur-3xl pointer-events-none"></div>

              <div className="relative z-10 w-full max-w-md bg-pch-surface/95 backdrop-blur-md border border-pch-border/90 rounded-2xl p-6 sm:p-8 shadow-card-elevated space-y-6">
                
                {/* Brand Header */}
                <div className="flex flex-col items-center text-center space-y-2">
                  <BrandLogo config={appBranding} size="lg" />
                  <div>
                    <h2 className="text-xl sm:text-2xl font-bold tracking-wide gold-gradient-text uppercase">
                      {appBranding.title}
                    </h2>
                    <p className="text-xs text-pch-muted mt-0.5">{appBranding.tagline}</p>
                  </div>
                </div>

                {/* Mode Selector Tabs (Login vs Register) */}
                {authView !== "forgot" && (
                  <div className="grid grid-cols-2 p-1 rounded-xl bg-pch-secondary border border-pch-border">
                    <button
                      type="button"
                      onClick={() => setAuthView("login")}
                      className={`py-2 text-xs sm:text-sm font-semibold rounded-lg transition-all ${
                        authView === "login"
                          ? "bg-pch-gold text-black shadow-gold-glow"
                          : "text-pch-muted hover:text-pch-text"
                      }`}
                    >
                      Masuk (Login)
                    </button>
                    <button
                      type="button"
                      onClick={() => setAuthView("register")}
                      className={`py-2 text-xs sm:text-sm font-semibold rounded-lg transition-all ${
                        authView === "register"
                          ? "bg-pch-purple text-white shadow-purple-glow"
                          : "text-pch-muted hover:text-pch-text"
                      }`}
                    >
                      Daftar (Register)
                    </button>
                  </div>
                )}

                {/* VIEW: LOGIN FORM */}
                {authView === "login" && (
                  <form onSubmit={handleLoginSubmit} className="space-y-4">
                    <div>
                      <label className="text-xs font-semibold text-pch-muted block mb-1">
                        Email atau Username
                      </label>
                      <div className="relative">
                        <Icons.User className="w-4 h-4 text-pch-muted absolute left-3.5 top-3" />
                        <input 
                          type="text"
                          required
                          value={loginIdentifier}
                          onChange={(e) => setLoginIdentifier(e.target.value)}
                          placeholder="Masukkan Email atau Username"
                          className="w-full bg-pch-secondary border border-pch-border rounded-xl pl-10 pr-4 py-2.5 text-sm text-pch-text placeholder-pch-muted/60 focus:outline-none focus:border-pch-purple"
                        />
                      </div>
                    </div>

                    <div>
                      <div className="flex items-center justify-between mb-1">
                        <label className="text-xs font-semibold text-pch-muted">
                          Password
                        </label>
                        <button 
                          type="button"
                          onClick={() => setAuthView("forgot")}
                          className="text-xs text-pch-gold hover:underline"
                        >
                          Lupa Password?
                        </button>
                      </div>
                      <div className="relative">
                        <Icons.Lock className="w-4 h-4 text-pch-muted absolute left-3.5 top-3" />
                        <input 
                          type={showLoginPassword ? "text" : "password"}
                          required
                          value={loginPassword}
                          onChange={(e) => setLoginPassword(e.target.value)}
                          placeholder="••••••••"
                          className="w-full bg-pch-secondary border border-pch-border rounded-xl pl-10 pr-11 py-2.5 text-sm text-pch-text placeholder-pch-muted/60 focus:outline-none focus:border-pch-purple font-mono"
                        />
                        <button
                          type="button"
                          onClick={() => setShowLoginPassword(!showLoginPassword)}
                          className="absolute right-3.5 top-2.5 text-pch-muted hover:text-pch-gold transition-colors focus:outline-none"
                          title={showLoginPassword ? "Sembunyikan password" : "Lihat password"}
                        >
                          {showLoginPassword ? <Icons.EyeOff className="w-4 h-4" /> : <Icons.Eye className="w-4 h-4" />}
                        </button>
                      </div>
                    </div>

                    <button
                      type="submit"
                      className="w-full py-2.5 rounded-xl bg-pch-gold text-black font-bold text-sm hover:bg-pch-goldLight transition-all shadow-gold-glow flex items-center justify-center gap-2 mt-2"
                    >
                      <span>Masuk ke Akun</span>
                    </button>
                  </form>
                )}

                {/* VIEW: REGISTER FORM */}
                {authView === "register" && (
                  <form onSubmit={handleRegisterSubmit} className="space-y-3.5">
                    <div>
                      <label className="text-xs font-semibold text-pch-muted block mb-1">
                        Nama Lengkap
                      </label>
                      <input 
                        type="text"
                        required
                        value={regName}
                        onChange={(e) => setRegName(e.target.value)}
                        placeholder="Contoh: Budi Santoso"
                        className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-sm text-pch-text focus:outline-none focus:border-pch-purple"
                      />
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="text-xs font-semibold text-pch-muted block mb-1">
                          Username
                        </label>
                        <input 
                          type="text"
                          required
                          value={regUsername}
                          onChange={(e) => setRegUsername(e.target.value)}
                          placeholder="budisantoso_01"
                          className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-sm text-pch-text font-mono focus:outline-none focus:border-pch-purple"
                        />
                      </div>
                      <div>
                        <label className="text-xs font-semibold text-pch-muted block mb-1">
                          No HP / WhatsApp
                        </label>
                        <input 
                          type="tel"
                          required
                          value={regPhone}
                          onChange={(e) => setRegPhone(e.target.value)}
                          placeholder="081234567890"
                          className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-sm text-pch-text focus:outline-none focus:border-pch-purple"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="text-xs font-semibold text-pch-muted block mb-1">
                        Email
                      </label>
                      <input 
                        type="email"
                        required
                        value={regEmail}
                        onChange={(e) => setRegEmail(e.target.value)}
                        placeholder="budi@email.com"
                        className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-sm text-pch-text focus:outline-none focus:border-pch-purple"
                      />
                    </div>

                    <div>
                      <label className="text-xs font-semibold text-pch-muted block mb-1">
                        Password (Min. 6 Karakter)
                      </label>
                      <div className="relative">
                        <input 
                          type={showRegPassword ? "text" : "password"}
                          required
                          value={regPassword}
                          onChange={(e) => setRegPassword(e.target.value)}
                          placeholder="••••••••"
                          className="w-full bg-pch-secondary border border-pch-border rounded-xl pl-3.5 pr-11 py-2 text-sm text-pch-text font-mono focus:outline-none focus:border-pch-purple"
                        />
                        <button
                          type="button"
                          onClick={() => setShowRegPassword(!showRegPassword)}
                          className="absolute right-3.5 top-2 text-pch-muted hover:text-pch-gold transition-colors focus:outline-none"
                        >
                          {showRegPassword ? <Icons.EyeOff className="w-4 h-4" /> : <Icons.Eye className="w-4 h-4" />}
                        </button>
                      </div>
                    </div>

                    <div>
                      <label className="text-xs font-semibold text-pch-muted block mb-1">
                        Konfirmasi Password
                      </label>
                      <div className="relative">
                        <input 
                          type={showRegConfirmPassword ? "text" : "password"}
                          required
                          value={regConfirmPassword}
                          onChange={(e) => setRegConfirmPassword(e.target.value)}
                          placeholder="••••••••"
                          className="w-full bg-pch-secondary border border-pch-border rounded-xl pl-3.5 pr-11 py-2 text-sm text-pch-text font-mono focus:outline-none focus:border-pch-purple"
                        />
                        <button
                          type="button"
                          onClick={() => setShowRegConfirmPassword(!showRegConfirmPassword)}
                          className="absolute right-3.5 top-2 text-pch-muted hover:text-pch-gold transition-colors focus:outline-none"
                        >
                          {showRegConfirmPassword ? <Icons.EyeOff className="w-4 h-4" /> : <Icons.Eye className="w-4 h-4" />}
                        </button>
                      </div>
                    </div>

                    <label className="flex items-start gap-2 pt-1 cursor-pointer">
                      <input 
                        type="checkbox"
                        checked={regAgreed}
                        onChange={(e) => setRegAgreed(e.target.checked)}
                        className="mt-0.5 rounded accent-pch-gold"
                      />
                      <span className="text-[11px] text-pch-muted leading-tight">
                        Saya menyetujui Ketentuan Penggunaan, Kebijakan Privasi, dan Protokol Keamanan Independen PCH.
                      </span>
                    </label>

                    <button
                      type="submit"
                      className="w-full py-2.5 rounded-xl bg-pch-purple text-white font-bold text-sm hover:bg-pch-purpleLight transition-all shadow-purple-glow flex items-center justify-center gap-2 mt-1"
                    >
                      <span>Daftar Akun Anggota</span>
                    </button>
                  </form>
                )}

                {/* VIEW: FORGOT PASSWORD */}
                {authView === "forgot" && (
                  <div className="space-y-4">
                    <button
                      type="button"
                      onClick={() => { setAuthView("login"); setForgotSent(false); }}
                      className="text-xs text-pch-gold flex items-center gap-1 hover:underline"
                    >
                      <Icons.ArrowLeft className="w-3.5 h-3.5" />
                      <span>Kembali ke Halaman Masuk</span>
                    </button>

                    <div className="space-y-1">
                      <h3 className="text-base font-bold text-pch-text">Lupa Password Akun</h3>
                      <p className="text-xs text-pch-muted">
                        Masukkan alamat email yang terdaftar pada akun Anda. Kami akan mengirimkan instruksi untuk mengatur ulang kata sandi Anda.
                      </p>
                    </div>

                    {forgotSent ? (
                      <div className="p-4 rounded-xl bg-emerald-950/60 border border-pch-success text-xs text-pch-success space-y-2">
                        <div className="flex items-center gap-2 font-bold">
                          <Icons.Check className="w-4 h-4" />
                          <span>Tautan Berhasil Dikirim!</span>
                        </div>
                        <p className="text-[11px] text-pch-muted">
                          Silakan periksa kotak masuk atau spam email <strong>{forgotEmail}</strong> untuk melanjutkan pemulihan akun.
                        </p>
                        <button
                          type="button"
                          onClick={() => { setAuthView("login"); setForgotSent(false); }}
                          className="mt-2 w-full py-2 rounded-lg bg-pch-gold text-black font-semibold text-xs"
                        >
                          Masuk Sekarang
                        </button>
                      </div>
                    ) : (
                      <form onSubmit={handleForgotSubmit} className="space-y-3">
                        <div>
                          <label className="text-xs font-semibold text-pch-muted block mb-1">
                            Email Terdaftar
                          </label>
                          <input 
                            type="email"
                            required
                            value={forgotEmail}
                            onChange={(e) => setForgotEmail(e.target.value)}
                            placeholder="budi@email.com"
                            className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-sm text-pch-text focus:outline-none focus:border-pch-purple"
                          />
                        </div>
                        <button
                          type="submit"
                          className="w-full py-2.5 rounded-xl bg-pch-gold text-black font-bold text-sm hover:bg-pch-goldLight transition-all shadow-gold-glow"
                        >
                          Kirim Instruksi Pemulihan
                        </button>
                      </form>
                    )}
                  </div>
                )}

              </div>
            </div>
          ) : (
            /* ============================================================== */
            /* 2. AUTHENTICATED APP SHELL & NAVIGATION                        */
            /* ============================================================== */
            <div className="flex-1 flex flex-col md:flex-row">
              {/* DESKTOP SIDEBAR */}
              <aside className="hidden md:flex flex-col w-64 border-r border-pch-border bg-pch-secondary/80 p-4 space-y-6">
                <div className="flex items-center gap-3 px-2">
                  <BrandLogo config={appBranding} size="md" />
                  <div className="truncate">
                    <h1 className="font-bold text-sm gold-gradient-text uppercase truncate">{appBranding.title}</h1>
                    <p className="text-[10px] text-pch-muted truncate">{appBranding.tagline}</p>
                  </div>
                </div>

                <nav className="flex-1 space-y-1.5">
                  {[
                    { id: "dashboard", label: "Beranda", icon: Icons.Home },
                    { id: "community", label: "Komunitas", icon: Icons.Users },
                    { id: "chat", label: "Chat & Pesan", icon: Icons.MessageSquare },
                    { id: "meetings", label: "Rapat Online", icon: Icons.Video },
                    { id: "vault", label: "My Secure Vault", icon: Icons.Lock },
                    { id: "profile", label: "Profil Anggota", icon: Icons.User },
                    ...(user?.role === "admin" ? [{ id: "admin", label: "Admin Console", icon: Icons.Shield }] : []),
                    { id: "gas-studio", label: "GAS Code.gs Studio", icon: Icons.Cloud }
                  ].map(item => {
                    const Icon = item.icon;
                    const isActive = activeTab === item.id;
                    return (
                      <button
                        key={item.id}
                        onClick={() => { setActiveTab(item.id); setActiveJitsiRoom(null); }}
                        className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                          isActive 
                            ? "bg-pch-gold text-black shadow-gold-glow" 
                            : "text-pch-muted hover:text-pch-text hover:bg-pch-surface"
                        }`}
                      >
                        <Icon className="w-4 h-4 shrink-0" />
                        <span>{item.label}</span>
                      </button>
                    );
                  })}
                </nav>

                <div className="p-3 rounded-xl bg-pch-surface border border-pch-border space-y-2">
                  <div className="flex items-center gap-2.5">
                    <UserAvatar user={user} branding={appBranding} size="md" />
                    <div className="truncate text-left flex-1">
                      <p className="text-xs font-bold text-pch-text truncate">{user.name}</p>
                      <p className="text-[10px] text-pch-muted truncate">@{user.username}</p>
                    </div>
                  </div>
                  <button
                    onClick={handleLogoutSession}
                    className="w-full py-1.5 rounded-lg bg-pch-secondary border border-pch-border text-[11px] text-pch-danger hover:bg-red-950/40 flex items-center justify-center gap-1.5"
                  >
                    <Icons.LogOut className="w-3.5 h-3.5" />
                    <span>Keluar Sesi</span>
                  </button>
                </div>
              </aside>

              {/* MAIN CONTENT AREA */}
              <div className="flex-1 flex flex-col min-w-0">
                {/* TOP HEADER */}
                <header className="h-14 border-b border-pch-border bg-pch-surface/70 backdrop-blur-md px-4 sm:px-6 flex items-center justify-between gap-4">
                  <div className="flex items-center gap-3 md:hidden">
                    <BrandLogo config={appBranding} size="sm" />
                    <span className="font-bold text-xs gold-gradient-text uppercase truncate max-w-[140px]">{appBranding.title}</span>
                  </div>

                  <div className="hidden md:flex items-center gap-2 text-xs text-pch-muted">
                    <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                    <span>GAS Backend: {gasConfig.connected ? "Terkoneksi" : "Siap Terhubung"}</span>
                  </div>

                  <div className="flex items-center gap-3">
                    <button
                      onClick={() => setShowGasModal(true)}
                      className="px-2.5 py-1.5 rounded-lg bg-pch-secondary border border-pch-border text-[11px] text-pch-goldLight hover:border-pch-gold flex items-center gap-1.5"
                    >
                      <Icons.Cloud className="w-3.5 h-3.5" />
                      <span className="hidden sm:inline">Status GAS</span>
                    </button>
                    <UserAvatar user={user} branding={appBranding} size="sm" />
                    <button 
                      onClick={handleLogoutSession}
                      className="p-1.5 rounded-lg bg-pch-secondary border border-pch-border text-pch-muted hover:text-pch-danger md:hidden"
                      title="Keluar"
                    >
                      <Icons.LogOut className="w-4 h-4" />
                    </button>
                  </div>
                </header>

                {/* TAB CONTENTS */}
                <main className="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto">
                  
                  {/* TAB 1: DASHBOARD */}
                  {activeTab === "dashboard" && (
                    <div className="space-y-6">
                      <div className="p-6 rounded-2xl bg-gradient-to-r from-pch-surface via-pch-secondary to-pch-surface border border-pch-border flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div className="flex items-center gap-4">
                          <UserAvatar user={user} branding={appBranding} size="lg" />
                          <div>
                            <span className="text-[11px] font-bold text-pch-gold uppercase tracking-wider">Dashboard Komunitas</span>
                            <h2 className="text-xl sm:text-2xl font-bold text-pch-text mt-1">Selamat datang, {user.name}!</h2>
                            <p className="text-xs text-pch-muted mt-1">Platform Komunitas Independen — Terhubung, Berkolaborasi, dan Bertumbuh Bersama.</p>
                          </div>
                        </div>
                        <button 
                          onClick={() => setActiveTab("vault")}
                          className="px-4 py-2.5 rounded-xl bg-pch-gold text-black font-bold text-xs sm:text-sm hover:bg-pch-goldLight transition-all shadow-gold-glow flex items-center gap-2 self-start sm:self-auto"
                        >
                          <Icons.Lock className="w-4 h-4" />
                          <span>Buka My Secure Vault</span>
                        </button>
                      </div>

                      {/* Stats Grid */}
                      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                        <div className="p-4 rounded-xl bg-pch-surface border border-pch-border">
                          <span className="text-xs text-pch-muted block">Anggota Terdaftar</span>
                          <span className="text-xl font-bold text-pch-goldLight font-mono">{registeredUsers.length}</span>
                        </div>
                        <div className="p-4 rounded-xl bg-pch-surface border border-pch-border">
                          <span className="text-xs text-pch-muted block">Grup Aktif</span>
                          <span className="text-xl font-bold text-pch-purpleLight font-mono">{groups.length}</span>
                        </div>
                        <div className="p-4 rounded-xl bg-pch-surface border border-pch-border">
                          <span className="text-xs text-pch-muted block">Dokumen Brankas Saya</span>
                          <span className="text-xl font-bold text-pch-gold font-mono">{memberDossier.extraDocs.length} Tambahan</span>
                        </div>
                        <div className="p-4 rounded-xl bg-pch-surface border border-pch-border">
                          <span className="text-xs text-pch-muted block">Server Rapat</span>
                          <span className="text-xs font-bold text-pch-success">Jitsi Dedicated Aktif</span>
                        </div>
                      </div>

                      {/* Quick Actions */}
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <button 
                          onClick={() => setActiveTab("chat")}
                          className="p-4 rounded-xl bg-pch-secondary border border-pch-border hover:border-pch-purple text-left transition-all group"
                        >
                          <Icons.MessageSquare className="w-6 h-6 text-pch-purple group-hover:scale-110 transition-transform mb-2" />
                          <h4 className="font-bold text-sm text-pch-text">Forum & Diskusi Pesan</h4>
                          <p className="text-xs text-pch-muted mt-1">Buka ruang obrolan anggota dan koordinasi komunitas.</p>
                        </button>

                        <button 
                          onClick={() => setActiveTab("meetings")}
                          className="p-4 rounded-xl bg-pch-secondary border border-pch-border hover:border-pch-gold text-left transition-all group"
                        >
                          <Icons.Video className="w-6 h-6 text-pch-gold group-hover:scale-110 transition-transform mb-2" />
                          <h4 className="font-bold text-sm text-pch-text">Rapat Online Dedicated</h4>
                          <p className="text-xs text-pch-muted mt-1">Ruang video conference aman, terpisah dari backend GAS.</p>
                        </button>

                        <button 
                          onClick={() => setActiveTab("community")}
                          className="p-4 rounded-xl bg-pch-secondary border border-pch-border hover:border-pch-purple text-left transition-all group"
                        >
                          <Icons.Users className="w-6 h-6 text-pch-purpleLight group-hover:scale-110 transition-transform mb-2" />
                          <h4 className="font-bold text-sm text-pch-text">Jelajahi Grup Komunitas</h4>
                          <p className="text-xs text-pch-muted mt-1">Temukan sub-komunitas edukasi, UMKM, dan node validator.</p>
                        </button>
                      </div>
                    </div>
                  )}

                  {/* TAB 2: COMMUNITY */}
                  {activeTab === "community" && (
                    <div className="space-y-6">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                          <h2 className="text-xl font-bold text-pch-text">Direktori Grup & Komunitas</h2>
                          <p className="text-xs text-pch-muted">Temukan ruang koordinasi dan diskusi perintis nusantara.</p>
                        </div>
                        <div className="relative w-full sm:w-64">
                          <Icons.Search className="w-4 h-4 text-pch-muted absolute left-3 top-3" />
                          <input 
                            type="text" 
                            placeholder="Cari grup..."
                            value={searchQuery}
                            onChange={(e) => setSearchQuery(e.target.value)}
                            className="w-full bg-pch-secondary border border-pch-border rounded-xl pl-9 pr-4 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                          />
                        </div>
                      </div>

                      <div className="flex flex-wrap gap-2">
                        {["Semua", "Edukasi", "Bisnis dan Kolaborasi", "Diskusi Ekosistem", "Wilayah"].map(cat => (
                          <button
                            key={cat}
                            onClick={() => setSelectedCategory(cat)}
                            className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${
                              selectedCategory === cat 
                                ? "bg-pch-purple text-white shadow-purple-glow" 
                                : "bg-pch-secondary border border-pch-border text-pch-muted hover:text-pch-text"
                            }`}
                          >
                            {cat}
                          </button>
                        ))}
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {filteredGroups.map(grp => (
                          <div key={grp.id} className="p-5 rounded-2xl bg-pch-surface border border-pch-border space-y-3">
                            <div className="flex items-start justify-between gap-2">
                              <div>
                                <span className="text-[10px] px-2 py-0.5 rounded bg-pch-secondary border border-pch-border text-pch-goldLight font-mono">
                                  {grp.category}
                                </span>
                                <h3 className="font-bold text-base text-pch-text mt-1">{grp.name}</h3>
                              </div>
                              {grp.isOfficial && (
                                <span className="text-[10px] px-2 py-0.5 rounded bg-amber-950/80 text-pch-gold border border-pch-gold/40">
                                  Resmi Komunitas
                                </span>
                              )}
                            </div>
                            <p className="text-xs text-pch-muted leading-relaxed">{grp.description}</p>
                            <div className="pt-2 border-t border-pch-border flex items-center justify-between">
                              <span className="text-xs text-pch-muted font-mono">{grp.memberCount} Anggota</span>
                              <button
                                onClick={() => {
                                  setGroups(prev => prev.map(g => g.id === grp.id ? { ...g, joined: !g.joined } : g));
                                  triggerToast(grp.joined ? `Keluar dari ${grp.name}` : `Bergabung ke ${grp.name}!`);
                                }}
                                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                                  grp.joined 
                                    ? "bg-pch-secondary border border-pch-border text-pch-muted hover:text-pch-danger"
                                    : "bg-pch-gold text-black hover:bg-pch-goldLight shadow-gold-glow"
                                }`}
                              >
                                {grp.joined ? "Sudah Bergabung" : "Gabung Grup"}
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* TAB 3: CHAT */}
                  {activeTab === "chat" && (
                    <div className="p-4 sm:p-6 rounded-2xl bg-pch-surface border border-pch-border h-[650px] flex flex-col justify-between">
                      <div className="pb-3 border-b border-pch-border flex items-center justify-between">
                        <div className="flex items-center gap-3">
                          <div className="w-10 h-10 rounded-xl bg-pch-purple/20 border border-pch-purple text-pch-purpleLight flex items-center justify-center font-bold">
                            <Icons.MessageSquare className="w-5 h-5" />
                          </div>
                          <div>
                            <h3 className="font-bold text-sm text-pch-text">Forum Edukasi & Node Nusantara</h3>
                            <p className="text-[10px] text-pch-muted">Komunikasi publik komunitas independen (Tersinkron ke Sheets DB)</p>
                          </div>
                        </div>
                      </div>

                      {/* Chat messages */}
                      <div className="flex-1 overflow-y-auto py-4 space-y-3.5 pr-2">
                        {chatMessages.length === 0 ? (
                          <div className="flex flex-col items-center justify-center h-full text-center p-6 space-y-2">
                            <Icons.MessageSquare className="w-8 h-8 text-pch-muted/40" />
                            <p className="text-xs text-pch-muted">Belum ada pesan. Mulai obrolan pertama dalam forum komunitas!</p>
                          </div>
                        ) : (
                          chatMessages.map(msg => (
                            <div key={msg.id} className={`flex flex-col ${msg.isMe ? "items-end" : "items-start"}`}>
                              {msg.replyTo && (
                                <span className="text-[10px] text-pch-muted italic mb-1 bg-pch-secondary/80 px-2 py-0.5 rounded border border-pch-border/60">
                                  Membalas: "{msg.replyTo}"
                                </span>
                              )}
                              <div className={`max-w-[85%] sm:max-w-md p-3 rounded-2xl text-xs space-y-1 ${
                                msg.isMe 
                                  ? "bg-pch-purple text-white rounded-br-sm" 
                                  : "bg-pch-secondary border border-pch-border text-pch-text rounded-bl-sm"
                              }`}>
                                {!msg.isMe && <span className="font-bold text-pch-goldLight block text-[11px]">{msg.sender}</span>}
                                <p className="leading-relaxed">{msg.text}</p>
                                <div className="flex items-center justify-end gap-2 text-[10px] opacity-70 pt-0.5">
                                  <span>{msg.time}</span>
                                  {!msg.isMe && (
                                    <button onClick={() => setReplyingTo(msg)} className="hover:underline">
                                      Balas
                                    </button>
                                  )}
                                </div>
                              </div>
                            </div>
                          ))
                        )}
                      </div>

                      {/* Input Box */}
                      <form onSubmit={handleSendMessage} className="pt-3 border-t border-pch-border space-y-2">
                        {replyingTo && (
                          <div className="flex items-center justify-between bg-pch-secondary px-3 py-1 rounded-lg text-[11px] text-pch-goldLight">
                            <span>Membalas @{replyingTo.sender}: "{replyingTo.text.slice(0, 30)}..."</span>
                            <button type="button" onClick={() => setReplyingTo(null)} className="text-pch-muted hover:text-pch-text">
                              <Icons.X className="w-3.5 h-3.5" />
                            </button>
                          </div>
                        )}
                        <div className="flex items-center gap-2">
                          <input 
                            type="text" 
                            placeholder="Ketik pesan untuk forum komunitas..."
                            value={chatInput}
                            onChange={(e) => setChatInput(e.target.value)}
                            className="flex-1 bg-pch-secondary border border-pch-border rounded-xl px-4 py-2.5 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                          />
                          <button 
                            type="submit"
                            className="p-2.5 rounded-xl bg-pch-gold text-black hover:bg-pch-goldLight transition-all shadow-gold-glow shrink-0"
                          >
                            <Icons.Send className="w-4 h-4" />
                          </button>
                        </div>
                      </form>
                    </div>
                  )}

                  {/* TAB 4: MEETINGS (ISOLATED JITSI WEBRTC ENGINE) */}
                  {activeTab === "meetings" && (
                    <div className="space-y-6">
                      <div className="p-5 rounded-2xl bg-pch-surface border border-pch-border flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                          <div className="flex items-center gap-2">
                            <span className="w-2.5 h-2.5 rounded-full bg-pch-success animate-ping"></span>
                            <h2 className="text-lg font-bold text-pch-text">Layanan Rapat Khusus (WebRTC Isolated)</h2>
                          </div>
                          <p className="text-xs text-pch-muted mt-1">
                            Audio, video, mikrofon, dan kamera langsung ditangani oleh server rapat independen ({appBranding.meetingProvider}), <strong>terisolasi total dari GAS backend</strong>.
                          </p>
                        </div>
                      </div>

                      {/* Active Jitsi Room Embed View */}
                      {activeJitsiRoom ? (
                        <div className="space-y-3">
                          <div className="flex items-center justify-between p-3 rounded-xl bg-pch-surface border border-pch-gold/40">
                            <span className="text-xs font-bold text-pch-goldLight">Sesi Rapat Aktif: {activeJitsiRoom}</span>
                            <div className="flex items-center gap-2">
                              <a 
                                href={`https://${appBranding.meetingProvider}/${activeJitsiRoom}`}
                                target="_blank"
                                rel="noreferrer"
                                className="px-3 py-1.5 rounded-lg bg-pch-secondary border border-pch-border text-pch-text text-xs hover:border-pch-gold flex items-center gap-1"
                              >
                                <Icons.ExternalLink className="w-3.5 h-3.5" />
                                <span>Buka di Tab Baru</span>
                              </a>
                              <button 
                                onClick={() => setActiveJitsiRoom(null)}
                                className="px-3 py-1.5 rounded-lg bg-red-950/80 border border-pch-danger text-red-200 text-xs font-semibold"
                              >
                                Tinggalkan Rapat
                              </button>
                            </div>
                          </div>

                          <div className="w-full h-[520px] rounded-2xl overflow-hidden border border-pch-border bg-black">
                            <iframe 
                              src={`https://${appBranding.meetingProvider}/${activeJitsiRoom}#config.prejoinPageEnabled=false`}
                              title="Jitsi Video Conference"
                              allow="camera; microphone; fullscreen; display-capture; autoplay"
                              className="w-full h-full border-0"
                            ></iframe>
                          </div>
                        </div>
                      ) : (
                        meetings.length === 0 ? (
                          <div className="p-8 rounded-2xl bg-pch-surface border border-pch-border text-center space-y-3">
                            <Icons.Video className="w-10 h-10 text-pch-muted/40 mx-auto" />
                            <h3 className="font-bold text-base text-pch-text">Belum Ada Sesi Rapat Terjadwal</h3>
                            <p className="text-xs text-pch-muted max-w-sm mx-auto">Sesi rapat online komunitas akan tampil di sini saat dijadwalkan oleh koordinator atau moderator.</p>
                          </div>
                        ) : (
                          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {meetings.map(meet => (
                              <div key={meet.id} className="p-5 rounded-2xl bg-pch-surface border border-pch-border space-y-4">
                                <div className="flex items-start justify-between">
                                  <span className={`text-[10px] px-2 py-0.5 rounded font-bold uppercase ${
                                    meet.status === "Berlangsung" 
                                      ? "bg-emerald-950 text-pch-success border border-pch-success/40"
                                      : "bg-pch-secondary text-pch-muted border border-pch-border"
                                  }`}>
                                    {meet.status}
                                  </span>
                                  <span className="text-xs text-pch-muted font-mono">{meet.date}</span>
                                </div>

                                <div>
                                  <h3 className="font-bold text-sm sm:text-base text-pch-text">{meet.title}</h3>
                                  <p className="text-xs text-pch-muted mt-1">Host: {meet.host} • Durasi: {meet.duration}</p>
                                </div>

                                <button 
                                  onClick={() => setActiveJitsiRoom(meet.room)}
                                  className="w-full py-2.5 rounded-xl bg-pch-gold text-black font-bold text-xs hover:bg-pch-goldLight transition-all shadow-gold-glow flex items-center justify-center gap-2"
                                >
                                  <Icons.Video className="w-4 h-4" />
                                  <span>Gabung Rapat Langsung</span>
                                </button>
                              </div>
                            ))}
                          </div>
                        )
                      )}
                    </div>
                  )}

                  {/* TAB 5: MY SECURE VAULT (MENU-LEVEL REDEEM CODE GATEWAY) */}
                  {activeTab === "vault" && (
                    <div className="space-y-6">
                      {!vaultUnlocked && user?.role !== "admin" ? (
                        <div className="max-w-xl mx-auto p-6 sm:p-8 rounded-2xl bg-pch-surface border border-pch-gold/40 shadow-card-elevated space-y-6 text-center">
                          <div className="w-16 h-16 rounded-2xl bg-pch-gold/15 border border-pch-gold/40 text-pch-gold mx-auto flex items-center justify-center shadow-gold-glow">
                            <Icons.Key className="w-8 h-8" />
                          </div>

                          <div className="space-y-2">
                            <span className="text-[11px] font-bold px-3 py-1 rounded-full bg-amber-950/80 text-pch-goldLight border border-pch-gold/40 uppercase tracking-wider">
                              Akses Privat Terproteksi (Gas Token)
                            </span>
                            <h2 className="text-xl sm:text-2xl font-bold text-pch-text">
                              Buka Akses My Secure Vault
                            </h2>
                            <p className="text-xs sm:text-sm text-pch-muted max-w-md mx-auto leading-relaxed">
                              Menu ini memuat seluruh berkas identitas dan dokumen berharga Anda. Masukkan <strong>Redeem Code / Token Akses Privat</strong> yang diberikan oleh Admin untuk membuka akses seluruh dokumen Anda sekaligus.
                            </p>
                          </div>

                          <form onSubmit={handleUnlockVault} className="space-y-4 max-w-md mx-auto">
                            <div className="relative">
                              <Icons.Key className="w-4 h-4 text-pch-gold absolute left-3.5 top-3" />
                              <input 
                                type="text" 
                                required
                                placeholder="Contoh: VAULT-PCH-2026 atau kode dari Admin"
                                value={vaultRedeemInput}
                                onChange={(e) => setVaultRedeemInput(e.target.value)}
                                className="w-full bg-pch-secondary border border-pch-border rounded-xl pl-10 pr-4 py-2.5 text-sm text-pch-text font-mono uppercase placeholder:normal-case placeholder:text-pch-muted focus:outline-none focus:border-pch-gold"
                              />
                            </div>

                            <button 
                              type="submit"
                              className="w-full py-2.5 rounded-xl bg-pch-gold text-black font-bold text-sm hover:bg-pch-goldLight transition-all shadow-gold-glow flex items-center justify-center gap-2"
                            >
                              <Icons.Lock className="w-4 h-4" />
                              <span>Verifikasi & Masuk ke Brankas</span>
                            </button>
                          </form>

                          <div className="pt-4 border-t border-pch-border/70 space-y-3">
                            <p className="text-xs text-pch-muted">
                              Belum memiliki Redeem Code atau lupa kode akses Anda?
                            </p>
                            <button 
                              type="button"
                              onClick={handleRequestCodeViaWhatsapp}
                              className="px-4 py-2 rounded-xl bg-emerald-950/70 border border-pch-success text-pch-success text-xs font-semibold hover:bg-emerald-900/50 flex items-center justify-center gap-2 mx-auto"
                            >
                              <Icons.Phone className="w-3.5 h-3.5" />
                              <span>Minta Kode Akses ke Admin via WhatsApp</span>
                            </button>
                          </div>
                        </div>
                      ) : (
                        /* UNLOCKED MASTER DOSSIER & DOCUMENT VAULT */
                        <div className="space-y-6">
                          <div className="p-4 rounded-2xl bg-gradient-to-r from-emerald-950/40 via-pch-surface to-pch-surface border border-pch-success/40 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                              <div className="w-10 h-10 rounded-xl bg-emerald-950 border border-pch-success text-pch-success flex items-center justify-center shrink-0">
                                <Icons.Check className="w-5 h-5" />
                              </div>
                              <div>
                                <div className="flex items-center gap-2">
                                  <h3 className="font-bold text-sm sm:text-base text-pch-text">My Secure Vault — Sesi Akses Aktif</h3>
                                  <span className="text-[10px] px-2 py-0.5 rounded bg-emerald-950 text-pch-success border border-pch-success/30 font-mono font-bold">Terbuka Penuh</span>
                                </div>
                                <p className="text-xs text-pch-muted">
                                  Sinkronisasi Google Drive Admin: <strong>{memberDossier.lastSynced}</strong>
                                </p>
                              </div>
                            </div>

                            <div className="flex items-center gap-2">
                              <button 
                                onClick={handleSaveAndSendDossierToAdmin}
                                className="px-3.5 py-2 rounded-xl bg-pch-gold text-black text-xs font-bold hover:bg-pch-goldLight flex items-center gap-1.5 shadow-gold-glow"
                              >
                                <Icons.Upload className="w-3.5 h-3.5" />
                                <span>Kirim/Sinkronkan ke Drive Admin</span>
                              </button>

                              {user?.role !== "admin" && (
                                <button 
                                  onClick={() => { setVaultUnlocked(false); triggerToast("Sesi brankas telah dikunci kembali.", "warning"); }}
                                  className="px-3 py-2 rounded-xl bg-pch-secondary border border-pch-border text-pch-muted hover:text-pch-danger text-xs font-semibold"
                                >
                                  Kunci Kembali
                                </button>
                              )}
                            </div>
                          </div>

                          {/* SECTION 1: MASTER IDENTITAS DIRI & KONTAK */}
                          <div className="p-5 sm:p-6 rounded-2xl bg-pch-surface border border-pch-border space-y-4">
                            <div className="flex items-center justify-between pb-3 border-b border-pch-border">
                              <h4 className="font-bold text-sm text-pch-goldLight flex items-center gap-2">
                                <Icons.User className="w-4 h-4 text-pch-gold" />
                                <span>1. Data Identitas Lengkap & Kontak</span>
                              </h4>
                              <span className="text-[10px] text-pch-muted font-mono">Tersimpan di Vault Google Drive</span>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                              <div>
                                <label className="text-xs font-semibold text-pch-muted block mb-1">Nama Lengkap</label>
                                <input 
                                  type="text" 
                                  value={memberDossier.namaLengkap}
                                  onChange={(e) => setMemberDossier({ ...memberDossier, namaLengkap: e.target.value })}
                                  className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                                />
                              </div>

                              <div>
                                <label className="text-xs font-semibold text-pch-muted block mb-1">Email</label>
                                <input 
                                  type="email" 
                                  value={memberDossier.email}
                                  onChange={(e) => setMemberDossier({ ...memberDossier, email: e.target.value })}
                                  className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                                />
                              </div>

                              <div>
                                <label className="text-xs font-semibold text-pch-muted block mb-1">No HP / WhatsApp</label>
                                <input 
                                  type="tel" 
                                  value={memberDossier.noHp}
                                  onChange={(e) => setMemberDossier({ ...memberDossier, noHp: e.target.value })}
                                  className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                                />
                              </div>

                              <div>
                                <label className="text-xs font-semibold text-pch-muted block mb-1">Username Pi Network</label>
                                <input 
                                  type="text" 
                                  value={memberDossier.usernamePi}
                                  onChange={(e) => setMemberDossier({ ...memberDossier, usernamePi: e.target.value })}
                                  placeholder="@username_pi"
                                  className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text font-mono focus:outline-none focus:border-pch-purple"
                                />
                              </div>

                              <div>
                                <label className="text-xs font-semibold text-pch-muted block mb-1">Tempat & Tanggal Lahir</label>
                                <input 
                                  type="text" 
                                  value={memberDossier.ttl}
                                  onChange={(e) => setMemberDossier({ ...memberDossier, ttl: e.target.value })}
                                  placeholder="Kota, DD Bulan YYYY"
                                  className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                                />
                              </div>

                              <div>
                                <label className="text-xs font-semibold text-pch-muted block mb-1">NIK (Nomor Induk Kependudukan)</label>
                                <input 
                                  type="text" 
                                  value={memberDossier.nik}
                                  onChange={(e) => setMemberDossier({ ...memberDossier, nik: e.target.value })}
                                  placeholder="16 Digit NIK"
                                  className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text font-mono focus:outline-none focus:border-pch-purple"
                                />
                              </div>

                              <div className="sm:col-span-2 lg:col-span-3">
                                <label className="text-xs font-semibold text-pch-muted block mb-1">Alamat Lengkap</label>
                                <textarea 
                                  rows="2"
                                  value={memberDossier.alamatLengkap}
                                  onChange={(e) => setMemberDossier({ ...memberDossier, alamatLengkap: e.target.value })}
                                  placeholder="Alamat domisili lengkap sesuai KTP"
                                  className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                                ></textarea>
                              </div>
                            </div>
                          </div>

                          {/* SECTION 2: REKENING BANK & WALLET PUBLIK */}
                          <div className="p-5 sm:p-6 rounded-2xl bg-pch-surface border border-pch-border space-y-4">
                            <div className="flex items-center justify-between pb-3 border-b border-pch-border">
                              <h4 className="font-bold text-sm text-pch-goldLight flex items-center gap-2">
                                <Icons.Database className="w-4 h-4 text-pch-gold" />
                                <span>2. Informasi Finansial & Wallet Publik</span>
                              </h4>
                              <span className="text-[10px] text-pch-warning font-semibold">Hanya Alamat Publik (Bukan Passphrase)</span>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                              <div>
                                <label className="text-xs font-semibold text-pch-muted block mb-1">Nama Pemilik Rekening Bank</label>
                                <input 
                                  type="text" 
                                  value={memberDossier.namaRekening}
                                  onChange={(e) => setMemberDossier({ ...memberDossier, namaRekening: e.target.value })}
                                  className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                                />
                              </div>

                              <div>
                                <label className="text-xs font-semibold text-pch-muted block mb-1">Nama Bank & Nomor Rekening</label>
                                <input 
                                  type="text" 
                                  value={memberDossier.noRekening}
                                  onChange={(e) => setMemberDossier({ ...memberDossier, noRekening: e.target.value })}
                                  placeholder="Contoh: BCA - 1234567890"
                                  className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text font-mono focus:outline-none focus:border-pch-purple"
                                />
                              </div>

                              <div>
                                <label className="text-xs font-semibold text-pch-muted block mb-1">Alamat Wallet Publik Pi Network</label>
                                <input 
                                  type="text" 
                                  value={memberDossier.walletPi}
                                  onChange={(e) => setMemberDossier({ ...memberDossier, walletPi: e.target.value })}
                                  placeholder="Public Address (G...)"
                                  className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text font-mono focus:outline-none focus:border-pch-purple"
                                />
                              </div>

                              <div>
                                <label className="text-xs font-semibold text-pch-muted block mb-1">Alamat Wallet Publik OKX</label>
                                <input 
                                  type="text" 
                                  value={memberDossier.walletOkx}
                                  onChange={(e) => setMemberDossier({ ...memberDossier, walletOkx: e.target.value })}
                                  placeholder="Public Address OKX (0x...)"
                                  className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text font-mono focus:outline-none focus:border-pch-purple"
                                />
                              </div>
                            </div>
                          </div>

                          {/* SECTION 3: BERKAS DOKUMEN UTAMA */}
                          <div className="p-5 sm:p-6 rounded-2xl bg-pch-surface border border-pch-border space-y-4">
                            <div className="flex items-center justify-between pb-3 border-b border-pch-border">
                              <h4 className="font-bold text-sm text-pch-goldLight flex items-center gap-2">
                                <Icons.FileText className="w-4 h-4 text-pch-gold" />
                                <span>3. Berkas Dokumen Wajib Terunggah</span>
                              </h4>
                              <span className="text-[10px] text-pch-success font-semibold">Tersimpan di Google Drive Vault</span>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                              {[
                                { key: 'fotoKtp', label: 'Foto KTP Elektronik', data: memberDossier.fotoKtp },
                                { key: 'fotoKk', label: 'Foto Kartu Keluarga (KK)', data: memberDossier.fotoKk },
                                { key: 'fotoNpwp', label: 'Foto NPWP', data: memberDossier.fotoNpwp },
                                { key: 'pasfoto', label: 'Pasfoto Formal (4x6)', data: memberDossier.pasfoto },
                                { key: 'kartuKeanggotaan', label: 'Kartu Keanggotaan Komunitas', data: memberDossier.kartuKeanggotaan }
                              ].map(item => (
                                <div key={item.key} className="p-3.5 rounded-xl bg-pch-secondary border border-pch-border flex flex-col justify-between space-y-3">
                                  <div>
                                    <span className="text-[11px] font-bold text-pch-text block">{item.label}</span>
                                    <div className="mt-2 flex items-center gap-2">
                                      <Icons.FileText className="w-4 h-4 text-pch-gold shrink-0" />
                                      <span className="text-xs font-mono text-pch-goldLight truncate">{item.data?.name || "Belum ada berkas"}</span>
                                    </div>
                                    <span className="text-[10px] text-pch-muted mt-1 block">Ukuran: {item.data?.size || "-"} • Status: {item.data?.status || "Siap"}</span>
                                  </div>

                                  <div className="pt-2 border-t border-pch-border/70 flex items-center justify-between gap-2">
                                    <label className="text-[11px] px-2.5 py-1 rounded-lg bg-pch-purple/20 border border-pch-purple text-pch-purpleLight hover:bg-pch-purple/30 cursor-pointer text-center font-medium">
                                      <span>Ganti File</span>
                                      <input 
                                        type="file" 
                                        accept=".pdf,image/*" 
                                        className="hidden"
                                        onChange={(e) => {
                                          const file = e.target.files[0];
                                          if (file) {
                                            setMemberDossier(prev => ({
                                              ...prev,
                                              [item.key]: {
                                                name: file.name,
                                                size: (file.size / (1024 * 1024)).toFixed(2) + " MB",
                                                status: "Baru Dimuat"
                                              }
                                            }));
                                            triggerToast(`File ${item.label} diperbarui!`);
                                          }
                                        }}
                                      />
                                    </label>
                                    <button 
                                      onClick={() => triggerToast(`Mengunduh ${item.data?.name || item.label} dari Google Drive Vault...`)}
                                      className="text-[11px] px-2.5 py-1 rounded-lg bg-pch-surface border border-pch-border text-pch-muted hover:text-pch-text"
                                    >
                                      Unduh
                                    </button>
                                  </div>
                                </div>
                              ))}
                            </div>
                          </div>

                          {/* SECTION 4: FITUR TAMBAH DOKUMEN LAINNYA */}
                          <div className="p-5 sm:p-6 rounded-2xl bg-pch-surface border border-pch-border space-y-4">
                            <div className="flex items-center justify-between pb-3 border-b border-pch-border">
                              <h4 className="font-bold text-sm text-pch-goldLight flex items-center gap-2">
                                <Icons.Plus className="w-4 h-4 text-pch-gold" />
                                <span>4. Dokumen Tambahan Lainnya</span>
                              </h4>
