                              <span className="text-[10px] text-pch-muted">Sertifikat, Surat Keterangan, dsb.</span>
                            </div>

                            {memberDossier.extraDocs.length > 0 ? (
                              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                {memberDossier.extraDocs.map(doc => (
                                  <div key={doc.id} className="p-3 rounded-xl bg-pch-secondary border border-pch-border flex items-center justify-between">
                                    <div className="space-y-0.5 truncate pr-2">
                                      <h5 className="text-xs font-bold text-pch-text truncate">{doc.title}</h5>
                                      <p className="text-[10px] text-pch-muted font-mono">{doc.fileName} • {doc.size}</p>
                                    </div>
                                    <div className="flex items-center gap-1.5 shrink-0">
                                      <button 
                                        onClick={() => triggerToast(`Mengunduh dokumen tambahan: ${doc.title}...`)}
                                        className="p-1.5 rounded-lg bg-pch-surface border border-pch-border text-pch-gold hover:text-pch-goldLight"
                                        title="Unduh"
                                      >
                                        <Icons.Download className="w-3.5 h-3.5" />
                                      </button>
                                      <button 
                                        onClick={() => {
                                          setMemberDossier(prev => ({
                                            ...prev,
                                            extraDocs: prev.extraDocs.filter(d => d.id !== doc.id)
                                          }));
                                          triggerToast(`Dokumen "${doc.title}" dihapus.`);
                                        }}
                                        className="p-1.5 rounded-lg bg-pch-surface border border-pch-border text-pch-danger hover:bg-red-950/40"
                                        title="Hapus"
                                      >
                                        <Icons.Trash className="w-3.5 h-3.5" />
                                      </button>
                                    </div>
                                  </div>
                                ))}
                              </div>
                            ) : (
                              <p className="text-xs text-pch-muted italic">Belum ada dokumen tambahan yang diunggah.</p>
                            )}

                            <form onSubmit={handleAddExtraDocument} className="pt-3 border-t border-pch-border/70 flex flex-col sm:flex-row items-center gap-2.5">
                              <input 
                                type="text" 
                                placeholder="Judul Dokumen (Misal: Ijazah / SK Komunitas)"
                                value={newExtraDocTitle}
                                onChange={(e) => setNewExtraDocTitle(e.target.value)}
                                className="flex-1 bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                              />
                              <input 
                                type="file" 
                                accept=".pdf,image/*"
                                onChange={(e) => setNewExtraDocFile(e.target.files[0])}
                                className="w-full sm:w-auto text-xs text-pch-muted file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-pch-secondary file:text-pch-text file:border file:border-pch-border"
                              />
                              <button 
                                type="submit"
                                className="w-full sm:w-auto px-4 py-2 rounded-xl bg-pch-purple text-white text-xs font-semibold hover:bg-pch-purpleLight shrink-0 shadow-purple-glow"
                              >
                                Tambah Dokumen
                              </button>
                            </form>
                          </div>

                          <div className="p-5 rounded-2xl bg-pch-secondary border border-pch-gold/40 flex flex-col sm:flex-row items-center justify-between gap-4">
                            <div className="space-y-1 text-center sm:text-left">
                              <h4 className="text-sm font-bold text-pch-text">Simpan & Kirim Semua Dokumen ke Admin Drive</h4>
                              <p className="text-xs text-pch-muted">
                                Data disimpan rapi di Google Drive Vault Admin. Anda dapat meminta berkas kembali via WhatsApp atau memasukkan Redeem Code kapan pun dibutuhkan.
                              </p>
                            </div>
                            <button 
                              onClick={handleSaveAndSendDossierToAdmin}
                              className="w-full sm:w-auto px-6 py-2.5 rounded-xl bg-pch-gold text-black font-bold text-sm hover:bg-pch-goldLight transition-all shadow-gold-glow flex items-center justify-center gap-2 shrink-0"
                            >
                              <Icons.Upload className="w-4 h-4" />
                              <span>Simpan & Kirim ke Drive Admin</span>
                            </button>
                          </div>
                        </div>
                      )}
                    </div>
                  )}

                  {/* TAB 6: PROFILE */}
                  {activeTab === "profile" && (
                    <div className="max-w-2xl mx-auto space-y-6">
                      <div className="p-6 rounded-2xl bg-pch-surface border border-pch-border space-y-6">
                        <div className="flex flex-col sm:flex-row items-center gap-5">
                          <div className="relative group">
                            <UserAvatar user={user} branding={appBranding} size="lg" />
                            <label className="absolute inset-0 bg-black/60 rounded-full flex flex-col items-center justify-center text-white opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer">
                              <Icons.Upload className="w-5 h-5 mb-1 text-pch-gold" />
                              <span className="text-[10px] font-semibold">Ganti Foto</span>
                              <input 
                                type="file" 
                                accept="image/*"
                                onChange={handleProfilePhotoUpload}
                                className="hidden"
                              />
                            </label>
                          </div>

                          <div className="space-y-1 text-center sm:text-left">
                            <h2 className="text-xl font-bold text-pch-text">{user.name}</h2>
                            <p className="text-xs text-pch-gold font-mono">@{user.username} • {user.role.toUpperCase()}</p>
                            <p className="text-xs text-pch-muted">{user.email}</p>
                            <p className="text-xs text-pch-purpleLight font-mono">{user.phone || "No HP belum diatur"}</p>
                            {!user.avatarUrl && (
                              <span className="inline-block text-[10px] text-pch-muted italic">
                                Menggunakan Logo Komunitas sebagai foto profil default
                              </span>
                            )}
                          </div>
                        </div>

                        <div className="space-y-4 pt-4 border-t border-pch-border">
                          <div>
                            <label className="text-xs font-semibold text-pch-muted">Nama Lengkap</label>
                            <input 
                              type="text" 
                              value={user.name} 
                              onChange={(e) => setUser({ ...user, name: e.target.value })}
                              className="w-full mt-1 bg-pch-secondary border border-pch-border rounded-xl px-4 py-2 text-sm text-pch-text focus:outline-none focus:border-pch-purple"
                            />
                          </div>

                          <div>
                            <label className="text-xs font-semibold text-pch-muted">Username</label>
                            <input 
                              type="text" 
                              value={user.username} 
                              onChange={(e) => setUser({ ...user, username: e.target.value })}
                              className="w-full mt-1 bg-pch-secondary border border-pch-border rounded-xl px-4 py-2 text-sm text-pch-text font-mono focus:outline-none focus:border-pch-purple"
                            />
                          </div>

                          <div>
                            <label className="text-xs font-semibold text-pch-muted">Email</label>
                            <input 
                              type="email" 
                              value={user.email} 
                              onChange={(e) => setUser({ ...user, email: e.target.value })}
                              className="w-full mt-1 bg-pch-secondary border border-pch-border rounded-xl px-4 py-2 text-sm text-pch-text focus:outline-none focus:border-pch-purple"
                            />
                          </div>

                          <div>
                            <label className="text-xs font-semibold text-pch-muted">No HP / WhatsApp</label>
                            <input 
                              type="tel" 
                              value={user.phone || ""} 
                              onChange={(e) => setUser({ ...user, phone: e.target.value })}
                              placeholder="081234567890"
                              className="w-full mt-1 bg-pch-secondary border border-pch-border rounded-xl px-4 py-2 text-sm text-pch-text focus:outline-none focus:border-pch-purple"
                            />
                          </div>

                          <div>
                            <label className="text-xs font-semibold text-pch-muted block mb-1">Unggah Foto Profil Baru</label>
                            <input 
                              type="file" 
                              accept="image/*"
                              onChange={handleProfilePhotoUpload}
                              className="w-full text-xs text-pch-muted file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-pch-purple file:text-white hover:file:bg-pch-purpleLight"
                            />
                          </div>

                          <div>
                            <label className="text-xs font-semibold text-pch-muted">Bio Komunitas</label>
                            <textarea 
                              rows="2"
                              value={user.bio} 
                              onChange={(e) => setUser({ ...user, bio: e.target.value })}
                              className="w-full mt-1 bg-pch-secondary border border-pch-border rounded-xl px-4 py-2 text-sm text-pch-text focus:outline-none focus:border-pch-purple"
                            ></textarea>
                          </div>

                          <div>
                            <div className="flex items-center justify-between">
                              <label className="text-xs font-semibold text-pch-muted">Alamat Wallet Publik Pi Network (Opsional)</label>
                              <span className="text-[10px] text-pch-warning">Hanya Alamat Publik</span>
                            </div>
                            <input 
                              type="text" 
                              placeholder="GD5J... (Hanya untuk pengenal publik)"
                              value={user.publicWallet} 
                              onChange={(e) => setUser({ ...user, publicWallet: e.target.value })}
                              className="w-full mt-1 bg-pch-secondary border border-pch-border rounded-xl px-4 py-2 text-sm text-pch-text font-mono focus:outline-none focus:border-pch-purple"
                            />
                          </div>

                          <div className="pt-2 flex gap-3">
                            <button 
                              onClick={() => triggerToast("Profil Anda berhasil diperbarui.")}
                              className="flex-1 py-2.5 rounded-xl bg-pch-gold text-black font-semibold text-sm hover:bg-pch-goldLight shadow-gold-glow"
                            >
                              Simpan Pengaturan Profil
                            </button>
                            <button 
                              onClick={handleLogoutSession}
                              className="px-4 py-2.5 rounded-xl bg-pch-secondary border border-pch-border text-pch-muted hover:text-pch-danger hover:border-pch-danger text-sm font-semibold flex items-center gap-1.5"
                            >
                              <Icons.LogOut className="w-4 h-4" />
                              <span>Keluar</span>
                            </button>
                          </div>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* TAB 7: ADMIN CONSOLE */}
                  {activeTab === "admin" && user?.role === "admin" && (
                    <div className="space-y-6">
                      <div className="p-5 rounded-2xl bg-pch-surface border border-pch-purple/50 flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                          <div className="flex items-center gap-2">
                            <Icons.Shield className="w-5 h-5 text-pch-purpleLight" />
                            <h2 className="text-lg font-bold text-pch-text">Admin Master Console</h2>
                          </div>
                          <p className="text-xs text-pch-muted mt-1">
                            Kelola branding aplikasi (Judul & Logo), terbitkan Redeem Code brankas, dan kelola dokumen anggota di Google Drive.
                          </p>
                        </div>
                        <span className="text-xs font-mono bg-pch-purple/20 text-pch-purpleLight border border-pch-purple px-3 py-1 rounded-lg self-start">
                          Actor: @{user.username} (SUPER_ADMIN)
                        </span>
                      </div>

                      {/* 1. DYNAMIC BRANDING & LOGO */}
                      <div className="p-6 rounded-2xl bg-pch-surface border border-pch-gold/50 shadow-card-elevated space-y-6">
                        <div className="flex items-center justify-between pb-3 border-b border-pch-border">
                          <div className="flex items-center gap-3">
                            <div className="p-2.5 rounded-xl bg-pch-gold/15 text-pch-gold border border-pch-gold/30">
                              <Icons.Edit className="w-5 h-5" />
                            </div>
                            <div>
                              <h3 className="font-bold text-base text-pch-text">Pengaturan Nama & Gambar Logo Aplikasi</h3>
                              <p className="text-xs text-pch-muted">Ubah Nama Aplikasi, Tagline, dan Gambar Logo secara instan.</p>
                            </div>
                          </div>
                          <span className="text-[11px] px-2.5 py-1 rounded-full bg-pch-secondary border border-pch-gold text-pch-goldLight font-mono">
                            Admin Only
                          </span>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                          <div className="space-y-4">
                            <div>
                              <label className="text-xs font-semibold text-pch-muted block mb-1">
                                Nama Judul Web / Aplikasi
                              </label>
                              <input 
                                type="text" 
                                value={brandingDraft.title}
                                onChange={(e) => setBrandingDraft({ ...brandingDraft, title: e.target.value })}
                                placeholder="Contoh: PI COMMUNITY HUB"
                                className="w-full bg-pch-secondary border border-pch-border rounded-xl px-4 py-2 text-sm text-pch-text font-semibold focus:outline-none focus:border-pch-purple"
                              />
                            </div>

                            <div>
                              <label className="text-xs font-semibold text-pch-muted block mb-1">
                                Tagline Komunitas
                              </label>
                              <input 
                                type="text" 
                                value={brandingDraft.tagline}
                                onChange={(e) => setBrandingDraft({ ...brandingDraft, tagline: e.target.value })}
                                placeholder="Contoh: Connect • Collaborate • Grow Together"
                                className="w-full bg-pch-secondary border border-pch-border rounded-xl px-4 py-2 text-sm text-pch-text focus:outline-none focus:border-pch-purple"
                              />
                            </div>

                            <div>
                              <label className="text-xs font-semibold text-pch-muted block mb-1">
                                Nomor WhatsApp Resmi Admin (Menerima Permintaan Kode)
                              </label>
                              <input 
                                type="tel" 
                                value={brandingDraft.adminWhatsapp}
                                onChange={(e) => setBrandingDraft({ ...brandingDraft, adminWhatsapp: e.target.value })}
                                placeholder="6281299887766"
                                className="w-full bg-pch-secondary border border-pch-border rounded-xl px-4 py-2 text-xs font-mono text-pch-text focus:outline-none focus:border-pch-purple"
                              />
                            </div>

                            <div>
                              <label className="text-xs font-semibold text-pch-muted block mb-1.5">
                                Pilihan Format Logo
                              </label>
                              <div className="grid grid-cols-2 gap-2">
                                <button
                                  type="button"
                                  onClick={() => setBrandingDraft({ ...brandingDraft, logoType: "default", customLogoUrl: "" })}
                                  className={`py-2 px-3 rounded-xl text-xs font-semibold border transition-all ${
                                    brandingDraft.logoType === "default"
                                      ? "bg-pch-gold text-black border-pch-gold shadow-gold-glow"
                                      : "bg-pch-secondary border-pch-border text-pch-muted hover:text-pch-text"
                                  }`}
                                >
                                  Logo Geometrik Default
                                </button>

                                <button
                                  type="button"
                                  onClick={() => setBrandingDraft({ ...brandingDraft, logoType: "custom" })}
                                  className={`py-2 px-3 rounded-xl text-xs font-semibold border transition-all ${
                                    brandingDraft.logoType === "custom"
                                      ? "bg-pch-purple text-white border-pch-purple shadow-purple-glow"
                                      : "bg-pch-secondary border-pch-border text-pch-muted hover:text-pch-text"
                                  }`}
                                >
                                  Logo Gambar Kustom
                                </button>
                              </div>
                            </div>

                            {brandingDraft.logoType === "custom" && (
                              <div className="space-y-3 p-3.5 rounded-xl bg-pch-secondary/80 border border-pch-border">
                                <div>
                                  <label className="text-[11px] font-semibold text-pch-muted block mb-1">
                                    Unggah File Gambar Logo Baru (PNG/JPEG/SVG)
                                  </label>
                                  <input 
                                    type="file" 
                                    accept="image/*"
                                    onChange={handleLogoFileUpload}
                                    className="w-full text-xs text-pch-muted file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-pch-purple file:text-white hover:file:bg-pch-purpleLight"
                                  />
                                </div>
                                <div className="text-center text-[10px] text-pch-muted">ATAU</div>
                                <div>
                                  <label className="text-[11px] font-semibold text-pch-muted block mb-1">
                                    Masukkan URL Tautan Logo
                                  </label>
                                  <input 
                                    type="url" 
                                    value={brandingDraft.customLogoUrl.startsWith("data:") ? "" : brandingDraft.customLogoUrl}
                                    onChange={(e) => setBrandingDraft({ ...brandingDraft, logoType: "custom", customLogoUrl: e.target.value })}
                                    placeholder="https://domain.com/logo.png"
                                    className="w-full bg-pch-surface border border-pch-border rounded-xl px-3 py-2 text-xs font-mono text-pch-text focus:outline-none focus:border-pch-purple"
                                  />
                                </div>
                              </div>
                            )}
                          </div>

                          <div className="flex flex-col justify-between p-5 rounded-2xl bg-pch-secondary/50 border border-pch-border space-y-4">
                            <div className="space-y-3">
                              <span className="text-xs font-semibold text-pch-muted uppercase tracking-wider block">
                                Pratinjau Tampilan Header Aplikasi
                              </span>
                              <div className="p-4 rounded-xl bg-pch-bg border border-pch-gold/40 flex items-center gap-3">
                                <BrandLogo config={brandingDraft} size="lg" />
                                <div>
                                  <h4 className="font-bold text-base gold-gradient-text uppercase">
                                    {brandingDraft.title || "JUDUL APLIKASI"}
                                  </h4>
                                  <p className="text-xs text-pch-muted">
                                    {brandingDraft.tagline || "Tagline komunitas"}
                                  </p>
                                </div>
                              </div>
                            </div>

                            <button 
                              onClick={handleSaveBranding}
                              className="w-full py-3 rounded-xl bg-pch-gold text-black font-bold text-sm hover:bg-pch-goldLight transition-all flex items-center justify-center gap-2 shadow-gold-glow"
                            >
                              <Icons.Check className="w-4 h-4" />
                              <span>Terapkan Perubahan Judul & Logo</span>
                            </button>
                          </div>
                        </div>
                      </div>

                      {/* 2. MANAJEMEN BRANKAS ANGGOTA & REDEEM CODE */}
                      <div className="p-6 rounded-2xl bg-pch-surface border border-pch-purple/50 shadow-card-elevated space-y-6">
                        <div className="flex items-center justify-between pb-3 border-b border-pch-border">
                          <div className="flex items-center gap-3">
                            <div className="p-2.5 rounded-xl bg-pch-purple/20 text-pch-purpleLight border border-pch-purple/40">
                              <Icons.Key className="w-5 h-5" />
                            </div>
                            <div>
                              <h3 className="font-bold text-base text-pch-text">Manajemen Brankas Dokumen & Generator Redeem Code</h3>
                              <p className="text-xs text-pch-muted">Terbitkan Token Akses Privat untuk anggota dan kirimkan dokumen/kode kembali melalui WhatsApp.</p>
                            </div>
                          </div>
                        </div>

                        <form onSubmit={handleAdminCreateRedeemCode} className="p-4 rounded-xl bg-pch-secondary border border-pch-border space-y-3">
                          <span className="text-xs font-bold text-pch-goldLight block">Buat Redeem Code Baru untuk Anggota</span>
                          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <div>
                              <label className="text-[11px] text-pch-muted block mb-1">Target Anggota</label>
                              <select 
                                value={newCodeTarget}
                                onChange={(e) => setNewCodeTarget(e.target.value)}
                                className="w-full bg-pch-surface border border-pch-border rounded-xl px-3 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                              >
                                <option value="all">Semua Anggota (Umum)</option>
                                <option value="perintis_01">perintis_01 (Perintis Nusantara)</option>
                              </select>
                            </div>

                            <div>
                              <label className="text-[11px] text-pch-muted block mb-1">Kode Kustom (Opsional)</label>
                              <input 
                                type="text" 
                                placeholder="Kosongkan untuk auto-generate"
                                value={newCodeCustom}
                                onChange={(e) => setNewCodeCustom(e.target.value)}
                                className="w-full bg-pch-surface border border-pch-border rounded-xl px-3 py-2 text-xs text-pch-text font-mono uppercase focus:outline-none focus:border-pch-purple"
                              />
                            </div>

                            <div>
                              <label className="text-[11px] text-pch-muted block mb-1">Catatan Akses</label>
                              <input 
                                type="text" 
                                placeholder="Misal: Akses Verifikasi KYC"
                                value={newCodeNote}
                                onChange={(e) => setNewCodeNote(e.target.value)}
                                className="w-full bg-pch-surface border border-pch-border rounded-xl px-3 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                              />
                            </div>
                          </div>

                          <button 
                            type="submit"
                            className="px-4 py-2 rounded-xl bg-pch-purple text-white text-xs font-bold hover:bg-pch-purpleLight flex items-center gap-1.5 shadow-purple-glow"
                          >
                            <Icons.Plus className="w-3.5 h-3.5" />
                            <span>Terbitkan Redeem Code</span>
                          </button>
                        </form>

                        <div className="space-y-2">
                          <div className="flex items-center justify-between">
                            <span className="text-xs font-bold text-pch-text block">Daftar Redeem Code Aktif (Otomatis Hilang Setelah 60 Detik)</span>
                            <span className="text-[10px] text-pch-warning font-mono bg-amber-950/40 px-2.5 py-0.5 rounded border border-pch-warning/40">Masa Aktif: 1 Menit</span>
                          </div>
                          <div className="overflow-x-auto">
                            <table className="w-full text-xs text-left">
                              <thead className="bg-pch-secondary text-pch-muted uppercase border-b border-pch-border">
                                <tr>
                                  <th className="p-3">Kode Akses</th>
                                  <th className="p-3">Target</th>
                                  <th className="p-3">Sisa Waktu</th>
                                  <th className="p-3">Catatan</th>
                                  <th className="p-3">Aksi</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-pch-border">
                                {activeRedeemCodes.length === 0 ? (
                                  <tr>
                                    <td colSpan="5" className="p-4 text-center text-pch-muted italic">
                                      Tidak ada Redeem Code aktif saat ini. Semua kode yang lewat 60 detik telah otomatis kedaluwarsa & dihapus. Terbitkan kode baru di atas saat anggota meminta akses.
                                    </td>
                                  </tr>
                                ) : (
                                  activeRedeemCodes.map((item, idx) => {
                                    const remainingSeconds = Math.max(0, Math.ceil((item.expiresAt - currentTime) / 1000));
                                    return (
                                      <tr key={idx} className="hover:bg-pch-secondary/30 transition-colors">
                                        <td className="p-3 font-mono font-bold text-pch-goldLight">{item.code}</td>
                                        <td className="p-3 font-mono text-pch-text">{item.userTarget}</td>
                                        <td className="p-3">
                                          <span className={`px-2 py-0.5 rounded-full font-mono font-bold text-[10px] border flex items-center gap-1 w-fit ${
                                            remainingSeconds <= 15 
                                              ? "bg-red-950/80 border-pch-danger text-pch-danger animate-pulse" 
                                              : "bg-amber-950/80 border-pch-warning text-pch-warning"
                                          }`}>
                                            <span className="w-1.5 h-1.5 rounded-full bg-current"></span>
                                            <span>{remainingSeconds} detik tersisa</span>
                                          </span>
                                        </td>
                                        <td className="p-3 text-pch-muted">{item.note}</td>
                                        <td className="p-3">
                                          <button 
                                            onClick={() => {
                                              safeCopyToClipboard(item.code);
                                              triggerToast(`Kode [${item.code}] disalin ke clipboard! (Sisa ${remainingSeconds} detik)`);
                                            }}
                                            className="px-2.5 py-1 rounded bg-pch-surface border border-pch-border text-pch-muted hover:text-pch-gold text-[11px] flex items-center gap-1"
                                          >
                                            <Icons.Copy className="w-3 h-3" />
                                            <span>Salin</span>
                                          </button>
                                        </td>
                                      </tr>
                                    );
                                  })
                                )}
                              </tbody>
                            </table>
                          </div>
                        </div>

                        <div className="space-y-2 pt-2">
                          <span className="text-xs font-bold text-pch-text block">Arsip Berkas Brankas Anggota di Google Drive</span>
                          <div className="overflow-x-auto">
                            <table className="w-full text-xs text-left">
                              <thead className="bg-pch-secondary text-pch-muted uppercase border-b border-pch-border">
                                <tr>
                                  <th className="p-3">Nama Anggota</th>
                                  <th className="p-3">Kontak (WA)</th>
                                  <th className="p-3">Username Pi / NIK</th>
                                  <th className="p-3">Status Drive</th>
                                  <th className="p-3">Kirim Balik / Akses</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-pch-border">
                                {submittedDossiers.length === 0 ? (
                                  <tr>
                                    <td colSpan="5" className="p-4 text-center text-pch-muted italic">
                                      Belum ada berkas anggota yang diunggah.
                                    </td>
                                  </tr>
                                ) : (
                                  submittedDossiers.map(dos => (
                                    <tr key={dos.id}>
                                      <td className="p-3">
                                        <span className="font-bold text-pch-text block">{dos.namaLengkap}</span>
                                        <span className="text-[10px] text-pch-muted font-mono">@{dos.username}</span>
                                      </td>
                                      <td className="p-3 font-mono text-pch-text">{dos.noHp}</td>
                                      <td className="p-3">
                                        <span className="text-pch-goldLight font-mono block">{dos.usernamePi}</span>
                                        <span className="text-[10px] text-pch-muted font-mono">NIK: {dos.nik}</span>
                                      </td>
                                      <td className="p-3">
                                        <span className="text-[10px] px-2 py-0.5 rounded bg-emerald-950 text-pch-success border border-pch-success/30 font-semibold">
                                          {dos.status} ({dos.docsCount} Berkas)
                                        </span>
                                      </td>
                                      <td className="p-3">
                                        <button 
                                          onClick={() => handleAdminSendDossierViaWA(dos, activeRedeemCodes[0]?.code)}
                                          className="px-3 py-1.5 rounded-lg bg-emerald-950/80 border border-pch-success text-pch-success hover:bg-emerald-900/60 font-semibold text-xs flex items-center gap-1.5"
                                        >
                                          <Icons.Phone className="w-3.5 h-3.5" />
                                          <span>Kirim via WA</span>
                                        </button>
                                      </td>
                                    </tr>
                                  ))
                                )}
                              </tbody>
                            </table>
                          </div>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* TAB 8: GAS STUDIO */}
                  {activeTab === "gas-studio" && (
                    <div className="space-y-4">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div>
                          <h2 className="text-xl font-bold text-pch-text flex items-center gap-2">
                            <Icons.Cloud className="w-5 h-5 text-pch-gold" />
                            <span>Google Apps Script (GAS) Backend Studio</span>
                          </h2>
                          <p className="text-xs text-pch-muted">
                            Salin kode <code>Code.gs</code> di bawah ini ke <strong>script.google.com</strong> untuk menghubungkan Google Drive Vault dan Google Spreadsheet Database.
                          </p>
                        </div>

                        <div className="flex items-center gap-2">
                          <button 
                            onClick={() => {
                              safeCopyToClipboard(COMPLETE_GAS_SCRIPT);
                              triggerToast("Skrip Code.gs lengkap disalin ke clipboard!");
                            }}
                            className="px-4 py-2 rounded-xl bg-pch-gold text-black font-semibold text-xs sm:text-sm hover:bg-pch-goldLight flex items-center gap-2 shadow-gold-glow"
                          >
                            <Icons.Copy className="w-4 h-4" />
                            <span>Salin Code.gs</span>
                          </button>

                          <button 
                            onClick={() => setShowGasModal(true)}
                            className="px-4 py-2 rounded-xl bg-pch-purple text-white font-semibold text-xs sm:text-sm hover:bg-pch-purpleLight flex items-center gap-2"
                          >
                            <Icons.Database className="w-4 h-4" />
                            <span>Pasang URL Web App</span>
                          </button>
                        </div>
                      </div>

                      <div className="p-4 rounded-xl bg-pch-secondary border border-pch-border text-xs text-pch-muted space-y-2">
                        <h4 className="font-bold text-pch-goldLight">Cara Pasang Google Apps Script:</h4>
                        <ol className="list-decimal pl-5 space-y-1">
                          <li>Buka <a href="https://script.google.com" target="_blank" rel="noreferrer" className="text-pch-purpleLight underline">script.google.com</a> dan buat project baru.</li>
                          <li>Hapus isi default dan tempel seluruh kode di bawah ini ke file <code>Code.gs</code>.</li>
                          <li>Klik <strong>Deploy &rarr; New Deployment</strong>. Pilih jenis <strong>Web App</strong>.</li>
                          <li>Pada <em>Execute as</em> pilih <strong>Me (Akun Google Anda)</strong>. Pada <em>Who has access</em> pilih <strong>Anyone</strong>.</li>
                          <li>Salin URL Web App yang dihasilkan (berawalan <code>https://script.google.com/macros/s/.../exec</code>) dan masukkan ke menu <em>Pasang URL Web App</em>.</li>
                        </ol>
                      </div>

                      <div className="relative rounded-2xl bg-black border border-pch-border p-4 font-mono text-xs overflow-x-auto text-emerald-400 max-h-[560px]">
                        <pre>{COMPLETE_GAS_SCRIPT}</pre>
                      </div>
                    </div>
                  )}

                </main>
              </div>

              {/* MOBILE BOTTOM NAVIGATION */}
              <nav className="md:hidden fixed bottom-0 left-0 right-0 z-50 bg-pch-bg/95 backdrop-blur-lg border-t border-pch-border px-2 py-1.5 flex items-center justify-around safe-bottom">
                {[
                  { id: "dashboard", label: "Beranda", icon: Icons.Home },
                  { id: "community", label: "Komunitas", icon: Icons.Users },
                  { id: "chat", label: "Chat", icon: Icons.MessageSquare },
                  { id: "meetings", label: "Rapat", icon: Icons.Video },
                  { id: "vault", label: "Vault", icon: Icons.Lock },
                  { id: "profile", label: "Profil", icon: Icons.User },
                  ...(user?.role === "admin" ? [{ id: "admin", label: "Admin", icon: Icons.Shield }] : [])
                ].map(item => {
                  const Icon = item.icon;
                  const isActive = activeTab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => { setActiveTab(item.id); setActiveJitsiRoom(null); }}
                      className={`flex flex-col items-center justify-center py-1 px-2 rounded-xl transition-all ${
                        isActive ? "text-pch-gold scale-105" : "text-pch-muted hover:text-pch-text"
                      }`}
                    >
                      <Icon className="w-5 h-5" />
                      <span className="text-[10px] font-medium mt-0.5">{item.label}</span>
                    </button>
                  );
                })}
              </nav>
            </div>
          )}

          {/* ==================== MODAL: GOOGLE APPS SCRIPT (GAS) CONFIGURATION ==================== */}
          {showGasModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-pch-surface border border-pch-border rounded-2xl max-w-md w-full p-6 space-y-4 shadow-card-elevated">
                <div className="flex items-center justify-between pb-2 border-b border-pch-border">
                  <h3 className="font-bold text-base text-pch-text flex items-center gap-2">
                    <Icons.Cloud className="w-4 h-4 text-pch-gold" />
                    <span>Konfigurasi Google Apps Script (GAS)</span>
                  </h3>
                  <button onClick={() => setShowGasModal(false)} className="text-pch-muted hover:text-pch-text">
                    <Icons.X className="w-5 h-5" />
                  </button>
                </div>

                <p className="text-xs text-pch-muted">
                  Masukkan Web App URL yang Anda dapatkan saat melakukan Deploy di Google Apps Script (script.google.com).
                </p>

                <div className="space-y-3">
                  <div>
                    <label className="text-xs font-semibold text-pch-muted">GAS Web App URL (/exec)</label>
                    <input 
                      type="url" 
                      placeholder="https://script.google.com/macros/s/AKfycbx.../exec"
                      value={gasConfig.webAppUrl}
                      onChange={(e) => setGasConfig({ ...gasConfig, webAppUrl: e.target.value })}
                      className="w-full mt-1 bg-pch-secondary border border-pch-border rounded-xl px-3 py-2 text-xs font-mono text-pch-text focus:outline-none focus:border-pch-purple"
                    />
                  </div>
                  <div className="p-3 rounded-xl bg-pch-secondary border border-pch-border text-[11px] text-pch-muted space-y-1">
                    <span className="font-semibold text-pch-goldLight">Keamanan Drive Vault:</span>
                    <p>File dokumen yang diunggah akan disimpan langsung ke Google Drive privat di folder khusus, terisolasi dari layanan eksternal mana pun.</p>
                  </div>
                </div>

                <div className="pt-2 flex gap-3">
                  <button 
                    onClick={() => {
                      setDemoMode(true);
                      setGasConfig({ webAppUrl: "", connected: false, lastSync: null });
                      setShowGasModal(false);
                      triggerToast("Kembali ke Mode Lokal.");
                    }}
                    className="flex-1 py-2.5 rounded-xl bg-pch-secondary border border-pch-border text-pch-muted text-xs font-semibold hover:text-pch-text"
                  >
                    Mode Lokal
                  </button>

                  <button 
                    onClick={() => handleSaveGasConfig(gasConfig.webAppUrl)}
                    className="flex-1 py-2.5 rounded-xl bg-pch-gold text-black text-xs font-semibold hover:bg-pch-goldLight shadow-gold-glow"
                  >
                    Hubungkan GAS
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ==================== MODAL: CUSTOM CONFIRMATION DIALOG ==================== */}
          {confirmDialog && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-pch-surface border border-pch-border rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-card-elevated">
                <div className="flex items-center gap-2 text-pch-warning font-semibold">
                  <Icons.AlertTriangle className="w-5 h-5 shrink-0" />
                  <h3 className="font-bold text-sm text-pch-text">{confirmDialog.title}</h3>
                </div>
                <p className="text-xs text-pch-muted leading-relaxed">
                  {confirmDialog.message}
                </p>
                <div className="pt-2 flex gap-3">
                  <button 
                    onClick={() => setConfirmDialog(null)}
                    className="flex-1 py-2 rounded-xl bg-pch-secondary border border-pch-border text-pch-muted text-xs font-semibold hover:text-pch-text"
                  >
                    Batal
                  </button>
                  <button 
                    onClick={confirmDialog.onConfirm}
                    className="flex-1 py-2 rounded-xl bg-pch-danger text-white text-xs font-semibold hover:bg-red-600 shadow-sm"
                  >
                    Konfirmasi
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render the React application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
