                                              className="px-2 py-1 rounded-lg bg-emerald-950/70 border border-pch-success/50 text-pch-success text-[11px] font-semibold flex items-center gap-1"
                                              title="Download Dokumen"
                                            >
                                              <Icons.Download className="w-3 h-3" />
                                              <span>Download</span>
                                            </button>
                                          </>
                                        )}
                                        <button 
                                          type="button"
                                          onClick={() => {
                                            isDossierDirtyRef.current = true;
                                            setMemberDossier(prev => ({
                                              ...prev,
                                              extraDocs: prev.extraDocs.filter(d => d.id !== doc.id)
                                            }));
                                            triggerToast(`Dokumen "${doc.title}" dihapus.`, "warning");
                                          }}
                                          className="p-1.5 rounded-lg bg-pch-surface border border-pch-border text-pch-danger hover:bg-red-950/40"
                                          title="Hapus"
                                        >
                                          <Icons.Trash className="w-3.5 h-3.5" />
                                        </button>
                                      </div>
                                    </div>
                                  );
                                })}
                              </div>
                            ) : (
                              <p className="text-xs text-pch-muted italic">Belum ada dokumen tambahan.</p>
                            )}

                            <form onSubmit={handleAddExtraDocument} className="pt-2 flex flex-col sm:flex-row items-center gap-2.5">
                              <input 
                                type="text" 
                                placeholder="Judul Dokumen Tambahan"
                                value={newExtraDocTitle}
                                onChange={(e) => setNewExtraDocTitle(e.target.value)}
                                className="flex-1 bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                              />
                              <input 
                                type="file" 
                                accept=".pdf,image/*" 
                                onChange={(e) => setNewExtraDocFile(e.target.files[0])}
                                className="w-full sm:w-auto text-xs text-pch-muted file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:bg-pch-secondary file:text-pch-text file:border file:border-pch-border"
                              />
                              <button 
                                type="submit"
                                className="w-full sm:w-auto px-4 py-2 rounded-xl bg-pch-purple text-white text-xs font-semibold hover:bg-pch-purpleLight shrink-0 shadow-purple-glow"
                              >
                                Tambah Dokumen
                              </button>
                            </form>
                          </div>

                          {/* Save & Sync Button */}

                              <h4 className="text-sm font-bold text-pch-text">Simpan & Kirim Semua Dokumen ke Admin</h4>
                              <p className="text-xs text-pch-muted">

                              </p>
                            </div>
                            <button 
                              onClick={handleSaveAndSendDossierToAdmin}
                              disabled={isSavingDossier}
                              className="w-full sm:w-auto px-6 py-2.5 rounded-xl bg-pch-gold text-black font-bold text-sm hover:bg-pch-goldLight transition-all shadow-gold-glow flex items-center justify-center gap-2 shrink-0 disabled:opacity-50"
                            >
                              <Icons.Upload className="w-4 h-4" />
                              <span>{isSavingDossier ? "Menyimpan Realtime..." : "Simpan & Kirim Dokumen"}</span>
                            </button>
                          </div>
                        </div>

                    </div>

                        <div className="flex flex-col sm:flex-row items-center sm:items-start gap-5">
                          <div className="flex flex-col items-center gap-2.5 shrink-0">
                            <div className="relative">
                              <UserAvatar user={user} branding={appBranding} size="lg" />
                              <label className="absolute bottom-0 right-0 p-1.5 rounded-full bg-pch-gold text-black shadow-md border-2 border-pch-surface cursor-pointer hover:bg-pch-goldLight transition-transform active:scale-95" title="Ganti Foto">

                                />
                              </label>

                              <Icons.Upload className="w-3.5 h-3.5 text-pch-gold" />
                              <span>Ganti Foto Profil</span>
                              <input 
                                type="file" 
                                accept="image/*"
                                onChange={handleProfilePhotoUpload}
                                className="hidden"
                              />
                            </label>
                          </div>

                                {user.role || "MEMBER"}

                              <span>{user.phone || "No HP belum diatur"}</span>
                            </p>
                          </div>
                        </div>

                        <div className="space-y-4 pt-4 border-t border-pch-border">
                          <div>
                            <label className="text-xs font-semibold text-pch-muted block mb-1">Nama Lengkap</label>
                            <input 
                              type="text" 
                              value={user.name} 
                              onChange={(e) => setUser({ ...user, name: e.target.value })}
                              className="w-full bg-pch-secondary border border-pch-border rounded-xl px-4 py-2.5 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                            />

                            <label className="text-xs font-semibold text-pch-muted block mb-1">No HP / WhatsApp</label>

                              value={user.phone || ""} 
                              onChange={(e) => setUser({ ...user, phone: e.target.value })}

                            <label className="text-xs font-semibold text-pch-muted block mb-1">Bio Anggota Panua</label>
                            <textarea

                              value={user.bio || ""} 
                              onChange={(e) => setUser({ ...user, bio: e.target.value })}

                              className="w-full bg-pch-secondary border border-pch-border rounded-xl px-4 py-2.5 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                            ></textarea>
                          </div>

                          <div className="pt-2 flex flex-col sm:flex-row gap-3">
                            <button 
                              onClick={async () => {
                                if (supabase) {
                                  await supabase.from('users_registry').update({
                                    name: user.name,
                                    phone: user.phone,
                                    bio: user.bio
                                  }).eq('id', user.id);
                                }
                                triggerToast("Pengaturan profil berhasil disimpan.", "success");
                              }}
                              className="flex-1 py-2.5 rounded-xl bg-pch-gold text-black font-bold text-xs hover:bg-pch-goldLight shadow-gold-glow flex items-center justify-center gap-2"
                            >
                              <Icons.Check className="w-4 h-4" />
                              <span>Simpan Profil</span>

                            <button

                            >
                              <Icons.LogOut className="w-4 h-4" />
                              <span>Keluar Sesi</span>
                            </button>
                          </div>
                        </div>
                      </div>

                          <div className="flex items-center gap-2">
                            <Icons.Shield className="w-5 h-5 text-pch-purpleLight" />
                            <h2 className="text-lg font-bold text-pch-text">Panel Administrasi Panua Community</h2>

                        <div className="flex items-center gap-2 self-start">

                            onClick={() => setShowSupabaseSettingsModal(true)}

                          <Icons.Edit className="w-4 h-4 text-pch-gold" />
                          <span>1. Pengaturan Identitas, Judul & Logo Panua Community</span>
                        </h3>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                          <div className="space-y-4">
                            <div>
                              <label className="text-xs font-semibold text-pch-muted block mb-1">Nama Judul Aplikasi</label>
                              <input 
                                type="text" 
                                value={brandingDraft.title}
                                onChange={(e) => setBrandingDraft({ ...brandingDraft, title: e.target.value })}
                                className="w-full bg-pch-secondary border border-pch-border rounded-xl px-4 py-2 text-sm text-pch-text font-bold focus:outline-none focus:border-pch-purple"
                              />
                            </div>

                            <div>
                              <label className="text-xs font-semibold text-pch-muted block mb-1">Tagline Komunitas</label>
                              <input 
                                type="text" 
                                value={brandingDraft.tagline}
                                onChange={(e) => setBrandingDraft({ ...brandingDraft, tagline: e.target.value })}
                                className="w-full bg-pch-secondary border border-pch-border rounded-xl px-4 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                              />
                            </div>

                              <label className="text-xs font-semibold text-pch-muted block mb-1">Nomor WhatsApp Resmi Admin</label>
                              <input 
                                type="text"

                              />

                              <label className="text-xs font-semibold text-pch-muted block mb-2">Format Tampilan Logo</label>

                                <button
                                  type="button"
                                  onClick={() => setBrandingDraft({ ...brandingDraft, logoType: "panua" })}
                                  className={`py-2 px-3 rounded-xl border text-xs font-semibold transition-all ${
                                    brandingDraft.logoType === "panua"
                                      ? "bg-pch-gold text-black border-pch-gold shadow-gold-glow"
                                      : "bg-pch-secondary border-pch-border text-pch-muted hover:text-pch-text"
                                  }`}
                                >
                                  Logo Segel Panua Resmi
                                </button>
                                <button
                                  type="button"
                                  onClick={() => setBrandingDraft({ ...brandingDraft, logoType: "custom" })}
                                  className={`py-2 px-3 rounded-xl border text-xs font-semibold transition-all ${
                                    brandingDraft.logoType === "custom"
                                      ? "bg-pch-purple text-white border-pch-purple shadow-purple-glow"
                                      : "bg-pch-secondary border-pch-border text-pch-muted hover:text-pch-text"
                                  }`}
                                >
                                  Logo Kustom Bulat
                                </button>
                              </div>
                            </div>

                            {/* Pilihan Unggah Logo Kustom Bulat */}
                            {brandingDraft.logoType === "custom" && (
                              <div className="p-3.5 rounded-xl bg-pch-secondary border border-pch-purple/40 space-y-3 animate-fade-in">
                                <div>
                                  <label className="text-xs font-semibold text-pch-purpleLight block mb-1">Unggah Berkas Gambar Logo (PNG/JPG/SVG)</label>
                                  <input 
                                    type="file" 
                                    accept="image/*"
                                    onChange={async (e) => {
                                      const file = e.target.files[0];
                                      if (file) {
                                        if (file.size > 2 * 1024 * 1024) {
                                          triggerToast("Ukuran logo maksimal 2MB!", "danger");
                                          return;
                                        }
                                        const compressed = await compressImageFile(file, 400, 0.85);
                                        let logoUrl = compressed.base64;
                                        if (supabase) {
                                          triggerToast("Mengunggah logo ke Supabase...", "warning");
                                          const cloudUrl = await uploadFileToSupabaseStorage(compressed, 'branding');
                                          if (cloudUrl) logoUrl = cloudUrl;
                                        }
                                        setBrandingDraft(prev => ({ ...prev, customLogoUrl: logoUrl }));
                                        triggerToast("Logo kustom siap disimpan!", "success");
                                      }
                                    }}
                                    className="w-full text-xs text-pch-muted file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:bg-pch-surface file:text-pch-text file:border file:border-pch-border cursor-pointer"
                                  />
                                </div>
                                <div>
                                  <label className="text-xs font-semibold text-pch-muted block mb-1">Atau Masukkan URL Gambar Logo</label>
                                  <input 
                                    type="text" 
                                    placeholder="https://example.com/logo.png"
                                    value={brandingDraft.customLogoUrl}
                                    onChange={(e) => setBrandingDraft({ ...brandingDraft, customLogoUrl: e.target.value })}
                                    className="w-full bg-pch-surface border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                                  />
                                </div>
                              </div>
                            )}

                              <span className="text-xs font-semibold text-pch-muted block mb-2">Pratinjau Tampilan Header & Avatar</span>

                                <BrandLogo config={brandingDraft} size="lg" />
                                <div>
                                  <h4 className="font-bold text-sm gold-gradient-text uppercase">{brandingDraft.title || "PANUA COMMUNITY"}</h4>
                                  <p className="text-[11px] text-pch-muted">{brandingDraft.tagline || "Pi Network Gorontalo - Indonesia"}</p>
                                </div>
                              </div>
                            </div>

                            <button
                              type="button"
                              onClick={handleSaveBranding}
                              className="w-full py-2.5 rounded-xl bg-pch-gold text-black font-bold text-xs hover:bg-pch-goldLight transition-all shadow-gold-glow flex items-center justify-center gap-2"
                            >
                              <Icons.Check className="w-4 h-4" />
                              <span>Simpan Perubahan Identitas</span>
                            </button>
                          </div>
                        </div>
                      </div>

                      {/* 1B. Pengaturan Dana Talangan & Barcode QRIS */}
                      <div className="p-6 rounded-2xl bg-pch-surface border border-pch-gold/50 shadow-card-elevated space-y-6">
                        <h3 className="font-bold text-base text-pch-text border-b border-pch-border pb-3 flex items-center gap-2">
                          <Icons.Wallet className="w-4 h-4 text-pch-gold" />
                          <span>1B. Pengaturan Dana Talangan & Barcode QRIS Komunitas</span>
                        </h3>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                          <div className="space-y-4">
                            <div>
                              <label className="text-xs font-semibold text-pch-muted block mb-1">Nomor Akun Dompet DANA</label>
                              <input 
                                type="text" 
                                value={brandingDraft.danaNumber || ""}
                                onChange={(e) => setBrandingDraft({ ...brandingDraft, danaNumber: e.target.value })}
                                placeholder="081299887766"
                                className="w-full bg-pch-secondary border border-pch-border rounded-xl px-4 py-2 text-xs text-pch-text font-mono focus:outline-none focus:border-pch-purple"
                              />
                            </div>

                            <div>
                              <label className="text-xs font-semibold text-pch-muted block mb-1">Atas Nama Rekening DANA</label>
                              <input 
                                type="text" 
                                value={brandingDraft.danaName || ""}
                                onChange={(e) => setBrandingDraft({ ...brandingDraft, danaName: e.target.value })}
                                placeholder="PANUA COMMUNITY GORONTALO"
                                className="w-full bg-pch-secondary border border-pch-border rounded-xl px-4 py-2 text-xs text-pch-text font-bold focus:outline-none focus:border-pch-purple"
                              />
                            </div>

                            <div>
                              <label className="text-xs font-semibold text-pch-muted block mb-1">Deskripsi Solidaritas Dana Talangan</label>
                              <textarea 
                                rows="3"
                                value={brandingDraft.danaDescription || ""}
                                onChange={(e) => setBrandingDraft({ ...brandingDraft, danaDescription: e.target.value })}
                                placeholder="Wadah dana talangan dan solidaritas gotong royong..."
                                className="w-full bg-pch-secondary border border-pch-border rounded-xl px-4 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                              ></textarea>
                            </div>

                            <div>
                              <label className="text-xs font-semibold text-pch-goldLight block mb-1">Unggah Gambar Barcode QRIS (Semua Bank / E-Wallet)</label>
                              <input 
                                type="file" 
                                accept="image/*"
                                onChange={async (e) => {
                                  const file = e.target.files[0];
                                  if (file) {
                                    if (file.size > 5 * 1024 * 1024) {
                                      triggerToast("Ukuran QRIS maksimal 5MB!", "danger");
                                      return;
                                    }
                                    const compressed = await compressImageFile(file, 800, 0.85);
                                    let qrisUrl = compressed.base64;
                                    if (supabase) {
                                      triggerToast("Mengunggah barcode QRIS ke Supabase Storage...", "warning");
                                      const cloudUrl = await uploadFileToSupabaseStorage(compressed, 'qris');
                                      if (cloudUrl) qrisUrl = cloudUrl;
                                    }
                                    setBrandingDraft(prev => ({ ...prev, qrisImageUrl: qrisUrl }));
                                    triggerToast("Barcode QRIS berhasil disiapkan!", "success");
                                  }
                                }}
                                className="w-full text-xs text-pch-muted file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:bg-pch-secondary file:text-pch-text file:border file:border-pch-border cursor-pointer"
                              />
                            </div>
                          </div>

                          <div className="flex flex-col justify-between p-5 rounded-xl bg-pch-secondary border border-pch-border space-y-4">
                            <div>
                              <span className="text-xs font-semibold text-pch-muted block mb-2">Pratinjau Barcode QRIS</span>
                              <div className="w-48 h-48 mx-auto rounded-xl overflow-hidden border-2 border-pch-gold bg-white p-2 flex items-center justify-center">
                                {brandingDraft.qrisImageUrl ? (
                                  <img src={brandingDraft.qrisImageUrl} alt="QRIS" className="w-full h-full object-contain" />
                                ) : (
                                  <div className="text-center text-pch-muted">
                                    <Icons.QrCode className="w-12 h-12 mx-auto opacity-40 mb-1" />
                                    <span className="text-[10px]">Belum ada barcode QRIS</span>
                                  </div>
                                )}
                              </div>
                            </div>

                            <button
                              type="button"
                              onClick={handleSaveBranding}
                              className="w-full py-2.5 rounded-xl bg-pch-gold text-black font-bold text-xs hover:bg-pch-goldLight transition-all shadow-gold-glow flex items-center justify-center gap-2"
                            >
                              <Icons.Check className="w-4 h-4" />
                              <span>Simpan Pengaturan Dana Talangan & QRIS</span>
                            </button>
                          </div>
                        </div>
                      </div>

                      {/* 1C. Pengaturan Banner Gambar Auto-Slide & Kolom Informasi Dashboard */}
                      <div className="p-6 rounded-2xl bg-pch-surface border border-pch-gold/50 shadow-card-elevated space-y-6">
                        <h3 className="font-bold text-base text-pch-text border-b border-pch-border pb-3 flex items-center gap-2">
                          <Icons.Upload className="w-4 h-4 text-pch-gold" />
                          <span>1C. Pengaturan Banner Gambar Auto-Slide & Kolom Informasi Dashboard</span>
                        </h3>

                        <div className="space-y-3 pb-6 border-b border-pch-border">

                          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <div className="sm:col-span-2">
                              <label className="text-xs font-semibold text-pch-muted block mb-1">Judul Pengumuman</label>
                              <input 
                                type="text"
                                value={brandingDraft.announcementTitle || ""}
                                onChange={(e) => setBrandingDraft({ ...brandingDraft, announcementTitle: e.target.value })}
                                placeholder="Informasi Resmi Panua Community"
                                className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                              />
                            </div>
                            <div>
                              <label className="text-xs font-semibold text-pch-muted block mb-1">Label Tanggal / Waktu</label>
                              <input 
                                type="text"
                                value={brandingDraft.announcementDate || ""}
                                onChange={(e) => setBrandingDraft({ ...brandingDraft, announcementDate: e.target.value })}
                                placeholder="Hari Ini"
                                className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                              />
                            </div>
                          </div>
                          <div>
                            <label className="text-xs font-semibold text-pch-muted block mb-1">Isi Pengumuman / Pesan Komunitas</label>
                            <textarea 
                              rows="3"
                              value={brandingDraft.announcementContent || ""}
                              onChange={(e) => setBrandingDraft({ ...brandingDraft, announcementContent: e.target.value })}
                              placeholder="Tuliskan informasi penting yang ingin disampaikan kepada seluruh anggota..."
                              className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                            ></textarea>
                          </div>
                          <button
                            type="button"
                            onClick={handleSaveBranding}
                            className="px-4 py-2 rounded-xl bg-pch-gold text-black font-bold text-xs hover:bg-pch-goldLight shadow-gold-glow flex items-center gap-1.5"
                          >
                            <Icons.Check className="w-3.5 h-3.5" />
                            <span>Simpan Kolom Informasi</span>
                          </button>
                        </div>

                        {/* Pengaturan Slide Banner */}
                        <div className="space-y-4">
                          <div className="flex items-center justify-between flex-wrap gap-2">

                            <span className="text-[10px] text-pch-muted">Slide berganti otomatis tiap 4 detik di Beranda Anggota</span>
                          </div>

                          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                            {(brandingDraft.bannerSlides || []).map((slide, idx) => (
                              <div key={slide.id || idx} className="p-3 rounded-xl bg-pch-secondary border border-pch-border space-y-2 relative group overflow-hidden shadow-sm">
                                <div className="w-full h-28 rounded-lg bg-pch-surface overflow-hidden border border-pch-border relative">
                                  {slide.imageUrl ? (
                                    <img 
                                      src={slide.imageUrl} 
                                      alt={slide.title} 
                                      className="w-full h-full object-cover"
                                      onError={(e) => { e.target.onerror = null; e.target.src = "https://placehold.co/600x300/181922/D4AF37?text=Gambar+Slide"; }}
                                    />
                                  ) : (
                                    <div className="w-full h-full flex flex-col items-center justify-center text-pch-muted text-[11px] p-2 text-center bg-gradient-to-br from-pch-surface to-pch-secondary">
                                      <Icons.Zap className="w-5 h-5 text-pch-gold/50 mb-1" />
                                      <span>Banner Gradien Bawaan (Tanpa Gambar)</span>
                                    </div>
                                  )}
                                  <span className="absolute top-1.5 left-1.5 px-2 py-0.5 rounded-full bg-black/80 backdrop-blur-sm text-[9px] font-mono text-pch-goldLight border border-pch-gold/40">
                                    Slide {idx + 1}
                                  </span>
                                </div>
                                <div className="space-y-0.5">
                                  <h5 className="font-bold text-xs text-pch-text truncate">{slide.title}</h5>
                                  <p className="text-[10px] text-pch-muted truncate">{slide.subtitle}</p>
                                </div>
                                <button
                                  type="button"
                                  onClick={() => handleDeleteBannerSlide(slide.id)}
                                  className="w-full py-1.5 text-[11px] text-pch-danger hover:bg-red-950/40 rounded-lg border border-red-900/30 hover:border-red-600 transition-colors flex items-center justify-center gap-1 font-medium"
                                >
                                  <Icons.Trash className="w-3.5 h-3.5" />
                                  <span>Hapus Slide Ini</span>
                                </button>
                              </div>
                            ))}
                          </div>

                          {/* Form Tambah Slide Baru Dengan Live Preview */}
                          <form onSubmit={handleAddBannerSlide} className="p-4 rounded-xl bg-pch-secondary border border-pch-gold/40 space-y-3.5 shadow-sm">
                            <div className="flex items-center justify-between border-b border-pch-border/70 pb-2">
                              <h5 className="text-xs font-bold text-pch-text flex items-center gap-1.5">
                                <Icons.Plus className="w-3.5 h-3.5 text-pch-gold" />
                                <span>Tambah Slide Gambar Banner Baru</span>
                              </h5>
                              <span className="text-[10px] text-pch-goldLight font-medium">Pratinjau Otomatis</span>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                              <div>
                                <label className="text-[11px] font-semibold text-pch-muted block mb-1">Judul Slide (Opsional)</label>
                                <input 
                                  type="text" 
                                  placeholder="Contoh: SEMINAR PI NETWORK GORONTALO"
                                  value={newSlideTitle}
                                  onChange={(e) => setNewSlideTitle(e.target.value)}
                                  className="w-full bg-pch-surface border border-pch-border rounded-xl px-3 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                                />
                              </div>
                              <div>
                                <label className="text-[11px] font-semibold text-pch-muted block mb-1">Sub Judul / Keterangan Singkat</label>
                                <input 
                                  type="text" 
                                  placeholder="Contoh: Edukasi & Utilitas Pionir Gorontalo"
                                  value={newSlideSubtitle}
                                  onChange={(e) => setNewSlideSubtitle(e.target.value)}
                                  className="w-full bg-pch-surface border border-pch-border rounded-xl px-3 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                                />
                              </div>
                            </div>

                            {/* Pilihan File Gambar & URL Gambar Langsung */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                              <div>
                                <label className="text-[11px] font-semibold text-pch-goldLight block mb-1">
                                  1. Unggah Gambar dari Perangkat (Galeri/File)
                                </label>
                                <input 
                                  type="file" 
                                  accept="image/*"
                                  onChange={(e) => {
                                    const file = e.target.files[0];
                                    if (file) {
                                      setNewSlideImageFile(file);
                                      const reader = new FileReader();
                                      reader.onload = (rev) => setNewSlidePreview(rev.target.result);
                                      reader.readAsDataURL(file);
                                    }
                                  }}
                                  className="w-full text-xs text-pch-muted file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:bg-pch-surface file:text-pch-text file:border file:border-pch-border cursor-pointer"
                                />
                              </div>

                              <div>
                                <label className="text-[11px] font-semibold text-pch-muted block mb-1">
                                  2. Atau Masukkan Tautan / URL Gambar Banner
                                </label>
                                <input 
                                  type="url"
                                  placeholder="https://example.com/banner.jpg"
                                  value={newSlideImageUrl}
                                  onChange={(e) => {
                                    setNewSlideImageUrl(e.target.value);
                                    if (e.target.value.trim()) setNewSlidePreview(e.target.value.trim());
                                  }}
                                  className="w-full bg-pch-surface border border-pch-border rounded-xl px-3 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"
                                />
                              </div>
                            </div>

                            {/* Kotak Pratinjau Gambar Langsung (Live Preview Box) */}

                                  <div className="w-20 h-12 rounded-lg overflow-hidden border border-pch-gold/50 shrink-0 bg-black">
                                    <img src={newSlidePreview} alt="Preview" className="w-full h-full object-cover" />
                                  </div>
                                  <div className="truncate text-xs">
                                    <span className="font-bold text-pch-goldLight block">Gambar Terpilih Siap Dipasang</span>
                                    <span className="text-[10px] text-pch-muted truncate block">
                                      {newSlideImageFile ? newSlideImageFile.name : newSlideImageUrl}
                                    </span>
                                  </div>
                                </div>
                                <button
                                  type="button"
                                  onClick={() => {
                                    setNewSlideImageFile(null);
                                    setNewSlideImageUrl("");
                                    setNewSlidePreview("");
                                  }}
                                  className="px-2.5 py-1 rounded-lg bg-pch-secondary border border-pch-border text-[10px] text-pch-muted hover:text-pch-danger"
                                >
                                  Batalkan
                                </button>
                              </div>
                            )}

                            <button
                              type="submit"
                              disabled={isUploadingSlide}
                              className="px-5 py-2.5 rounded-xl bg-pch-gold text-black font-bold text-xs hover:bg-pch-goldLight shadow-gold-glow flex items-center justify-center gap-2 disabled:opacity-50 transition-all cursor-pointer"
                            >
                              <Icons.Upload className="w-4 h-4" />
                              <span>{isUploadingSlide ? "Menyimpan & Menyinkronkan Slide..." : "Unggah & Pasang ke Banner Slide Dashboard"}</span>
                            </button>
                          </form>
                        </div>
                      </div>

                      {/* 2. Generator Redeem Code 90 Detik */}
                      <div className="p-6 rounded-2xl bg-pch-surface border border-pch-border shadow-card-elevated space-y-6">
                        <div className="border-b border-pch-border pb-3 flex items-center justify-between flex-wrap gap-2">
                          <h3 className="font-bold text-base text-pch-text flex items-center gap-2">
                            <Icons.Key className="w-4 h-4 text-pch-gold" />
                            <span>2. Generator Redeem Code 90 Detik (Auto-Delete Realtime)</span>
                          </h3>
                          <span className="text-[10px] px-2.5 py-0.5 rounded-full bg-amber-950/80 text-pch-goldLight border border-pch-gold/40 font-mono font-bold">

                          </span>
                        </div>

                            <label className="text-xs font-semibold text-pch-muted block mb-1">Target Pengguna</label>
                            <select
                              value={newCodeTarget}
                              onChange={(e) => setNewCodeTarget(e.target.value)}
                              className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text focus:outline-none focus:border-pch-purple"

                                <option key={u.id} value={u.username}>@{u.username} — {u.name}</option>

                              value={newCodeCustom}
                              onChange={(e) => setNewCodeCustom(e.target.value)}
                              className="w-full bg-pch-secondary border border-pch-border rounded-xl px-3.5 py-2 text-xs text-pch-text uppercase font-mono focus:outline-none focus:border-pch-purple"

                          </div>
