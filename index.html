                            className="px-5 py-2.5 bg-gradient-to-r from-[#D4AF37] to-[#F5D77A] text-[#08090D] font-bold text-xs rounded-xl shadow-md hover:brightness-110 transition-all"
                          >
                            Simpan Perubahan Identitas
                          </button>
                          {branding.customLogoUrl && (
                            <button
                              type="button"
                              onClick={() => setBranding({ ...branding, customLogoUrl: "" })}
                              className="px-4 py-2 bg-[#111218] border border-[#302A3D] text-[#FF5570] text-xs font-semibold rounded-xl"
                            >
                              Gunakan Logo Segel Bawaan
                            </button>
                          )}
                        </div>
                      </form>
                    </div>

                    {/* 2. Generator Redeem Code 90 Detik */}
                    <div className="bg-[#181922] border border-[#302A3D] rounded-3xl p-6 space-y-4">
                      <div className="flex items-center justify-between">
                        <div>
                          <h3 className="text-sm font-bold text-[#F5D77A] uppercase tracking-wider">
                            2. Generator Kode Akses 90 Detik (Auto-Prune)
                          </h3>
                          <p className="text-xs text-[#AAA6B5]">Kode akan otomatis terhapus saat waktu 90 detik berakhir.</p>
                        </div>
                        <button
                          onClick={() => handleGenerateRedeemCode("all")}
                          className="px-4 py-2 bg-[#8B2CFF] hover:bg-[#8B2CFF]/90 text-white font-bold text-xs rounded-xl shadow-md transition-all"
                        >
                          + Terbitkan Kode Baru (90s)
                        </button>
                      </div>

                      {/* Tabel Kode Akses */}
                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs">
                          <thead className="bg-[#111218] text-[#AAA6B5] border-b border-[#302A3D]">
                            <tr>
                              <th className="p-3">Kode Akses</th>
                              <th className="p-3">Target</th>
                              <th className="p-3">Sisa Waktu</th>
                              <th className="p-3">Aksi WhatsApp</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-[#302A3D]">
                            {redeemCodes.length === 0 ? (
                              <tr>
                                <td colSpan="4" className="p-4 text-center text-[#AAA6B5] italic">
                                  Tidak ada kode akses aktif saat ini.
                                </td>
                              </tr>
                            ) : (
                              redeemCodes.map((c) => {
                                const remainingSec = Math.max(0, Math.round(((c.expiresAtMs || (c.createdAtMs + 90000)) - nowMs) / 1000));
                                return (
                                  <tr key={c.id}>
                                    <td className="p-3 font-mono font-bold text-[#F5D77A]">{c.code}</td>
                                    <td className="p-3 text-[#AAA6B5]">@{c.userTarget || "all"}</td>
                                    <td className="p-3">
                                      <span className={`px-2 py-0.5 rounded text-[11px] font-bold ${
                                        remainingSec <= 15 ? "bg-[#FF5570]/20 text-[#FF5570]" : "bg-[#35D49A]/20 text-[#35D49A]"
                                      }`}>
                                        {remainingSec}s tersisa
                                      </span>
                                    </td>
                                    <td className="p-3">
                                      <button
                                        onClick={() => handleSendCodeViaWhatsapp(c.code, branding.adminWhatsapp, c.userTarget || "anggota")}
                                        className="px-3 py-1 bg-[#25D366]/20 border border-[#25D366]/50 text-[#25D366] rounded-lg text-[11px] font-semibold"
                                      >
                                        Kirim via WA
                                      </button>
                                    </td>
                                  </tr>
                                );
                              })
                            )}
                          </tbody>
                        </table>
                      </div>
                    </div>

                    {/* 3. Daftar Akun Anggota Terdaftar */}
                    <div className="bg-[#181922] border border-[#302A3D] rounded-3xl p-6 space-y-4">
                      <h3 className="text-sm font-bold text-[#F5D77A] uppercase tracking-wider">
                        3. Daftar Anggota Terdaftar di Cloud Supabase ({registeredUsers.length})
                      </h3>
                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs">
                          <thead className="bg-[#111218] text-[#AAA6B5] border-b border-[#302A3D]">
                            <tr>
                              <th className="p-3">Nama</th>
                              <th className="p-3">Username</th>
                              <th className="p-3">No HP / WA</th>
                              <th className="p-3">Email</th>
                              <th className="p-3">Aksi</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-[#302A3D]">
                            {registeredUsers.length === 0 ? (
                              <tr>
                                <td colSpan="5" className="p-4 text-center text-[#AAA6B5] italic">
                                  Belum ada anggota terdaftar.
                                </td>
                              </tr>
                            ) : (
                              registeredUsers.map((u) => (
                                <tr key={u.id || u.username}>
                                  <td className="p-3 font-semibold text-[#F7F5FA]">{u.name}</td>
                                  <td className="p-3 text-[#F5D77A]">@{u.username}</td>
                                  <td className="p-3 text-[#AAA6B5]">{u.phone || "-"}</td>
                                  <td className="p-3 text-[#AAA6B5]">{u.email}</td>
                                  <td className="p-3">
                                    <button
                                      onClick={async () => {
                                        // Tarik detail dossier dari Supabase
                                        if (supabase) {
                                          const { data } = await supabase.from('dossiers').select('*').eq('username', u.username).maybeSingle();
                                          if (data) {
                                            setSelectedDossierDetail({
                                              namaLengkap: data.nama_lengkap,
                                              username: data.username,
                                              nik: data.nik,
                                              noHp: data.no_hp,
                                              ttl: data.ttl,
                                              alamatLengkap: data.alamat_lengkap,
                                              walletPi: data.wallet_pi,
                                              walletOkx: data.wallet_okx,
                                              fotoKtpUrl: data.foto_ktp_url,
                                              fotoKkUrl: data.foto_kk_url,
                                              fotoNpwpUrl: data.foto_npwp_url,
                                              pasfotoUrl: data.pasfoto_url,
                                              ktaUrl: data.kta_url,
                                              extraDocs: data.extra_docs || []
                                            });
                                          } else {
                                            showToast(`Anggota @${u.username} belum mengisi brankas berkas.`, "warning");
                                          }
                                        }
                                      }}
                                      className="px-3 py-1 bg-[#8B2CFF]/20 border border-[#8B2CFF]/50 text-[#B66CFF] rounded-lg text-[11px] font-semibold"
                                    >
                                      Buka Berkas
                                    </button>
                                  </td>
                                </tr>
                              ))
                            )}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                )}
              </main>
            </div>

            {/* Navigasi Bawah Mobile */}
            <nav className="md:hidden fixed bottom-0 left-0 right-0 z-30 bg-[#111218]/95 backdrop-blur-md border-t border-[#302A3D] px-2 py-2 flex items-center justify-around">
              {[
                { id: "dashboard", label: "Beranda", icon: "M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" },
                { id: "vault", label: "Brankas", icon: "M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" },
                { id: "chat", label: "Forum", icon: "M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" },
                { id: "meetings", label: "Rapat", icon: "M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" },
                { id: "profile", label: "Profil", icon: "M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" },
                ...(currentUser?.role === "admin" ? [
                  { id: "admin", label: "Admin", icon: "M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" }
                ] : [])
              ].map((item) => (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`flex flex-col items-center justify-center p-2 rounded-xl transition-all ${
                    activeTab === item.id ? "text-[#F5D77A]" : "text-[#AAA6B5]"
                  }`}
                >
                  <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d={item.icon} />
                  </svg>
                  <span className="text-[10px] mt-0.5">{item.label}</span>
                </button>
              ))}
            </nav>

            {/* Modal Detail Berkas Anggota (Untuk Admin) */}
            {selectedDossierDetail && (
              <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-[#181922] border border-[#302A3D] rounded-3xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-6 space-y-4">
                  <div className="flex items-center justify-between pb-3 border-b border-[#302A3D]">
                    <h3 className="text-base font-bold text-[#F5D77A]">Arsip Berkas: @{selectedDossierDetail.username}</h3>
                    <button onClick={() => setSelectedDossierDetail(null)} className="text-[#AAA6B5] hover:text-white">✕</button>
                  </div>
                  <div className="grid grid-cols-2 gap-3 text-xs">
                    <div>
                      <span className="text-[#AAA6B5]">Nama:</span>
                      <p className="font-bold text-[#F7F5FA]">{selectedDossierDetail.namaLengkap}</p>
                    </div>
                    <div>
                      <span className="text-[#AAA6B5]">NIK:</span>
                      <p className="font-bold text-[#F7F5FA]">{selectedDossierDetail.nik || "-"}</p>
                    </div>
                    <div>
                      <span className="text-[#AAA6B5]">No HP / WA:</span>
                      <p className="font-bold text-[#F7F5FA]">{selectedDossierDetail.noHp}</p>
                    </div>
                    <div>
                      <span className="text-[#AAA6B5]">Domisili:</span>
                      <p className="font-bold text-[#F7F5FA]">{selectedDossierDetail.alamatLengkap || "-"}</p>
                    </div>
                  </div>

                  <div className="pt-2">
                    <h4 className="text-xs font-bold text-[#F5D77A] mb-2 uppercase">Berkas Terunggah</h4>
                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                      {[
                        { label: "Foto KTP", url: selectedDossierDetail.fotoKtpUrl },
                        { label: "Foto KK", url: selectedDossierDetail.fotoKkUrl },
                        { label: "Foto NPWP", url: selectedDossierDetail.fotoNpwpUrl },
                        { label: "Pasfoto", url: selectedDossierDetail.pasfotoUrl },
                        { label: "KTA", url: selectedDossierDetail.ktaUrl }
                      ].map((item, idx) => (
                        <div key={idx} className="p-3 bg-[#111218] border border-[#302A3D] rounded-xl text-center">
                          <p className="text-[11px] font-bold text-[#F7F5FA] mb-1.5">{item.label}</p>
                          {item.url ? (
                            <a
                              href={item.url}
                              target="_blank"
                              rel="noopener noreferrer"
                              className="px-2.5 py-1 bg-[#8B2CFF]/20 text-[#B66CFF] text-[10px] font-bold rounded-lg inline-block"
                            >
                              Lihat Berkas
                            </a>
                          ) : (
                            <span className="text-[10px] text-[#AAA6B5] italic">Kosong</span>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="pt-4 border-t border-[#302A3D] flex justify-end">
                    <button
                      onClick={() => setSelectedDossierDetail(null)}
                      className="px-4 py-2 bg-[#D4AF37] text-black font-bold text-xs rounded-xl"
                    >
                      Tutup
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Modal Dialog Konfirmasi */}
            {confirmDialog.isOpen && (
              <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-[#181922] border border-[#302A3D] rounded-2xl w-full max-w-sm p-6 space-y-4">
                  <h4 className="text-sm font-bold text-[#F7F5FA]">{confirmDialog.title}</h4>
                  <p className="text-xs text-[#AAA6B5]">{confirmDialog.message}</p>
                  <div className="flex gap-2.5 pt-2">
                    <button
                      onClick={() => {
                        if (confirmDialog.onConfirm) confirmDialog.onConfirm();
                        setConfirmDialog({ isOpen: false, title: "", message: "", onConfirm: null });
                      }}
                      className="flex-1 py-2 bg-[#FF5570] text-white font-bold text-xs rounded-xl"
                    >
                      Ya, Lanjutkan
                    </button>
                    <button
                      onClick={() => setConfirmDialog({ isOpen: false, title: "", message: "", onConfirm: null })}
                      className="flex-1 py-2 bg-[#111218] border border-[#302A3D] text-[#AAA6B5] text-xs rounded-xl"
                    >
                      Batal
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Toast Notifikasi */}
            {toast && (
              <div className={`fixed top-4 right-4 z-50 flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl border text-xs font-semibold ${
                toast.type === "success"
                  ? "bg-[#181922] border-[#35D49A] text-[#35D49A]"
                  : toast.type === "danger"
                  ? "bg-[#181922] border-[#FF5570] text-[#FF5570]"
                  : toast.type === "warning"
                  ? "bg-[#181922] border-[#FFB84D] text-[#FFB84D]"
                  : "bg-[#181922] border-[#8B2CFF] text-[#B66CFF]"
              }`}>
                <span>{toast.message}</span>
                <button onClick={() => setToast(null)} className="opacity-70 hover:opacity-100">✕</button>
              </div>
            )}
          </div>
        );
      }

      // Render React ke Root DOM
      const rootElement = document.getElementById("root");
      if (rootElement) {
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
      }
    </script>
  </body>
</html>
