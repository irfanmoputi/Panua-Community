          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
          osc.start(now);
          osc.stop(now + 0.33);
        } else if (type === 'alert' || type === 'meeting' || type === 'user') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(659.25, now + 0.1);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
          osc.start(now);
          osc.stop(now + 0.37);
        } else if (type === 'delete') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.setValueAtTime(160, now + 0.08);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.23);
        }
      } catch (e) {
        // Safe fail jika kebijakan autoplay browser memerlukan interaksi pertama
      }
    };

    function dataURLtoBlob(dataurl) {
      const arr = dataurl.split(',');
      const mime = arr[0].match(/:(.*?);/)[1];
      const bstr = atob(arr[1]);
      let n = bstr.length;
      const u8arr = new Uint8Array(n);
      while(n--){
        u8arr[n] = bstr.charCodeAt(n);
      }
      return new Blob([u8arr], {type:mime});
    }

      const compressImageFile = (file, maxWidth = 1200, quality = 0.75) => {
        return new Promise((resolve) => {
          if (!file || !file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = (e) => resolve({
              name: file ? file.name : "berkas.dat",
              type: file ? file.type : "application/octet-stream",
              base64: e.target.result,
              size: file ? (file.size / (1024 * 1024)).toFixed(2) + " MB" : "0 MB"
            });
            reader.readAsDataURL(file);
            return;
          }

          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              let width = img.width;
              let height = img.height;
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              const compressedBase64 = canvas.toDataURL('image/jpeg', quality);
              const approxKB = Math.round((compressedBase64.length * 3 / 4) / 1024);
              resolve({
                name: file.name,
                type: 'image/jpeg',
                base64: compressedBase64,
                size: approxKB > 1024 ? (approxKB / 1024).toFixed(2) + " MB" : approxKB + " KB"

      const [newGroupDesc, setNewGroupDesc] = useState("");
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedCategory, setSelectedCategory] = useState("Semua");

      // Filtered Groups Memo
      const filteredGroups = useMemo(() => {
        return groups.filter(grp => {
          const matchCat = selectedCategory === "Semua" || grp.category === selectedCategory;
          const matchSearch = !searchQuery.trim() || 
            grp.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
            grp.description.toLowerCase().includes(searchQuery.toLowerCase());
          return matchCat && matchSearch;
        });
      }, [groups, selectedCategory, searchQuery]);

      // =======================================================================
      // FETCH DATA LENGKAP DARI SUPABASE (PARALLEL & RESILIENT AUTO-SYNC)
      // Modul Rapat Online dipisahkan 100% mandiri agar bebas pemblokiran Google Meet & WebRTC
      // =======================================================================
      const fetchLatestFromSupabase = useCallback(async (isSilent = true) => {
        if (!supabase) return;

        try {
          // Hanya sinkronkan pengguna, berkas, branding, kode akses, chat, dan grup
          const [usersRes, dosRes, brandRes, codesRes, chatRes, groupsRes, membershipsRes] = await Promise.allSettled([
            supabase.from('users_registry').select('*').order('created_at', { ascending: false }),
            supabase.from('dossiers').select('*').order('updated_at', { ascending: false }),
            supabase.from('app_branding').select('*').limit(1).maybeSingle(),
            supabase.from('redeem_codes').select('*').eq('is_active', true),
            supabase.from('chat_messages').select('*').order('created_at', { ascending: true }).limit(80),
            supabase.from('community_groups').select('*').order('created_at', { ascending: false }),
            supabase.from('group_memberships').select('*')
          ]);

          // 1. Sinkronisasi Pengguna Terdaftar (users_registry)

            setRegisteredUsers(usersRes.value.data.map(u => ({
              id: u.id,
              name: u.name,
              username: u.username,
              email: u.email,
              phone: u.phone,
              role: u.role || 'member',
              bio: u.bio,
              avatarUrl: u.avatar_url,
              registeredAt: new Date(u.created_at).toLocaleDateString('id-ID')
            })));
          }

          // 2. Sinkronisasi Arsip Berkas Brankas (dossiers)
          if (dosRes.status === 'fulfilled' && !dosRes.value.error && Array.isArray(dosRes.value.data)) {
            const mapped = dosRes.value.data.map(d => ({
              id: d.id,
              userId: d.user_id,
              username: d.username,
              namaLengkap: d.nama_lengkap,
              email: d.email,
              noHp: d.no_hp,
              usernamePi: d.username_pi,
              ttl: d.ttl,
              nik: d.nik,
              alamatLengkap: d.alamat_lengkap,
              namaRekening: d.nama_rekening,
              rekening: d.no_rekening,
              walletPi: d.wallet_pi,
              walletOkx: d.wallet_okx,
              fotoKtpUrl: d.foto_ktp_url,
              fotoKkUrl: d.foto_kk_url,
              fotoNpwpUrl: d.foto_npwp_url,
              pasfotoUrl: d.pasfoto_url,

              extraDocs: d.extra_docs || [],

              status: d.status || "Tersimpan di Cloud Supabase",
              lastUpdate: new Date(d.updated_at).toLocaleDateString('id-ID')
            }));
            setSubmittedDossiers(mapped);

            // FIX: Hanya populate dossier awal dari Cloud jika user belum mengeditnya (mencegah karakter terhapus otomatis saat mengetik)
            if (user && user.role !== 'admin' && !isDossierDirtyRef.current && !dossierLoadedOnceRef.current) {
              const myDos = mapped.find(d => d.username?.toLowerCase() === user.username?.toLowerCase() || d.userId === user.id);
              if (myDos) {
                dossierLoadedOnceRef.current = true;
                setMemberDossier({
                  namaLengkap: myDos.namaLengkap || user.name || "",
                  email: myDos.email || user.email || "",
                  noHp: myDos.noHp || user.phone || "",
                  usernamePi: myDos.usernamePi || "",
                  ttl: myDos.ttl || "",
                  nik: myDos.nik || "",
                  alamatLengkap: myDos.alamatLengkap || "",
                  namaRekening: myDos.namaRekening || "",
                  noRekening: myDos.rekening || "",
                  walletPi: myDos.walletPi || "",
                  walletOkx: myDos.walletOkx || "",
                  fotoKtp: myDos.fotoKtpUrl ? { name: "KTP Elektronik Terunggah", driveUrl: myDos.fotoKtpUrl } : null,
                  fotoKk: myDos.fotoKkUrl ? { name: "Kartu Keluarga Terunggah", driveUrl: myDos.fotoKkUrl } : null,
                  fotoNpwp: myDos.fotoNpwpUrl ? { name: "NPWP Terunggah", driveUrl: myDos.fotoNpwpUrl } : null,
                  pasfoto: myDos.pasfotoUrl ? { name: "Pasfoto Formal Terunggah", driveUrl: myDos.pasfotoUrl } : null,
                  kartuKeanggotaan: myDos.ktaUrl ? { name: "KTA Panua Terunggah", driveUrl: myDos.ktaUrl } : null,
                  extraDocs: myDos.extraDocs || [],
                  isSavedToAdmin: true,
                  lastSynced: "Tersimpan di Cloud (" + myDos.lastUpdate + ")"
                });
              } else {
                dossierLoadedOnceRef.current = true;
                setMemberDossier(prev => ({
                  ...prev,
                  namaLengkap: prev.namaLengkap || user.name || "",
                  email: prev.email || user.email || "",
                  noHp: prev.noHp || user.phone || ""
                }));
              }
            }
          }

          // 3. Sinkronisasi Branding & Dana Talangan
          if (brandRes.status === 'fulfilled' && brandRes.value.data) {
            const b = brandRes.value.data;
            const fetchedBranding = {
              title: b.title || "PANUA COMMUNITY",
              tagline: b.tagline || "Pi Network Gorontalo - Indonesia",
              logoType: b.logo_type || "panua",
              customLogoUrl: b.custom_logo_url || "",
              meetingProvider: b.meeting_provider || "mirotalk",
              adminWhatsapp: b.admin_whatsapp || "6281299887766",
              danaNumber: b.dana_number || "081299887766",
              danaName: b.dana_name || "PANUA COMMUNITY GORONTALO",
              qrisImageUrl: b.qris_image_url || "",
              danaDescription: b.dana_description || "Wadah dana talangan dan solidaritas gotong royong resmi Panua Community Gorontalo untuk mendukung anggota dan kelancaran kegiatan komunitas."
            };
            setAppBranding(fetchedBranding);
            setBrandingDraft(prev => ({
              ...fetchedBranding,
              ...prev
            }));
          }

          // 4. Sinkronisasi Redeem Codes
          if (codesRes.status === 'fulfilled' && Array.isArray(codesRes.value.data)) {
            const now = Date.now();
            const validCodes = codesRes.value.data
              .filter(c => now < Number(c.expires_at_ms))
              .map(c => ({
                code: c.code,
                userTarget: c.user_target,
                createdBy: c.created_by,
                note: c.note,
                createdAt: Number(c.created_at_ms),
                expiresAt: Number(c.expires_at_ms)
              }));
            setActiveRedeemCodes(validCodes);
          }

          // 5. Sinkronisasi Pesan Chat
          if (chatRes.status === 'fulfilled' && Array.isArray(chatRes.value.data)) {
            setChatMessages(chatRes.value.data.map(c => ({
              id: c.id,
              sender: c.sender,
              userId: c.user_id,
              isMe: user ? (c.user_id === user.id || c.sender === user.name) : false,
              text: c.text,
              time: c.time,
              replyTo: c.reply_to
            })));
          }

          // 6. Sinkronisasi Grup Panua & Keanggotaan (community_groups & group_memberships)
          const joinedIds = new Set();
          if (membershipsRes.status === 'fulfilled' && Array.isArray(membershipsRes.value.data)) {
            membershipsRes.value.data.forEach(mb => {
              if (user && (mb.user_id === user.id || mb.username === user.username)) {
                joinedIds.add(mb.group_id);
              }
            });
          }
          setUserJoinedGroupIds(joinedIds);

          if (groupsRes.status === 'fulfilled' && Array.isArray(groupsRes.value.data)) {
            setGroups(groupsRes.value.data.map(g => ({
              id: g.id,
              name: g.name,
              category: g.category || 'Umum',
              memberCount: g.member_count || 1,
              isOfficial: !!g.is_official,
              joined: joinedIds.has(g.id),
              description: g.description || '',
              createdBy: g.created_by || ''
            })));
          }

          setIsRealtimeActive(true);
          if (!isSilent) {
            triggerToast("Database Cloud Supabase berhasil disinkronkan!", "success");
          }
        } catch (err) {
          console.error("Gagal sinkron data Supabase:", err);
          if (!isSilent) {
            triggerToast("Gagal mengambil data dari Supabase: " + err.message, "danger");
          }
        }
      }, [supabase, user]);

      // =======================================================================
      // CONTINUOUS REALTIME ENGINE & HIGH-FREQUENCY 3-SECOND AUTO-SYNC
      // =======================================================================
      useEffect(() => {
        if (!supabase) {
          setIsRealtimeActive(false);
          return;
        }

        fetchLatestFromSupabase(true);

        let channel;
        if (!isWebSocketRestricted && !SafeRealtimeTransport.isRestricted) {
          try {
            channel = supabase.channel('panua_auto_stream_' + Date.now())
              .on('postgres_changes', { event: '*', schema: 'public', table: 'users_registry' }, (payload) => {
                fetchLatestFromSupabase(true);
                if (payload.eventType === 'INSERT' && user?.role === 'admin') {
                  playNotificationSound('user');
                  triggerToast(`Pendaftaran Realtime: @${payload.new?.username || 'Anggota'} baru saja masuk!`, "success");
                }
              })
              .on('postgres_changes', { event: '*', schema: 'public', table: 'dossiers' }, (payload) => {
                fetchLatestFromSupabase(true);
                if (user?.role === 'admin') {
                  triggerToast(`Brankas @${payload.new?.username || 'Anggota'} baru saja diperbarui di Cloud!`, "success");
                }
              })
              .on('postgres_changes', { event: '*', schema: 'public', table: 'redeem_codes' }, () => {
                fetchLatestFromSupabase(true);
              })
              .on('postgres_changes', { event: '*', schema: 'public', table: 'chat_messages' }, (payload) => {
                fetchLatestFromSupabase(true);
                if (payload.eventType === 'INSERT') {
                  const newSender = payload.new?.sender;
                  if (user && newSender !== user.name) {
                    playNotificationSound('chat');
                    if (activeTabRef.current !== 'chat') {
                      setUnreadChatCount(prev => prev + 1);
                    }
                  }
                }
              })
              .on('postgres_changes', { event: '*', schema: 'public', table: 'community_groups' }, () => {
                fetchLatestFromSupabase(true);
              })
              .on('postgres_changes', { event: '*', schema: 'public', table: 'group_memberships' }, () => {
                fetchLatestFromSupabase(true);
              })
              .subscribe((status, err) => {
                if (status === 'SUBSCRIBED') {
                  setIsRealtimeActive(true);
                } else if (err || status === 'CHANNEL_ERROR') {
                  SafeRealtimeTransport.isRestricted = true;
                }
              });
          } catch (subErr) {
            console.warn("Realtime channel notice:", subErr);
            SafeRealtimeTransport.isRestricted = true;
          }
        } else {
          setIsRealtimeActive(true);
        }

        const autoSyncTimer = setInterval(() => {
          fetchLatestFromSupabase(true);
        }, 3000);

        const handleAutoFocusSync = () => fetchLatestFromSupabase(true);
        window.addEventListener('focus', handleAutoFocusSync);
        document.addEventListener('visibilitychange', handleAutoFocusSync);

        return () => {
          clearInterval(autoSyncTimer);
          window.removeEventListener('focus', handleAutoFocusSync);
          document.removeEventListener('visibilitychange', handleAutoFocusSync);
          if (channel && supabase) {
            supabase.removeChannel(channel);
          }
        };
      }, [supabase, fetchLatestFromSupabase, user?.role]);

      // Scroll Chat otomatis ke bawah
      useEffect(() => {
        if (activeTab === "chat" && chatScrollRef.current) {
          chatScrollRef.current.scrollTop = chatScrollRef.current.scrollHeight;
        }
      }, [chatMessages, activeTab]);

      // Auto-sync instan saat tab dibuka
      useEffect(() => {
        if (supabase) {
          fetchLatestFromSupabase(true);
        }
      }, [activeTab, supabase, fetchLatestFromSupabase]);

      // Upload Helper ke Supabase Storage
      const uploadFileToSupabaseStorage = async (fileObj, pathPrefix) => {
        if (!supabase || !fileObj) return "";
        try {
          let blob;
          let fileName = "file_" + Date.now() + ".jpg";

          if (fileObj.base64 && typeof fileObj.base64 === 'string') {
            blob = dataURLtoBlob(fileObj.base64);
            fileName = fileObj.name || fileName;
          } else if (fileObj instanceof File || fileObj instanceof Blob) {
            blob = fileObj;
            fileName = fileObj.name || fileName;
          } else {
            return typeof fileObj === 'string' ? fileObj : "";
          }

          const cleanFileName = fileName.replace(/[^a-zA-Z0-9._-]/g, '_');
          const filePath = `${pathPrefix}/${Date.now()}_${cleanFileName}`;

          const { error } = await supabase.storage
            .from('pch_secure_vault')
            .upload(filePath, blob, {
              cacheControl: '3600',
              upsert: true
            });

          if (error) {
            console.error("Storage upload error:", error);
            return fileObj.base64 || "";
          }

          const { data: urlData } = supabase.storage
            .from('pch_secure_vault')
            .getPublicUrl(filePath);

          return urlData?.publicUrl || "";
        } catch (err) {
          console.error("Storage error:", err);
          return fileObj.base64 || "";
        }
      };

      // Handler Login Submit
      const handleLoginSubmit = async (e) => {
        e.preventDefault();
        const id = loginIdentifier.trim().toLowerCase();
        const pwd = loginPassword;

        // 1. Verifikasi Admin
        if (_authGateway.verify(id, pwd)) {
          const adminSession = _authGateway.createAdminSession(appBranding.adminWhatsapp);
          setUser(adminSession);
          setIsAuthenticated(true);
          triggerToast("Selamat datang, Administrator Utama!", "success");
          return;
        }

        // 2. Verifikasi Anggota dari Database Supabase
        if (!supabase) {
          triggerToast("Koneksi server Supabase belum terpasang di perangkat ini. Hubungi Admin.", "danger");
          return;
        }

        try {
          const { data: member, error } = await supabase
            .from('users_registry')
            .select('*')
            .or(`username.ilike.${id},email.ilike.${id}`)
            .limit(1)
            .maybeSingle();

          if (error) {
            triggerToast("Gagal menghubungi database: " + error.message, "danger");
            return;
          }

          if (member) {
            const memberSession = {
              id: member.id,
              name: member.name,
              username: member.username,
              email: member.email,
              phone: member.phone,
              role: member.role || 'member',
              bio: member.bio,
              avatarUrl: member.avatar_url,
              registeredAt: new Date(member.created_at).toLocaleDateString('id-ID')
            };
            setUser(memberSession);
            setIsAuthenticated(true);
            triggerToast(`Selamat datang kembali, ${member.name}!`, "success");
            return;
          }

          triggerToast("Email atau Username tidak ditemukan di database komunitas!", "danger");
        } catch (err) {
          triggerToast("Terjadi kendala jaringan: " + err.message, "danger");
        }
      };

      // Handler Registrasi (MURNI CLOUD-FIRST REALTIME KE SUPABASE)
      const handleRegisterSubmit = async (e) => {
        e.preventDefault();
        if (!regName.trim() || !regUsername.trim() || !regEmail.trim() || !regPhone.trim() || !regPassword) {
          triggerToast("Lengkapi semua field pendaftaran termasuk No HP!", "warning");
          return;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(regEmail.trim())) {
          triggerToast("Format email tidak valid!", "warning");
          return;
        }

        if (regPassword.length < 6) {
          triggerToast("Password minimal 6 karakter!", "warning");
          return;
        }

        if (regPassword !== regConfirmPassword) {
          triggerToast("Konfirmasi password tidak cocok!", "danger");
          return;
        }

        if (!regAgreed) {
          triggerToast("Harap setujui syarat dan ketentuan komunitas!", "warning");
          return;
        }

        if (!supabase) {
          triggerToast("Koneksi server Supabase belum terhubung. Hubungi Admin.", "danger");
          return;
        }

        setIsRegistering(true);
        const cleanUsername = regUsername.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');

        try {
          // Cek apakah username atau email sudah terdaftar
          const { data: existing, error: checkErr } = await supabase
            .from('users_registry')
            .select('username, email')
            .or(`username.ilike.${cleanUsername},email.ilike.${regEmail.trim()}`)
            .limit(1)
            .maybeSingle();

          if (existing) {
            if (existing.username.toLowerCase() === cleanUsername) {
              triggerToast(`Username @${cleanUsername} sudah digunakan! Gunakan username lain.`, "danger");
            } else {
              triggerToast("Email tersebut sudah terdaftar! Silakan login.", "danger");
            }
            setIsRegistering(false);
            return;
          }

          const newUser = {
            id: "usr-" + Date.now(),
            username: cleanUsername,
            name: regName.trim(),
            email: regEmail.trim(),
            phone: regPhone.trim(),
            role: "member",
            bio: "Anggota resmi Panua Community Gorontalo.",
            public_wallet: "",
            avatar_url: ""
          };

          const { error: insertErr } = await supabase
            .from('users_registry')
            .insert([newUser]);

          if (insertErr) {
            throw insertErr;
          }

          // Otomatis buat dossier awal di cloud
          await supabase.from('dossiers').upsert([{
            id: "dos-" + cleanUsername,
            user_id: newUser.id,
            username: cleanUsername,
            nama_lengkap: newUser.name,
            email: newUser.email,
            no_hp: newUser.phone,
            status: "Tersimpan di Cloud Supabase",
            updated_at: new Date().toISOString()
          }], { onConflict: 'id' });

          setUser(newUser);
          setIsAuthenticated(true);
          playNotificationSound('user');
          triggerToast(`Selamat datang @${cleanUsername}! Akun Anda berhasil terdaftar di Cloud Supabase.`, "success");
        } catch (err) {
          console.error("Register error:", err);
          triggerToast("Gagal mendaftar ke Cloud: " + (err.message || "Terjadi kesalahan"), "danger");
        } finally {
          setIsRegistering(false);
        }
      };

      // Handler Forgot Password
      const handleForgotSubmit = (e) => {
        e.preventDefault();
        if (!forgotEmail.trim()) {
          triggerToast("Masukkan alamat email Anda!", "warning");
          return;
        }
        setForgotSent(true);
        triggerToast("Instruksi pemulihan telah dikirim ke email.", "success");
      };

      // Handler Logout Sesi
      const handleLogoutSession = () => {
        isDossierDirtyRef.current = false;
        dossierLoadedOnceRef.current = false;
        setUser(null);
        setIsAuthenticated(false);
        setVaultUnlockedUntil(0);
        localStorage.removeItem('panua_active_session');
        localStorage.removeItem('panua_vault_unlock_until');
        triggerToast("Anda telah keluar dari sesi.", "normal");
      };

      const handleProfilePhotoUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        if (file.size > 2 * 1024 * 1024) {
          triggerToast("Ukuran foto maksimal 2MB!", "danger");
          return;
        }

        const compressed = await compressImageFile(file, 600, 0.8);
        let photoUrl = compressed.base64;

        if (supabase) {
          triggerToast("Mengunggah foto profil ke Cloud...", "warning");
          const cloudUrl = await uploadFileToSupabaseStorage(compressed, `avatars/${user.username}`);
          if (cloudUrl) photoUrl = cloudUrl;

          await supabase.from('users_registry').update({ avatar_url: photoUrl }).eq('id', user.id);
        }

        setUser(prev => ({ ...prev, avatarUrl: photoUrl }));
        triggerToast("Foto profil Panua Community Anda berhasil diperbarui!", "success");
      };

      // VERIFIKASI REDEEM CODE 90 DETIK -> AKSES BRANKAS 1 JAM
      const handleUnlockVault = async (e) => {
        e.preventDefault();
        const codeTrim = vaultRedeemInput.trim().toUpperCase();
        if (!codeTrim) {
          triggerToast("Masukkan Redeem Code / Token Akses!", "warning");
          return;
        }

        const grantVaultAccessOneHour = () => {
          const oneHourMs = 60 * 60 * 1000;
          const expiryTime = Date.now() + oneHourMs;
          setVaultUnlockedUntil(expiryTime);
          localStorage.setItem('panua_vault_unlock_until', String(expiryTime));
          setVaultRedeemInput("");
          triggerToast("Akses Brankas Diterima! Sesi aktif selama 1 Jam.", "success");
        };

        if (user?.role === "admin") {
          grantVaultAccessOneHour();
          return;
        }

        const now = Date.now();
        const matchedLocal = activeRedeemCodes.find(c => 
          c.code === codeTrim && 
          (c.userTarget === "all" || c.userTarget?.toLowerCase() === user?.username?.toLowerCase()) &&
          now < c.expiresAt
        );

        if (matchedLocal) {
          grantVaultAccessOneHour();
          return;
        }

        if (supabase) {
          setIsVerifyingCode(true);
          try {
            const { data, error } = await supabase
              .from('redeem_codes')
              .select('*')
              .eq('code', codeTrim)
              .eq('is_active', true)
              .maybeSingle();

            if (data) {
              const expiresMs = Number(data.expires_at_ms);
              const target = (data.user_target || 'all').toLowerCase();
              const myUser = (user?.username || '').toLowerCase();

              if (now < expiresMs && (target === 'all' || target === myUser)) {
                grantVaultAccessOneHour();
                return;
              } else if (now >= expiresMs) {
                triggerToast("Redeem Code telah kedaluwarsa (> 90 detik). Minta kode baru ke Admin.", "danger");
                return;
              } else {
                triggerToast("Redeem Code ini diterbitkan untuk pengguna lain.", "danger");
                return;
              }
            } else {
              triggerToast("Kode Akses tidak valid atau sudah kedaluwarsa.", "danger");
            }
          } catch (err) {
            triggerToast("Gagal memverifikasi kode: " + err.message, "danger");
          } finally {
            setIsVerifyingCode(false);
          }
        } else {
          triggerToast("Kode Akses tidak valid atau sudah kedaluwarsa.", "danger");
        }
      };

      const handleSaveSupabaseConfig = async (url, key) => {
        const cleanUrl = cleanSupabaseUrl(url);
        const cleanKey = (key || '').trim();

        if (!cleanUrl || !cleanKey) {
          triggerToast("Masukkan Project URL & Anon Key Supabase!", "danger");
          return;
        }

        setIsTestingSupabase(true);
        triggerToast("Menguji koneksi ke server Supabase...", "warning");

        try {
          if (!window.supabase) {
            throw new Error("Supabase SDK belum termuat di browser!");
          }
          const testClient = window.supabase.createClient(cleanUrl, cleanKey, {
            auth: { persistSession: false },
            realtime: { transport: SafeRealtimeTransport }
          });
          const { error } = await testClient.from('users_registry').select('id').limit(1);

          if (error) {
            if (error.code === '42P01' || error.message?.includes('relation')) {
              triggerToast("Koneksi berhasil, namun tabel belum dibuat! Harap jalankan supabase_schema.sql di SQL Editor.", "warning");
            } else if (error.code === 'PGRST301' || error.message?.includes('JWT') || error.message?.includes('apikey')) {
              triggerToast("Anon Public Key tidak valid! Periksa kembali key Supabase Anda.", "danger");
              setIsTestingSupabase(false);
              return;
            }
          }

          localStorage.setItem('panua_supabase_url', cleanUrl);
          localStorage.setItem('panua_supabase_key', cleanKey);
          setSupabaseConfig({
            url: cleanUrl,
            key: cleanKey
          });
          setShowSupabaseSettingsModal(false);
          triggerToast("Berhasil terhubung ke Supabase Cloud secara Realtime!", "success");
        } catch (err) {
          console.error("Test connection error:", err);
          triggerToast("Gagal terhubung: " + err.message, "danger");
        } finally {
          setIsTestingSupabase(false);
        }
      };

      const handleRequestCodeViaWhatsapp = () => {
        const adminNumber = appBranding.adminWhatsapp.replace(/\D/g, '');
        const message = `Halo Admin ${appBranding.title} (Gorontalo),\n\nSaya ingin meminta Kode Akses / Redeem Code untuk membuka menu My Secure Vault:\nNama: ${user.name}\nUsername: ${user.username}\nEmail: ${user.email}\nNo HP: ${user.phone || '-'}\n\nMohon buatkan kode akses 90 detik untuk sesi 1 jam di Supabase. Terima kasih!`;
        const waUrl = `https://wa.me/${adminNumber}?text=${encodeURIComponent(message)}`;
        window.open(waUrl, '_blank');
        triggerToast("Membuka WhatsApp untuk mengirim permohonan ke Admin...");
      };

      const handleAdminSendDossierViaWA = (dossier, codeToSend = "") => {
        if (!dossier.noHp) {
          triggerToast("Nomor HP anggota tidak tersedia!", "warning");
          return;
        }
        const cleanNumber = dossier.noHp.replace(/\D/g, '').replace(/^0/, '62');
        let text = `Halo Sdr/i ${dossier.namaLengkap},\n\nAdmin ${appBranding.title} (Gorontalo) menyampaikan informasi arsip brankas Anda:\n• Status Dokumen: Tersimpan di Supabase Realtime Storage\n• NIK: ${dossier.nik}\n• Username Pi: ${dossier.usernamePi}\n• Rekening: ${dossier.rekening}\n`;
        if (codeToSend) {
          text += `\n🔑 KODE AKSES / REDEEM CODE BRANKAS (BERLAKU 90 DETIK):\n👉 *${codeToSend}*\n⚠️ *PENTING:* Kode ini aktif selama tepat 90 detik (1.5 menit). Harap segera masukkan di aplikasi untuk membuka My Secure Vault selama 1 Jam.\n`;
        } else {
          text += `\n⚠️ Belum ada kode aktif. Silakan minta admin membuatkan kode akses 90 detik baru.\n`;
        }
        text += `\nSalam Komunitas Panua Pi Network Gorontalo!`;

        const waUrl = `https://wa.me/${cleanNumber}?text=${encodeURIComponent(text)}`;
        window.open(waUrl, '_blank');
        triggerToast(`Membuka WhatsApp ke ${dossier.namaLengkap}...`);
      };

      // SIMPAN 15 BERKAS DOSSIER KE CLOUD SUPABASE
      const handleSaveAndSendDossierToAdmin = async () => {
        if (!supabase) {
          triggerToast("Gagal: Database Cloud Supabase belum terhubung!", "danger");
          return;
        }

        setIsSavingDossier(true);
        triggerToast("Mengunggah berkas ke Supabase Storage & Database Realtime...", "warning");

        try {
          let ktpUrl = memberDossier.fotoKtp?.driveUrl || "";
          let kkUrl = memberDossier.fotoKk?.driveUrl || "";
          let npwpUrl = memberDossier.fotoNpwp?.driveUrl || "";
          let pasfotoUrl = memberDossier.pasfoto?.driveUrl || "";
          let ktaUrl = memberDossier.kartuKeanggotaan?.driveUrl || "";

          const prefix = `dossiers/${user.username}`;
          if (memberDossier.fotoKtp?.base64 && !ktpUrl) ktpUrl = await uploadFileToSupabaseStorage(memberDossier.fotoKtp, `${prefix}/ktp`);
          if (memberDossier.fotoKk?.base64 && !kkUrl) kkUrl = await uploadFileToSupabaseStorage(memberDossier.fotoKk, `${prefix}/kk`);
          if (memberDossier.fotoNpwp?.base64 && !npwpUrl) npwpUrl = await uploadFileToSupabaseStorage(memberDossier.fotoNpwp, `${prefix}/npwp`);
          if (memberDossier.pasfoto?.base64 && !pasfotoUrl) pasfotoUrl = await uploadFileToSupabaseStorage(memberDossier.pasfoto, `${prefix}/pasfoto`);
          if (memberDossier.kartuKeanggotaan?.base64 && !ktaUrl) ktaUrl = await uploadFileToSupabaseStorage(memberDossier.kartuKeanggotaan, `${prefix}/kta`);

          const updatedDossier = {
            ...memberDossier,
            fotoKtp: ktpUrl ? { name: "KTP Elektronik Terunggah", driveUrl: ktpUrl } : memberDossier.fotoKtp,
            fotoKk: kkUrl ? { name: "Kartu Keluarga Terunggah", driveUrl: kkUrl } : memberDossier.fotoKk,
            fotoNpwp: npwpUrl ? { name: "NPWP Terunggah", driveUrl: npwpUrl } : memberDossier.fotoNpwp,
            pasfoto: pasfotoUrl ? { name: "Pasfoto Formal Terunggah", driveUrl: pasfotoUrl } : memberDossier.pasfoto,
            kartuKeanggotaan: ktaUrl ? { name: "KTA Panua Terunggah", driveUrl: ktaUrl } : memberDossier.kartuKeanggotaan,
            isSavedToAdmin: true,
            lastSynced: new Date().toLocaleDateString('id-ID') + ", " + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + " WITA"
          };

          setMemberDossier(updatedDossier);

          const dossierId = "dos-" + user.username.replace(/[^a-zA-Z0-9]/g, '_');
          const totalDocs = (ktpUrl ? 1 : 0) + (kkUrl ? 1 : 0) + (npwpUrl ? 1 : 0) + (pasfotoUrl ? 1 : 0) + (ktaUrl ? 1 : 0) + (updatedDossier.extraDocs?.length || 0);

          const { error: upsertErr } = await supabase.from('dossiers').upsert([
            {
              id: dossierId,
              user_id: user.id,
              username: user.username,
              nama_lengkap: updatedDossier.namaLengkap,
              email: updatedDossier.email,
              no_hp: updatedDossier.noHp,
              username_pi: updatedDossier.usernamePi,
              ttl: updatedDossier.ttl,
              nik: updatedDossier.nik,
              alamat_lengkap: updatedDossier.alamatLengkap,
              nama_rekening: updatedDossier.namaRekening,
              no_rekening: updatedDossier.noRekening,
              wallet_pi: updatedDossier.walletPi,
              wallet_okx: updatedDossier.walletOkx,
              foto_ktp_url: ktpUrl,
              foto_kk_url: kkUrl,
              foto_npwp_url: npwpUrl,
              pasfoto_url: pasfotoUrl,
              kta_url: ktaUrl,
              extra_docs: updatedDossier.extraDocs || [],
              docs_count: totalDocs,
              status: 'Tersimpan di Cloud Supabase Realtime',
              updated_at: new Date().toISOString()
            }
          ], { onConflict: 'id' });

          if (upsertErr) {
            console.error("Dossier upsert error:", upsertErr);
            triggerToast("Gagal simpan ke Supabase: " + upsertErr.message, "danger");
          } else {
            isDossierDirtyRef.current = false;
            triggerToast("Sukses! 15 Berkas & Identitas tersimpan di Cloud Supabase Realtime!", "success");
          }
        } catch (err) {
          console.error("Error saving dossier:", err);
          triggerToast("Gagal mengunggah berkas. Periksa koneksi internet Anda.", "danger");
        } finally {
          setIsSavingDossier(false);
        }
      };
      // Simpan Branding & Dana Talangan oleh Admin
      const handleSaveBranding = async () => {
        if (!brandingDraft.title.trim()) {
          triggerToast("Nama judul aplikasi tidak boleh kosong!", "danger");
          return;
        }

        setAppBranding({ ...brandingDraft });

        if (supabase) {
          try {
            await supabase.from('app_branding').upsert([
              {
                id: 'primary',
                title: brandingDraft.title,
                tagline: brandingDraft.tagline,
                logo_type: brandingDraft.logoType,
                custom_logo_url: brandingDraft.customLogoUrl,
                admin_whatsapp: brandingDraft.adminWhatsapp,
                meeting_provider: brandingDraft.meetingProvider,
                dana_number: brandingDraft.danaNumber,
                dana_name: brandingDraft.danaName,
                qris_image_url: brandingDraft.qrisImageUrl,
                dana_description: brandingDraft.danaDescription,
                updated_at: new Date().toISOString()
              }
            ], { onConflict: 'id' });
            triggerToast("Identitas & Pengaturan Dana Talangan tersimpan di Cloud!", "success");
          } catch (err) {
            console.error("Supabase branding error:", err);
            triggerToast("Gagal menyimpan ke database: " + err.message, "danger");
          }
        }
      };

      // Helper Konfirmasi Dana Talangan ke WhatsApp Admin
      const handleSendDanaConfirmationWA = () => {
        const adminNumber = (appBranding.adminWhatsapp || "6281299887766").replace(/\D/g, '');
        const sender = danaConfirmSender.trim() || user?.name || "Pionir Panua";
        const nominal = danaConfirmNominal.trim() || "Sukarela";
        const note = danaConfirmNote.trim() || "Dukungan & Solidaritas Panua Gorontalo";
        const text = `📢 *KONFIRMASI DANA TALANGAN & SOLIDARITAS — ${appBranding.title}*\n\nHalo Admin,\nSaya telah melakukan transfer dukungan dana talangan komunitas:\n\n👤 *Nama Pengirim:* ${sender} (@${user?.username || 'user'})\n💰 *Nominal:* Rp ${nominal}\n💳 *Metode:* ${danaConfirmMethod}\n📝 *Catatan / Doa:* ${note}\n\n(Bukti tangkapan layar transfer saya lampirkan di chat ini). Terima kasih atas amanahnya, salam sukses Pionir Panua!`;
        window.open(`https://wa.me/${adminNumber}?text=${encodeURIComponent(text)}`, '_blank');
        triggerToast("Membuka WhatsApp untuk mengirim bukti transfer ke Admin...");
      };

      const handleAddExtraDocument = async (e) => {
        e.preventDefault();
        if (!newExtraDocTitle.trim()) {
          triggerToast("Masukkan judul dokumen tambahan!", "warning");
          return;
        }
        let docObj = null;
        if (newExtraDocFile) {
          docObj = await compressImageFile(newExtraDocFile);
        }
        const newDoc = {
          id: "extra-" + Date.now(),
          title: newExtraDocTitle.trim(),
          fileName: newExtraDocFile ? newExtraDocFile.name : "dokumen_tambahan.dat",
          size: docObj ? docObj.size : "0 KB",
          base64: docObj ? docObj.base64 : ""
        };
        isDossierDirtyRef.current = true;
        setMemberDossier(prev => ({
          ...prev,
          extraDocs: [...(prev.extraDocs || []), newDoc]
        }));
        setNewExtraDocTitle("");
        setNewExtraDocFile(null);
        triggerToast(`Dokumen "${newDoc.title}" siap disimpan ke Supabase!`);
      };

      // GENERATOR REDEEM CODE 90 DETIK
      const handleAdminCreateRedeemCode = async (e) => {
        e.preventDefault();
        const code = newCodeCustom.trim().toUpperCase() || "PANUA-" + Math.floor(100000 + Math.random() * 900000);
        const now = Date.now();
        const newEntry = {
          code: code,
          userTarget: newCodeTarget,
          createdBy: user.username,
          note: newCodeNote.trim() || "Akses Brankas 90 Detik",
          createdAt: now,
          expiresAt: now + 90000
        };

        setActiveRedeemCodes(prev => [newEntry, ...prev.filter(c => now < c.expiresAt)]);
        setNewCodeCustom("");
        setNewCodeNote("");
        triggerToast(`Redeem Code [${code}] aktif 90 detik untuk: ${newCodeTarget}!`, "success");

        if (supabase) {
          try {
            await supabase.from('redeem_codes').insert([
              {
                id: "code-" + now,
                code: newEntry.code,
                user_target: newEntry.userTarget,
                created_by: newEntry.createdBy,
                note: newEntry.note,
                created_at_ms: newEntry.createdAt,
                expires_at_ms: newEntry.expiresAt,
                is_active: true
              }
            ]);
          } catch (err) {
            console.error("Supabase insert code error:", err);
          }
        }
      };

      // Handler Chat Pesan
      const handleSendMessage = async (e) => {
        e.preventDefault();
        if (!chatInput.trim()) return;
        const newMsg = {
          id: "m-" + Date.now(),
          sender: user.name,
          userId: user.id,
          isMe: true,
          text: chatInput.trim(),
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          replyTo: replyingTo ? replyingTo.text.slice(0, 35) + "..." : null
        };

        setChatMessages(prev => [...prev, newMsg]);
        setChatInput("");
        setReplyingTo(null);

        if (supabase) {
          try {
            await supabase.from('chat_messages').insert([
              {
                id: newMsg.id,
                sender: newMsg.sender,
                user_id: newMsg.userId,
                text: newMsg.text,
                time: newMsg.time,
                reply_to: newMsg.replyTo
              }
            ]);
          } catch (err) {
            console.error("Supabase chat error:", err);
          }
        }
      };

      // Handler Hapus Satu Pesan Chat
      const handleDeleteSingleChatMessage = (msgId, senderName) => {
        setConfirmDialog({
          title: "Hapus Pesan Chat",
          message: `Apakah Anda yakin ingin menghapus pesan dari ${senderName}? Pesan ini akan dihapus dari obrolan untuk semua anggota.`,
          onConfirm: async () => {
            setChatMessages(prev => prev.filter(m => m.id !== msgId));
            setConfirmDialog(null);
            playNotificationSound('delete');
            triggerToast("Pesan obrolan berhasil dihapus.", "warning");

            if (supabase) {
              try {
                await supabase.from('chat_messages').delete().eq('id', msgId);
              } catch (err) {
                console.error("Gagal menghapus pesan chat:", err);
              }
            }
          }
        });
      };

      // Handler Hapus Masal / Bersihkan Riwayat Chat
      const handleClearAllChatMessages = () => {
        setConfirmDialog({
          title: "Bersihkan Seluruh Riwayat Chat",
          message: "Apakah Anda yakin ingin menghapus SEMUA pesan di Forum Chat Panua? Riwayat obrolan akan dikosongkan secara permanen di database Cloud Supabase.",
          onConfirm: async () => {
            setChatMessages([]);
            setConfirmDialog(null);
            playNotificationSound('delete');
            triggerToast("Seluruh riwayat chat forum berhasil dibersihkan!", "warning");

            if (supabase) {
              try {
                await supabase.from('chat_messages').delete().neq('id', 'keep_none_placeholder');
              } catch (err) {
                console.error("Gagal membersihkan seluruh pesan chat:", err);
              }
            }
          }
        });
      };

      // Handler Buat Grup Komunitas Baru (Disimpan ke Supabase)
      const handleCreateNewGroup = async (e) => {
        e.preventDefault();
        if (!newGroupName.trim() || !newGroupDesc.trim()) {
          triggerToast("Lengkapi nama grup dan deskripsi!", "warning");
          return;
        }

        const newGrp = {
          id: "grp-" + Date.now(),
          name: newGroupName.trim(),
          category: newGroupCategory,
          member_count: 1,
          is_official: user?.role === "admin",
          description: newGroupDesc.trim(),
          created_by: user.username
        };

        setGroups(prev => [{ ...newGrp, joined: true }, ...prev]);
        setUserJoinedGroupIds(prev => new Set([...prev, newGrp.id]));
        setShowCreateGroupModal(false);
        setNewGroupName("");
        setNewGroupDesc("");
        triggerToast(`Grup "${newGrp.name}" berhasil dibuat di Cloud!`, "success");

        if (supabase) {
          try {
            await supabase.from('community_groups').insert([newGrp]);
            await supabase.from('group_memberships').insert([{
              id: "gmb-" + Date.now(),
              group_id: newGrp.id,
              user_id: user.id,
              username: user.username
            }]);
          } catch (err) {
            console.error("Supabase create group error:", err);
          }
        }
      };

      // Handler Gabung / Keluar Grup Komunitas (Disinkronkan ke Supabase)
      const handleToggleJoinGroup = async (group) => {
        const willJoin = !group.joined;
        setGroups(prev => prev.map(g => g.id === group.id ? { 
          ...g, 
          joined: willJoin, 
          memberCount: willJoin ? g.memberCount + 1 : Math.max(1, g.memberCount - 1) 
        } : g));

        setUserJoinedGroupIds(prev => {
          const nextSet = new Set(prev);
          if (willJoin) nextSet.add(group.id);
          else nextSet.delete(group.id);
          return nextSet;
        });

        triggerToast(willJoin ? `Bergabung ke grup ${group.name}!` : `Keluar dari grup ${group.name}.`);

        if (supabase && user) {
          try {
            if (willJoin) {
              await supabase.from('group_memberships').insert([{
                id: `gmb-${group.id}-${user.id}`,
                group_id: group.id,
                user_id: user.id,
                username: user.username
              }]);
              await supabase.from('community_groups').update({ 
                member_count: group.memberCount + 1 
              }).eq('id', group.id);
            } else {
              await supabase.from('group_memberships').delete().match({
                group_id: group.id,
                user_id: user.id
              });
              await supabase.from('community_groups').update({ 
                member_count: Math.max(1, group.memberCount - 1) 
              }).eq('id', group.id);
            }
          } catch (err) {
            console.error("Toggle group error:", err);
          }
        }
      };

      // Handler Hapus Kelompok Grup Panua (Sinkron Cloud Supabase)
      const handleDeleteGroup = (groupId, groupName) => {
        setConfirmDialog({
          title: "Hapus Grup Komunitas",
          message: `Apakah Anda yakin ingin menghapus grup "${groupName}"? Tindakan ini akan menghapus kelompok grup secara permanen dari daftar dan database Cloud Supabase.`,
          onConfirm: async () => {
            setGroups(prev => prev.filter(g => g.id !== groupId));
            setUserJoinedGroupIds(prev => {
              const nextSet = new Set(prev);
              nextSet.delete(groupId);
              return nextSet;
            });
            setConfirmDialog(null);
            triggerToast(`Grup "${groupName}" berhasil dihapus.`, "warning");

            if (supabase) {
              try {
                await supabase.from('group_memberships').delete().eq('group_id', groupId);
                await supabase.from('community_groups').delete().eq('id', groupId);
              } catch (err) {
                console.error("Gagal menghapus grup dari Supabase:", err);
              }
            }
          }
        });
      };

      const handleDeleteRegisteredMember = async (targetId, targetName) => {
        setConfirmDialog({
          title: "Hapus Anggota Terdaftar",
          message: `Apakah Anda yakin ingin menghapus akun anggota "${targetName}" dari database?`,
          onConfirm: async () => {
            setRegisteredUsers(prev => prev.filter(u => u.id !== targetId));
            setSubmittedDossiers(prev => prev.filter(d => d.userId !== targetId));
            setConfirmDialog(null);
            if (supabase) {
              try {
                await supabase.from('users_registry').delete().eq('id', targetId);
                await supabase.from('dossiers').delete().eq('user_id', targetId);
                triggerToast(`Akun "${targetName}" berhasil dihapus dari Cloud.`, "warning");
              } catch (err) {
                console.error("Delete user error:", err);
              }
            } else {
              triggerToast(`Akun "${targetName}" dihapus secara lokal.`, "warning");
            }
          }
        });
      };

      return (
        <div className="min-h-screen flex flex-col bg-pch-bg text-pch-text pb-16 md:pb-0">
          
          {/* Toast Notification */}
          {toast && (
            <div className={`fixed top-4 right-4 z-50 px-4 py-2.5 rounded-xl border text-xs sm:text-sm font-semibold shadow-card-elevated flex items-center gap-2 backdrop-blur-md animate-fade-in ${
              toast.type === "danger" 
                ? "bg-red-950/90 border-pch-danger text-red-200" 
                : toast.type === "warning"
                ? "bg-amber-950/90 border-pch-warning text-amber-200"
                : toast.type === "success"
                ? "bg-emerald-950/90 border-pch-success text-emerald-200"
                : "bg-pch-surface/90 border-pch-border text-pch-text"
            }`}>
              <span className="w-2 h-2 rounded-full bg-current"></span>
              <span>{toast.msg}</span>
            </div>
          )}

          {/* TOP BAR BERSIH KHUSUS PENGGUNA — TOMBOL KONEKSI HANYA UNTUK ADMIN */}
          <div className="bg-pch-secondary/90 border-b border-pch-border/60 px-4 py-1.5 text-xs flex items-center justify-between gap-2">
            <div className="flex-1 text-center text-pch-muted truncate">
              <span className="inline-block w-2 h-2 rounded-full bg-pch-gold animate-pulse mr-2"></span>
              <span><strong>PANUA COMMUNITY GORONTALO</strong> — Independent Community Platform.</span>
            </div>
            {user?.role === "admin" && (
              <button
                onClick={() => setShowSupabaseSettingsModal(true)}
                className={`px-2.5 py-0.5 rounded-full text-[10px] font-semibold border flex items-center gap-1.5 shrink-0 transition-all ${
                  supabase 
                    ? "bg-emerald-950/60 border-pch-success text-pch-success hover:bg-emerald-900/60" 
                    : "bg-amber-950/80 border-pch-warning text-pch-warning hover:bg-amber-900/80"
                }`}
                title="Status & Pengaturan Koneksi Supabase"
              >
                <Icons.Database className="w-3 h-3" />
                <span>{supabase ? "Cloud Aktif" : "Setup Cloud"}</span>
              </button>
            )}
          </div>

          {/* ==================== AUTHENTICATION PORTAL ==================== */}
          {!isAuthenticated ? (
            <div className="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8 relative">
              <div className="absolute top-1/4 left-1/2 -translate-x-1/2 w-96 h-96 bg-pch-purple/15 rounded-full blur-3xl pointer-events-none"></div>
              <div className="absolute bottom-10 left-1/3 w-80 h-80 bg-pch-gold/10 rounded-full blur-3xl pointer-events-none"></div>

              <div className="relative z-10 w-full max-w-md bg-pch-surface/95 backdrop-blur-md border border-pch-border/90 rounded-2xl p-6 sm:p-8 shadow-card-elevated space-y-6">
                
                <div className="flex flex-col items-center text-center space-y-2">
                  <BrandLogo config={appBranding} size="lg" />
                  <div>
                    <h2 className="text-xl sm:text-2xl font-bold tracking-wide gold-gradient-text uppercase">
                      {appBranding.title}
                    </h2>
                    <p className="text-xs text-pch-muted mt-0.5">{appBranding.tagline}</p>
                  </div>
                </div>

                {authView !== "forgot" && (
                  <div className="grid grid-cols-2 p-1 rounded-xl bg-pch-secondary border border-pch-border">
                    <button
                      type="button"
                      onClick={() => setAuthView("login")}
                      className={`py-2 text-xs sm:text-sm font-semibold rounded-lg transition-all ${
                        authView === "login"
                          ? "bg-pch-gold text-black shadow-gold-glow"
                          : "text-pch-muted hover:text-pch-text"
                      }`}
                    >
                      Masuk (Login)
                    </button>
                    <button
                      type="button"
                      onClick={() => setAuthView("register")}
                      className={`py-2 text-xs sm:text-sm font-semibold rounded-lg transition-all ${
                        authView === "register"
                          ? "bg-pch-purple text-white shadow-purple-glow"
                          : "text-pch-muted hover:text-pch-text"
                      }`}
                    >
                      Daftar (Register)
                    </button>
                  </div>
                )}

                {/* LOGIN FORM */}
                {authView === "login" && (
                  <form onSubmit={handleLoginSubmit} className="space-y-4">
                    <div>
                      <label className="text-xs font-semibold text-pch-muted block mb-1">
                        Email atau Username
                      </label>
                      <div className="relative">
                        <Icons.User className="w-4 h-4 text-pch-muted absolute left-3.5 top-3" />
                        <input 
                          type="text"
                          required
                          value={loginIdentifier}
                          onChange={(e) => setLoginIdentifier(e.target.value)}
                          placeholder="Masukkan Email atau Username"
                          className="w-full bg-pch-secondary border border-pch-border rounded-xl pl-10 pr-4 py-2.5 text-sm text-pch-text placeholder-pch-muted/60 focus:outline-none focus:border-pch-purple"
                        />
                      </div>
                    </div>

                    <div>
                      <div className="flex items-center justify-between mb-1">
                        <label className="text-xs font-semibold text-pch-muted">Password</label>
                        <button 
                          type="button"
                          onClick={() => setAuthView("forgot")}
                          className="text-xs text-pch-gold hover:underline"
                        >
                          Lupa Password?
                        </button>
                      </div>

                                <span>Metode 2: Barcode QRIS Resmi</span>
