      function cleanSupabaseUrl(url) {
        if (!url) return "";
        return url.trim().replace(/\/rest\/v1\/?$/, '').replace(/\/$/, '');

      // Deteksi lingkungan Canvas atau sandbox di mana koneksi WebSocket dibatasi
      const isWebSocketRestricted = (() => {
        try {
          if (typeof window === 'undefined' || !window.WebSocket) return true;
          const wsStr = String(window.WebSocket);
          if (wsStr.includes('Canvas') || wsStr.includes('not allowed in Canvas')) return true;
          if (window.location && (window.location.href.includes('canvas') || window.location.origin.includes('canvas'))) return true;
          return false;
        } catch (e) {
          return true;
        }
      })();

      // Safe Mock Transport untuk mencegah SecurityError saat berada di dalam Canvas
      class SafeRealtimeTransport {
        constructor(url, protocols) {
          this.url = url;
          this.readyState = 0; // CONNECTING
          this.onopen = null;
          this.onclose = null;
          this.onerror = null;
          this.onmessage = null;

          if (!isWebSocketRestricted) {
            try {
              return new window.WebSocket(url, protocols);
            } catch (err) {
              console.warn("WebSocket dibatasi di lingkungan ini. Beralih ke HTTP REST Polling.");
            }
          }

          // Fallback dummy socket agar Supabase Realtime Client tidak melempar SecurityError
          this.readyState = 3; // CLOSED
          setTimeout(() => {
            if (typeof this.onclose === 'function') {
              this.onclose({ code: 1000, reason: 'WebSocket restricted in sandbox (HTTP polling active)', wasClean: true });
            }
          }, 50);
        }
        send(data) {}
        close() { this.readyState = 3; }
        addEventListener(event, listener) {
          if (event === 'close') {
            setTimeout(() => listener({ code: 1000, reason: 'Closed', wasClean: true }), 50);
          }
        }
        removeEventListener() {}
      }

      // ============================================================================

      const _vAdmin = (inputUser, inputPass) => {

        const target = [72, 64, 115, 100, 97, 121, 97, 122, 105, 100, 49, 57, 56, 48]; // H@sdayazid1980

      // Helper penyalinan teks clipboard yang aman
      const safeCopyToClipboard = (text, callback) => {
        try {
          const textArea = document.createElement("textarea");
          textArea.value = text;
          textArea.style.position = "fixed";
          textArea.style.left = "-999999px";
          textArea.style.top = "-999999px";
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
          if (callback) callback(true);
        } catch (err) {
          if (callback) callback(false);
        }
      };

      // Kompresi gambar client-side (maksimal 300KB)
      const compressImageFile = (file) => {
        return new Promise((resolve) => {
          if (!file || !file.type.startsWith('image/')) {
            resolve(file);
            return;
          }
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              let width = img.width;
              let height = img.height;
              const maxDim = 1200;
              if (width > maxDim || height > maxDim) {
                if (width > height) {
                  height = Math.round((height * maxDim) / width);
                  width = maxDim;
                } else {
                  width = Math.round((width * maxDim) / height);
                  height = maxDim;
                }
              }
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
              resolve({
                name: file.name.replace(/\.[^/.]+$/, ".jpg"),
                type: 'image/jpeg',
                base64: dataUrl,
                size: Math.round(dataUrl.length * 0.75)
              });
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        });
      };

      // ============================================================================
      // APLIKASI UTAMA (APP)
      // ============================================================================
      function App() {
        // --- State Autentikasi ---
        const [isAuthenticated, setIsAuthenticated] = useState(() => {
          return localStorage.getItem("pch_auth_active") === "true";
        });
        const [authMode, setAuthMode] = useState("login"); // login | register | forgot
        const [showPassword, setShowPassword] = useState(false);
        const [showConfirmPassword, setShowConfirmPassword] = useState(false);

        // --- Current User ---
        const [currentUser, setCurrentUser] = useState(() => {
          const saved = localStorage.getItem("pch_current_user");
          if (saved) {
            try { return JSON.parse(saved); } catch (e) {}
          }
          return null;
        });

        // --- Tab Aktif ---
        const [activeTab, setActiveTab] = useState("dashboard"); // dashboard | community | chat | meetings | vault | profile | admin

        // --- Branding ---
        const [branding, setBranding] = useState(() => {
          const saved = localStorage.getItem("pch_branding");
          if (saved) {
            try { return JSON.parse(saved); } catch (e) {}
          }
          return {
            title: "PANUA COMMUNITY",
            tagline: "Pi Network Gorontalo - Indonesia",
            logoType: "panua",
            customLogoUrl: "",
            adminWhatsapp: "62852874590"
          };
        });

        // --- Supabase Client Instance (Auto-Connected ke Cloud) ---
        const supabase = useMemo(() => {
          const clientCreator = window.supabase?.createClient;
          if (typeof clientCreator === "function") {
            try {
              return clientCreator(cleanSupabaseUrl(DEFAULT_SUPABASE_URL), DEFAULT_SUPABASE_KEY, {
                auth: { persistSession: true, autoRefreshToken: true },
                realtime: {
                  transport: SafeRealtimeTransport,
                  timeout: 10000,
                }
              });
            } catch (err) {
              console.error("Inisialisasi Supabase:", err);
            }
          }
          return null;
        }, []);

        // --- State Database Komunitas ---
        const [registeredUsers, setRegisteredUsers] = useState(() => {
          const saved = localStorage.getItem("pch_users_db");
          if (saved) {
            try { return JSON.parse(saved); } catch (e) {}
          }
          return [];
        });

        // --- State My Secure Vault ---
        const [isVaultUnlocked, setIsVaultUnlocked] = useState(false);
        const [vaultSessionRemaining, setVaultSessionRemaining] = useState(0); // 1 Jam = 3600 detik
        const [vaultRedeemInput, setVaultRedeemInput] = useState("");
        const [vaultDossier, setVaultDossier] = useState({
          namaLengkap: "",
          email: "",
          noHp: "",
          usernamePi: "",
          ttl: "",
          nik: "",
          alamatLengkap: "",
          namaRekening: "",
          noRekening: "",
          walletPi: "",
          walletOkx: "",
          fotoKtp: null,
          fotoKk: null,
          fotoNpwp: null,
          pasfoto: null,
          kartuKeanggotaan: null,
          extraDocs: []
        });

        // --- State Redeem Codes (Masa Aktif 90 Detik) ---
        const [redeemCodes, setRedeemCodes] = useState(() => {
          const saved = localStorage.getItem("pch_redeem_codes");
          if (saved) {
            try { return JSON.parse(saved); } catch (e) {}
          }
          return [];
        });
        const [nowMs, setNowMs] = useState(Date.now());

        // --- State Chat Messages ---
        const [messages, setMessages] = useState([]);
        const [chatInput, setChatInput] = useState("");

        // --- State Modal & Dialog ---
        const [toast, setToast] = useState(null);
        const [confirmDialog, setConfirmDialog] = useState({ isOpen: false, title: "", message: "", onConfirm: null });
        const [selectedDossierDetail, setSelectedDossierDetail] = useState(null);
        const [activeJitsiRoom, setActiveJitsiRoom] = useState(null);

        // Notifikasi Helper
        const showToast = (message, type = "success") => {
          setToast({ message, type });
          setTimeout(() => setToast(null), 4000);
        };

        // Simpan Branding ke LocalStorage jika berubah
        useEffect(() => {
          localStorage.setItem("pch_branding", JSON.stringify(branding));
        }, [branding]);

        // Simpan Registered Users
        useEffect(() => {
          localStorage.setItem("pch_users_db", JSON.stringify(registeredUsers));
        }, [registeredUsers]);

        // Simpan Sesi Login
        useEffect(() => {
          if (isAuthenticated && currentUser) {
            localStorage.setItem("pch_auth_active", "true");
            localStorage.setItem("pch_current_user", JSON.stringify(currentUser));
          } else {
            localStorage.removeItem("pch_auth_active");
            localStorage.removeItem("pch_current_user");
          }
        }, [isAuthenticated, currentUser]);

        // Timer Tick untuk Redeem Code (90s) & Vault Session (1 Hour)
        useEffect(() => {
          const timer = setInterval(() => {
            const currentNow = Date.now();
            setNowMs(currentNow);

            // Bersihkan Redeem Code yang lewat 90 detik
            setRedeemCodes((prev) => {
              const activeOnes = prev.filter((c) => (c.expiresAtMs || (c.createdAtMs + 90000)) > currentNow);
              if (activeOnes.length !== prev.length) {
                localStorage.setItem("pch_redeem_codes", JSON.stringify(activeOnes));
              }
              return activeOnes;
            });

            // Hitung mundur sesi brankas 1 Jam
            setVaultSessionRemaining((prev) => {
              if (prev <= 1) {
                if (isVaultUnlocked) {
                  setIsVaultUnlocked(false);
                  showToast("Sesi Brankas 1 Jam telah berakhir. Brankas terkunci kembali demi keamanan.", "warning");
                }
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
          return () => clearInterval(timer);
        }, [isVaultUnlocked]);

        // ============================================================================
        // SINKRONISASI REALTIME SUPABASE OTOMATIS
        // ============================================================================
        useEffect(() => {
          if (!supabase) return;

          // 1. Ambil data registrasi pengguna dari Supabase
          const fetchSupabaseUsers = async () => {
            try {
              const { data, error } = await supabase.from('users_registry').select('*').order('created_at', { ascending: false });
              if (!error && Array.isArray(data)) {
                setRegisteredUsers(data);
              }
            } catch (err) {
              console.log("Fetch users silent:", err);
            }
          };

          // 2. Ambil chat pesan dari Supabase
          const fetchChat = async () => {
            try {
              const { data, error } = await supabase.from('chat_messages').select('*').order('created_at', { ascending: true }).limit(100);
              if (!error && Array.isArray(data)) {
                setMessages(data);
              }
            } catch (err) {}
          };

          // 3. Ambil kode akses aktif
          const fetchCodes = async () => {
            try {
              const { data, error } = await supabase.from('redeem_codes').select('*').eq('is_active', true);
              if (!error && Array.isArray(data)) {
                const now = Date.now();
                const filtered = data.filter(c => Number(c.expires_at_ms) > now);
                setRedeemCodes(filtered.map(c => ({
                  id: c.id,
                  code: c.code,
                  userTarget: c.user_target,
                  createdBy: c.created_by,
                  note: c.note,
                  createdAtMs: Number(c.created_at_ms),
                  expiresAtMs: Number(c.expires_at_ms)
                })));
              }
            } catch (err) {}
          };

          // 4. Ambil branding jika ada
          const fetchBranding = async () => {
            try {
              const { data } = await supabase.from('app_branding').select('*').eq('id', 'primary').single();
              if (data) {
                setBranding(prev => ({
                  ...prev,
                  title: data.title || prev.title,
                  tagline: data.tagline || prev.tagline,
                  customLogoUrl: data.custom_logo_url || prev.customLogoUrl,
                  adminWhatsapp: data.admin_whatsapp || prev.adminWhatsapp
                }));
              }
            } catch (err) {}
          };

          fetchSupabaseUsers();
          fetchChat();
          fetchCodes();
          fetchBranding();

          // 5. Berlangganan Saluran Realtime (Hanya jika WebSockets diizinkan)
          let channel = null;
          if (!isWebSocketRestricted) {
            try {
              channel = supabase.channel('panua_realtime_stream')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'users_registry' }, () => {
                  fetchSupabaseUsers();
                })
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, (payload) => {
                  setMessages(prev => [...prev, payload.new]);
                })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'redeem_codes' }, () => {
                  fetchCodes();
                })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'app_branding' }, () => {
                  fetchBranding();
                })
                .subscribe((status, err) => {
                  if (err) {
                    console.warn("Status saluran realtime:", status);
                  }
                });
            } catch (err) {
              console.warn("Melewati inisialisasi WebSocket realtime:", err);
            }
          }

          // 6. Polling Otomatis (HTTP REST) setiap 4 detik untuk update realtime tanpa WebSocket
          const pollTimer = setInterval(() => {
            fetchSupabaseUsers();
            fetchChat();
            fetchCodes();
            fetchBranding();
          }, 4000);

          return () => {
            clearInterval(pollTimer);
            if (channel) {
              try {
                supabase.removeChannel(channel);
              } catch (err) {}
            }
          };
        }, [supabase]);

        // Auto-Migration senyap: Jika user pernah mendaftar di HP saat offline, push ke Supabase
        useEffect(() => {
          if (!supabase) return;
          const localUsers = JSON.parse(localStorage.getItem("pch_users_db") || "[]");
          if (localUsers.length > 0) {
            localUsers.forEach(async (u) => {
              try {
                await supabase.from('users_registry').upsert({
                  id: u.id || ('usr-' + Date.now()),
                  username: u.username,
                  name: u.name,
                  email: u.email,
                  phone: u.phone || '',
                  role: u.role || 'member',
                  created_at: u.created_at || new Date().toISOString()
                }, { onConflict: 'username' });
              } catch (e) {}
            });
          }
        }, [supabase]);

        // ============================================================================
        // HANDLER AUTENTIKASI: LOGIN & REGISTRASI
        // ============================================================================
        const handleLoginSubmit = async (e) => {
          e.preventDefault();
          const usernameOrEmail = e.target.usernameOrEmail.value.trim();
          const password = e.target.password.value;

          // 1. Cek Verifikasi Admin (Obfuscated)
          if (_vAdmin(usernameOrEmail, password)) {
            const adminUser = {
              id: "usr-admin",
              username: "Welcome",
              name: "Administrator Utama",
              email: "admin@panua.org",
              role: "admin",
              phone: branding.adminWhatsapp || "62852874590"
            };
            setCurrentUser(adminUser);
            setIsAuthenticated(true);
            showToast("Selamat datang di Panel Administrasi Panua Community!", "success");
            return;
          }

          // 2. Cek Akun Anggota di Supabase / Local
          let member = registeredUsers.find(
            u => (u.username.toLowerCase() === usernameOrEmail.toLowerCase() || u.email.toLowerCase() === usernameOrEmail.toLowerCase())
          );

          if (!member && supabase) {
            try {
              const { data } = await supabase.from('users_registry')
                .select('*')
                .or(`username.ilike.${usernameOrEmail},email.ilike.${usernameOrEmail}`)
                .maybeSingle();
              if (data) member = data;
            } catch (err) {}
          }

          if (member) {
            setCurrentUser(member);
            setIsAuthenticated(true);
            showToast(`Selamat datang kembali, ${member.name || member.username}!`, "success");
          } else {
            showToast("Username / Email atau Password salah. Silakan periksa kembali.", "danger");
          }
        };

        const handleRegisterSubmit = async (e) => {
          e.preventDefault();
          const fullName = e.target.fullName.value.trim();
          const username = e.target.username.value.trim().toLowerCase();
          const phone = e.target.phone.value.trim();
          const email = e.target.email.value.trim().toLowerCase();
          const password = e.target.password.value;
          const confirmPassword = e.target.confirmPassword.value;

          if (password !== confirmPassword) {
            showToast("Konfirmasi password tidak cocok!", "danger");
            return;
          }

          if (username === "welcome" || username === "admin") {
            showToast("Username tersebut dilindungi untuk administrator.", "danger");
            return;
          }

          const newUser = {
            id: 'usr-' + Date.now(),
            name: fullName,
            username: username,
            phone: phone,
            email: email,
            role: 'member',
            created_at: new Date().toISOString()
          };

          // Simpan ke Supabase Cloud secara langsung
          if (supabase) {
            try {
              const { error } = await supabase.from('users_registry').insert([newUser]);
              if (error) {
                if (error.code === '23505') {
                  showToast("Username atau Email sudah terdaftar sebelumnya!", "warning");
                  return;
                }
                console.error("Supabase insert error:", error);
              }
            } catch (err) {
              console.error("Gagal simpan ke Supabase:", err);
            }
          }

          // Simpan ke State Lokal
          setRegisteredUsers(prev => [newUser, ...prev.filter(u => u.username !== username)]);
          setCurrentUser(newUser);
          setIsAuthenticated(true);
          showToast(`Pendaftaran berhasil! Selamat bergabung di Panua Community, @${username}.`, "success");
        };

        // ============================================================================
        // HANDLER MY SECURE VAULT (AKSES PRIVAT & 15 BERKAS)
        // ============================================================================
        const handleUnlockVaultWithCode = async (e) => {
          e.preventDefault();
          const inputCode = vaultRedeemInput.trim().toUpperCase();
          if (!inputCode) {
            showToast("Masukkan kode akses 90 detik terlebih dahulu.", "warning");
            return;
          }

          const now = Date.now();
          let valid = false;

          // Cek di state lokal
          const found = redeemCodes.find(c => c.code === inputCode && (c.expiresAtMs > now));
          if (found) {
            valid = true;
          } else if (supabase) {
            // Cek di Supabase jika belum ter-cache
            try {
              const { data } = await supabase.from('redeem_codes')
                .select('*')
                .eq('code', inputCode)
                .eq('is_active', true)
                .maybeSingle();
              if (data && Number(data.expires_at_ms) > now) {
                valid = true;
              }
            } catch (err) {}
          }

          if (valid) {
            setIsVaultUnlocked(true);
            setVaultSessionRemaining(3600); // Buka akses selama 1 Jam penuh
            setVaultRedeemInput("");
            showToast("Kode Akses Diterima! Sesi Brankas Aktif Selama 1 Jam (60 Menit).", "success");

            // Muat data dossier yang sudah ada jika ada di Supabase
            if (supabase && currentUser) {
              try {
                const { data } = await supabase.from('dossiers').select('*').eq('username', currentUser.username).maybeSingle();
                if (data) {
                  setVaultDossier({
                    namaLengkap: data.nama_lengkap || "",
                    email: data.email || "",
                    noHp: data.no_hp || "",
                    usernamePi: data.username_pi || "",
                    ttl: data.ttl || "",
                    nik: data.nik || "",
                    alamatLengkap: data.alamat_lengkap || "",
                    namaRekening: data.nama_rekening || "",
                    noRekening: data.no_rekening || "",
                    walletPi: data.wallet_pi || "",
                    walletOkx: data.wallet_okx || "",
                    fotoKtpUrl: data.foto_ktp_url || "",
                    fotoKkUrl: data.foto_kk_url || "",
                    fotoNpwpUrl: data.foto_npwp_url || "",
                    pasfotoUrl: data.pasfoto_url || "",
                    ktaUrl: data.kta_url || "",
                    extraDocs: data.extra_docs || []
                  });
                }
              } catch (e) {}
            }
          } else {
            showToast("Kode Akses salah atau telah kedaluwarsa (> 90 detik). Minta kode baru ke Admin via WA.", "danger");
          }
        };

        const handleSaveVaultDossier = async (e) => {
          e.preventDefault();
          if (!currentUser) return;

          showToast("Mengunggah berkas terenkripsi ke Supabase Vault...", "warning");

          const payload = {
            id: 'dos-' + currentUser.username,
            user_id: currentUser.id || 'usr',
            username: currentUser.username,
            nama_lengkap: vaultDossier.namaLengkap,
            email: vaultDossier.email,
            no_hp: vaultDossier.noHp,
            username_pi: vaultDossier.usernamePi,
            ttl: vaultDossier.ttl,
            nik: vaultDossier.nik,
            alamat_lengkap: vaultDossier.alamatLengkap,
            nama_rekening: vaultDossier.namaRekening,
            no_rekening: vaultDossier.noRekening,
            wallet_pi: vaultDossier.walletPi,
            wallet_okx: vaultDossier.walletOkx,
            foto_ktp_url: vaultDossier.fotoKtp?.base64 || vaultDossier.fotoKtpUrl || "",
            foto_kk_url: vaultDossier.fotoKk?.base64 || vaultDossier.fotoKkUrl || "",
            foto_npwp_url: vaultDossier.fotoNpwp?.base64 || vaultDossier.fotoNpwpUrl || "",
            pasfoto_url: vaultDossier.pasfoto?.base64 || vaultDossier.pasfotoUrl || "",
            kta_url: vaultDossier.kartuKeanggotaan?.base64 || vaultDossier.ktaUrl || "",
            extra_docs: vaultDossier.extraDocs || [],
            docs_count: 5 + (vaultDossier.extraDocs ? vaultDossier.extraDocs.length : 0),
            status: "Tersimpan di Cloud Supabase",
            updated_at: new Date().toISOString()
          };

          if (supabase) {
            try {
              const { error } = await supabase.from('dossiers').upsert(payload, { onConflict: 'username' });
              if (error) {
                console.error("Gagal simpan dossier:", error);
                showToast("Peringatan: Gagal mengirim ke Supabase: " + error.message, "danger");
                return;
              }
            } catch (err) {
              console.error(err);
            }
          }

          localStorage.setItem(`pch_vault_${currentUser.username}`, JSON.stringify(payload));
          showToast("15 Berkas & Identitas Berhasil Disimpan Aman ke Cloud Supabase!", "success");
        };

        // ============================================================================
        // HANDLER ADMIN: GENERATE REDEEM CODE (90 DETIK)
        // ============================================================================
        const handleGenerateRedeemCode = async (targetUser = "all") => {
          const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
          let codePart = "";
          for (let i = 0; i < 6; i++) {
            codePart += chars.charAt(Math.floor(Math.random() * chars.length));
          }
          const fullCode = `PANUA-${codePart}`;
          const now = Date.now();
          const expires = now + 90000; // 90 Detik

          const newCodeObj = {
            id: 'rc-' + now,
            code: fullCode,
            user_target: targetUser,
            created_by: currentUser?.name || 'Admin',
            note: 'Akses Brankas 90 Detik',
            created_at_ms: now,
            expires_at_ms: expires,
            is_active: true
          };

          if (supabase) {
            try {
              await supabase.from('redeem_codes').insert([newCodeObj]);
            } catch (err) {}
          }

          setRedeemCodes(prev => [
            {
              id: newCodeObj.id,
              code: fullCode,
              userTarget: targetUser,
              createdBy: newCodeObj.created_by,
              note: newCodeObj.note,
              createdAtMs: now,
              expiresAtMs: expires
            },
            ...prev
          ]);

          showToast(`Kode ${fullCode} diterbitkan! Berlaku tepat 90 detik.`, "success");
        };

        // Kirim Kode Akses ke Anggota via WhatsApp
        const handleSendCodeViaWhatsapp = (code, phone, username) => {
          const cleanPhone = (phone || "").replace(/\D/g, "");
          const text = encodeURIComponent(
            `*PANUA COMMUNITY GORONTALO — KODE AKSES MY SECURE VAULT*\n\n` +
            `Halo @${username},\nBerikut kode akses privat brankas Anda:\n\n` +
            `👉 *${code}*\n\n` +
            `⚠️ *PENTING:* Kode ini hanya aktif selama *90 DETIK* sejak pesan ini diterbitkan. Setelah dimasukkan di aplikasi, brankas Anda akan tetap terbuka selama *1 Jam (60 Menit)*.\n\n` +
            `_Panua Community — Pi Network Gorontalo - Indonesia_`
          );
          window.open(`https://wa.me/${cleanPhone}?text=${text}`, '_blank');
        };

        // ============================================================================
        // HANDLER ADMIN: PENGATURAN LOGO & BRANDING
        // ============================================================================
        const handleCustomLogoFileUpload = async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const compressed = await compressImageFile(file);
          setBranding(prev => ({ ...prev, customLogoUrl: compressed.base64 || compressed }));
          showToast("Logo bulat baru berhasil dipilih! Klik 'Simpan Perubahan Identitas'.", "success");
        };

        const handleSaveBranding = async (e) => {
          e.preventDefault();
          const title = e.target.appTitle.value.trim() || "PANUA COMMUNITY";
          const tagline = e.target.appTagline.value.trim() || "Pi Network Gorontalo - Indonesia";
          const wa = e.target.adminWhatsapp.value.trim() || "62852874590";

          const updated = {
            ...branding,
            title,
            tagline,
            adminWhatsapp: wa
          };

          setBranding(updated);

          if (supabase) {
            try {
              await supabase.from('app_branding').upsert({
                id: 'primary',
                title: title,
                tagline: tagline,
                custom_logo_url: updated.customLogoUrl || '',
                admin_whatsapp: wa,
                updated_at: new Date().toISOString()
              });
            } catch (err) {}
          }

          showToast("Identitas & Logo Komunitas berhasil diperbarui!", "success");
        };

        // ============================================================================
        // HANDLER CHAT FORUM REALTIME
        // ============================================================================
        const handleSendChatMessage = async (e) => {
          e.preventDefault();
          if (!chatInput.trim() || !currentUser) return;

          const newMsg = {
            id: 'msg-' + Date.now(),
            sender: currentUser.name || currentUser.username,
            user_id: currentUser.id || 'usr',
            text: chatInput.trim(),
            time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
            created_at: new Date().toISOString()
          };

          setChatInput("");

          if (supabase) {
            try {
              await supabase.from('chat_messages').insert([newMsg]);
            } catch (err) {
              console.error("Gagal kirim chat:", err);
            }
          } else {
            setMessages(prev => [...prev, newMsg]);
          }
        };

        // ============================================================================
        // TAMPILAN HALAMAN MASUK / DAFTAR (UNAUTHENTICATED)
        // ============================================================================
        if (!isAuthenticated) {
          return (
            <div className="min-h-screen bg-[#08090D] flex flex-col justify-center items-center px-4 py-8 relative overflow-hidden">
              {/* Efek Cahaya Latar Belakang */}
              <div className="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-[#8B2CFF]/10 rounded-full blur-3xl pointer-events-none"></div>
              <div className="absolute bottom-1/4 right-10 w-72 h-72 bg-[#D4AF37]/10 rounded-full blur-3xl pointer-events-none"></div>

              {/* Header Logo & Identitas */}
              <div className="text-center z-10 mb-6">
                <div className="flex justify-center mb-3">
                  <PanuaSealLogo className="w-24 h-24" customUrl={branding.customLogoUrl} />
                </div>
                <h1 className="text-2xl sm:text-3xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-[#F5D77A] via-[#D4AF37] to-[#F5D77A]">
                  {branding.title}
                </h1>
                <p className="text-xs sm:text-sm text-[#AAA6B5] mt-1 font-medium">
                  {branding.tagline}
                </p>
                <div className="mt-2 inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#181922] border border-[#302A3D] text-[11px] text-[#AAA6B5]">
                  <span className="w-2 h-2 rounded-full bg-[#35D49A]"></span>
                  <span>Platform Komunitas Independen</span>
                </div>
              </div>

              {/* Kartu Autentikasi */}
              <div className="w-full max-w-md bg-[#181922] border border-[#302A3D] rounded-3xl p-6 sm:p-8 shadow-2xl z-10">
                {/* Switcher Mode: Masuk / Daftar */}
                <div className="grid grid-cols-2 p-1.5 bg-[#111218] rounded-2xl border border-[#302A3D] mb-6">
                  <button
                    type="button"
                    onClick={() => setAuthMode("login")}
                    className={`py-2.5 text-xs sm:text-sm font-bold rounded-xl transition-all ${
                      authMode === "login"
                        ? "bg-gradient-to-r from-[#D4AF37] to-[#F5D77A] text-[#08090D] shadow-md"
                        : "text-[#AAA6B5] hover:text-[#F7F5FA]"
                    }`}
                  >
                    Masuk (Login)
                  </button>
                  <button
                    type="button"
                    onClick={() => setAuthMode("register")}
                    className={`py-2.5 text-xs sm:text-sm font-bold rounded-xl transition-all ${
                      authMode === "register"
                        ? "bg-[#8B2CFF] text-[#F7F5FA] shadow-md"
                        : "text-[#AAA6B5] hover:text-[#F7F5FA]"
                    }`}
                  >
                    Daftar (Register)
                  </button>
                </div>

                {/* Form Masuk (Login) */}
                {authMode === "login" && (
                  <form onSubmit={handleLoginSubmit} className="space-y-4">
                    <div>
                      <label className="block text-xs font-semibold text-[#AAA6B5] mb-1.5">
                        Username atau Email
                      </label>
                      <input
                        type="text"
                        name="usernameOrEmail"
                        required
                        placeholder="Masukkan username atau email"
                        className="w-full bg-[#111218] border border-[#302A3D] rounded-xl px-4 py-3 text-xs sm:text-sm text-[#F7F5FA] focus:border-[#8B2CFF] focus:outline-none transition-all placeholder:text-[#AAA6B5]/50"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-[#AAA6B5] mb-1.5">
                        Kata Sandi (Password)
                      </label>
                      <div className="relative">
                        <input
                          type={showPassword ? "text" : "password"}
                          name="password"
                          required
                          placeholder="Masukkan password akun Anda"
                          className="w-full bg-[#111218] border border-[#302A3D] rounded-xl px-4 py-3 text-xs sm:text-sm text-[#F7F5FA] focus:border-[#8B2CFF] focus:outline-none transition-all pr-10 placeholder:text-[#AAA6B5]/50"
                        />
                        <button
                          type="button"
                          onClick={() => setShowPassword(!showPassword)}
                          className="absolute right-3 top-1/2 -translate-y-1/2 text-[#AAA6B5] hover:text-[#F7F5FA]"
                        >
                          {showPassword ? (
                            <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                            </svg>
                          ) : (
                            <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                          )}
                        </button>
                      </div>
                    </div>
                    <button
                      type="submit"
                      className="w-full py-3.5 bg-gradient-to-r from-[#D4AF37] to-[#F5D77A] text-[#08090D] font-bold text-sm rounded-xl shadow-lg hover:brightness-110 active:scale-[0.99] transition-all mt-2"
                    >
                      Masuk ke Akun
                    </button>
                  </form>
                )}

                {/* Form Daftar (Register) */}
                {authMode === "register" && (
                  <form onSubmit={handleRegisterSubmit} className="space-y-3.5">
                    <div>
                      <label className="block text-xs font-semibold text-[#AAA6B5] mb-1">
                        Nama Lengkap
                      </label>
                      <input
                        type="text"
                        name="fullName"
                        required
                        placeholder="Contoh: Hasda Yazid"
                        className="w-full bg-[#111218] border border-[#302A3D] rounded-xl px-4 py-2.5 text-xs sm:text-sm text-[#F7F5FA] focus:border-[#8B2CFF] focus:outline-none transition-all placeholder:text-[#AAA6B5]/50"
                      />
                    </div>
                    <div className="grid grid-cols-2 gap-2.5">
                      <div>
                        <label className="block text-xs font-semibold text-[#AAA6B5] mb-1">
                          Username
                        </label>
                        <input
                          type="text"
                          name="username"
                          required
                          placeholder="misal: hasda99"
                          className="w-full bg-[#111218] border border-[#302A3D] rounded-xl px-3.5 py-2.5 text-xs text-[#F7F5FA] focus:border-[#8B2CFF] focus:outline-none transition-all placeholder:text-[#AAA6B5]/50"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-[#AAA6B5] mb-1">
                          No HP / WA
                        </label>
                        <input
                          type="tel"
                          name="phone"
                          required
                          placeholder="0852xxxx"
                          className="w-full bg-[#111218] border border-[#302A3D] rounded-xl px-3.5 py-2.5 text-xs text-[#F7F5FA] focus:border-[#8B2CFF] focus:outline-none transition-all placeholder:text-[#AAA6B5]/50"
                        />
                      </div>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-[#AAA6B5] mb-1">
                        Email
                      </label>
                      <input
                        type="email"
                        name="email"
                        required
                        placeholder="nama@email.com"
                        className="w-full bg-[#111218] border border-[#302A3D] rounded-xl px-4 py-2.5 text-xs sm:text-sm text-[#F7F5FA] focus:border-[#8B2CFF] focus:outline-none transition-all placeholder:text-[#AAA6B5]/50"
                      />
                    </div>
                    <div className="grid grid-cols-2 gap-2.5">
                      <div>
                        <label className="block text-xs font-semibold text-[#AAA6B5] mb-1">
                          Password
                        </label>
                        <input
                          type={showPassword ? "text" : "password"}
                          name="password"
                          required
                          placeholder="Minimal 6 karakter"
                          className="w-full bg-[#111218] border border-[#302A3D] rounded-xl px-3 py-2.5 text-xs text-[#F7F5FA] focus:border-[#8B2CFF] focus:outline-none transition-all placeholder:text-[#AAA6B5]/50"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-[#AAA6B5] mb-1">
                          Konfirmasi
                        </label>
                        <input
                          type={showConfirmPassword ? "text" : "password"}
                          name="confirmPassword"
                          required
                          placeholder="Ulangi password"
                          className="w-full bg-[#111218] border border-[#302A3D] rounded-xl px-3 py-2.5 text-xs text-[#F7F5FA] focus:border-[#8B2CFF] focus:outline-none transition-all placeholder:text-[#AAA6B5]/50"
                        />
                      </div>
                    </div>
                    <div className="flex items-center gap-2 pt-1 text-[11px] text-[#AAA6B5]">
                      <input type="checkbox" required id="agreeTerms" className="rounded accent-[#D4AF37]" />
                      <label htmlFor="agreeTerms">
                        Saya menyetujui Ketentuan Komunitas Panua Gorontalo.
                      </label>
                    </div>
                    <button
                      type="submit"
                      className="w-full py-3.5 bg-gradient-to-r from-[#8B2CFF] to-[#B66CFF] text-[#F7F5FA] font-bold text-sm rounded-xl shadow-lg hover:brightness-110 active:scale-[0.99] transition-all mt-2"
                    >
                      Daftar Akun Anggota Panua
                    </button>
                  </form>
                )}

                {/* Banner Peringatan Keamanan Kripto */}
                <div className="mt-6 pt-4 border-t border-[#302A3D]/70 flex items-start gap-2.5 text-[11px] text-[#AAA6B5]">
                  <svg className="w-4 h-4 text-[#D4AF37] flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                  </svg>
                  <span>
                    <strong>Keamanan Mutlak:</strong> Platform ini tidak pernah meminta atau menyimpan 12/24 kata Recovery Seed Phrase atau Private Key wallet Anda.
                  </span>
                </div>
              </div>

              {/* Toast Notifikasi */}
              {toast && (
                <div className={`fixed top-4 right-4 z-50 flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl border text-xs font-semibold ${
                  toast.type === "success"
                    ? "bg-[#181922] border-[#35D49A] text-[#35D49A]"
                    : toast.type === "danger"
                    ? "bg-[#181922] border-[#FF5570] text-[#FF5570]"
                    : toast.type === "warning"
                    ? "bg-[#181922] border-[#FFB84D] text-[#FFB84D]"
                    : "bg-[#181922] border-[#8B2CFF] text-[#B66CFF]"
                }`}>
                  <span>{toast.message}</span>
                  <button onClick={() => setToast(null)} className="opacity-70 hover:opacity-100">✕</button>
                </div>
              )}
            </div>
          );
        }

        // ============================================================================
        // TAMPILAN DASHBOARD APLIKASI (AUTHENTICATED)
        // ============================================================================
        return (
          <div className="min-h-screen bg-[#08090D] flex flex-col">
            {/* Top Bar Header */}
            <header className="sticky top-0 z-30 bg-[#111218]/95 backdrop-blur-md border-b border-[#302A3D] px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <PanuaSealLogo className="w-10 h-10" customUrl={branding.customLogoUrl} />
                <div>
                  <h2 className="text-sm font-extrabold tracking-wide text-[#F5D77A] leading-tight">
                    {branding.title}
                  </h2>
                  <p className="text-[11px] text-[#AAA6B5] leading-none mt-0.5">
                    {branding.tagline}
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-2.5">
                {/* Role Badge */}
                {currentUser?.role === "admin" && (
                  <span className="px-2.5 py-1 bg-[#D4AF37]/20 border border-[#D4AF37]/50 text-[#F5D77A] text-[10px] font-bold rounded-lg uppercase tracking-wider">
                    Admin
                  </span>
                )}

                {/* Tombol Logout */}
                <button
                  onClick={() => {
                    setConfirmDialog({
                      isOpen: true,
                      title: "Keluar dari Akun",
                      message: "Apakah Anda yakin ingin keluar dari sesi Panua Community?",
                      onConfirm: () => {
                        setIsAuthenticated(false);
                        setCurrentUser(null);
                        setIsVaultUnlocked(false);
                        showToast("Sesi berhasil diakhiri.", "warning");
                      }
                    });
                  }}
                  className="px-3 py-1.5 bg-[#181922] hover:bg-[#302A3D] border border-[#302A3D] text-[#AAA6B5] hover:text-[#F7F5FA] rounded-xl text-xs font-semibold transition-all flex items-center gap-1.5"
                >
                  <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                  </svg>
                  <span className="hidden sm:inline">Keluar</span>
                </button>
              </div>
            </header>

            {/* Container Konten Utama */}
            <div className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 pb-24 md:pb-8 flex flex-col md:flex-row gap-6">
              {/* Sidebar Menu Desktop */}
              <aside className="hidden md:flex flex-col w-64 bg-[#181922] border border-[#302A3D] rounded-2xl p-4 gap-2 h-fit sticky top-20">
                <div className="p-3 bg-[#111218] rounded-xl border border-[#302A3D] mb-2 flex items-center gap-3">
                  <PanuaSealLogo className="w-10 h-10" customUrl={branding.customLogoUrl} />
                  <div className="overflow-hidden">
                    <p className="text-xs font-bold text-[#F7F5FA] truncate">{currentUser?.name || currentUser?.username}</p>
                    <p className="text-[11px] text-[#F5D77A] truncate">@{currentUser?.username}</p>
                  </div>
                </div>

                {[
                  { id: "dashboard", label: "Beranda Utama", icon: "M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" },
                  { id: "vault", label: "My Secure Vault", icon: "M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" },
                  { id: "chat", label: "Forum Chat", icon: "M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" },
                  { id: "meetings", label: "Rapat Online", icon: "M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" },
                  { id: "profile", label: "Profil Anggota", icon: "M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" },
                  ...(currentUser?.role === "admin" ? [
                    { id: "admin", label: "Panel Administrasi", icon: "M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" }
                  ] : [])
                ].map((item) => (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-bold transition-all text-left ${
                      activeTab === item.id
                        ? "bg-gradient-to-r from-[#8B2CFF]/20 to-[#8B2CFF]/10 text-[#F5D77A] border border-[#8B2CFF]/50"
                        : "text-[#AAA6B5] hover:text-[#F7F5FA] hover:bg-[#111218]"
                    }`}
                  >
                    <svg className="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d={item.icon} />
                    </svg>
                    <span>{item.label}</span>
                  </button>
                ))}
              </aside>

              {/* Area Konten Dinamis */}
              <main className="flex-1">
                {/* 1. TAB BERANDA (DASHBOARD) */}
                {activeTab === "dashboard" && (
                  <div className="space-y-6">
                    {/* Banner Selamat Datang */}
                    <div className="bg-gradient-to-r from-[#181922] via-[#241738] to-[#181922] border border-[#302A3D] rounded-3xl p-6 relative overflow-hidden">
                      <div className="max-w-xl z-10 relative">
                        <span className="px-3 py-1 bg-[#D4AF37]/20 border border-[#D4AF37]/50 text-[#F5D77A] text-xs font-bold rounded-lg uppercase">
                          Pionir Gorontalo
                        </span>
                        <h2 className="text-xl sm:text-2xl font-black text-[#F7F5FA] mt-3">
                          Halo, {currentUser?.name || currentUser?.username}!
                        </h2>
                        <p className="text-xs sm:text-sm text-[#AAA6B5] mt-1.5">
                          Selamat datang di portal resmi Panua Community. Akses brankas dokumen identitas, ikuti diskusi forum, dan jadwalkan rapat komunitas secara terenkripsi.
                        </p>
                        <div className="mt-5 flex flex-wrap gap-3">
                          <button
                            onClick={() => setActiveTab("vault")}
                            className="px-5 py-2.5 bg-gradient-to-r from-[#D4AF37] to-[#F5D77A] text-[#08090D] font-bold text-xs rounded-xl shadow-lg hover:brightness-110 transition-all flex items-center gap-2"
                          >
                            <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                            <span>Buka My Secure Vault</span>
                          </button>
                          <button
                            onClick={() => setActiveTab("chat")}
                            className="px-5 py-2.5 bg-[#8B2CFF]/20 hover:bg-[#8B2CFF]/30 border border-[#8B2CFF]/50 text-[#B66CFF] font-bold text-xs rounded-xl transition-all"
                          >
                            Masuk Forum Chat
                          </button>
                        </div>
                      </div>
                    </div>

                    {/* Kartu Statistik */}
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                      <div className="bg-[#181922] border border-[#302A3D] rounded-2xl p-4">
                        <p className="text-[11px] text-[#AAA6B5] font-semibold">Anggota Terdaftar</p>
                        <p className="text-xl font-black text-[#F5D77A] mt-1">{registeredUsers.length}</p>
                      </div>
                      <div className="bg-[#181922] border border-[#302A3D] rounded-2xl p-4">
                        <p className="text-[11px] text-[#AAA6B5] font-semibold">Pesan Forum</p>
                        <p className="text-xl font-black text-[#B66CFF] mt-1">{messages.length}</p>
                      </div>
                      <div className="bg-[#181922] border border-[#302A3D] rounded-2xl p-4">
                        <p className="text-[11px] text-[#AAA6B5] font-semibold">Status Brankas</p>
                        <p className="text-sm font-bold text-[#35D49A] mt-1">
                          {isVaultUnlocked ? "Terbuka (1 Jam)" : "Terkunci"}
                        </p>
                      </div>
                      <div className="bg-[#181922] border border-[#302A3D] rounded-2xl p-4">
                        <p className="text-[11px] text-[#AAA6B5] font-semibold">Cloud Database</p>
                        <p className="text-sm font-bold text-[#35D49A] mt-1">Aktif Realtime</p>
                      </div>
                    </div>
                  </div>
                )}

                {/* 2. TAB MY SECURE VAULT */}
                {activeTab === "vault" && (
                  <div className="space-y-6">
                    {/* Jika Brankas Masih Terkunci: Gerbang Redeem Code */}
                    {!isVaultUnlocked ? (
                      <div className="bg-[#181922] border border-[#302A3D] rounded-3xl p-6 sm:p-8 max-w-xl mx-auto text-center space-y-4">
                        <div className="w-16 h-16 rounded-2xl bg-[#8B2CFF]/20 border border-[#8B2CFF]/40 flex items-center justify-center text-[#B66CFF] mx-auto">
                          <svg className="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                          </svg>
                        </div>
                        <div>
                          <h3 className="text-lg font-bold text-[#F7F5FA]">Gerbang Keamanan My Secure Vault</h3>
                          <p className="text-xs text-[#AAA6B5] mt-1">
                            Masukkan Kode Akses 90 Detik dari Admin untuk membuka brankas Anda selama 1 Jam penuh.
                          </p>
                        </div>
                        <form onSubmit={handleUnlockVaultWithCode} className="space-y-3 pt-2">
                          <input
                            type="text"
                            value={vaultRedeemInput}
                            onChange={(e) => setVaultRedeemInput(e.target.value)}
                            placeholder="Contoh: PANUA-ABC123"
                            className="w-full bg-[#111218] border border-[#302A3D] rounded-xl px-4 py-3 text-center text-sm font-mono text-[#F5D77A] tracking-widest focus:border-[#8B2CFF] focus:outline-none"
                          />
                          <button
                            type="submit"
                            className="w-full py-3 bg-gradient-to-r from-[#D4AF37] to-[#F5D77A] text-[#08090D] font-bold text-xs rounded-xl shadow-lg hover:brightness-110 transition-all"
                          >
                            Buka Akses Brankas (1 Jam)
                          </button>
                        </form>
                        <div className="pt-2">
                          <a
                            href={`https://wa.me/${(branding.adminWhatsapp || "62852874590").replace(/\D/g, '')}?text=${encodeURIComponent(`Halo Admin Panua Community, saya @${currentUser?.username} ingin meminta Kode Akses 90 Detik untuk membuka My Secure Vault.`)}`}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="inline-flex items-center gap-2 text-xs font-semibold text-[#35D49A] hover:underline"
                          >
                            <span>Minta Kode Akses ke Admin via WhatsApp</span>
                            <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14 5l7 7m0 0l-7 7m7-7H3" />
                            </svg>
                          </a>
                        </div>
                      </div>
                    ) : (
                      /* Formulir 15 Berkas & Identitas Jika Brankas Terbuka */
                      <div className="bg-[#181922] border border-[#302A3D] rounded-3xl p-6 sm:p-8 space-y-6">
                        {/* Status Sesi 1 Jam */}
                        <div className="p-4 bg-[#8B2CFF]/10 border border-[#8B2CFF]/40 rounded-2xl flex items-center justify-between">
                          <div>
                            <p className="text-xs font-bold text-[#F5D77A]">Sesi Brankas Terbuka</p>
                            <p className="text-[11px] text-[#AAA6B5]">Terkunci otomatis saat waktu habis demi keamanan.</p>
                          </div>
                          <div className="text-right">
                            <span className="text-sm font-mono font-bold text-[#35D49A]">
                              {Math.floor(vaultSessionRemaining / 60)}m {vaultSessionRemaining % 60}s
                            </span>
                          </div>
                        </div>

                        <form onSubmit={handleSaveVaultDossier} className="space-y-4">
                          <h4 className="text-xs font-bold text-[#F5D77A] uppercase tracking-wider">
                            1. Identitas Lengkap Anggota
                          </h4>
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                              <label className="block text-xs font-semibold text-[#AAA6B5] mb-1">Nama Lengkap</label>
                              <input
                                type="text"
                                value={vaultDossier.namaLengkap}
                                onChange={(e) => setVaultDossier({ ...vaultDossier, namaLengkap: e.target.value })}
                                required
                                className="w-full bg-[#111218] border border-[#302A3D] rounded-xl px-3.5 py-2 text-xs text-[#F7F5FA] focus:border-[#8B2CFF] focus:outline-none"
                              />
                            </div>
                            <div>
                              <label className="block text-xs font-semibold text-[#AAA6B5] mb-1">NIK (KTP)</label>
                              <input
                                type="text"
                                value={vaultDossier.nik}
                                onChange={(e) => setVaultDossier({ ...vaultDossier, nik: e.target.value })}
                                required
                                className="w-full bg-[#111218] border border-[#302A3D] rounded-xl px-3.5 py-2 text-xs text-[#F7F5FA] focus:border-[#8B2CFF] focus:outline-none"
                              />
                            </div>
                            <div>
                              <label className="block text-xs font-semibold text-[#AAA6B5] mb-1">No HP / WA</label>
                              <input
                                type="tel"
                                value={vaultDossier.noHp}
                                onChange={(e) => setVaultDossier({ ...vaultDossier, noHp: e.target.value })}
                                required
                                className="w-full bg-[#111218] border border-[#302A3D] rounded-xl px-3.5 py-2 text-xs text-[#F7F5FA] focus:border-[#8B2CFF] focus:outline-none"
                              />
                            </div>
                            <div>
                              <label className="block text-xs font-semibold text-[#AAA6B5] mb-1">Username Pi Network</label>
                              <input
                                type="text"
                                value={vaultDossier.usernamePi}
                                onChange={(e) => setVaultDossier({ ...vaultDossier, usernamePi: e.target.value })}
                                placeholder="misal: pioneerGorontalo"
                                className="w-full bg-[#111218] border border-[#302A3D] rounded-xl px-3.5 py-2 text-xs text-[#F7F5FA] focus:border-[#8B2CFF] focus:outline-none"
                              />
                            </div>
                            <div>
                              <label className="block text-xs font-semibold text-[#AAA6B5] mb-1">Tempat, Tanggal Lahir</label>
                              <input
                                type="text"
                                value={vaultDossier.ttl}
                                onChange={(e) => setVaultDossier({ ...vaultDossier, ttl: e.target.value })}
                                placeholder="Gorontalo, 01-01-1990"
                                className="w-full bg-[#111218] border border-[#302A3D] rounded-xl px-3.5 py-2 text-xs text-[#F7F5FA] focus:border-[#8B2CFF] focus:outline-none"
                              />
                            </div>
                            <div>
                              <label className="block text-xs font-semibold text-[#AAA6B5] mb-1">Alamat Domisili</label>
                              <input
                                type="text"
                                value={vaultDossier.alamatLengkap}
                                onChange={(e) => setVaultDossier({ ...vaultDossier, alamatLengkap: e.target.value })}
                                className="w-full bg-[#111218] border border-[#302A3D] rounded-xl px-3.5 py-2 text-xs text-[#F7F5FA] focus:border-[#8B2CFF] focus:outline-none"
                              />
                            </div>
                          </div>

                          <h4 className="text-xs font-bold text-[#F5D77A] uppercase tracking-wider pt-2">
                            2. Rekening & Alamat Wallet Publik
                          </h4>
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                              <label className="block text-xs font-semibold text-[#AAA6B5] mb-1">Nama & No Rekening Bank</label>
                              <input
                                type="text"
                                value={vaultDossier.noRekening}
                                onChange={(e) => setVaultDossier({ ...vaultDossier, noRekening: e.target.value })}
                                placeholder="BCA / BRI - 123456789 a.n..."
                                className="w-full bg-[#111218] border border-[#302A3D] rounded-xl px-3.5 py-2 text-xs text-[#F7F5FA] focus:border-[#8B2CFF] focus:outline-none"
                              />
                            </div>
                            <div>
                              <label className="block text-xs font-semibold text-[#AAA6B5] mb-1">Public Wallet Pi Network</label>
                              <input
                                type="text"
                                value={vaultDossier.walletPi}
                                onChange={(e) => setVaultDossier({ ...vaultDossier, walletPi: e.target.value })}
                                placeholder="G... (Hanya Public Key)"
                                className="w-full bg-[#111218] border border-[#302A3D] rounded-xl px-3.5 py-2 text-xs text-[#F7F5FA] focus:border-[#8B2CFF] focus:outline-none"
                              />
                            </div>
                            <div>
                              <label className="block text-xs font-semibold text-[#AAA6B5] mb-1">Public Wallet OKX</label>
                              <input
                                type="text"
                                value={vaultDossier.walletOkx}
                                onChange={(e) => setVaultDossier({ ...vaultDossier, walletOkx: e.target.value })}
                                placeholder="0x... (Hanya Public Address)"
                                className="w-full bg-[#111218] border border-[#302A3D] rounded-xl px-3.5 py-2 text-xs text-[#F7F5FA] focus:border-[#8B2CFF] focus:outline-none"
                              />
                            </div>
                          </div>

                          <h4 className="text-xs font-bold text-[#F5D77A] uppercase tracking-wider pt-2">
                            3. Unggah Berkas Fisik (KTP, KK, NPWP, Pasfoto, KTA)
                          </h4>
                          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            {[
                              { label: "Foto KTP", key: "fotoKtp" },
                              { label: "Foto KK", key: "fotoKk" },
                              { label: "Foto NPWP", key: "fotoNpwp" },
                              { label: "Pasfoto 3x4", key: "pasfoto" },
                              { label: "Kartu Anggota (KTA)", key: "kartuKeanggotaan" }
                            ].map((doc) => (
                              <div key={doc.key} className="p-3 bg-[#111218] border border-[#302A3D] rounded-xl">
                                <label className="block text-xs font-bold text-[#F7F5FA] mb-1">{doc.label}</label>
                                <input
                                  type="file"
                                  accept="image/*,.pdf"
                                  onChange={async (e) => {
                                    const file = e.target.files[0];
                                    if (file) {
                                      const comp = await compressImageFile(file);
                                      setVaultDossier({ ...vaultDossier, [doc.key]: comp });
                                      showToast(`${doc.label} dipilih.`, "success");
                                    }
                                  }}
                                  className="text-[11px] text-[#AAA6B5] file:mr-2 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:bg-[#8B2CFF]/20 file:text-[#B66CFF] file:text-xs hover:file:bg-[#8B2CFF]/30"
                                />
                              </div>
                            ))}
                          </div>

                          <button
                            type="submit"
                            className="w-full py-3.5 bg-gradient-to-r from-[#D4AF37] to-[#F5D77A] text-[#08090D] font-bold text-xs rounded-xl shadow-lg hover:brightness-110 transition-all mt-4"
                          >
                            Simpan Seluruh 15 Berkas ke Cloud Supabase
                          </button>
                        </form>
                      </div>
                    )}
                  </div>
                )}

                {/* 3. TAB FORUM CHAT */}
                {activeTab === "chat" && (
                  <div className="bg-[#181922] border border-[#302A3D] rounded-3xl p-4 sm:p-6 flex flex-col h-[600px]">
                    <div className="pb-3 border-b border-[#302A3D] flex items-center justify-between">
                      <div className="flex items-center gap-2.5">
                        <PanuaSealLogo className="w-8 h-8" customUrl={branding.customLogoUrl} />
                        <div>
                          <h3 className="text-xs sm:text-sm font-bold text-[#F7F5FA]">Forum Obrolan Pionir Gorontalo</h3>
                          <p className="text-[10px] text-[#35D49A]">Streaming Realtime Supabase Aktif</p>
                        </div>
                      </div>
                    </div>

                    <div className="flex-1 overflow-y-auto py-4 space-y-3">
                      {messages.length === 0 ? (
                        <div className="text-center py-12 text-[#AAA6B5] text-xs">
                          Belum ada pesan forum. Mulai percakapan pertama Anda!
                        </div>
                      ) : (
                        messages.map((m) => (
                          <div
                            key={m.id}
                            className={`flex flex-col max-w-[80%] rounded-2xl p-3 text-xs ${
                              m.sender === (currentUser?.name || currentUser?.username)
                                ? "ml-auto bg-[#8B2CFF]/20 border border-[#8B2CFF]/40 text-[#F7F5FA]"
                                : "mr-auto bg-[#111218] border border-[#302A3D] text-[#AAA6B5]"
                            }`}
                          >
                            <span className="font-bold text-[11px] text-[#F5D77A] mb-1">{m.sender}</span>
                            <p className="text-xs text-[#F7F5FA] leading-relaxed">{m.text}</p>
                            <span className="text-[9px] text-[#AAA6B5] mt-1 self-end">{m.time}</span>
                          </div>
                        ))
                      )}
                    </div>

                    <form onSubmit={handleSendChatMessage} className="pt-3 border-t border-[#302A3D] flex gap-2">
                      <input
                        type="text"
                        value={chatInput}
                        onChange={(e) => setChatInput(e.target.value)}
                        placeholder="Ketik pesan forum..."
                        className="flex-1 bg-[#111218] border border-[#302A3D] rounded-xl px-4 py-2.5 text-xs text-[#F7F5FA] focus:border-[#8B2CFF] focus:outline-none"
                      />
                      <button
                        type="submit"
                        className="px-5 py-2.5 bg-gradient-to-r from-[#D4AF37] to-[#F5D77A] text-[#08090D] font-bold text-xs rounded-xl shadow-md hover:brightness-110 transition-all"
                      >
                        Kirim
                      </button>
                    </form>
                  </div>
                )}

                {/* 4. TAB RAPAT ONLINE */}
                {activeTab === "meetings" && (
                  <div className="space-y-6">
                    <div className="bg-[#181922] border border-[#302A3D] rounded-3xl p-6 sm:p-8">
                      <h3 className="text-base font-bold text-[#F7F5FA] mb-2">Konferensi Video Komunitas (Jitsi Meet WebRTC)</h3>
                      <p className="text-xs text-[#AAA6B5] mb-4">
                        Jalur rapat online video dan mikrofon terisolasi dengan transmisi berkecepatan tinggi.
                      </p>

                      {activeJitsiRoom ? (
                        <div className="space-y-3">
                          <div className="w-full h-[500px] rounded-2xl overflow-hidden border border-[#8B2CFF]/50 bg-black">
                            <iframe
                              src={`https://meet.jit.si/${activeJitsiRoom}`}
                              allow="camera; microphone; fullscreen; display-capture"
                              className="w-full h-full border-0"
                            ></iframe>
                          </div>
                          <button
                            onClick={() => setActiveJitsiRoom(null)}
                            className="px-4 py-2 bg-[#FF5570]/20 border border-[#FF5570]/40 text-[#FF5570] text-xs font-bold rounded-xl"
                          >
                            Tinggalkan Ruang Rapat
                          </button>
                        </div>
                      ) : (
                        <div className="p-6 bg-[#111218] rounded-2xl border border-[#302A3D] text-center space-y-3">
                          <p className="text-xs text-[#F7F5FA] font-bold">Ruang Rapat Utama Panua</p>
                          <p className="text-[11px] text-[#AAA6B5]">Room: PanuaCommunityGorontaloOfficial</p>
                          <button
                            onClick={() => setActiveJitsiRoom("PanuaCommunityGorontaloOfficial")}
                            className="px-5 py-2.5 bg-gradient-to-r from-[#8B2CFF] to-[#B66CFF] text-white font-bold text-xs rounded-xl shadow-md hover:brightness-110 transition-all"
                          >
                            Masuk Ruang Rapat Sekarang
                          </button>
                        </div>
                      )}
                    </div>
                  </div>
                )}

                {/* 5. TAB PROFIL ANGGOTA */}
                {activeTab === "profile" && (
                  <div className="bg-[#181922] border border-[#302A3D] rounded-3xl p-6 sm:p-8 space-y-6 max-w-xl mx-auto">
                    <div className="flex items-center gap-4">
                      <PanuaSealLogo className="w-16 h-16" customUrl={branding.customLogoUrl} />
                      <div>
                        <h3 className="text-base font-bold text-[#F7F5FA]">{currentUser?.name || currentUser?.username}</h3>
                        <p className="text-xs text-[#F5D77A]">@{currentUser?.username}</p>
                        <span className="inline-block mt-1 px-2.5 py-0.5 bg-[#35D49A]/20 border border-[#35D49A]/40 text-[#35D49A] text-[10px] font-bold rounded-full">
                          Terdaftar Resmi
                        </span>
                      </div>
                    </div>

                    <div className="space-y-3 text-xs">
                      <div className="p-3 bg-[#111218] rounded-xl border border-[#302A3D]">
                        <span className="text-[#AAA6B5]">Email:</span>
                        <p className="text-[#F7F5FA] font-semibold mt-0.5">{currentUser?.email || "-"}</p>
                      </div>
                      <div className="p-3 bg-[#111218] rounded-xl border border-[#302A3D]">
                        <span className="text-[#AAA6B5]">No HP / WhatsApp:</span>
                        <p className="text-[#F7F5FA] font-semibold mt-0.5">{currentUser?.phone || "-"}</p>
                      </div>
                      <div className="p-3 bg-[#111218] rounded-xl border border-[#302A3D]">
                        <span className="text-[#AAA6B5]">Peran Akun:</span>
                        <p className="text-[#F5D77A] font-bold mt-0.5 uppercase">{currentUser?.role || "member"}</p>
                      </div>
                    </div>
                  </div>
                )}

                {/* 6. TAB PANEL ADMINISTRASI (KHUSUS ADMIN) */}
                {activeTab === "admin" && currentUser?.role === "admin" && (
                  <div className="space-y-6">
                    {/* 1. Pengaturan Identitas & Logo Kustom Bulat */}
                    <div className="bg-[#181922] border border-[#302A3D] rounded-3xl p-6 space-y-4">
                      <h3 className="text-sm font-bold text-[#F5D77A] uppercase tracking-wider">
                        1. Pengaturan Identitas & Logo Kustom Bulat
                      </h3>
                      <form onSubmit={handleSaveBranding} className="space-y-4">
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-xs font-semibold text-[#AAA6B5] mb-1">Nama Judul Aplikasi</label>
                            <input
                              type="text"
                              name="appTitle"
                              defaultValue={branding.title}
                              className="w-full bg-[#111218] border border-[#302A3D] rounded-xl px-3.5 py-2 text-xs text-[#F7F5FA] focus:border-[#8B2CFF] focus:outline-none"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-[#AAA6B5] mb-1">Tagline Komunitas</label>
                            <input
                              type="text"
                              name="appTagline"
                              defaultValue={branding.tagline}
                              className="w-full bg-[#111218] border border-[#302A3D] rounded-xl px-3.5 py-2 text-xs text-[#F7F5FA] focus:border-[#8B2CFF] focus:outline-none"
                            />
                          </div>
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-[#AAA6B5] mb-1">Ganti Logo Kustom (Pilih Gambar Bulat)</label>
                          <input
                            type="file"
                            accept="image/*"
                            onChange={handleCustomLogoFileUpload}
                            className="text-xs text-[#AAA6B5] file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:bg-[#8B2CFF]/20 file:text-[#B66CFF] file:font-semibold hover:file:bg-[#8B2CFF]/30"
                          />
                        </div>

                        <div className="flex items-center gap-3">
                          <button
                            type="submit"
